name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Validate version and release guard
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t versions < <(sed -nE "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"][[:space:]]*$/\1/p" build.gradle)
          if (( ${#versions[@]} != 1 )); then
            echo "Expected exactly one literal version assignment in build.gradle." >&2
            exit 1
          fi

          version="${versions[0]}"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid Gradle version: $version (expected strict X.Y.Z semver)." >&2
            exit 1
          fi

          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          latest_tag="$(jq -r 'flatten | map(select(.draft == false and (.tag_name | startswith("v")))) | sort_by(.published_at) | last | .tag_name // empty' <<< "$releases")"
          tag="v${version}"

          if [[ -n "$latest_tag" ]]; then

            latest_version="${latest_tag#v}"
            if [[ ! "$latest_version" =~ $semver_re ]]; then
              echo "Latest release is not strict X.Y.Z semver: $latest_tag" >&2
              exit 1
            fi

            if [[ "$version" == "$latest_version" ]]; then
              echo "Version $version is already the latest release; nothing to do."
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS=. read -r current_major current_minor current_patch <<< "$version"
            IFS=. read -r latest_major latest_minor latest_patch <<< "$latest_version"
            if (( current_major < latest_major ||
                  (current_major == latest_major && current_minor < latest_minor) ||
                  (current_major == latest_major && current_minor == latest_minor && current_patch < latest_patch) )); then
              echo "Version $version is older than latest release $latest_version." >&2
              exit 1
            fi
          fi

          if jq -e --arg tag "$tag" 'flatten | any(.[]; .tag_name == $tag)' <<< "$releases" >/dev/null; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$changed_files" == "lib-manifest.json" ]]; then
              echo "Release $tag already exists and this is the manifest commit; nothing to do."
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release $tag already exists; refusing to duplicate it." >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --refs origin "$tag" >/dev/null 2>&1
          status=$?
          set -e
          if (( status == 0 )); then
            echo "Tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if (( status != 2 )); then
            echo "Could not verify whether tag $tag exists (git status $status)." >&2
            exit "$status"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.release_guard.outputs.release_needed == 'true'
        run: ./gradlew clean build

      - name: Create GitHub release
        if: steps.release_guard.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_guard.outputs.version }}
          TAG: ${{ steps.release_guard.outputs.tag }}
        run: |
          set -euo pipefail
          jar="build/libs/ExyliaLib-${VERSION}.jar"
          test -f "$jar"
          gh release create "$TAG" "$jar" \
            --target "$GITHUB_SHA" \
            --title "ExyliaLib ${VERSION}" \
            --generate-notes
          [[ "$(gh release view "$TAG" --json tagName --jq .tagName)" == "$TAG" ]]

      - name: Update and publish manifest
        if: steps.release_guard.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_guard.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release_guard.outputs.source_commit }}
          TAG: ${{ steps.release_guard.outputs.tag }}
        run: |
          set -euo pipefail
          jar="build/libs/ExyliaLib-${VERSION}.jar"

          # The manifest ships with the release as well as on the branch. The
          # branch copy is served by a CDN that holds it for five minutes, so a
          # server restarted right after a release is told the previous version
          # is still the latest one; the release asset is resolved per request
          # and answers no-cache. Uploaded from the same step that generates it,
          # so the two copies cannot disagree.
          publish_asset() {
            gh release upload "$TAG" lib-manifest.json --clobber
          }

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # main moves while a release builds, and a commit pushed during those
          # two minutes makes this push a non-fast-forward. That used to end the
          # job right here, with the release published and the manifest still
          # naming the previous version — which is invisible from the outside:
          # every server's updater reads the manifest, so the release exists and
          # nothing ever offers it. The manifest is generated rather than
          # authored, so the answer to a main that moved is to generate it again
          # on top of whatever landed.
          for attempt in 1 2 3; do
            ./update-lib-manifest.sh "$VERSION" "$jar" stable "$SOURCE_COMMIT" "$TAG"

            changed_files="$(git diff --name-only)"
            if [[ -z "$changed_files" ]]; then
              echo "Manifest already points at ${VERSION}; no commit needed."
              publish_asset
              exit 0
            fi
            if [[ "$changed_files" != "lib-manifest.json" ]]; then
              echo "Unexpected files changed by manifest generation: $changed_files" >&2
              exit 1
            fi

            git add lib-manifest.json
            git commit -m "chore: point the manifest at ${VERSION}"
            if git push origin "HEAD:main"; then
              publish_asset
              exit 0
            fi

            echo "main moved while this release was building; regenerating the manifest on top of it (attempt ${attempt})."
            git fetch origin main
            git reset --hard FETCH_HEAD
          done

          echo "Could not publish the manifest for ${VERSION}: main kept moving." >&2
          exit 1
