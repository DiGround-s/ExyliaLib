name: Promote Dev Release To Main

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Dev version to promote (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Validate Dev release identity
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$VERSION" =~ $semver_re ]]; then
            echo "Version must be strict X.Y.Z semver: $VERSION" >&2
            exit 1
          fi

          dev_tag="dev-v${VERSION}"
          stable_tag="v${VERSION}"
          release_json="$(gh release view "$dev_tag" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$dev_tag" ]]
          [[ "$(jq -r .isDraft <<<"$release_json")" == false ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]

          target_commit="$(jq -r .targetCommitish <<<"$release_json")"
          if [[ -z "$target_commit" || "$target_commit" == "null" ]]; then
            echo "Dev release has no source commit identity." >&2
            exit 1
          fi

          asset_name="ExyliaLib-${VERSION}.jar"
          asset_count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
          [[ "$asset_count" == 1 ]] || { echo "Dev release must contain exactly one $asset_name asset." >&2; exit 1; }

          mkdir -p build/promotion
          gh release download "$dev_tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset_name" --dir build/promotion --clobber
          jar="build/promotion/${asset_name}"
          sha256="$(sha256sum "$jar" | cut -d' ' -f1)"

          manifest="$(gh api "repos/${GITHUB_REPOSITORY}/contents/lib-manifest.json?ref=dev" --jq .content | tr -d '\n' | base64 --decode)"
          entry="$(jq -c --arg v "$VERSION" '.versions[$v] // empty' <<<"$manifest")"
          [[ -n "$entry" ]] || { echo "Dev manifest has no entry for $VERSION." >&2; exit 1; }
          [[ "$(jq -r .url <<<"$entry")" == "https://github.com/${GITHUB_REPOSITORY}/releases/download/${dev_tag}/${asset_name}" ]] || { echo "Dev manifest URL does not identify $dev_tag." >&2; exit 1; }
          [[ "$(jq -r .sha256 <<<"$entry")" == "$sha256" ]] || { echo "Dev manifest SHA-256 does not match the release asset." >&2; exit 1; }
          [[ "$(jq -r .releaseTag <<<"$entry")" == "$dev_tag" ]] || { echo "Dev manifest releaseTag does not match $dev_tag." >&2; exit 1; }
          [[ "$(jq -r .sourceCommit <<<"$entry")" == "$target_commit" ]] || { echo "Dev manifest sourceCommit does not match the release source." >&2; exit 1; }

          if gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release $stable_tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/${stable_tag}" >/dev/null 2>&1; then
            echo "Stable tag $stable_tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if jq -e --arg v "$VERSION" '.versions[$v] != null' lib-manifest.json >/dev/null; then
            echo "Stable manifest already contains $VERSION; refusing to overwrite it." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "source_commit=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Create stable release from exact Dev bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validation.outputs.version }}
          JAR: ${{ steps.validation.outputs.jar }}
          SOURCE_COMMIT: ${{ steps.validation.outputs.source_commit }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "ExyliaLib ${VERSION}" \
            --generate-notes
          [[ "$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" == "v${VERSION}" ]]

      - name: Update and publish stable manifest
        env:
          VERSION: ${{ steps.validation.outputs.version }}
          SOURCE_COMMIT: ${{ steps.validation.outputs.source_commit }}
        run: |
          set -euo pipefail
          ./update-lib-manifest.sh "$VERSION" "${{ steps.validation.outputs.jar }}" stable "$SOURCE_COMMIT" "v${VERSION}"
          changed_files="$(git diff --name-only)"
          [[ "$changed_files" == "lib-manifest.json" ]] || { echo "Unexpected files changed by manifest generation: $changed_files" >&2; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib-manifest.json
          git commit -m "chore: promote ExyliaLib ${VERSION} to main"
          git push origin HEAD:main
