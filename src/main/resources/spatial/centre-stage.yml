# Centre stage: the library's layout for a cosmetic catalogue (SpatialCatalog). Written as
# plugins/<Plugin>/spatial/<menu>.yml for a catalogue whose plugin ships no layout of its own.
#
#                 All   Rare   Epic   ★                          the tabs (plain words)
#                        THE NAME LOOKED AT                      the title
#                      Epic · ✔ Equipped                         one quiet line
#      ‹   ◆  ◆  ◆  ◆      ( preview )      ◆  ◆  ◆  ◆   ›       the arc of items, at eye level
#                           [ EQUIP ]                            the one primary button
#                     ☆   ✘   ↺   ✦   ?   ✕                      icons; words show on hover
#               Look at an item to see it · click to try it      the hint
#
# No panels: words float with a shadow, only the primary button is filled. Coordinates are blocks on the
# board, a plane 'anchor.distance' ahead of the eyes: [across (right +), up, forward (towards the viewer +)].
# At 4.5 blocks the board stays inside about 70° across and 48° top to bottom, and every line is drawn at
# least as large as theme.min-glyph-degrees reads from the eyes. Every word is a %catalog_...% placeholder.
menu-version: 2
title: '{primary}&lCOLLECTION'
anchor:
  mode: FRONT
  distance: 4.5
  lift: 0.15
  clear-view: true
hide-others: true
freeze: true
theme:
  title-scale: 1.0
  text-scale: 0.42
  small-scale: 0.38
  previous-arrow: '{muted}‹'
  next-arrow: '{muted}›'
  page-line: '{muted}%page% / %pages%'
  locked-marker: '{muted}🔒'
  equipped-marker: '{success}✔'
  intro-outline: '{secondary_light}'
  open-motion: RISE
panels:
  # The categories as plain words; the open one has a thin accent line under it. The wheel steps through them.
  tabs:
    at: [0, 1.65, 0]
    size: [5.0, 0.26]
    frame: false
    content: {type: TABS, source: catalog_tabs}
  # The effect looked at, else the one chosen: its name, and one quiet line (rarity · where you stand with it).
  title:
    at: [0, 1.2, 0.1]
    size: [3.6, 0.52]
    frame: false
    title: '%catalog_card_title%'
    hint: '%catalog_card_meta%'
  # The one primary action: EQUIP, EQUIPPED ✔, BUY · price then CONFIRM · price, or LOCKED.
  action:
    at: [0, -1.38, 0.2]
    size: [1.9, 0.28]
    frame: false
    content: {type: ACTION}
  # Quiet icons; the hint line says what one does while the crosshair is on it.
  icons:
    at: [0, -1.74, 0.2]
    size: [3.6, 0.26]
    frame: false
    content:
      type: ICONS
      buttons:
        - {label: '%catalog_favourite%', action: favourite}
        - {label: '%catalog_unequip%', action: unequip}
        - {label: '%catalog_revert%', action: revert}
        - {label: '✦|%catalog_crate%', action: crate}
        - {label: '%catalog_help%', action: intro}
        - {label: '%catalog_leave%', action: leave}
  hint:
    at: [0, -2.0, 0.2]
    size: [5.0, 0.2]
    frame: false
    content:
      type: TEXT
      lines: ['%catalog_hint%']
preview:
  at: [0, -1.0, 0.1]
  turn-speed: 0
  pedestal: true
  scale: 0.72
  vanish-on-play: true
  # How large the effect and its mannequin play: a miniature on the pedestal, every offset,
  # movement, body and spread that many times its written size.
  effect-scale: 0.72
  # Whose skin the mannequin and the body it leaves wear, the first source that has one: others
  # (another online player, a different one each play), viewer (the player looking), defaults
  # (vanilla's Steve, Alex, Ari, Efe, Kai, Makena, Noor, Sunny and Zuri, slim and wide).
  skins: [others, defaults]
  facing: FRONT
  turn-controls: false
  turn-hint: ''
  turn-pause: 8
# The arc: 4 items either side of the preview, at eye level, bending round you. The wheel or the arrows
# turn it a page.
carousel:
  source: catalog
  style: ARC
  at: [0, -0.4, 0.1]
  slots: 8
  rows: 1
  spacing: 0.42
  row-gap: 0.7
  centre-gap: 1.8
  curve: 0.45
# Shown once, the first time a player opens the selector. The '?' icon shows it again.
intro:
  steps:
    - {target: carousel, at: [-2.35, 0.78, 0.4], text: '%catalog_intro_shelf%'}
    - {target: preview, at: [2.35, 0.78, 0.4], text: '%catalog_intro_preview%'}
    - {target: action, at: [2.35, -1.0, 0.4], text: '%catalog_intro_action%'}
    - {target: icons, at: [-2.35, -1.0, 0.4], text: '%catalog_intro_more%'}
