name: ExyliaLib
version: '${version}'
main: net.exylia.lib.ExyliaLib
api-version: '1.21'
description: Shared high-performance library for Exylia plugins.
website: https://github.com/DiGround-s/ExyliaLib
authors: [Exylia]
load: STARTUP
folia-supported: true
# Optional, and only for load order: with load: STARTUP the first placeholder
# render can otherwise happen before PlaceholderAPI enables. The bridge re-checks
# availability anyway, because a softdepend is a preference, not a guarantee.
softdepend: [PlaceholderAPI, Vault, PlayerPoints]
# Runtime dependencies the server's library loader fetches from Maven Central,
# exactly as every consumer plugin declares its own. Everything else ExyliaLib
# touches is either shaded into the jar (scoreboard-library, jfiglet), provided
# by the server (Bukkit, Adventure, Guava, Gson, netty) or optional and guarded
# behind a plugin check (PacketEvents, Apollo, Feather, PlaceholderAPI).
libraries:
  - 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
  - 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
  # Caches in TextEngine, TemplateCache, Effects and ClanRuntime. TextEngine is
  # touched from onEnable, so a missing Caffeine kills startup outright.
  - 'com.github.ben-manes.caffeine:caffeine:3.2.4'
  # Database. The pool is always needed; the drivers are not, and a server only
  # ever loads the one its config names. They are listed anyway because the
  # library loader fetches them once and shares them across every plugin, which
  # is the same arrangement the consumer plugins already declare.
  - 'com.zaxxer:HikariCP:5.1.0'
  - 'com.h2database:h2:2.2.224'
  - 'com.mysql:mysql-connector-j:8.4.0'
  - 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
  - 'org.postgresql:postgresql:42.7.4'
  - 'org.mongodb:mongodb-driver-sync:4.11.1'
  # The shared cache, off unless a database.yml turns it on. Listed with the
  # drivers for the same reason: fetched once and shared, and the same version
  # ExyliaCommons installs, so a server midway through migrating holds one copy.
  # commons-pool2 is Jedis's own dependency and is named explicitly rather than
  # left to transitive resolution, which the library loader does not perform.
  - 'redis.clients:jedis:5.1.0'
  - 'org.apache.commons:commons-pool2:2.12.0'
