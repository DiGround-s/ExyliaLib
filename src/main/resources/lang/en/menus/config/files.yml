# One plugin's settings files, then its content files (catalogues it registered for editing).
# Values: %cfg_plugin%
# Per row: %cfg_file_id% %cfg_file_name% %cfg_file_path% %cfg_file_keys% %cfg_file_about%
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&lSETTINGS {letters_black}» {highlight}%cfg_plugin% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No more files'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Every file of the plugin is listed.'
      - ''
pagination:
  slots: '0-35'
  item_template:
    material: BOOK
    name: '{primary}&l%cfg_file_name%'
    lore:
      - ''
      - '%cfg_file_about%'
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}File {letters_black}» {info}%cfg_file_path%'
      - ' {letters_black}▎ {letters}Settings {letters_black}» {info}%cfg_file_keys%'
      - ''
      - '{warning}➥ Click to open'
      - ''
    actions:
      - 'exylialib:config_file %cfg_file_id%'
  content_template:
    material: CHEST
    name: '{primary}&l%cfg_file_name%'
    lore:
      - ''
      - '%cfg_file_about%'
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Content {letters_black}» {info}%cfg_file_path%'
      - ' {letters_black}▎ {letters}Entries {letters_black}» {info}%cfg_file_keys%'
      - ''
      - '{warning}➥ Click to open'
      - ''
    actions:
      - 'exylialib:config_yaml %cfg_file_id%'
  navigation:
