# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every showcase the plugin plays on a loop.
#
# Values: %admin_title%
# Per row: %place_number% %place_world% %place_x% %place_y% %place_z% %place_server%
title: '{primary}&lSHOWCASES {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No more showcases'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Add one where you stand to list it.'
      - ''
pagination:
  slots: '0-35'
  item_template:
    material: ARMOR_STAND
    name: '{primary}&lSHOWCASE #%place_number%'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}World {letters_black}» {info}%place_world%'
      - ' {letters_black}▎ {letters}At {letters_black}» {info}%place_x%{letters_black}, {info}%place_y%{letters_black}, {info}%place_z%'
      - ' {letters_black}▎ {letters}Server {letters_black}» {info}%place_server%'
      - ''
      - '{warning}➥ Left-click to teleport'
      - '{error}➥ Right-click to remove'
      - ''
    actions:
      - 'left,shift_left: exylialib:cosmetics place_tp'
      - 'right,shift_right: exylialib:cosmetics place_remove'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
