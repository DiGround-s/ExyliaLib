# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every showcase the plugin plays on a loop.
#
# Values: %admin_title%
# Per row: %place_number% %place_world% %place_x% %place_y% %place_z% %place_server%
title: '{primary}&lSHOWCASES {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No more showcases'
    lore:
      - "{letters_black}Add one where you stand to list it."
pagination:
  slots: '0-35'
  item_template:
    material: ARMOR_STAND
    name: "{letters}Showcase {letters_black}▸ <gradient:{primary}:{secondary_light}>#%place_number%</gradient>"
    lore:
      - "{letters_black}Placed showcase"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}World{letters_black}: {info}%place_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}At{letters_black}: {info}%place_x%{letters_black}, {info}%place_y%{letters_black}, {info}%place_z%"
      - "  {letters_black}· {info}{icon:ping} {letters}Server{letters_black}: {info}%place_server%"
      - ""
      - "{primary}» Left-click to teleport"
      - "{error}» Right-click to remove"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'left,shift_left: exylialib:cosmetics place_tp'
      - 'right,shift_right: exylialib:cosmetics place_remove'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
items:
  add:
    slot: 45
    material: LIME_DYE
    name: "{letters}Showcases {letters_black}▸ <gradient:{success}:{success_light}>Add showcase</gradient>"
    lore:
      - "{letters_black}New showcase"
      - ""
      - "{success}✎ Information"
      - " {letters}Places one where you stand,"
      - " {letters}facing the way you face."
      - ""
      - "{success}» Click to add"
    actions:
      - 'exylialib:cosmetics place_add'
  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Admin hub</gradient>"
    lore:
