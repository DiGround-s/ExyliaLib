# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One player: crate keys, unlocks and what they have equipped.
#
# Values: %admin_title% %admin_catalogue% %player_name% %player_keys%
#         %player_unlocked% %player_equipped%
title: '{primary}&lPLAYER {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Player"
      - ""
      - "{primary}✎ Information"
      - " {letters}Keys, unlocks and what"
      - " {letters}this player has {highlight}equipped{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Player {letters_black}▸ <gradient:{primary}:{secondary_light}>Crate keys</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Player setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Keys on the account, which open"
      - " {letters}the crate and can never be {highlight}lost{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:key} {letters}Keys{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}+1 key"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}-1 key"
      - "{primary}{icon:click} Shift-click {letters_black}· {letters}type an amount"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Player {letters_black}▸ <gradient:{primary}:{secondary_light}>Unlocks</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Grant or revoke each cosmetic,"
      - " {letters}kept for good like a {highlight}crate {letters}win."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {success}{icon:star} {letters}Owned{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}{icon:click} Click to manage"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Player {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipped</gradient>"
    lore:
      - "{letters_black}Player setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What the player has on right now."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Equipped{letters_black}: %player_equipped%"
      - ""
      - "{error}{icon:click} Click to take it off"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Player {letters_black}▸ <gradient:{error}:{error_light}>Clear favourites</gradient>"
    lore:
      - "{letters_black}Danger zone"
      - ""
      - "{error}✎ Information"
      - " {letters}Empties the player's shortlist."
      - ""
      - "{error}{icon:click} Click to clear"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Players</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: "{letters}Player {letters_black}▸ <gradient:{error}:{error_light}>Clear unlocks</gradient>"
    lore:
      - "{letters_black}Danger zone"
      - ""
      - "{error}✎ Information"
      - " {letters}Takes back {highlight}everything {letters}the"
      - " {letters}player won or was granted."
      - ""
      - "{error}{icon:click} Click to clear"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
