# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One player: crate keys, unlocks and what they have equipped.
#
# Values: %admin_title% %admin_catalogue% %player_name% %player_keys%
#         %player_unlocked% %player_equipped%
title: '{primary}&lPLAYER {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: '{primary}&l%player_name%'
    lore:
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Crate keys {letters_black}» {info}%player_keys%'
      - ' {letters_black}▎ {letters}Owned {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ' {letters_black}▎ {letters}Equipped {letters_black}» %player_equipped%'
      - ''
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: '{primary}&lCRATE KEYS &8[{info}%player_keys%&8]'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}Keys on the account, which open'
      - ' {letters_black}▎ {letters}the crate and can never be {highlight}lost{letters}.'
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Keys {letters_black}» {info}%player_keys%'
      - ''
      - '{warning}➥ Left-click {letters_black}» {letters}+1 key'
      - '{warning}➥ Right-click {letters_black}» {letters}-1 key'
      - '{warning}➥ Shift-click {letters_black}» {letters}type an amount'
      - ''
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: '{primary}&lUNLOCKS'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}Grant or revoke each cosmetic,'
      - ' {letters_black}▎ {letters}kept for good like a {highlight}crate {letters}win.'
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Owned {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ''
      - '{warning}➥ Click to manage'
      - ''
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: '{primary}&lEQUIPPED'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}What the player has on right now.'
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Equipped {letters_black}» %player_equipped%'
      - ''
      - '{error}➥ Click to take it off'
      - ' {letters_black}You will be asked to confirm.'
      - ''
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: '{error}&lCLEAR FAVOURITES'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}Empties the player''s shortlist.'
      - ''
      - '{error}➥ Click to clear'
      - ' {letters_black}You will be asked to confirm.'
      - ''
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Returns to the players.'
      - ''
      - '{warning}➥ Click to go back'
      - ''
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: '{error}&lCLEAR UNLOCKS'
    lore:
      - ''
      - '{secondary}Information:'
      - ' {letters_black}▎ {letters}Takes back {highlight}everything {letters}the player'
      - ' {letters_black}▎ {letters}won or was granted.'
      - ''
      - '{error}➥ Click to clear'
      - ' {letters_black}You will be asked to confirm.'
      - ''
    actions:
      - 'exylialib:cosmetics clear_unlocks'
