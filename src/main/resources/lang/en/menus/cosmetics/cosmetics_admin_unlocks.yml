# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# What one player owns, cosmetic by cosmetic. A click grants or revokes it.
#
# Values: %admin_title% %player_name%
# Per row: %reward_id% %reward_name% %reward_material% %reward_description%
#          %reward_tier% %reward_tier_id% %reward_tier_color%
# Templates: item (locked), unlocked, permission (owned through a permission only)
title: '{primary}&lUNLOCKS {letters_black}» {highlight}%player_name% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No more cosmetics'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Add one to the plugin to see it here.'
      - ''
pagination:
  slots: '0-35'
  item_template:
    material: '%reward_material%'
    hide-attributes: true
    name: '%reward_name%'
    lore:
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Rarity {letters_black}» %reward_tier%'
      - ' {letters_black}▎ {letters}State {letters_black}» {error}✘ Locked'
      - ''
      - '{warning}➥ Click to grant'
      - ''
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
  unlocked_template:
    material: '%reward_material%'
    hide-attributes: true
    glowing: true
    name: '%reward_name%'
    lore:
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Rarity {letters_black}» %reward_tier%'
      - ' {letters_black}▎ {letters}State {letters_black}» {success}✔ Unlocked'
      - ''
      - '{error}➥ Click to revoke'
      - ''
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
  permission_template:
    material: '%reward_material%'
    hide-attributes: true
    name: '%reward_name%'
    lore:
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}Rarity {letters_black}» %reward_tier%'
      - ' {letters_black}▎ {letters}State {letters_black}» {info}By permission'
      - ''
      - '{warning}➥ Click to grant for good'
      - ''
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
