# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One cosmetic: its item, crate keys, and a preview.
#
# Values: %admin_title% %reward_id% %reward_name% %reward_material%
#         %reward_description% %reward_tier%
title: '{primary}&lCOSMETIC {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: '10-16'
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Cosmetic"
      - ""
      - "{accent}✎ Information"
      - " %reward_description%"
      - ""
      - "{accent}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Rarity{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Cosmetic {letters_black}▸ <gradient:{success}:{success_light}>Give item</gradient>"
    lore:
      - "{letters_black}Cosmetic action"
      - ""
      - "{success}✎ Information"
      - " {letters}The item that applies this"
      - " {letters}cosmetic, into {highlight}your {letters}inventory."
      - ""
      - "{success}» Click to receive one"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Cosmetic {letters_black}▸ <gradient:{success}:{success_light}>Give crate keys</gradient>"
    lore:
      - "{letters_black}Cosmetic action"
      - ""
      - "{success}✎ Information"
      - " {letters}Key items that open the crate,"
      - " {letters}to hold, trade or drop."
      - ""
      - "{success}» Left-click {letters_black}· {letters}one key"
      - "{success}» Right-click {letters_black}· {letters}type an amount"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Cosmetic {letters_black}▸ <gradient:{info}:{info_light}>Preview</gradient>"
    lore:
      - "{letters_black}Cosmetic action"
      - ""
      - "{info}✎ Information"
      - " {letters}Plays this cosmetic for"
      - " {highlight}you {letters}on the preview stage."
      - ""
      - "{info}» Click to watch it"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Catalogue</gradient>"
    lore:
      - "{error}» Click to go back"
    actions:
      - 'exylialib:cosmetics catalogue'
