title: '{primary}&lCATALOGUE {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No more cosmetics'
    lore:
      - "{letters_black}Add one to the plugin to see it here."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← First page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Last page →"

