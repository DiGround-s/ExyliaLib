# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# A cosmetic plugin's admin hub, opened by its admin command with no arguments.
# Every cosmetic plugin built on the library's crate shares these screens.
#
# Values: %admin_title% %admin_catalogue% %admin_online% %admin_showcases% %admin_blocks%
# %admin_in_use% %admin_wearing% (players with one on), %admin_activity_label% %admin_activity%
# (the plugin's own live number); a line naming a value the plugin does not give is not drawn.
title: '{primary}&lADMIN {letters_black}» {highlight}%admin_title%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Cosmetics admin"
      - ""
      - "{primary}✎ Information"
      - " {letters}The catalogue, the players, the"
      - " {letters}showcases and the crate blocks."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Cosmetics{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}In use{letters_black}: {info}%admin_in_use% {letters}of {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Cosmetics {letters_black}▸ <gradient:{primary}:{secondary_light}>Catalogue</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Every cosmetic: hand out its item,"
      - " {letters}crate keys, or watch a {highlight}preview{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Cosmetics{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}» Click to browse"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Cosmetics {letters_black}▸ <gradient:{primary}:{secondary_light}>Players</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Keys, unlocks and what each"
      - " {letters}player online has {highlight}equipped{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Wearing one now{letters_black}: {info}%admin_wearing% {letters}of {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}» Click to browse"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Cosmetics {letters_black}▸ <gradient:{primary}:{secondary_light}>Showcases</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Places that show the cosmetics"
      - " {letters}off on a {highlight}loop {letters}to whoever is near."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Placed{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}» Click to manage"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Cosmetics {letters_black}▸ <gradient:{primary}:{secondary_light}>Crate blocks</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Blocks that open the crate"
      - " {letters}when a player {highlight}clicks {letters}them."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Bound{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}» Click to manage"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 36
    material: COMPARATOR
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Settings</gradient>"
    lore:
      - "{letters_black}Configuration"
      - ""
      - "{primary}✎ Information"
      - " {letters}Change this plugin's settings"
      - " {letters}without editing its {highlight}files{letters}."
      - ""
      - "{primary}» Click {letters_black}· {letters}Open settings"
    actions:
      - 'exylialib:cosmetics settings'
