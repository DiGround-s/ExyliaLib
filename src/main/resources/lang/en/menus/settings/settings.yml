# The settings screens of every plugin, shown by /settings.
# Restyle them freely: the library only adds keys missing from this file.
# The root screen: Settings and Announcements.
menu-version: 1

title: '{primary}&lSETTINGS'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
items:
  settings:
    slot: 12
    material: COMPARATOR
    name: "<gradient:{primary}:{secondary_light}>Settings</gradient>"
    lore:
      - "{letters_black}Your settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}How other players reach you and"
      - " {letters}how each feature treats you."
      - ""
      - "{primary}» Click to open"
    actions:
      - 'exylialib:settings_open settings'
  announcements:
    slot: 14
    material: BELL
    name: "<gradient:{primary}:{secondary_light}>Announcements</gradient>"
    lore:
      - "{letters_black}Your settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Which server-wide"
      - " {letters}messages reach your {highlight}chat{letters}."
      - ""
      - "{primary}» Click to open"
    actions:
      - 'exylialib:settings_open announcements'
