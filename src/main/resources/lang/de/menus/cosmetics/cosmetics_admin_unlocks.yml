# DO NOT EDIT — REGENERIERT BEI JEDEM START.
#
# Was ein Spieler besitzt, Cosmetic für Cosmetic. Ein Klick vergibt oder entzieht es.
#
# Werte: %admin_title% %player_name%
# Pro Zeile: %reward_id% %reward_name% %reward_material% %reward_description%
#            %reward_tier% %reward_tier_id% %reward_tier_color%
# Templates: item (gesperrt), unlocked, permission (nur über eine Permission im Besitz)
title: '{primary}&lFREISCHALTUNGEN {letters_black}» {highlight}%player_name% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Keine weiteren Cosmetics'
    lore:
      - "{letters_black}Füge eins im Plugin hinzu, um es hier zu sehen."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'
  item_template:
    material: '%reward_material%'
    hide-attributes: true
    name: "{letters}Cosmetic {letters_black}▸ %reward_name%"
    lore:
      - "{letters_black}Gesperrtes Cosmetic"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Seltenheit{letters_black}: %reward_tier%"
      - "  {letters_black}· {error}{icon:redstone} {letters}Status{letters_black}: {error}✘ Gesperrt"
      - ""
      - "{primary}{icon:click} Klicken zum Vergeben"
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
  unlocked_template:
    material: '%reward_material%'
    hide-attributes: true
    glowing: true
    name: "{letters}Cosmetic {letters_black}▸ %reward_name%"
    lore:
      - "{letters_black}Freigeschaltetes Cosmetic"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Seltenheit{letters_black}: %reward_tier%"
      - "  {letters_black}· {success}{icon:redstone} {letters}Status{letters_black}: {success}✔ Freigeschaltet"
      - ""
      - "{error}{icon:click} Klicken zum Entziehen"
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
  permission_template:
    material: '%reward_material%'
    hide-attributes: true
    name: "{letters}Cosmetic {letters_black}▸ %reward_name%"
    lore:
      - "{letters_black}Cosmetic per Permission"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Seltenheit{letters_black}: %reward_tier%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Status{letters_black}: {info}Per Permission"
      - ""
      - "{primary}{icon:click} Klicken zum dauerhaften Vergeben"
    actions:
      - 'exylialib:cosmetics toggle %reward_id%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
