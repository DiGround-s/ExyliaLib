# DO NOT EDIT — REGENERIERT BEI JEDEM START.
#
# Jede Showcase, die das Plugin in einer Schleife abspielt.
#
# Werte: %admin_title%
# Pro Zeile: %place_number% %place_world% %place_x% %place_y% %place_z% %place_server%
title: '{primary}&lSHOWCASES {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Keine weiteren Showcases'
    lore:
      - "{letters_black}Platziere eine, um sie hier zu listen."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'
  item_template:
    material: ARMOR_STAND
    name: "{letters}Showcase {letters_black}▸ <gradient:{primary}:{secondary_light}>#%place_number%</gradient>"
    lore:
      - "{letters_black}Platzierte Showcase"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Welt{letters_black}: {info}%place_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Position{letters_black}: {info}%place_x%{letters_black}, {info}%place_y%{letters_black}, {info}%place_z%"
      - "  {letters_black}· {info}{icon:ping} {letters}Server{letters_black}: {info}%place_server%"
      - ""
      - "{primary}{icon:click} Linksklick zum Teleportieren"
      - "{error}{icon:right_click} Rechtsklick zum Entfernen"
      - "{letters_black}Du musst bestätigen."
    actions:
      - 'left,shift_left: exylialib:cosmetics place_tp'
      - 'right,shift_right: exylialib:cosmetics place_remove'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
