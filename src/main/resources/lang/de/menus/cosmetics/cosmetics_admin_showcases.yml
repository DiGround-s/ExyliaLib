    slot: 45
    material: LIME_DYE
    name: "{letters}Showcases {letters_black}▸ <gradient:{success}:{success_light}>Showcase hinzufügen</gradient>"
    lore:
      - "{letters_black}Neue Showcase"
      - ""
      - "{success}✎ Information"
