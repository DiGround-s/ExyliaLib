# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Ein Cosmetic: sein Item, Crate-Keys und eine Vorschau.
#
# Values: %admin_title% %reward_id% %reward_name% %reward_material%
#         %reward_description% %reward_tier%
title: '{primary}&lKOSMETIK {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Kosmetik"
      - ""
      - "{accent}✎ Information"
      - " %reward_description%"
      - ""
      - "{accent}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Seltenheit{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Kosmetik {letters_black}▸ <gradient:{success}:{success_light}>Item geben</gradient>"
    lore:
      - "{letters_black}Kosmetik-Aktion"
      - ""
      - "{success}✎ Information"
      - " {letters}Das Item, das diese Kosmetik"
      - " {letters}aktiviert, in {highlight}dein {letters}Inventar."
      - ""
      - "{success}{icon:click} Klicken, um eins zu erhalten"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Kosmetik {letters_black}▸ <gradient:{success}:{success_light}>Crate-Keys geben</gradient>"
    lore:
      - "{letters_black}Kosmetik-Aktion"
      - ""
      - "{success}✎ Information"
      - " {letters}Key-Items, die die Crate öffnen,"
      - " {letters}zum Behalten, Tauschen oder Droppen."
      - ""
      - "{success}{icon:click} Linksklick {letters_black}· {letters}ein Key"
      - "{success}{icon:right_click} Rechtsklick {letters_black}· {letters}Menge eingeben"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Kosmetik {letters_black}▸ <gradient:{info}:{info_light}>Vorschau</gradient>"
    lore:
      - "{letters_black}Kosmetik-Aktion"
      - ""
      - "{info}✎ Information"
      - " {letters}Spielt diese Kosmetik für"
      - " {highlight}dich {letters}auf der Vorschau-Bühne ab."
      - ""
      - "{info}{icon:click} Klicken, um sie anzusehen"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Katalog</gradient>"
    lore:
      - "{error}{icon:click} Klicken, um zurückzugehen"
    actions:
      - 'exylialib:cosmetics catalogue'
