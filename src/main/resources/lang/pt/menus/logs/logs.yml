title: '{primary}&lREGISTROS {letters_black}» {highlight}%logs_subject% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Não há mais registros'
    lore:
      - "{letters_black}Os plugins registram aqui o que a staff faz."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'
  item_template:
    material: '%log_icon%'
    name: "{letters}Registro {letters_black}▸ <gradient:{info}:{info_light}>%log_action%</gradient>"
    lore:
      - "{letters_black}Registro da equipe"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Plugin{letters_black}: {info}%log_plugin%"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Por{letters_black}: {highlight}%log_actor%"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Alvo{letters_black}: {highlight}%log_target%"
      - ""
      - "{info}✎ Detalhes"
      - "%log_detail%"
      - ""
      - "{info}✦ Onde"
      - "  {letters_black}· {info}{icon:ping} {letters}Servidor{letters_black}: {info}%log_server%"
      - "  {letters_black}· {info}{icon:map} {letters}Local{letters_black}: {info}%log_location%"
      - "  {letters_black}· {info}{icon:clock} {letters}Quando{letters_black}: {info}%log_when%"
      - "    {letters_black}%log_date%"
      - ""
      - "%log_view%"
    actions:
      - 'exylialib:logs_entry %log_id%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
items:
  plugin:
    slot: 45
    material: COMPARATOR
    name: "{letters}Filtro {letters_black}▸ <gradient:{info}:{info_light}>Plugin</gradient>"
    lore:
      - "{letters_black}Filtro de registros"
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {highlight}{icon:search} {letters}Mostrando{letters_black}: {highlight}%logs_plugin%"
      - ""
      - "{info}{icon:click} Clique esq. {letters_black}· {letters}próximo plugin"
      - "{info}{icon:click} Clique dir. {letters_black}· {letters}todos os plugins"
    actions:
      - 'left: exylialib:logs_plugin next'
      - 'right: exylialib:logs_plugin all'
  action:
    slot: 46
    material: HOPPER
    name: "{letters}Filtro {letters_black}▸ <gradient:{info}:{info_light}>Ação</gradient>"
    lore:
      - "{letters_black}Filtro de registros"
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {highlight}{icon:search} {letters}Mostrando{letters_black}: {highlight}%logs_action%"
      - ""
      - "{info}{icon:click} Clique esq. {letters_black}· {letters}próxima ação"
      - "{info}{icon:click} Clique dir. {letters_black}· {letters}todas as ações"
    actions:
      - 'left: exylialib:logs_action next'
      - 'right: exylialib:logs_action all'
  info:
    slot: 49
    material: BOOK
    name: "<gradient:{info}:{info_light}>Registros</gradient>"
    lore:
      - "{letters_black}Registros da equipe"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Jogador{letters_black}: {highlight}%logs_subject%"
      - "  {letters_black}· {info}{icon:book} {letters}Registros{letters_black}: {info}%logs_count%"
