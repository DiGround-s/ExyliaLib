# /exylialib config: every Exylia plugin with settings to change.
# Per row: %cfg_plugin_name% %cfg_plugin_about% %cfg_plugin_status% (also %cfg_plugin_version% %cfg_plugin_files%)
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&lCONFIGURAÇÕES {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Não há mais plugins'
    lore:
      - "{letters_black}Os plugins Exylia com configurações aparecem aqui."
pagination:
  slots: '0-35'
  item_template:
    material: KNOWLEDGE_BOOK
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_plugin_name%</gradient>"
    lore:
      - "{letters_black}Configurações do plugin"
      - "%cfg_plugin_about%"
      - "%cfg_plugin_status%"
      - ""
      - "{primary}» Clique para abrir suas configurações"
    actions:
      - 'exylialib:config_plugin %cfg_plugin_name%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
# A command opens this screen, so it has no BACK: ESC closes it.
items:
  info:
    slot: 49
    material: BOOK
    name: "<gradient:{primary}:{secondary_light}>Configurações</gradient>"
    lore:
      - "{letters_black}Configuração"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Todos os plugins Exylia, daqui."
      - " {letters}Os arquivos continuam valendo:"
      - " {letters}edite um e o outro acompanha."
