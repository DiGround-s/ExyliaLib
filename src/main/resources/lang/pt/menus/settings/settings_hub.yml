title: '{primary}&l%settings_section% {letters_black}» {highlight}%settings_title%'
size: 45
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
pagination:
  item_template:
    material: '%icon%'
    name: '%name%'
    glow: '%glow%'
    lore:
      - '%lore%'
    actions:
      - 'left,shift_left: exylialib:settings_click 1'
      - 'right,shift_right: exylialib:settings_click -1'
  inert_template:
    material: '%icon%'
    name: '%name%'
    lore:
      - '%lore%'
items:
  header:
    slot: 4
    material: COMPARATOR
    name: '{primary}&l%settings_title%'
    lore:
      - ''
      - '{secondary}Informação:'
      - ' {letters_black}▎ {letters}Cada configuração deste plugin,'
      - ' {letters_black}▎ {letters}agrupadas por tema.'
      - ''
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLTAR'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Volta para %settings_parent%.'
      - ''
      - '{warning}➥ Clique para voltar'
      - ''
    actions:
      - 'exylialib:settings_back'
