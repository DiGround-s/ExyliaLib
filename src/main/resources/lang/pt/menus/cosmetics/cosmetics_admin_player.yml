title: '{primary}&lJOGADOR {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Jogador"
      - ""
      - "{primary}✎ Informações"
      - " {letters}Chaves, desbloqueios e o que"
      - " {letters}este jogador tem {highlight}equipado{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Jogador {letters_black}▸ <gradient:{primary}:{secondary_light}>Chaves de caixa</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Ajuste do jogador"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Chaves na conta, que abrem"
      - " {letters}a caixa e nunca se {highlight}perdem{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:key} {letters}Chaves{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}» Clique esquerdo {letters_black}· {letters}+1 chave"
      - "{primary}» Clique direito {letters_black}· {letters}-1 chave"
      - "{primary}» Shift-clique {letters_black}· {letters}digitar uma quantidade"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Jogador {letters_black}▸ <gradient:{primary}:{secondary_light}>Desbloqueios</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Conceda ou retire cada"
      - " {letters}cosmético, para sempre,"
      - " {letters}como um prêmio de {highlight}caixa{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {success}{icon:star} {letters}Obtidos{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}» Clique para gerenciar"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Jogador {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipado</gradient>"
    lore:
      - "{letters_black}Ajuste do jogador"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O que o jogador está usando agora."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Equipado{letters_black}: %player_equipped%"
      - ""
      - "{error}» Clique para remover"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Jogador {letters_black}▸ <gradient:{error}:{error_light}>Limpar favoritos</gradient>"
    lore:
      - "{letters_black}Zona de perigo"
      - ""
      - "{error}✎ Informação"
      - " {letters}Esvazia a lista de"
      - " {letters}favoritos do jogador."
      - ""
      - "{error}» Clique para limpar"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Jogadores</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: "{letters}Jogador {letters_black}▸ <gradient:{error}:{error_light}>Limpar desbloqueios</gradient>"
    lore:
      - "{letters_black}Zona de perigo"
      - ""
      - "{error}✎ Informação"
      - " {letters}Retira {highlight}tudo {letters}o que o"
      - " {letters}jogador ganhou ou recebeu."
      - ""
      - "{error}» Clique para limpar"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
