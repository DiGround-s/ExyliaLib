title: '{primary}&lCOSMÉTICO {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: '10-16'
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: '%reward_name%'
    lore:
      - ''
      - '{secondary}Informação:'
      - ' {letters_black}▎ %reward_description%'
      - ''
      - '{secondary}Status:'
      - ' {letters_black}▎ {letters}ID {letters_black}» {info}%reward_id%'
      - ' {letters_black}▎ {letters}Raridade {letters_black}» %reward_tier%'
      - ''
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: '{primary}&lDAR ITEM'
    lore:
      - ''
      - '{secondary}Informação:'
      - ' {letters_black}▎ {letters}O item que aplica este'
      - ' {letters_black}▎ {letters}cosmético, no {highlight}seu {letters}inventário.'
      - ''
      - '{warning}➥ Clique para receber um'
      - ''
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: '{primary}&lDAR CHAVES DE CAIXA'
    lore:
      - ''
      - '{secondary}Informação:'
      - ' {letters_black}▎ {letters}Chaves em item que abrem a caixa,'
      - ' {letters_black}▎ {letters}para guardar, trocar ou largar.'
      - ''
      - '{warning}➥ Clique esquerdo {letters_black}» {letters}uma chave'
      - '{warning}➥ Clique direito {letters_black}» {letters}digitar uma quantidade'
      - ''
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: '{primary}&lPRÉVIA'
    lore:
      - ''
      - '{secondary}Informação:'
      - ' {letters_black}▎ {letters}Reproduz este cosmético para {highlight}você'
      - ' {letters_black}▎ {letters}no palco de prévia.'
      - ''
      - '{warning}➥ Clique para assistir'
      - ''
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLTAR'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Volta ao catálogo.'
      - ''
      - '{warning}➥ Clique para voltar'
      - ''
    actions:
      - 'exylialib:cosmetics catalogue'
