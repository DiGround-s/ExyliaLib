title: '{primary}&lCOSMÉTICO {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: '10-16'
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Cosmético"
      - ""
      - "{accent}✎ Informação"
      - " %reward_description%"
      - ""
      - "{accent}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Raridade{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Cosmético {letters_black}▸ <gradient:{success}:{success_light}>Dar item</gradient>"
    lore:
      - "{letters_black}Ação do cosmético"
      - ""
      - "{success}✎ Informação"
      - " {letters}O item que aplica este"
      - " {letters}cosmético, no {highlight}seu {letters}inventário."
      - ""
      - "{success}{icon:click} Clique para receber um"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Cosmético {letters_black}▸ <gradient:{success}:{success_light}>Dar chaves de caixa</gradient>"
    lore:
      - "{letters_black}Ação do cosmético"
      - ""
      - "{success}✎ Informação"
      - " {letters}Chaves em item que abrem a caixa,"
      - " {letters}para guardar, trocar ou largar."
      - ""
      - "{success}{icon:click} Clique esquerdo {letters_black}· {letters}uma chave"
      - "{success}{icon:right_click} Clique direito {letters_black}· {letters}digitar uma quantidade"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Cosmético {letters_black}▸ <gradient:{info}:{info_light}>Prévia</gradient>"
    lore:
      - "{letters_black}Ação do cosmético"
      - ""
      - "{info}✎ Informação"
      - " {letters}Reproduz este cosmético para"
      - " {highlight}você {letters}no palco de prévia."
      - ""
      - "{info}{icon:click} Clique para assistir"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Catálogo</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - 'exylialib:cosmetics catalogue'
