title: '{primary}&lADMIN {letters_black}» {highlight}%admin_title%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Gestão de cosméticos"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O catálogo, os jogadores, as"
      - " {letters}vitrines e os blocos de caixa."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Cosméticos{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}Em uso{letters_black}: {info}%admin_in_use% {letters}de {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Catálogo</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Cada cosmético: entregue"
      - " {letters}o item, chaves de caixa,"
      - " {letters}ou veja uma {highlight}prévia{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Cosméticos{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}» Clique para navegar"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Jogadores</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Chaves, desbloqueios e o que cada"
      - " {letters}jogador online tem {highlight}equipado{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Status"
      - "  {letters_black}· {info}{icon:eye} {letters}Usando agora{letters_black}: {info}%admin_wearing% {letters}de {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}» Clique para navegar"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Vitrines</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Lugares que exibem os cosméticos"
      - " {letters}em {highlight}loop {letters}para quem estiver perto."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Colocadas{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}» Clique para gerenciar"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Blocos de caixa</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Blocos que abrem a caixa"
      - " {letters}quando um jogador {highlight}clica {letters}neles."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Vinculados{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}» Clique para gerenciar"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 36
    material: COMPARATOR
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Configurações</gradient>"
    lore:
      - "{letters_black}Configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Altera as configurações do"
      - " {letters}plugin sem editar seus {highlight}arquivos{letters}."
      - ""
      - "{primary}» Clique {letters_black}· {letters}Abrir configurações"
    actions:
      - 'exylialib:cosmetics settings'
