title: '{primary}&lBLOCOS DE CAIXA {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Sem mais blocos de caixa'
    lore:
      - "{letters_black}Vincule um bloco para vê-lo aqui."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'
  item_template:
    material: ENDER_CHEST
    name: "{letters}Bloco de caixa {letters_black}▸ <gradient:{primary}:{secondary_light}>#%place_number%</gradient>"
    lore:
      - "{letters_black}Bloco vinculado"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%place_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Em{letters_black}: {info}%place_x%{letters_black}, {info}%place_y%{letters_black}, {info}%place_z%"
      - "  {letters_black}· {info}{icon:ping} {letters}Servidor{letters_black}: {info}%place_server%"
      - ""
      - "{primary}{icon:click} Clique esquerdo para teleportar"
      - "{error}{icon:right_click} Clique direito para remover"
      - "{letters_black}Você precisará confirmar."
    actions:
      - 'left,shift_left: exylialib:cosmetics place_tp'
      - 'right,shift_right: exylialib:cosmetics place_remove'
  navigation:
