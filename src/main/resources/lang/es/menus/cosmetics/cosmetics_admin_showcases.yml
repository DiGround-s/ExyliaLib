title: '{primary}&lVITRINAS {letters_black}» {highlight}%admin_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}No hay más vitrinas'
    lore:
      - "{letters_black}Añade una donde estás para verla aquí."
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primera página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'
  item_template:
    material: ARMOR_STAND
    name: "{letters}Vitrina {letters_black}▸ <gradient:{primary}:{secondary_light}>#%place_number%</gradient>"
    lore:
      - "{letters_black}Vitrina colocada"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%place_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}En{letters_black}: {info}%place_x%{letters_black}, {info}%place_y%{letters_black}, {info}%place_z%"
      - "  {letters_black}· {info}{icon:ping} {letters}Servidor{letters_black}: {info}%place_server%"
      - ""
      - "{primary}{icon:click} Clic izquierdo para teletransportarte"
      - "{error}{icon:right_click} Clic derecho para quitar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - 'left,shift_left: exylialib:cosmetics place_tp'
      - 'right,shift_right: exylialib:cosmetics place_remove'
  navigation:
