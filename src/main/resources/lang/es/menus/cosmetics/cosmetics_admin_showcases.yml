    slot: 45
    material: LIME_DYE
    name: "{letters}Vitrinas {letters_black}▸ <gradient:{success}:{success_light}>Añadir vitrina</gradient>"
    lore:
      - "{letters_black}Nueva vitrina"
      - ""
      - "{success}✎ Información"
