title: '{primary}&lADMIN {letters_black}» {highlight}%admin_title%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Gestión de cosméticos"
      - ""
      - "{primary}✎ Información"
      - " {letters}El catálogo, los jugadores, las"
      - " {letters}vitrinas y los bloques de caja."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:star} {letters}Cosméticos{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}En uso{letters_black}: {info}%admin_in_use% {letters}de {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Catálogo</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cada cosmético: entrega"
      - " {letters}su ítem, llaves de caja"
      - " {letters}o mira una {highlight}vista previa{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:star} {letters}Cosméticos{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}» Clic para explorar"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Jugadores</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Llaves, desbloqueos y lo que cada"
      - " {letters}jugador en línea tiene {highlight}equipado{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:eye} {letters}Con uno puesto{letters_black}: {info}%admin_wearing% {letters}de {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}» Clic para explorar"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Vitrinas</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Lugares que muestran"
      - " {letters}los cosméticos en {highlight}bucle"
      - " {letters}a quien esté cerca."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Colocadas{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}» Clic para gestionar"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Cosméticos {letters_black}▸ <gradient:{primary}:{secondary_light}>Bloques de caja</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Bloques que abren la caja"
      - " {letters}cuando un jugador hace {highlight}clic{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Vinculados{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}» Clic para gestionar"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 36
    material: COMPARATOR
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajustes</gradient>"
    lore:
      - "{letters_black}Configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cambia los ajustes del plugin"
      - " {letters}sin editar sus {highlight}archivos{letters}."
      - ""
      - "{primary}» Clic {letters_black}· {letters}Abrir ajustes"
    actions:
      - 'exylialib:cosmetics settings'
