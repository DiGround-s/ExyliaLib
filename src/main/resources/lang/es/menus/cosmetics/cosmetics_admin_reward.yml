title: '{primary}&lCOSMÉTICO {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Cosmético"
      - ""
      - "{accent}✎ Información"
      - " %reward_description%"
      - ""
      - "{accent}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Rareza{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Cosmético {letters_black}▸ <gradient:{success}:{success_light}>Dar ítem</gradient>"
    lore:
      - "{letters_black}Acción del cosmético"
      - ""
      - "{success}✎ Información"
      - " {letters}El ítem que aplica este"
      - " {letters}cosmético, a {highlight}tu {letters}inventario."
      - ""
      - "{success}{icon:click} Clic para recibir uno"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Cosmético {letters_black}▸ <gradient:{success}:{success_light}>Dar llaves de caja</gradient>"
    lore:
      - "{letters_black}Acción del cosmético"
      - ""
      - "{success}✎ Información"
      - " {letters}Llaves físicas que abren"
      - " {letters}la caja, para guardar,"
      - " {letters}intercambiar o tirar."
      - ""
      - "{success}{icon:click} Clic izquierdo {letters_black}· {letters}una llave"
      - "{success}{icon:right_click} Clic derecho {letters_black}· {letters}escribir una cantidad"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Cosmético {letters_black}▸ <gradient:{info}:{info_light}>Vista previa</gradient>"
    lore:
      - "{letters_black}Acción del cosmético"
      - ""
      - "{info}✎ Información"
      - " {letters}Reproduce este cosmético para {highlight}ti"
      - " {letters}en el escenario de vista previa."
      - ""
      - "{info}{icon:click} Clic para verlo"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Catálogo</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - 'exylialib:cosmetics catalogue'
