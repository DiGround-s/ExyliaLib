title: '{primary}&lJUGADOR {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: '{primary}&l%player_name%'
    lore:
      - ''
      - '{secondary}Estado:'
      - ' {letters_black}▎ {letters}Llaves de caja {letters_black}» {info}%player_keys%'
      - ' {letters_black}▎ {letters}Obtenidos {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ' {letters_black}▎ {letters}Equipado {letters_black}» %player_equipped%'
      - ''
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: '{primary}&lLLAVES DE CAJA &8[{info}%player_keys%&8]'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Llaves en la cuenta, que abren'
      - ' {letters_black}▎ {letters}la caja y nunca se {highlight}pierden{letters}.'
      - ''
      - '{secondary}Estado:'
      - ' {letters_black}▎ {letters}Llaves {letters_black}» {info}%player_keys%'
      - ''
      - '{warning}➥ Clic izquierdo {letters_black}» {letters}+1 llave'
      - '{warning}➥ Clic derecho {letters_black}» {letters}-1 llave'
      - '{warning}➥ Shift-clic {letters_black}» {letters}escribir una cantidad'
      - ''
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: '{primary}&lDESBLOQUEOS'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Otorga o retira cada cosmético,'
      - ' {letters_black}▎ {letters}para siempre, como un premio de {highlight}caja{letters}.'
      - ''
      - '{secondary}Estado:'
      - ' {letters_black}▎ {letters}Obtenidos {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ''
      - '{warning}➥ Clic para gestionar'
      - ''
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: '{primary}&lEQUIPADO'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Lo que el jugador lleva ahora mismo.'
      - ''
      - '{secondary}Estado:'
      - ' {letters_black}▎ {letters}Equipado {letters_black}» %player_equipped%'
      - ''
      - '{error}➥ Clic para quitárselo'
      - ' {letters_black}Se te pedirá confirmación.'
      - ''
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: '{error}&lBORRAR FAVORITOS'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Vacía la lista de favoritos del jugador.'
      - ''
      - '{error}➥ Clic para borrar'
      - ' {letters_black}Se te pedirá confirmación.'
      - ''
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLVER'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Vuelve a los jugadores.'
      - ''
      - '{warning}➥ Clic para volver'
      - ''
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: '{error}&lBORRAR DESBLOQUEOS'
    lore:
      - ''
      - '{secondary}Información:'
      - ' {letters_black}▎ {letters}Retira {highlight}todo {letters}lo que el jugador'
      - ' {letters_black}▎ {letters}ganó o recibió.'
      - ''
      - '{error}➥ Clic para borrar'
      - ' {letters_black}Se te pedirá confirmación.'
      - ''
    actions:
      - 'exylialib:cosmetics clear_unlocks'
