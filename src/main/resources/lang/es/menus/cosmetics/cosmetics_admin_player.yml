title: '{primary}&lJUGADOR {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Jugador"
      - ""
      - "{primary}✎ Información"
      - " {letters}Llaves, desbloqueos y lo que"
      - " {letters}este jugador tiene {highlight}equipado{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Jugador {letters_black}▸ <gradient:{primary}:{secondary_light}>Llaves de caja</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Ajuste del jugador"
      - ""
      - "{primary}✎ Información"
      - " {letters}Llaves en la cuenta, que abren"
      - " {letters}la caja y nunca se {highlight}pierden{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:key} {letters}Llaves{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}+1 llave"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}-1 llave"
      - "{primary}{icon:click} Shift-clic {letters_black}· {letters}escribir una cantidad"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Jugador {letters_black}▸ <gradient:{primary}:{secondary_light}>Desbloqueos</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Otorga o retira cada"
      - " {letters}cosmético, para siempre,"
      - " {letters}como un premio de {highlight}caja{letters}."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {success}{icon:star} {letters}Obtenidos{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}{icon:click} Clic para gestionar"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Jugador {letters_black}▸ <gradient:{primary}:{secondary_light}>Equipado</gradient>"
    lore:
      - "{letters_black}Ajuste del jugador"
      - ""
      - "{primary}✎ Información"
      - " {letters}Lo que el jugador"
      - " {letters}lleva ahora mismo."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:eye} {letters}Equipado{letters_black}: %player_equipped%"
      - ""
      - "{error}{icon:click} Clic para quitárselo"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Jugador {letters_black}▸ <gradient:{error}:{error_light}>Borrar favoritos</gradient>"
    lore:
      - "{letters_black}Zona de peligro"
      - ""
      - "{error}✎ Información"
      - " {letters}Vacía la lista de"
      - " {letters}favoritos del jugador."
      - ""
      - "{error}{icon:click} Clic para borrar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Jugadores</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: "{letters}Jugador {letters_black}▸ <gradient:{error}:{error_light}>Borrar desbloqueos</gradient>"
    lore:
      - "{letters_black}Zona de peligro"
      - ""
      - "{error}✎ Información"
      - " {letters}Retira {highlight}todo {letters}lo que el"
      - " {letters}jugador ganó o recibió."
      - ""
      - "{error}{icon:click} Clic para borrar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
