title: '{primary}&lREGISTRO {letters_black}» {highlight}%log_action% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:item.book.page_turn|1.0|1.2"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primera página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '9-44'
  group_template:
    material: NAME_TAG
    name: "{letters}Grupo {letters_black}▸ <gradient:{info}:{info_light}>%group_label%</gradient>"
    lore:
      - "{letters_black}Grupo de ítems"
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Stacks{letters_black}: {info}%group_count%"
      - ""
      - "{info}{icon:click} Pasa el cursor por los ítems de al lado"
  nothing_template:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Nada en este grupo'
    lore:
      - "{letters_black}No se movieron ítems en este lado."
  empty_template:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Sin ítems guardados'
    lore:
      - "{letters_black}Todo lo registrado está arriba."
  spacer_template:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
