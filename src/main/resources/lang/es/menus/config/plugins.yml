# /exylialib config: every Exylia plugin with settings to change.
# Per row: %cfg_plugin_name% %cfg_plugin_version% %cfg_plugin_files%
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&lAJUSTES {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
