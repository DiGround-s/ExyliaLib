title: '{primary}&lJOURNAL {letters_black}» {highlight}%log_action% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:item.book.page_turn|1.0|1.2"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '9-44'
  group_template:
    material: NAME_TAG
    name: "{letters}Groupe {letters_black}▸ <gradient:{info}:{info_light}>%group_label%</gradient>"
