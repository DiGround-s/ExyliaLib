    name: '{muted}Rien dans ce groupe'
    lore:
      - "{letters_black}Aucun objet n'a bougé de ce côté."
  empty_template:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Aucun objet conservé'
    lore:
      - "{letters_black}Tout ce qui est consigné est en haut."
  spacer_template:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
