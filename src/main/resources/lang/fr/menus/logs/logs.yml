    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Plus aucune entrée'
    lore:
      - "{letters_black}Les plugins consignent ici ce que fait le staff."
pagination:
  slots: '0-35'
  item_template:
    material: '%log_icon%'
    name: "{letters}Entrée {letters_black}▸ <gradient:{info}:{info_light}>%log_action%</gradient>"
