title: '{primary}&lMODES'
size: 45
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
pagination:
  item_template:
    material: '%icon%'
    name: '%name%'
    glow: '%glow%'
    lore:
      - '%lore%'
    actions:
      - 'exylialib:modes_click'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: '{primary}&lMODES'
    lore:
      - ''
      - '{secondary}Informations :'
      - ' {letters_black}▎ {letters}Toutes les façons de jouer sur le serveur,'
      - ' {letters_black}▎ {letters}regroupées par {highlight}type{letters}.'
      - ''
      - '{secondary}Statistiques :'
      - ' {letters_black}▎ {letters}En jeu {letters_black}» {info}%modes_playing%'
      - ''
