    material: '%icon%'
    name: '%name%'
    glow: '%glow%'
    lore:
      - '%lore%'
    actions:
      - 'exylialib:modes_click'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{info}:{info_light}>Modes</gradient>"
    lore:
      - "{letters_black}Modes du serveur"
      - ""
      - "{info}✎ Informations "
      - " {letters}Toutes les façons de jouer sur"
      - " {letters}le serveur, regroupées par {highlight}type{letters}."
      - ""
      - "{info}✦ Statistiques "
      - "  {letters_black}· {info}{icon:eye} {letters}En jeu{letters_black}: {info}%modes_playing%"
