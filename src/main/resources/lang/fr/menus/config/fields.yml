# One page of a settings file: a header, then a button per key, centred and cut to size.
# Values: %cfg_plugin% %cfg_title% %cfg_where% %cfg_back_to% %cfg_head_icon% %cfg_head_name% %cfg_head_lore%
# Per row: %cfg_key% %cfg_name% %cfg_icon% %cfg_value% %cfg_about% %cfg_hint%
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&l%cfg_title% {letters_black}» {highlight}%cfg_where% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
pagination:
  slots: '10-16'
  item_template:
    material: '%cfg_icon%'
    name: '{primary}&l%cfg_name%'
    lore:
      - ''
      - '%cfg_about%'
      - '{secondary}État :'
      - ' {letters_black}▎ {letters}Actuel {letters_black}» %cfg_value%'
      - ''
      - '%cfg_hint%'
      - ''
    actions:
      - 'left: exylialib:config_edit left %cfg_key%'
      - 'right: exylialib:config_edit right %cfg_key%'
      - 'shift_left: exylialib:config_edit shift_left %cfg_key%'
      - 'shift_right: exylialib:config_edit shift_right %cfg_key%'
      - 'drop: exylialib:config_edit drop %cfg_key%'
  section_template:
    material: '%cfg_icon%'
    name: '{primary}&l%cfg_name%'
    lore:
      - ''
      - '%cfg_about%'
      - '{secondary}État :'
      - ' {letters_black}▎ {letters}Réglages {letters_black}» %cfg_value%'
      - ''
      - '%cfg_hint%'
      - ''
    actions:
      - 'exylialib:config_edit left %cfg_key%'
  locked_template:
    material: '%cfg_icon%'
    name: '{muted}&l%cfg_name%'
    lore:
      - ''
      - '%cfg_about%'
      - '{secondary}État :'
      - ' {letters_black}▎ {letters}Actuel {letters_black}» %cfg_value%'
      - ''
      - ' {letters_black}▎ {letters_black}Cette valeur ne se modifie pas en jeu.'
      - '%cfg_hint%'
      - ''
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PAGE PRÉCÉDENTE'
      lore:
        - ''
        - ' {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%'
        - ''
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPAGE SUIVANTE →'
      lore:
        - ''
        - ' {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%'
        - ''
items:
  header:
    slot: 4
    material: '%cfg_head_icon%'
    name: '{primary}&l%cfg_head_name%'
    lore:
      - ''
      - '%cfg_head_lore%'
      - ''
  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lRETOUR'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Revient à %cfg_back_to%.'
      - ''
      - '{warning}➥ Cliquez pour revenir'
      - ''
    actions:
      - 'exylialib:config_back'
