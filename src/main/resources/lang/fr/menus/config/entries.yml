# The entries of a block in a content file: one button per entry.
# Values: %cfg_plugin% %cfg_where% %cfg_back_to%
# Per row: %cfg_key% %cfg_name% %cfg_icon% %cfg_value% %cfg_hint%
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&lCONTENU {letters_black}» {highlight}%cfg_where% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Plus aucune entrée'
    lore:
      - "{letters_black}Crée-en une pour la voir ici."
pagination:
  slots: '0-35'
  item_template:
    material: '%cfg_icon%'
    name: "{letters}Entrée {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_name%</gradient>"
    lore:
      - "{letters_black}Entrée de la liste"
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {letters}Contient{letters_black}: %cfg_value%"
      - ""
      - "%cfg_hint%"
      - "{primary}{icon:click} Maj + clic gauche {letters_black}· {letters}dupliquer"
      - "{error}{icon:right_click} Maj + clic droit {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - 'left: exylialib:config_entry open %cfg_key%'
      - 'right: exylialib:config_entry open %cfg_key%'
      - 'shift_left: exylialib:config_entry duplicate %cfg_key%'
      - 'shift_right: exylialib:config_entry delete %cfg_key%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
items:
  create:
    slot: 45
    material: LIME_DYE
    name: "{letters}Créer {letters_black}▸ <gradient:{success}:{success_light}>Nouvelle entrée</gradient>"
    lore:
      - "{letters_black}Nouvelle entrée"
      - ""
      - "{success}✎ Informations "
      - " {letters}Ajoute une nouvelle entrée qui se"
      - " {letters}charge déjà, prête à {highlight}modifier{letters} ici."
      - ""
      - "{success}{icon:click} Clic {letters_black}· {letters}Créer"
    actions:
      - 'exylialib:config_entry create'
  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>%cfg_back_to%</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - 'exylialib:config_back'
