title: '{primary}&lJOUEUR {letters_black}» {highlight}%player_name%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Joueur"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Clés, déblocages et ce"
      - " {letters}que ce joueur a {highlight}équipé{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Joueur {letters_black}▸ <gradient:{primary}:{secondary_light}>Clés de caisse</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Réglage du joueur"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Clés sur le compte, qui ouvrent la"
      - " {letters}caisse et ne se {highlight}perdent {letters}jamais."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:key} {letters}Clés{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}+1 clé"
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}-1 clé"
      - "{primary}{icon:click} Maj-clic {letters_black}· {letters}saisir un nombre"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Joueur {letters_black}▸ <gradient:{primary}:{secondary_light}>Déblocages</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Accorde ou retire chaque"
      - " {letters}cosmétique, pour de bon,"
      - " {letters}comme un gain de {highlight}caisse{letters}."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {success}{icon:star} {letters}Possédés{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}{icon:click} Clique pour gérer"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Joueur {letters_black}▸ <gradient:{primary}:{secondary_light}>Équipé</gradient>"
    lore:
      - "{letters_black}Réglage du joueur"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Ce que le joueur"
      - " {letters}porte en ce moment."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:eye} {letters}Équipé{letters_black}: %player_equipped%"
      - ""
      - "{error}{icon:click} Clique pour le retirer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 18
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Joueur {letters_black}▸ <gradient:{error}:{error_light}>Vider les favoris</gradient>"
    lore:
      - "{letters_black}Zone dangereuse"
      - ""
      - "{error}✎ Informations "
      - " {letters}Vide la liste de favoris du joueur."
      - ""
      - "{error}{icon:click} Clique pour vider"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Joueurs</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 26
    material: BARRIER
    name: "{letters}Joueur {letters_black}▸ <gradient:{error}:{error_light}>Vider les déblocages</gradient>"
    lore:
      - "{letters_black}Zone dangereuse"
      - ""
      - "{error}✎ Informations "
      - " {letters}Reprend {highlight}tout {letters}ce que le"
      - " {letters}joueur a gagné ou reçu."
      - ""
      - "{error}{icon:click} Clique pour vider"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
