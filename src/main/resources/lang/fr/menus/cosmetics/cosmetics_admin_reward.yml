title: '{primary}&lCOSMÉTIQUE {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Cosmétique"
      - ""
      - "{accent}✎ Informations "
      - " %reward_description%"
      - ""
      - "{accent}✦ Statut "
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Rareté{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Cosmétique {letters_black}▸ <gradient:{success}:{success_light}>Donner l'objet</gradient>"
    lore:
      - "{letters_black}Action du cosmétique"
      - ""
      - "{success}✎ Informations "
      - " {letters}L'objet qui applique ce"
      - " {letters}cosmétique, dans {highlight}ton {letters}inventaire."
      - ""
      - "{success}{icon:click} Clique pour en recevoir un"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Cosmétique {letters_black}▸ <gradient:{success}:{success_light}>Donner des clés</gradient>"
    lore:
      - "{letters_black}Action du cosmétique"
      - ""
      - "{success}✎ Informations "
      - " {letters}Des clés en objet qui"
      - " {letters}ouvrent la caisse, à"
      - " {letters}garder, échanger ou jeter."
      - ""
      - "{success}{icon:click} Clic gauche {letters_black}· {letters}une clé"
      - "{success}{icon:right_click} Clic droit {letters_black}· {letters}saisir un nombre"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Cosmétique {letters_black}▸ <gradient:{info}:{info_light}>Aperçu</gradient>"
    lore:
      - "{letters_black}Action du cosmétique"
      - ""
      - "{info}✎ Informations "
      - " {letters}Joue ce cosmétique pour"
      - " {highlight}toi {letters}sur la scène d'aperçu."
      - ""
      - "{info}{icon:click} Clique pour le voir"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Catalogue</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - 'exylialib:cosmetics catalogue'
