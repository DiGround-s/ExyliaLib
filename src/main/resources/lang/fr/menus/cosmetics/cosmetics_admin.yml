title: '{primary}&lADMIN {letters_black}» {highlight}%admin_title%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Gestion des cosmétiques"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Le catalogue, les joueurs, les"
      - " {letters}vitrines et les blocs de caisse."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:star} {letters}Cosmétiques{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}Utilisés{letters_black}: {info}%admin_in_use% {letters}sur {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Cosmétiques {letters_black}▸ <gradient:{primary}:{secondary_light}>Catalogue</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Chaque cosmétique : donne"
      - " {letters}son objet, des clés de"
      - " {letters}caisse, ou vois un {highlight}aperçu{letters}."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:star} {letters}Cosmétiques{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}» Clique pour parcourir"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Cosmétiques {letters_black}▸ <gradient:{primary}:{secondary_light}>Joueurs</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Clés, déblocages et ce que chaque"
      - " {letters}joueur en ligne a {highlight}équipé{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:eye} {letters}Équipés en ce moment{letters_black}: {info}%admin_wearing% {letters}sur {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}» Clique pour parcourir"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Cosmétiques {letters_black}▸ <gradient:{primary}:{secondary_light}>Vitrines</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Des lieux qui montrent"
      - " {letters}les cosmétiques en"
      - " {highlight}boucle {letters}à qui est proche."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:iron} {letters}Placées{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}» Clique pour gérer"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Cosmétiques {letters_black}▸ <gradient:{primary}:{secondary_light}>Blocs de caisse</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Des blocs qui ouvrent la caisse"
      - " {letters}quand un joueur {highlight}clique {letters}dessus."
      - ""
      - "{primary}✦ Statut "
      - "  {letters_black}· {info}{icon:iron} {letters}Liés{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}» Clique pour gérer"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 36
    material: COMPARATOR
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Paramètres</gradient>"
    lore:
      - "{letters_black}Configuration"
      - ""
      - "{primary}✎ Informations "
      - " {letters}Change les paramètres du plugin"
      - " {letters}sans modifier ses {highlight}fichiers{letters}."
      - ""
      - "{primary}» Clique {letters_black}· {letters}Ouvrir les paramètres"
    actions:
      - 'exylialib:cosmetics settings'
