title: '{primary}&lKOZMETİK {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Kozmetik"
      - ""
      - "{accent}✎ Bilgi"
      - " %reward_description%"
      - ""
      - "{accent}✦ Durum"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Nadirlik{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Kozmetik {letters_black}▸ <gradient:{success}:{success_light}>Eşya ver</gradient>"
    lore:
      - "{letters_black}Kozmetik eylemi"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Bu kozmetiği uygulayan"
      - " {letters}eşya, {highlight}senin {letters}envanterine."
      - ""
      - "{success}{icon:click} Bir tane almak için tıkla"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Kozmetik {letters_black}▸ <gradient:{success}:{success_light}>Sandık anahtarı ver</gradient>"
    lore:
      - "{letters_black}Kozmetik eylemi"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Sandığı açan anahtar eşyalar;"
      - " {letters}tutulabilir, takas edilebilir."
      - ""
      - "{success}{icon:click} Sol tık {letters_black}· {letters}bir anahtar"
      - "{success}{icon:right_click} Sağ tık {letters_black}· {letters}miktar yaz"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Kozmetik {letters_black}▸ <gradient:{info}:{info_light}>Önizleme</gradient>"
    lore:
      - "{letters_black}Kozmetik eylemi"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bu kozmetiği {highlight}sana {letters}önizleme"
      - " {letters}sahnesinde oynatır."
      - ""
      - "{info}{icon:click} İzlemek için tıkla"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>Katalog</gradient>"
    lore:
      - "{error}{icon:click} Geri dönmek için tıkla"
    actions:
      - 'exylialib:cosmetics catalogue'
