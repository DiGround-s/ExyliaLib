title: '{primary}&lOYUNCU {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: '{primary}&l%player_name%'
    lore:
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Sandık anahtarı {letters_black}» {info}%player_keys%'
      - ' {letters_black}▎ {letters}Sahip olunan {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ' {letters_black}▎ {letters}Kuşanılan {letters_black}» %player_equipped%'
      - ''
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: '{primary}&lSANDIK ANAHTARLARI &8[{info}%player_keys%&8]'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Hesaptaki anahtarlar sandığı açar'
      - ' {letters_black}▎ {letters}ve asla {highlight}kaybolmaz{letters}.'
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Anahtar {letters_black}» {info}%player_keys%'
      - ''
      - '{warning}➥ Sol tık {letters_black}» {letters}+1 anahtar'
      - '{warning}➥ Sağ tık {letters_black}» {letters}-1 anahtar'
      - '{warning}➥ Shift-tık {letters_black}» {letters}miktar yaz'
      - ''
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: '{primary}&lKİLİT AÇMALAR'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Her kozmetiği ver ya da geri al,'
      - ' {letters_black}▎ {letters}{highlight}sandık {letters}ödülü gibi kalıcı.'
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Sahip olunan {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ''
      - '{warning}➥ Yönetmek için tıkla'
      - ''
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: '{primary}&lKUŞANILAN'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Oyuncunun şu an kuşandığı.'
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Kuşanılan {letters_black}» %player_equipped%'
      - ''
      - '{error}➥ Çıkarmak için tıkla'
      - ' {letters_black}Onaylaman istenecek.'
      - ''
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: '{error}&lFAVORİLERİ TEMİZLE'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Oyuncunun favori listesini boşaltır.'
      - ''
      - '{error}➥ Temizlemek için tıkla'
      - ' {letters_black}Onaylaman istenecek.'
      - ''
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lGERİ'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Oyunculara döner.'
      - ''
      - '{warning}➥ Geri dönmek için tıkla'
      - ''
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: '{error}&lKİLİT AÇMALARI SİL'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Oyuncunun kazandığı ya da'
      - ' {letters_black}▎ {letters}aldığı {highlight}her şeyi {letters}geri alır.'
      - ''
      - '{error}➥ Temizlemek için tıkla'
      - ' {letters_black}Onaylaman istenecek.'
      - ''
    actions:
      - 'exylialib:cosmetics clear_unlocks'
