title: '{primary}&lOYUNCU {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Oyuncu"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Anahtarlar, açılanlar"
      - " {letters}ve {highlight}kuşanılanlar{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{primary}:{secondary_light}>Sandık anahtarları</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Oyuncu ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Hesaptaki anahtarlar sandığı"
      - " {letters}açar ve asla {highlight}kaybolmaz{letters}."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:key} {letters}Anahtar{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}» Sol tık {letters_black}· {letters}+1 anahtar"
      - "{primary}» Sağ tık {letters_black}· {letters}-1 anahtar"
      - "{primary}» Shift-tık {letters_black}· {letters}miktar yaz"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{primary}:{secondary_light}>Kilit açmalar</gradient>"
    lore:
      - "{letters_black}Kurulum bölümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Her kozmetiği ver ya da geri"
      - " {letters}al, {highlight}sandık {letters}ödülü gibi kalıcı."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {success}{icon:star} {letters}Sahip olunan{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}» Yönetmek için tıkla"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{primary}:{secondary_light}>Kuşanılan</gradient>"
    lore:
      - "{letters_black}Oyuncu ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Oyuncunun şu an kuşandığı."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:eye} {letters}Kuşanılan{letters_black}: %player_equipped%"
      - ""
      - "{error}» Çıkarmak için tıkla"
      - "{letters_black}Onaylaman istenecek."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{error}:{error_light}>Favorileri temizle</gradient>"
    lore:
      - "{letters_black}Tehlikeli bölge"
      - ""
      - "{error}✎ Bilgi"
      - " {letters}Oyuncunun favori"
      - " {letters}listesini boşaltır."
      - ""
      - "{error}» Temizlemek için tıkla"
      - "{letters_black}Onaylaman istenecek."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>Oyuncular</gradient>"
    lore:
      - "{error}» Geri dönmek için tıkla"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{error}:{error_light}>Kilit açmaları sil</gradient>"
    lore:
      - "{letters_black}Tehlikeli bölge"
      - ""
      - "{error}✎ Bilgi"
      - " {letters}Oyuncunun kazandığı ya da"
      - " {letters}aldığı {highlight}her şeyi {letters}geri alır."
      - ""
      - "{error}» Temizlemek için tıkla"
      - "{letters_black}Onaylaman istenecek."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
