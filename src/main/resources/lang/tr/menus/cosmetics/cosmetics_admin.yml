title: '{primary}&lYÖNETİM {letters_black}» {highlight}%admin_title%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Kozmetik yönetimi"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Katalog, oyuncular, vitrinler"
      - " {letters}ve sandık blokları."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:star} {letters}Kozmetikler{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}Kullanımda{letters_black}: {info}%admin_in_use% {letters_black}/ {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Kozmetikler {letters_black}▸ <gradient:{primary}:{secondary_light}>Katalog</gradient>"
    lore:
      - "{letters_black}Kurulum bölümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Her kozmetik: eşyasını ver,"
      - " {letters}sandık anahtarı ver ya da {highlight}önizle{letters}."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:star} {letters}Kozmetikler{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}» Göz atmak için tıkla"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Kozmetikler {letters_black}▸ <gradient:{primary}:{secondary_light}>Oyuncular</gradient>"
    lore:
      - "{letters_black}Kurulum bölümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Anahtarlar, kilit açmalar ve her"
      - " {letters}çevrimiçi oyuncunun {highlight}kuşandığı{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:eye} {letters}Şu an kuşanan{letters_black}: {info}%admin_wearing% {letters_black}/ {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}» Göz atmak için tıkla"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Kozmetikler {letters_black}▸ <gradient:{primary}:{secondary_light}>Vitrinler</gradient>"
    lore:
      - "{letters_black}Kurulum bölümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kozmetikleri yakındaki herkese"
      - " {highlight}döngüde {letters}gösteren yerler."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:iron} {letters}Yerleştirilen{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}» Yönetmek için tıkla"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Kozmetikler {letters_black}▸ <gradient:{primary}:{secondary_light}>Sandık blokları</gradient>"
    lore:
      - "{letters_black}Kurulum bölümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir oyuncu {highlight}tıkladığında"
      - " {letters}sandığı açan bloklar."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:iron} {letters}Bağlı{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}» Yönetmek için tıkla"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 36
    material: COMPARATOR
    name: "{letters}Eklenti {letters_black}▸ <gradient:{primary}:{secondary_light}>Ayarlar</gradient>"
    lore:
      - "{letters_black}Yapılandırma"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Eklentinin ayarlarını"
      - " {highlight}dosyalarını {letters}açmadan değiştir."
      - ""
      - "{primary}» Tıkla {letters_black}· {letters}Ayarları aç"
    actions:
      - 'exylialib:cosmetics settings'
