# /exylialib config: every Exylia plugin with settings to change.
# Per row: %cfg_plugin_name% %cfg_plugin_about% %cfg_plugin_status% (also %cfg_plugin_version% %cfg_plugin_files%)
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&lAYARLAR {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Başka eklenti yok'
    lore:
      - "{letters_black}Ayarları olan Exylia eklentileri burada görünür."
pagination:
  slots: '0-35'
  item_template:
    material: KNOWLEDGE_BOOK
    name: "{letters}Eklenti {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_plugin_name%</gradient>"
