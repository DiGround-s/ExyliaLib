# The settings screens of every plugin, shown by /settings.
# Restyle them freely: the library only adds keys missing from this file.
# The root screen: Settings and Announcements.
menu-version: 1

title: '{primary}&lAYARLAR'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
items:
  settings:
    slot: 12
    material: COMPARATOR
    name: "<gradient:{primary}:{secondary_light}>Ayarlar</gradient>"
    lore:
      - "{letters_black}Ayarların"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Diğer oyuncular sana nasıl"
      - " {letters}ulaşır ve her özellik sana"
      - " {letters}nasıl davranır."
      - ""
      - "{primary}{icon:click} Açmak için tıkla"
    actions:
      - 'exylialib:settings_open settings'
  announcements:
    slot: 14
    material: BELL
    name: "<gradient:{primary}:{secondary_light}>Duyurular</gradient>"
    lore:
      - "{letters_black}Ayarların"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Sunucu genelindeki hangi"
      - " {letters}mesajlar senin {highlight}sohbetine {letters}ulaşır."
      - ""
      - "{primary}{icon:click} Açmak için tıkla"
    actions:
      - 'exylialib:settings_open announcements'
