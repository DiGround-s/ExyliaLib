# The staff audit log, shown by /exylialib logs: one player's entries, or
# everybody's, newest first, across every plugin that keeps a log.
# Restyle it freely: the library only adds keys missing from this file.
#
# Values: %logs_subject% %logs_plugin% %logs_action% %logs_count%
# Per row: %log_id% %log_icon% %log_plugin% %log_action% %log_actor% %log_target%
#          %log_detail% %log_server% %log_location% %log_when% %log_date%
#          %log_view% (the click hint: view the items, or open the entry)
title: '{primary}&lKAYITLAR {letters_black}» {highlight}%logs_subject% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: false
    name: '{muted}Başka kayıt yok'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Eklentiler yetkililerin yaptıklarını buraya kaydeder.'
      - ''
pagination:
  slots: '0-35'
  item_template:
    material: '%log_icon%'
    name: '{primary}&l%log_action%'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Eklenti {letters_black}» {info}%log_plugin%'
      - ' {letters_black}▎ {letters}Yapan {letters_black}» {highlight}%log_actor%'
      - ' {letters_black}▎ {letters}Hedef {letters_black}» {highlight}%log_target%'
      - ''
      - '{secondary}Ayrıntı:'
      - '%log_detail%'
      - ''
      - '{secondary}Konum:'
      - ' {letters_black}▎ {letters}Sunucu {letters_black}» {info}%log_server%'
      - ' {letters_black}▎ {letters}Konum {letters_black}» {info}%log_location%'
      - ' {letters_black}▎ {letters}Zaman {letters_black}» {info}%log_when% ⌚'
      - ' {letters_black}▎ {letters_black}%log_date%'
      - ''
      - '%log_view%'
      - ''
    actions:
      - 'exylialib:logs_entry %log_id%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← ÖNCEKİ SAYFA'
      lore:
        - ''
        - ' {letters_black}▎ {letters}Sayfa {info}%current_page%{letters_black}/{info}%total_pages%'
        - ''
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lSONRAKİ SAYFA →'
      lore:
        - ''
        - ' {letters_black}▎ {letters}Sayfa {info}%current_page%{letters_black}/{info}%total_pages%'
        - ''
# A command opens this screen, so it has no BACK: ESC closes it.
items:
  plugin:
    slot: 45
    material: COMPARATOR
    name: '{primary}&lEKLENTİYE GÖRE FİLTRELE'
    lore:
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Gösterilen {letters_black}» {highlight}%logs_plugin%'
      - ''
      - '{warning}➥ Sol tık {letters_black}» {letters}sonraki eklenti'
      - '{warning}➥ Sağ tık {letters_black}» {letters}tüm eklentiler'
      - ''
    actions:
      - 'left: exylialib:logs_plugin next'
      - 'right: exylialib:logs_plugin all'
  action:
    slot: 46
    material: HOPPER
    name: '{primary}&lİŞLEME GÖRE FİLTRELE'
    lore:
      - ''
      - '{secondary}Durum:'
      - ' {letters_black}▎ {letters}Gösterilen {letters_black}» {highlight}%logs_action%'
      - ''
      - '{warning}➥ Sol tık {letters_black}» {letters}sonraki işlem'
      - '{warning}➥ Sağ tık {letters_black}» {letters}tüm işlemler'
      - ''
    actions:
      - 'left: exylialib:logs_action next'
      - 'right: exylialib:logs_action all'
  info:
    slot: 49
    material: BOOK
    name: '{primary}&lKAYITLAR'
    lore:
      - ''
      - '{secondary}Bilgi:'
      - ' {letters_black}▎ {letters}Oyuncu {letters_black}» {highlight}%logs_subject%'
      - ' {letters_black}▎ {letters}Eklenti {letters_black}» {info}%logs_plugin%'
      - ' {letters_black}▎ {letters}İşlem {letters_black}» {info}%logs_action%'
      - ' {letters_black}▎ {letters}Kayıtlar {letters_black}» {info}%logs_count%'
      - ''
