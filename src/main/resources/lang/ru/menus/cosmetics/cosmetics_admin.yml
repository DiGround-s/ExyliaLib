title: '{primary}&lАДМИН {letters_black}» {highlight}%admin_title%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:{primary}:{secondary_light}>%admin_title%</gradient>"
    lore:
      - "{letters_black}Управление косметикой"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Каталог, игроки,"
      - " {letters}витрины и блоки ящика."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:star} {letters}Косметика{letters_black}: {info}%admin_catalogue%"
      - "  {letters_black}· {info}{icon:eye} {letters}Используется{letters_black}: {info}%admin_in_use% {letters}из {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
  catalogue:
    group: cards
    material: BOOKSHELF
    name: "{letters}Косметика {letters_black}▸ <gradient:{primary}:{secondary_light}>Каталог</gradient>"
    lore:
      - "{letters_black}Раздел настройки"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Вся косметика: выдай предмет,"
      - " {letters}ключи от ящика или смотри {highlight}превью{letters}."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:star} {letters}Косметика{letters_black}: {info}%admin_catalogue%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы открыть"
    actions:
      - 'exylialib:cosmetics catalogue'
  players:
    group: cards
    material: PLAYER_HEAD
    name: "{letters}Косметика {letters_black}▸ <gradient:{primary}:{secondary_light}>Игроки</gradient>"
    lore:
      - "{letters_black}Раздел настройки"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Ключи, открытия и что надето"
      - " {letters}на каждом игроке {highlight}онлайн{letters}."
      - "%admin_players_status%"
      - "%admin_players_status%{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:eye} {letters}Сейчас носят{letters_black}: {info}%admin_wearing% {letters}из {info}%admin_online%"
      - "  {letters_black}· {info}{icon:spark} {letters}%admin_activity_label%{letters_black}: {info}%admin_activity%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы открыть"
    actions:
      - 'exylialib:cosmetics players'
  showcases:
    group: cards
    condition: '%admin_has_showcases% == true'
    material: ARMOR_STAND
    name: "{letters}Косметика {letters_black}▸ <gradient:{primary}:{secondary_light}>Витрины</gradient>"
    lore:
      - "{letters_black}Раздел настройки"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Места, где косметика крутится"
      - " {letters}по {highlight}кругу {letters}для всех рядом."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:iron} {letters}Установлено{letters_black}: {info}%admin_showcases%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы управлять"
    actions:
      - 'exylialib:cosmetics showcases'
  blocks:
    group: cards
    material: ENDER_CHEST
    name: "{letters}Косметика {letters_black}▸ <gradient:{primary}:{secondary_light}>Блоки ящика</gradient>"
    lore:
      - "{letters_black}Раздел настройки"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Блоки, которые открывают ящик,"
      - " {letters}когда игрок по ним {highlight}кликает{letters}."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:iron} {letters}Привязано{letters_black}: {info}%admin_blocks%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы управлять"
    actions:
      - 'exylialib:cosmetics blocks'
  settings:
    slot: 18
    material: COMPARATOR
    name: "{letters}Плагин {letters_black}▸ <gradient:{primary}:{secondary_light}>Настройки</gradient>"
    lore:
      - "{letters_black}Конфигурация"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Меняй настройки плагина,"
      - " {letters}не открывая его {highlight}файлы{letters}."
      - ""
      - "{primary}{icon:click} Нажми {letters_black}· {letters}Открыть настройки"
    actions:
      - 'exylialib:cosmetics settings'
