title: '{primary}&lИГРОК {letters_black}» {highlight}%player_name%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: "<gradient:{primary}:{secondary_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Игрок"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Ключи, открытое и то,"
      - " {letters}что сейчас {highlight}надето{letters}."
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: "{letters}Игрок {letters_black}▸ <gradient:{primary}:{secondary_light}>Ключи от ящика</gradient> &8[{info}%player_keys%&8]"
    lore:
      - "{letters_black}Настройка игрока"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Ключи на аккаунте: открывают"
      - " {letters}ящик и никогда не {highlight}теряются{letters}."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:key} {letters}Ключи{letters_black}: {info}%player_keys%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}+1 ключ"
      - "{primary}{icon:click} ПКМ {letters_black}· {letters}-1 ключ"
      - "{primary}{icon:click} Shift-клик {letters_black}· {letters}ввести число"
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: "{letters}Игрок {letters_black}▸ <gradient:{primary}:{secondary_light}>Открытия</gradient>"
    lore:
      - "{letters_black}Раздел настройки"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Выдай или забери косметику,"
      - " {letters}навсегда, как выигрыш из {highlight}ящика{letters}."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {success}{icon:star} {letters}Есть{letters_black}: {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы управлять"
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: "{letters}Игрок {letters_black}▸ <gradient:{primary}:{secondary_light}>Надето</gradient>"
    lore:
      - "{letters_black}Настройка игрока"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что сейчас надето на игроке."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:eye} {letters}Надето{letters_black}: %player_equipped%"
      - ""
      - "{error}{icon:click} Нажми, чтобы снять"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 18
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: "{letters}Игрок {letters_black}▸ <gradient:{error}:{error_light}>Очистить избранное</gradient>"
    lore:
      - "{letters_black}Опасная зона"
      - ""
      - "{error}✎ Информация"
      - " {letters}Очищает избранное игрока."
      - ""
      - "{error}{icon:click} Нажми, чтобы очистить"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Игроки</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 26
    material: BARRIER
    name: "{letters}Игрок {letters_black}▸ <gradient:{error}:{error_light}>Сбросить открытия</gradient>"
    lore:
      - "{letters_black}Опасная зона"
      - ""
      - "{error}✎ Информация"
      - " {letters}Забирает {highlight}всё{letters}, что игрок"
      - " {letters}выиграл или получил."
      - ""
      - "{error}{icon:click} Нажми, чтобы очистить"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - 'exylialib:cosmetics clear_unlocks'
