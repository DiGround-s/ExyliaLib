title: '{primary}&lИГРОК {letters_black}» {highlight}%player_name%'
size: 45
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  cards:
    slots: '19-25'
items:
  header:
    slot: 4
    material: 'playerhead-%player_name%'
    name: '{primary}&l%player_name%'
    lore:
      - ''
      - '{secondary}Состояние:'
      - ' {letters_black}▎ {letters}Ключи от ящика {letters_black}» {info}%player_keys%'
      - ' {letters_black}▎ {letters}Есть {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ' {letters_black}▎ {letters}Надето {letters_black}» %player_equipped%'
      - ''
  keys:
    group: cards
    material: TRIPWIRE_HOOK
    name: '{primary}&lКЛЮЧИ ОТ ЯЩИКА &8[{info}%player_keys%&8]'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Ключи на аккаунте: открывают'
      - ' {letters_black}▎ {letters}ящик и никогда не {highlight}теряются{letters}.'
      - ''
      - '{secondary}Состояние:'
      - ' {letters_black}▎ {letters}Ключи {letters_black}» {info}%player_keys%'
      - ''
      - '{warning}➥ ЛКМ {letters_black}» {letters}+1 ключ'
      - '{warning}➥ ПКМ {letters_black}» {letters}-1 ключ'
      - '{warning}➥ Shift-клик {letters_black}» {letters}ввести число'
      - ''
    actions:
      - 'left: exylialib:cosmetics keys 1'
      - 'right: exylialib:cosmetics keys -1'
      - 'shift_left,shift_right: exylialib:cosmetics keys ask'
  unlocks:
    group: cards
    material: CHEST
    name: '{primary}&lОТКРЫТИЯ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Выдай или забери косметику,'
      - ' {letters_black}▎ {letters}навсегда, как выигрыш из {highlight}ящика{letters}.'
      - ''
      - '{secondary}Состояние:'
      - ' {letters_black}▎ {letters}Есть {letters_black}» {success}%player_unlocked%{letters_black}/{info}%admin_catalogue%'
      - ''
      - '{warning}➥ Нажми, чтобы управлять'
      - ''
    actions:
      - 'exylialib:cosmetics unlocks'
  equipped:
    group: cards
    condition: '%admin_has_equipped% == true'
    material: ARMOR_STAND
    name: '{primary}&lНАДЕТО'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Что сейчас надето на игроке.'
      - ''
      - '{secondary}Состояние:'
      - ' {letters_black}▎ {letters}Надето {letters_black}» %player_equipped%'
      - ''
      - '{error}➥ Нажми, чтобы снять'
      - ' {letters_black}Потребуется подтверждение.'
      - ''
    actions:
      - 'exylialib:cosmetics unequip'
  favourites:
    slot: 36
    condition: '%admin_has_favourites% == true'
    material: BLAZE_POWDER
    name: '{error}&lОЧИСТИТЬ ИЗБРАННОЕ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Очищает избранное игрока.'
      - ''
      - '{error}➥ Нажми, чтобы очистить'
      - ' {letters_black}Потребуется подтверждение.'
      - ''
    actions:
      - 'exylialib:cosmetics favourites'
  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lНАЗАД'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Возврат к игрокам.'
      - ''
      - '{warning}➥ Нажми, чтобы вернуться'
      - ''
    actions:
      - 'exylialib:cosmetics players'
  clear:
    slot: 44
    material: BARRIER
    name: '{error}&lСБРОСИТЬ ОТКРЫТИЯ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Забирает {highlight}всё{letters}, что игрок'
      - ' {letters_black}▎ {letters}выиграл или получил.'
      - ''
      - '{error}➥ Нажми, чтобы очистить'
      - ' {letters_black}Потребуется подтверждение.'
      - ''
    actions:
      - 'exylialib:cosmetics clear_unlocks'
