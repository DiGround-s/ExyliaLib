title: '{primary}&lКОСМЕТИКА {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: '10-16'
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: '%reward_name%'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ %reward_description%'
      - ''
      - '{secondary}Состояние:'
      - ' {letters_black}▎ {letters}ID {letters_black}» {info}%reward_id%'
      - ' {letters_black}▎ {letters}Редкость {letters_black}» %reward_tier%'
      - ''
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: '{primary}&lВЫДАТЬ ПРЕДМЕТ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Предмет, который применяет'
      - ' {letters_black}▎ {letters}эту косметику, в {highlight}твой {letters}инвентарь.'
      - ''
      - '{warning}➥ Нажми, чтобы получить'
      - ''
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: '{primary}&lВЫДАТЬ КЛЮЧИ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Ключи-предметы, открывающие ящик:'
      - ' {letters_black}▎ {letters}можно хранить, обменять, выбросить.'
      - ''
      - '{warning}➥ ЛКМ {letters_black}» {letters}один ключ'
      - '{warning}➥ ПКМ {letters_black}» {letters}ввести число'
      - ''
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: '{primary}&lПРЕВЬЮ'
    lore:
      - ''
      - '{secondary}Информация:'
      - ' {letters_black}▎ {letters}Показывает эту косметику {highlight}тебе'
      - ' {letters_black}▎ {letters}на сцене превью.'
      - ''
      - '{warning}➥ Нажми, чтобы посмотреть'
      - ''
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lНАЗАД'
    lore:
      - ''
      - ' {letters_black}▎ {letters}Возврат в каталог.'
      - ''
      - '{warning}➥ Нажми, чтобы вернуться'
      - ''
    actions:
      - 'exylialib:cosmetics catalogue'
