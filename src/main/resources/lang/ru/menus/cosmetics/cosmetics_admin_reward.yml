title: '{primary}&lКОСМЕТИКА {letters_black}» {highlight}%reward_id%'
size: 27
type: SIMPLE
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
groups:
  buttons:
    slots: "10-16"
    spacing: split
items:
  header:
    slot: 4
    material: '%reward_material%'
    hide-attributes: true
    name: "%reward_name%"
    lore:
      - "{letters_black}Косметика"
      - ""
      - "{accent}✎ Информация"
      - " %reward_description%"
      - ""
      - "{accent}✦ Состояние"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%reward_id%"
      - "  {letters_black}· {info}{icon:star} {letters}Редкость{letters_black}: %reward_tier%"
  item:
    group: buttons
    condition: '%admin_has_token% == true'
    material: CHEST
    name: "{letters}Косметика {letters_black}▸ <gradient:{success}:{success_light}>Выдать предмет</gradient>"
    lore:
      - "{letters_black}Действие косметики"
      - ""
      - "{success}✎ Информация"
      - " {letters}Предмет, который применяет эту"
      - " {letters}косметику, в {highlight}твой {letters}инвентарь."
      - ""
      - "{success}{icon:click} Нажми, чтобы получить"
    actions:
      - 'exylialib:cosmetics give_item'
  keys:
    group: buttons
    material: TRIPWIRE_HOOK
    name: "{letters}Косметика {letters_black}▸ <gradient:{success}:{success_light}>Выдать ключи</gradient>"
    lore:
      - "{letters_black}Действие косметики"
      - ""
      - "{success}✎ Информация"
      - " {letters}Ключи-предметы, открывающие"
      - " {letters}ящик: можно хранить,"
      - " {letters}обменять, выбросить."
      - ""
      - "{success}{icon:click} ЛКМ {letters_black}· {letters}один ключ"
      - "{success}{icon:click} ПКМ {letters_black}· {letters}ввести число"
    actions:
      - 'left,shift_left: exylialib:cosmetics give_keys 1'
      - 'right,shift_right: exylialib:cosmetics give_keys ask'
  preview:
    group: buttons
    condition: '%admin_has_preview% == true'
    material: ENDER_EYE
    name: "{letters}Косметика {letters_black}▸ <gradient:{info}:{info_light}>Превью</gradient>"
    lore:
      - "{letters_black}Действие косметики"
      - ""
      - "{info}✎ Информация"
      - " {letters}Показывает эту косметику"
      - " {highlight}тебе {letters}на сцене превью."
      - ""
      - "{info}{icon:click} Нажми, чтобы посмотреть"
    actions:
      - 'exylialib:cosmetics preview'
  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Каталог</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
    actions:
      - 'exylialib:cosmetics catalogue'
