title: '{primary}&lЗАПИСЬ {letters_black}» {highlight}%log_action% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:item.book.page_turn|1.0|1.2"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Первая страница"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Последняя страница →"

pagination:
  slots: '9-44'
  group_template:
    material: NAME_TAG
    name: "{letters}Группа {letters_black}▸ <gradient:{info}:{info_light}>%group_label%</gradient>"
    lore:
      - "{letters_black}Группа предметов"
      - ""
      - "{info}✦ Статус"
      - "  {letters_black}· {info}{icon:iron} {letters}Стаки{letters_black}: {info}%group_count%"
      - ""
      - "{info}{icon:click} Наведи на предметы рядом"
  nothing_template:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}В этой группе пусто'
    lore:
      - "{letters_black}С этой стороны предметы не двигались."
  empty_template:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Предметы не сохранены'
    lore:
      - "{letters_black}Всё, что записано, показано выше."
  spacer_template:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  navigation:
