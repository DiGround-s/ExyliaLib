# A hub of cards, centred and cut to size: a plugin's settings files, or the pages of one file.
# Values: %cfg_plugin% %cfg_title% %cfg_where% %cfg_back_to% %cfg_head_icon% %cfg_head_name% %cfg_head_lore%
# Per card: %cfg_card% %cfg_card_icon% %cfg_card_name% %cfg_card_about% %cfg_card_status%
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
title: '{primary}&l%cfg_title% {letters_black}» {highlight}%cfg_where% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION
open_sounds:
  - "minecraft:block.ender_chest.open|0.6|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|0.7|1.0"
close_sounds:
  - "minecraft:block.barrel.close|0.6|0.7"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
pagination:
  slots: '19-25'
  item_template:
    material: '%cfg_card_icon%'
    name: "{letters}Настройки {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_card_name%</gradient>"
    lore:
      - "{letters_black}Страница настроек"
      - "%cfg_card_about%"
      - ""
      - "{primary}✦ Статус"
      - "%cfg_card_status%"
      - ""
      - "{primary}» Нажми, чтобы открыть"
    actions:
      - 'exylialib:config_page %cfg_card%'
  file_template:
    material: '%cfg_card_icon%'
    name: "{letters}Файл {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_card_name%</gradient>"
    lore:
      - "{letters_black}Файл настроек"
      - "%cfg_card_about%"
      - ""
      - "{primary}✦ Статус"
      - "%cfg_card_status%"
      - ""
      - "{primary}» Нажми, чтобы открыть"
    actions:
      - 'exylialib:config_file %cfg_card%'
  content_template:
    material: '%cfg_card_icon%'
    name: "{letters}Файл {letters_black}▸ <gradient:{primary}:{secondary_light}>%cfg_card_name%</gradient>"
    lore:
      - "{letters_black}Файл контента"
      - "%cfg_card_about%"
      - ""
      - "{primary}✦ Статус"
      - "%cfg_card_status%"
      - ""
      - "{primary}» Нажми, чтобы открыть"
    actions:
      - 'exylialib:config_yaml %cfg_card%'
  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
items:
  header:
    slot: 4
    material: '%cfg_head_icon%'
    name: "<gradient:{primary}:{secondary_light}>%cfg_head_name%</gradient>"
    lore:
      - "{letters_black}Настройки плагина"
      - "%cfg_head_lore%"
  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>%cfg_back_to%</gradient>"
    lore:
      - "{error}» Нажми, чтобы вернуться"
    actions:
      - 'exylialib:config_back'
