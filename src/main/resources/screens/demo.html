<!-- The /exylialib screentest markup demo: tabs, chips, a paged grid of cards, a toggle and a pager. -->
<screen>
  <panel id="panel" class="demo">
    <row class="bar">
      <h1>Practice</h1>
      <box class="spacer"/>
      <tabs state="tab" default="play">
        <tab value="play">Play</tab>
        <tab value="settings">Settings</tab>
      </tabs>
    </row>
    <column if="tab == 'play'" class="body">
      <chips state="category" default="all">
        <chip value="all">All</chip>
        <chip value="sword">Sword</chip>
        <chip value="pot">Potions</chip>
      </chips>
      <grid source="kits" columns="4" rows="2">
        <card action="pick %kit_id%" selected="%kit_picked%">
          <item material="%kit_icon%"/>
          <b>%kit_name%</b>
          <small>%kit_playing% playing</small>
        </card>
        <empty>No kits in this category</empty>
      </grid>
      <pager for="kits"/>
    </column>
    <column if="tab == 'settings'" class="body">
      <row class="setting"><text>Sounds</text><box class="spacer"/><toggle state="sounds"/></row>
      <row class="setting"><text>Cursor speed</text><box class="spacer"/>
        <button action="speed -0.1">-</button><text>%speed%</text><button action="speed 0.1">+</button>
      </row>
      <row class="setting"><text>Season</text><box class="spacer"/><progress value="70" max="100" class="season"/></row>
      <row><button action="set confirm yes" class="danger">Reset stats</button><button action="close">Close</button></row>
    </column>
  </panel>
  <small>Shift closes</small>
  <modal if="confirm">
    <h1>Reset your stats?</h1>
    <small>This cannot be undone.</small>
    <row class="actions">
      <button action="clear confirm">Cancel</button>
      <button action="clear confirm; toast {success}Stats reset" class="danger">Reset</button>
    </row>
  </modal>
</screen>
