<!--
  ExyliaLib's component library: templates every screen knows. A plugin's own template of the same name wins.
  docs/screens.md, "Component library", shows each one.
-->
<template name="page-head" props="title subtitle=">
  <column class="lib-page-head"><h1>${title}</h1><small if="'${subtitle}' != ''">${subtitle}</small></column>
</template>

<template name="stat" props="label value tone=info">
  <row class="lib-stat"><small>${label}<slot/></small><box class="spacer"/><b>{${tone}}${value}</b></row>
</template>

<template name="badge" props="tone=primary">
  <box class="lib-badge lib-badge-${tone}"><small><slot/></small></box>
</template>

<template name="key-hint" props="key">
  <row class="lib-key-hint"><box class="lib-key"><small>${key}</small></box><small><slot/></small></row>
</template>

<template name="empty-state" props="title hint=">
  <empty><text>${title}</text><small if="'${hint}' != ''">${hint}</small><slot/></empty>
</template>

<template name="dialog" props="title when dismiss">
  <modal if="${when}" dismiss="${dismiss}"><h1>${title}</h1><slot/></modal>
</template>

<!--
  The game frame (docs/screens.md, "Giving a game its screen form"): one 400 by 225 frame for every game. Java binds it
  with net.exylia.lib.screen.GameFrame. Every word is the library's, translated, unless the screen's own words say
  otherwise (frame.play, frame.how, frame.payouts, frame.again, frame.change, frame.auto, frame.leave).
-->
<template name="game-frame" props="title">
  <column id="game-frame" class="game-frame" assist="false">
    <row class="game-head">
      <h2 class="game-title">${title}</h2>
      <box class="spacer"/>
      <small if="game_idle" id="game-idle" class="game-idle">%game_idle%</small>
      <tabs class="game-tabs" state="game_tab" default="play">
        <tab value="play" t="frame.play">${tr('Play')}</tab>
        <tab value="how" t="frame.how">${tr('How to play')}</tab>
        <tab value="payouts" t="frame.payouts">${tr('Payouts')}</tab>
      </tabs>
    </row>
    <slot/>
  </column>
</template>

<template name="game-play">
  <row if="game_tab == 'play'" id="game-page-play" class="game-play"><slot/></row>
</template>

<template name="game-board">
  <box class="game-board"><slot/></box>
</template>

<template name="game-side">
  <column class="game-side"><slot/></column>
</template>

<template name="game-figure" props="value tone=letters">
  <row class="game-figure"><slot/><box class="spacer"/><b>{${tone}}${value}</b></row>
</template>

<template name="game-action" props="action disabled=false">
  <button class="game-action" action="${action}" disabled="${disabled}"><slot/></button>
</template>

<template name="game-result">
  <column if="game_result" id="game-result" class="game-result game-result-${game_tone}">
    <b class="game-result-title">%game_result%</b>
    <text if="game_detail" class="game-result-detail">%game_detail%</text>
    <column if="game_offer" id="game-offer" class="game-offer">
      <button class="game-again" action="game_again" disabled="${game_refused != ''}">%game_again%</button>
      <small if="game_refused" class="game-refused">%game_refused%</small>
      <row class="game-choices">
        <button if="game_can_change" class="game-choice" action="game_change" t="frame.change">${tr('Change stake')}</button>
        <button if="game_can_auto" class="game-choice" action="game_auto" t="frame.auto">${tr('Auto')}</button>
        <button class="game-choice" action="game_leave" t="frame.leave">${tr('Leave')}</button>
      </row>
    </column>
  </column>
</template>

<template name="game-page" props="tab">
  <column if="game_tab == '${tab}'" id="game-page-${tab}" class="game-page"><slot/></column>
</template>

<!--
  The table kit (1.598.0, docs/screens.md, "A game table on one screen"): one screen for a shared table game, every
  part on show at once. table-head is the title row with a RULES button that opens table-rules; table-panel is a framed
  block; kicker is a small dark label over a big value; results-strip shows a source's last results as tiles;
  chip-rack the chips to bet with, the picked one ringed; table-action the big footer button.
  Rows: results-strip reads result_label and result_tone (red, black, green); chip-rack reads chip_id, chip_colour
  (a palette colour) and chip_label, and sets the state named by `state` to the chip_id clicked. With `custom` (an
  action, 1.601.0) a CUSTOM chip ends the rack: its click runs that action, which asks for an amount and sets the state
  to `custom`; `custom_label` is what it reads once one is typed (Custom before).
-->
<template name="table-head" props="title subtitle= rules=table_rules">
  <column class="lib-table-head">
    <row class="lib-table-top">
      <box class="lib-table-side"/>
      <column class="lib-table-heading"><h1 class="lib-table-title">${title}</h1><small if="'${subtitle}' != ''">${subtitle}</small></column>
      <row class="lib-table-side lib-table-end"><button class="lib-table-rules" action="toggle ${rules}" t="table.rules">${tr('Rules')}</button></row>
    </row>
    <box class="lib-table-divider"/>
  </column>
</template>

<template name="table-rules" props="title rules=table_rules">
  <modal if="${rules}" dismiss="clear ${rules}"><column class="lib-table-modal"><h1>${title}</h1><slot/></column></modal>
</template>

<template name="table-panel" props="title=">
  <column class="lib-table-panel"><small if="'${title}' != ''" class="lib-table-label">${title}</small><slot/></column>
</template>

<template name="kicker" props="label tone=letters_black">
  <column class="lib-kicker"><small class="lib-table-label">{${tone}}${label}</small><slot/></column>
</template>

<template name="results-strip" props="source empty=">
  <row class="lib-results"><list source="${source}" class="lib-results-list"><box class="lib-result lib-result-%result_tone%"><b>%result_label%</b></box><empty><small>${empty}</small></empty></list></row>
</template>

<template name="chip-rack" props="source state=chip custom= custom_label= custom_colour={secondary_light}">
  <row class="lib-chip-rack"><list source="${source}" class="lib-chip-list">
    <column class="lib-chip ${${state} == chip_id ? 'lib-chip-on' : ''}" action="set ${state} %chip_id%">
      <img chip="%chip_colour%" size="18" ring="${${state} == chip_id ? '{highlight}' : ''}"/>
      <small class="lib-chip-value">%chip_label%</small>
    </column>
  </list>
    <column if="'${custom}' != ''" class="lib-chip lib-chip-custom ${${state} == 'custom' ? 'lib-chip-on' : ''}" action="${custom}">
      <img chip="${custom_colour}" size="18" ring="${${state} == 'custom' ? '{highlight}' : ''}"/>
      <small if="'${custom_label}' == ''" class="lib-chip-value">${tr('Custom')}</small>
      <small if="'${custom_label}' != ''" class="lib-chip-value">${custom_label}</small>
    </column>
  </row>
</template>

<template name="table-action" props="action tone=error">
  <button class="lib-table-action lib-table-action-${tone}" action="${action}"><slot/></button>
</template>
