title: "{primary}&lSELECT KITS {muted}— {info}%category_filter_name%"
size: 54
type: MULTI_PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to arena setup"
    actions:
      - "practice:open_arena_setup"

  add_all:
    slot: 40
    material: NETHER_STAR
    name: "{success}&lAdd All — {warning}%category_filter_name%"
    lore:
      - ""
      - " {muted}❙ Adds ALL kits from the selected category"
      - " {muted}❙ to this arena at once."
      - ""
      - "{success}» Click to add all"
    actions:
      - "practice:arena_kit_add_category %category_filter_id%"

sections:
  categories:
    slots: "1-7"
    filler:
      material: AIR
      hide_tooltip: true
    inactive_template:
      material: "%cat_icon%"
      name: "{warning}&l%cat_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%cat_id%"
        - ""
        - "{accent}» Click to filter by this category"
    active_template:
      material: "%cat_icon%"
      name: "{success}&l%cat_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%cat_id%"
        - ""
        - "{success}✔ Currently filtering"
        - "{accent}» Click again to show all kits"
      glowing: true
    navigation:
      previous:
        slot: 0
        material: ARROW
        name: "{letters}&l← Previous"
        hide_tooltip: false
      next:
        slot: 8
        material: ARROW
        name: "{letters}&lNext →"
        hide_tooltip: false

  kits:
    slots: "10-16,19-25,28-34"
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "{muted}No kits available"
      lore:
        - ""
        - "{muted}No kits match this filter."
      hide_tooltip: false
    not_in_arena_template:
      material: "%kit_icon%"
      name: "{error}✗ {warning}&l%kit_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%kit_id%"
        - ""
        - " {muted}❙ {muted}Not in arena — Click to add"
    in_arena_template:
      material: "%kit_icon%"
      name: "{success}✔ {warning}&l%kit_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%kit_id%"
        - ""
        - " {muted}❙ {success}In arena — Click to remove"
      glowing: true
    navigation:
      previous:
        slot: 45
        material: ARROW
        name: "{error}&l← PREVIOUS"
        lore:
          - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: false
      next:
        slot: 53
        material: ARROW
        name: "{success}&lNEXT →"
        lore:
          - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: false
