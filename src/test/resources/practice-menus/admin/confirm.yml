title: "{error}&lCONFIRM"
size: 27
type: SIMPLE

open_sounds:
  - "ENTITY_VILLAGER_NO|1.0|1.0"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  confirm:
    slot: 11
    material: LIME_WOOL
    name: "%confirm_title%"
    lore:
      - ""
      - " {muted}❙ {letters}%confirm_desc%"
      - ""
      - "{success}» Click to confirm"
    actions:
      - "%confirm_action%"

  cancel:
    slot: 15
    material: RED_WOOL
    name: "{success}&lCANCEL"
    lore:
      - ""
      - " {muted}❙ {letters}No changes will be made"
      - ""
      - "{error}» Click to cancel"
    actions:
      - "%cancel_action%"
