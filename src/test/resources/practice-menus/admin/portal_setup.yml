title: "{primary}&lPORTAL: %portal_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:portal_edit_name"

  region:
    slot: 4
    material: "%region_material%"
    name: "{highlight}&lPORTAL REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Area that triggers this portal"
      - ""
      - "{info}» Click to select"
    actions:
      - "practice:portal_set_region"

  command:
    slot: 6
    material: PAPER
    name: "{highlight}&lCOMMAND"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%command%"
      - ""
      - " {muted}❙ {letters}Command run on entry (without /)"
      - ""
      - "{info}» Click to set"
    actions:
      - "practice:portal_set_command"

  teleport:
    slot: 13
    material: "%teleport_material%"
    name: "{highlight}&lTELEPORT"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %teleport_status%"
      - ""
      - " {muted}❙ {letters}Teleport destination after trigger"
      - ""
      - " {muted}❙ {success}Left-Click to set current location"
      - " {muted}❙ {error}Right-Click to clear"
    actions:
      - "left: practice:portal_set_teleport"
      - "right: practice:portal_clear_teleport"

  delete:
    slot: 49
    material: BARRIER
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this portal"
      - ""
      - "{error}» Click to delete"
    actions:
      - "practice:portal_confirm_delete %portal_id%"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to portal list"
    actions:
      - "practice:portal_open_list"
