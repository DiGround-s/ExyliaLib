title: "{primary}&lARENА: %arena_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:edit_arena_name"

  icon:
    slot: 4
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{info}» Click to change"
    actions:
      - "practice:set_arena_icon"

  enabled:
    slot: 6
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %enabled_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:toggle_arena_enabled"

  spawn1:
    slot: 19
    material: "%spawn1_material%"
    name: "{warning}&lSPAWN 1"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %spawn1_status%"
      - ""
      - " {muted}❙ {success}Left-Click to set"
      - " {muted}❙ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spawn1"
      - "right: practice:tp_spawn spawn1"

  spawn2:
    slot: 20
    material: "%spawn2_material%"
    name: "{warning}&lSPAWN 2"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %spawn2_status%"
      - ""
      - " {muted}❙ {success}Left-Click to set"
      - " {muted}❙ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spawn2"
      - "right: practice:tp_spawn spawn2"

  spectator-spawn:
    slot: 21
    material: "%spectator_material%"
    name: "{warning}&lSPECTATOR SPAWN"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %spectator_status%"
      - ""
      - " {muted}❙ {success}Left-Click to set"
      - " {muted}❙ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spectator_spawn"
      - "right: practice:tp_spawn spectator"

  partyffa-spawn:
    slot: 22
    material: "%partyffa_material%"
    name: "{warning}&lPARTY FFA SPAWN"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %partyffa_status%"
      - ""
      - " {muted}❙ {success}Left-Click to set"
      - " {muted}❙ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_partyffa_spawn"
      - "right: practice:tp_spawn partyffa"

  playable-region:
    slot: 28
    material: "%playable_material%"
    name: "{info}&lPLAYABLE REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %playable_status%"
      - ""
      - " {muted}❙ {letters}Area where matches happen"
      - ""
      - "{info}» Click to select"
    actions:
      - "practice:set_playable_region"

  copy-region:
    slot: 29
    material: "%copy_material%"
    name: "{info}&lCOPY REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %copy_status%"
      - ""
      - " {muted}❙ {letters}Template area for cloning"
      - ""
      - "{info}» Click to select"
    actions:
      - "practice:set_copy_region"

  schematic:
    slot: 30
    material: "%schematic_material%"
    name: "{info}&lSCHEMATIC"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %schematic_status%"
      - ""
      - " {muted}❙ {letters}Save from copy region"
      - " {muted}❙ {letters}Used for regen & clones"
      - ""
      - " {muted}❙ {success}Left-Click to save"
      - " {muted}❙ {warning}Right-Click to restore"
    actions:
      - "left: practice:save_schematic"
      - "right: practice:regen_schematic"

  extra-regions:
    slot: 32
    material: END_PORTAL_FRAME
    name: "{info}&lEXTRA REGIONS"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%extra_regions_count%"
