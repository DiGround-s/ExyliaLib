      - " {muted}❙ {letters}Select which kits can use this arena"
      - ""
      - " {muted}❙ {info}Click to manage"
    actions:
      - "practice:open_arena_kit_select"

  protection-radius:
    slot: 37
    material: SHIELD
    name: "{info}&lSPAWN PROTECTION"
    lore:
      - ""
      - " {muted}❙ {letters}Radius: {highlight}%protection_radius% {letters}blocks"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click +5"
      - " {muted}❙ {error}Shift-Right -5"
    actions:
      - "left: practice:adjust_protection_radius 1"
      - "right: practice:adjust_protection_radius -1"
      - "shift_left: practice:adjust_protection_radius 5"
      - "shift_right: practice:adjust_protection_radius -5"

  extra-region-protection-radius:
    slot: 39
    material: END_PORTAL_FRAME
    name: "{info}&lEXTRA REGION PROTECTION"
    lore:
      - ""
      - " {muted}❙ {letters}Radius: {highlight}%extra_region_protection_radius% {letters}blocks"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click +5"
      - " {muted}❙ {error}Shift-Right -5"
    actions:
      - "left: practice:adjust_extra_region_protection_radius 1"
      - "right: practice:adjust_extra_region_protection_radius -1"
      - "shift_left: practice:adjust_extra_region_protection_radius 5"
      - "shift_right: practice:adjust_extra_region_protection_radius -5"

  priority:
    slot: 38
    material: HOPPER
    name: "{info}&lPRIORITY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%priority%"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click +10"
      - " {muted}❙ {error}Shift-Right -10"
    actions:
      - "left: practice:adjust_priority 1"
      - "right: practice:adjust_priority -1"
      - "shift_left: practice:adjust_priority 10"
      - "shift_right: practice:adjust_priority -10"

  view-clones:
    slot: 52
    material: ENDER_EYE
    name: "{info}&lVIEW CLONES"
    lore:
      - ""
      - " {muted}❙ {letters}Active clones: {highlight}%clone_count%"
      - ""
      - "{info}» Click to view"
    actions:
      - "practice:open_clone_list"

  force-load-clones:
    slot: 53
    material: SPAWNER
    name: "{warning}&lFORCE LOAD CLONES"
    lore:
      - ""
      - " {muted}❙ {letters}Active clones: {highlight}%clone_count%"
      - ""
      - " {muted}❙ {letters}Force-create N clones for testing"
      - ""
