      - "any: player: practice:open_extra_regions_list"

  kits:
    slot: 34
    material: BOOK
    name: "{info}&lKITS"
    lore:
      - ""
      - " {muted}❙ {letters}Compatible: {highlight}%kit_count% kit(s)"
