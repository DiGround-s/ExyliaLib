title: "{primary}&lSPECIAL CONDITIONS&r {muted}— %kit_id%"
size: 54
type: PAGINATION
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%trigger_icon%"
    name: "{highlight}&l%trigger_display%"
    lore:
      - ""
      - " {muted}❙ {success}Add Point: %add_point_status%"
      - " {muted}❙ {error}Loss Point: %loss_point_status%"
      - " {muted}❙ {muted}Death: %death_status%"
      - ""
      - " {muted}❙ {success}Left: {letters}Toggle Add Point"
      - " {muted}❙ {error}Right: {letters}Toggle Loss Point"
      - " {muted}❙ {warning}Shift-Left: {letters}Toggle Death"
    actions:
      - "left: practice:toggle_special_condition %trigger_name% ADD_POINT"
      - "right: practice:toggle_special_condition %trigger_name% LOSS_POINT"
      - "shift_left: practice:toggle_special_condition %trigger_name% DEATH"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Back to kit rules"
    actions:
      - "practice:open_kit_rules"
