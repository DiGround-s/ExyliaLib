title: "{primary}&lPLAYABILITY&r {muted}— %kit_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  party-ffa:
    slot: 20
    material: "%party_ffa_material%"
    name: "{highlight}&lPARTY FFA"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %party_ffa_status%"
      - ""
      - " {muted}❙ {letters}When disabled, this kit won't"
      - " {muted}❙ {letters}appear in Party FFA game selection"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:toggle_kit_party_ffa"

  party-split:
