title: "{primary}&lEXTRA REGIONS&r {muted}— %arena_id%"
size: 54
type: PAGINATION
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No extra regions configured"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: END_PORTAL_FRAME
    name: "{highlight}&lEXTRA REGION"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%region_id%"
      - ""
      - "{error}» Right-Click to delete"
    actions:
      - "right: practice:remove_extra_region %region_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  add:
    slot: 46
    material: LIME_CONCRETE
    name: "{success}&lADD EXTRA REGION"
    lore:
      - ""
      - "{muted}Select a new region"
    actions:
      - "practice:add_extra_region"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Back to arena setup"
    actions:
      - "practice:open_arena_setup"
