title: "{primary}&lPVP REGIONS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No PvP regions"
    lore:
      - ""
      - "{muted}Create your first PvP region!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: IRON_SWORD
    name: "{warning}&l%pvp_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%pvp_id%"
      - " {muted}❙ {letters}Region: %pvp_region_status%"
      - " {muted}❙ {letters}Kit: {highlight}%pvp_kit%"
      - " {muted}❙ {letters}Combat tag: {highlight}%pvp_combat_tag%s"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: practice:pvp_edit %pvp_id%"
      - "right: practice:pvp_confirm_delete %pvp_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE PVP REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new PvP zone"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:pvp_create"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to admin panel"
    actions:
      - "practice:open_admin"
