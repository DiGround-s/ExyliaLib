title: "{primary}&lEVENTS"
size: 27
type: SIMPLE
refresh:
  mode: SMART
  interval: 20
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  start-event:
    slot: 11
    material: GOLDEN_AXE
    name: "{secondary}&lSTART EVENT"
    lore:
      - ""
      - " {muted}❙ {letters}Start a new event"
      - " {muted}❙ {letters}and announce it to players."
      - ""
      - "{info}» Click to open"
    actions:
      - "events:open_start_event"

  active:
    slot: 13
    material: COMPASS
    name: "{warning}&lACTIVE EVENTS"
    amount: "%total_players%"
    lore:
      - ""
      - " {muted}❙ {letters}Browse active events"
      - " {muted}❙ {letters}Play or spectate."
      - ""
      - " {muted}❙ {letters}Active: {highlight}%active_events%"
      - " {muted}❙ {letters}Waiting: {success}%joinable_events%"
      - " {muted}❙ {letters}In progress: {info}%playing_events%"
      - " {muted}❙ {letters}Total players: {highlight}%total_players%"
      - ""
      - "{info}» Click to open"
    actions:
      - "events:open_active_events"

  stats:
    slot: 15
    material: BOOK
    name: "{info}&lSTATISTICS"
    lore:
      - ""
      - " {muted}❙ {letters}Your event statistics."
      - ""
      - " {muted}❙ {letters}Wins: {success}%player_wins%"
      - " {muted}❙ {letters}Played: {highlight}%player_games%"
      - ""
      - "{info}» Click to open"
    actions:
      - "events:open_stats"
