title: "{primary}&lBOUNTIES ADMIN {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No active bounties"
    lore:
      - ""
      - " {muted}No bounties have been placed."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "playerhead:%bounty_target%"
    name: "{warning}&l%bounty_target%"
    lore:
      - ""
      - " {muted}❙ {letters}Placed by: {highlight}%bounty_placer%"
      - " {muted}❙ {letters}Amount: {highlight}%bounty_amount%"
      - ""
      - " {error}● {info}Click to remove this bounty"
    actions:
      - "left: survivalcore:admin_bounty_remove %bounty_id%"
      - "right: survivalcore:admin_bounty_clear %bounty_target_uuid%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
