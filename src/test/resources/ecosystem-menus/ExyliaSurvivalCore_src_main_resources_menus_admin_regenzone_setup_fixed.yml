# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lREGEN ZONE: %zone_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 1
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%zone_name%"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:regenzone_edit_name"

  enabled:
    slot: 3
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - " {muted}❙ {letters}%regenerating_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:regenzone_toggle_enabled"

  region:
    slot: 5
    material: "%region_material%"
    name: "{highlight}&lZONE REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}The cuboid that gets snapshotted"
      - " {muted}❙ {letters}and pasted back on regen"
      - ""
      - "{info}» Click to select with wand"
    actions:
      - "survivalcore:regenzone_set_region"

  mode:
    slot: 7
    material: "%mode_material%"
    name: "{highlight}&lREGEN MODE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%mode_value%"
      - ""
      - " {muted}❙ {letters}FIXED {muted}» regenerates on a timer"
      - " {muted}❙ {letters}IDLE {muted}» regenerates X seconds after"
      - " {muted}❙ {letters}the last detected block change"
      - ""
      - "{info}» Click to switch mode"
    actions:
      - "survivalcore:regenzone_toggle_mode"

  schematic:
    slot: 19
    material: "%schematic_material%"
    name: "{highlight}&lSCHEMATIC"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %schematic_status%"
      - ""
      - " {muted}❙ {letters}Snapshot of the current block state."
      - " {muted}❙ {letters}Re-save any time to update what the"
      - " {muted}❙ {letters}zone regenerates back to"
      - ""
      - "{info}» Click to save from current blocks"
    actions:
      - "survivalcore:regenzone_save_schematic"

  interval:
    slot: 21
    material: CLOCK
    name: "{highlight}&lREGEN INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%interval_value%s {muted}(%interval_formatted%)"
      - ""
      - " {success}● {info}Left-click {muted}+10s"
      - " {error}● {info}Right-click {muted}-10s"
      - " {success}● {info}Shift + Left {muted}+60s"
      - " {error}● {info}Shift + Right {muted}-60s"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:regenzone_adjust_interval 10"
      - "right: survivalcore:regenzone_adjust_interval -10"
      - "shift_left: survivalcore:regenzone_adjust_interval 60"
      - "shift_right: survivalcore:regenzone_adjust_interval -60"
      - "middle: survivalcore:regenzone_set_interval"

  warning:
    slot: 23
    material: BELL
    name: "{highlight}&lREGEN WARNING"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%warning_value%s"
      - ""
      - " {muted}❙ {letters}Seconds before regen players inside"
      - " {muted}❙ {letters}are warned. {highlight}0 {letters}= disabled"
      - ""
      - " {success}● {info}Left-click {muted}+1s"
      - " {error}● {info}Right-click {muted}-1s"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:regenzone_adjust_warning 1"
      - "right: survivalcore:regenzone_adjust_warning -1"
      - "middle: survivalcore:regenzone_set_warning"

  teleport:
    slot: 25
    material: "%teleport_material%"
    name: "{highlight}&lTELEPORT TO SAFE AIR"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %teleport_status%"
      - ""
      - " {muted}❙ {letters}Moves players who would suffocate"
      - " {muted}❙ {letters}inside the pasted schematic to"
      - " {muted}❙ {letters}the nearest safe air pocket"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:regenzone_toggle_teleport"

  clean-entities:
    slot: 29
    material: "%clean_entities_material%"
    name: "{highlight}&lCLEAN ENTITIES ON REGEN"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %clean_entities_status%"
      - ""
      - " {muted}❙ {letters}Removes dropped items, arrows and"
      - " {muted}❙ {letters}similar entities inside the zone"
      - " {muted}❙ {letters}right before it regenerates"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:regenzone_toggle_clean_entities"

  flags:
    slot: 31
    material: SHIELD
    name: "{highlight}&lREGION FLAGS"
    lore:
      - ""
      - " {muted}❙ {letters}PvP, build, break, item drop,"
      - " {muted}❙ {letters}entry/exit, temporary blocks..."
      - ""
      - " {muted}❙ {letters}Use this zone as a full protected"
      - " {muted}❙ {letters}region on top of the auto-regen"
      - ""
      - "%flags_action%"
    actions:
      - "survivalcore:regenzone_open_flags"

  force-regen:
    slot: 40
    material: TNT
    name: "{error}&lFORCE REGEN NOW"
    lore:
      - ""
      - " {muted}❙ {letters}Immediately pastes the saved"
      - " {muted}❙ {letters}schematic back over the zone"
      - ""
      - "{error}» Click to regen"
    actions:
      - "survivalcore:regenzone_force_regen"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to regen zone list"
    actions:
      - "survivalcore:regenzone_open_list"

  delete:
    slot: 47
    material: BARRIER
    name: "{error}&lDELETE ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this regen zone"
      - ""
      - "{error}» Click to delete"
    actions:
      - "survivalcore:regenzone_delete %zone_id%"
