title: "{primary}&lCLAN LEVELS"
size: 54
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%level_material%"
    name: "%level_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Required EXP: {highlight}%level_required_exp%"
      - ""
      - " {muted}❙ {letters}Bonus members: {highlight}+%level_members_bonus%"
      - " {muted}❙ {letters}Bonus alliances: {highlight}+%level_alliances_bonus%"
      - " {muted}❙ {letters}Bonus rivals: {highlight}+%level_rivals_bonus%"
      - "%level_progress_bar%"
      - "%level_status%"

  navigation:
