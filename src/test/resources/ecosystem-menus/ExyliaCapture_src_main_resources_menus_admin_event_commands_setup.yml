title: "{primary}&lCOMMANDS: %config_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  start-info:
    slot: 12
    material: LIME_DYE
    name: "{success}&lSTART COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when event starts"
      - " {letters_black}▎ {letters}Count: {highlight}%start_commands_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholders: {highlight}%event_name%"

  start-add:
    slot: 13
    material: LIME_CONCRETE
    name: "{success}&lADD START COMMAND"
    lore:
      - ""
      - "{warning}➥ Click to add"
    actions:
      - "capture:add_start_command"

  start-clear:
    slot: 14
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lCLEAR START COMMANDS"
    lore:
      - ""
      - "{error}➥ Click to clear all"
    actions:
      - "capture:clear_start_commands"

  end-info:
    slot: 21
    material: GOLD_INGOT
    name: "{warning}&lEND COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when event ends"
      - " {letters_black}▎ {letters}Runs for the winner player"
      - " {letters_black}▎ {letters}Count: {highlight}%end_commands_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholders: {highlight}%player% %event_name%"

  end-add:
    slot: 22
    material: LIME_CONCRETE
    name: "{success}&lADD END COMMAND"
    lore:
      - ""
      - "{warning}➥ Click to add"
    actions:
      - "capture:add_end_command"

  end-clear:
    slot: 23
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lCLEAR END COMMANDS"
    lore:
      - ""
      - "{error}➥ Click to clear all"
    actions:
      - "capture:clear_end_commands"

  top1-reward:
    slot: 30
    material: DIAMOND
    name: "{highlight}&l#1 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}For points events only"
      - " {letters_black}▎ {letters}Count: {highlight}%top_1_count%"
      - ""
      - " {letters_black}▎ {info}Placeholders: {highlight}%player% %position% %event_name%"
      - ""
      - " {letters_black}▎ {success}Left-Click to add"
      - " {letters_black}▎ {error}Right-Click to clear"
    actions:
      - "left: capture:add_top_reward 1"
      - "right: capture:clear_top_rewards 1"

  top2-reward:
    slot: 31
    material: IRON_INGOT
    name: "{highlight}&l#2 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}For points events only"
      - " {letters_black}▎ {letters}Count: {highlight}%top_2_count%"
      - ""
      - " {letters_black}▎ {info}Placeholders: {highlight}%player% %position% %event_name%"
      - ""
      - " {letters_black}▎ {success}Left-Click to add"
      - " {letters_black}▎ {error}Right-Click to clear"
    actions:
      - "left: capture:add_top_reward 2"
      - "right: capture:clear_top_rewards 2"

  top3-reward:
    slot: 32
    material: GOLD_INGOT
    name: "{highlight}&l#3 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}For points events only"
      - " {letters_black}▎ {letters}Count: {highlight}%top_3_count%"
      - ""
      - " {letters_black}▎ {info}Placeholders: {highlight}%player% %position% %event_name%"
      - ""
      - " {letters_black}▎ {success}Left-Click to add"
      - " {letters_black}▎ {error}Right-Click to clear"
    actions:
      - "left: capture:add_top_reward 3"
      - "right: capture:clear_top_rewards 3"

  back:
    slot: 40
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
