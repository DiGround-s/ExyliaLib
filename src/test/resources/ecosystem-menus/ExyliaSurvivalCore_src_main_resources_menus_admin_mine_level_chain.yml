title: "{primary}&lDEGRADE CHAIN {muted}— %level_material%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No degrade stages configured"
    lore:
      - ""
      - "{muted}The block just stays air until it"
      - "{muted}heals back to %level_material%."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%stage_material%"
    name: "{warning}&lSTAGE #%stage_position% {highlight}%stage_material%"
    lore:
      - ""
      - " {letters_black}▎ {letters}Appears {highlight}%stage_seconds%s {letters}after becoming"
      - " {letters_black}▎ {letters}the current stage (0 = instant)"
      - " {letters_black}▎ {letters}Advances only when the player MINES it"
      - ""
      - " {letters_black}▎ {letters}Loot: %stage_loot_status%"
      - ""
      - " {letters_black}▎ {highlight}Left-click {muted}to move up"
      - " {letters_black}▎ {highlight}Right-click {muted}to move down"
      - " {letters_black}▎ {highlight}Middle-click {muted}to edit loot table"
      - " {letters_black}▎ {error}Shift + Right-click {muted}to remove"
    actions:
      - "left: survivalcore:mine_chain_move %stage_index% -1"
      - "right: survivalcore:mine_chain_move %stage_index% 1"
      - "middle: survivalcore:mine_chain_open_loot %stage_index%"
      - "shift_right: survivalcore:mine_chain_remove %stage_index%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - "next_page"

items:
  add:
    slot: 45
    material: EMERALD
    name: "{success}&lADD STAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Add a new block to show, with"
      - " {letters_black}▎ {letters}a delay for how long it takes to"
      - " {letters_black}▎ {letters}appear once it becomes current"
      - ""
      - " {letters_black}▎ {letters}Stages simulate in the order shown"
      - " {letters_black}▎ {letters}below (1st {muted}→{letters} 2nd {muted}→{letters} 3rd), advancing only"
      - " {letters_black}▎ {letters}when the player MINES the current one"
      - ""
      - "{warning}➥ Click to select a block"
    actions:
      - "survivalcore:mine_chain_add"

  back:
