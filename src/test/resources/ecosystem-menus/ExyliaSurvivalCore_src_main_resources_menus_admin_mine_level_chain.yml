title: "{primary}&lDEGRADE CHAIN {muted}— %level_material%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No degrade stages configured"
    lore:
      - ""
      - "{muted}The block just stays air until it"
      - "{muted}heals back to %level_material%."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%stage_material%"
    name: "{warning}&lSTAGE #%stage_position% {highlight}%stage_material%"
    lore:
      - ""
      - " {muted}❙ {letters}Appears {highlight}%stage_seconds%s {letters}after becoming"
      - " {muted}❙ {letters}the current stage (0 = instant)"
      - " {muted}❙ {letters}Advances only when the player MINES it"
      - ""
      - " {muted}❙ {letters}Loot: %stage_loot_status%"
      - ""
      - " {muted}❙ {highlight}Left-click {muted}to move up"
      - " {muted}❙ {highlight}Right-click {muted}to move down"
      - " {muted}❙ {highlight}Middle-click {muted}to edit loot table"
      - " {muted}❙ {error}Shift + Right-click {muted}to remove"
    actions:
      - "left: survivalcore:mine_chain_move %stage_index% -1"
      - "right: survivalcore:mine_chain_move %stage_index% 1"
      - "middle: survivalcore:mine_chain_open_loot %stage_index%"
      - "shift_right: survivalcore:mine_chain_remove %stage_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  add:
    slot: 48
    material: EMERALD
    name: "{success}&lADD STAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Add a new block to show, with"
      - " {muted}❙ {letters}a delay for how long it takes to"
      - " {muted}❙ {letters}appear once it becomes current"
      - ""
      - " {muted}❙ {letters}Stages simulate in the order shown"
      - " {muted}❙ {letters}below (1st {muted}→{letters} 2nd {muted}→{letters} 3rd), advancing only"
      - " {muted}❙ {letters}when the player MINES the current one"
      - ""
      - "{info}» Click to select a block"
    actions:
      - "survivalcore:mine_chain_add"

  back:
    slot: 49
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to level details"
    actions:
      - "survivalcore:mine_level_back_to_detail"
