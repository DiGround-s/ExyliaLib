title: "{primary}&lSPECTATOR {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No players alive"
    lore:
      - ""
      - "{muted}Waiting..."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "playerhead-%player_name%"
    name: "{highlight}%player_name%"
    lore:
      - ""
      - ' {muted}❙ {letters}Health: {info}%player_health% ❤'
      - ""
      - "{success}▶ Click to teleport"
    actions:
      - "events:spectator_teleport %player_name%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Click to go'
        - ' {muted}❙ {letters}to the previous page.'
        - ''
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Click to go'
        - ' {muted}❙ {letters}to the next page.'
        - ''
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  toggle_spectators:
    slot: 45
    material: "%spectator_toggle_material%"
    name: "%spectator_toggle_name%"
    lore:
      - ""
      - "%spectator_toggle_action%"
    actions:
      - "events:toggle_spectators"

  leave:
    slot: 49
    material: BARRIER
    name: '{error}&lLeave event'
    lore:
      - '{muted}Click to leave'
    actions:
      - "events:leave_event"
