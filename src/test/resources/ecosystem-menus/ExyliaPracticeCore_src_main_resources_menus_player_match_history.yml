        - ""
        - " {muted}❙ {letters}Kills: {highlight}%kills% {muted}/ Deaths: {highlight}%deaths%"
        - " {muted}❙ {letters}Damage dealt: {highlight}%damage_dealt%"
        - " {muted}❙ {letters}Hits: {success}%hits_dealt% {muted}dealt / {error}%hits_received% {muted}received"
        - " {muted}❙ {letters}Best combo: {highlight}%best_combo%"
