# ║  !! WARNING !! - DO NOT EDIT THIS FILE MANUALLY                  ║
# ║  This file is AUTOMATICALLY REGENERATED on every plugin startup. ║
# ║  Any changes made here WILL BE LOST.                             ║
# ╚══════════════════════════════════════════════════════════════════╝

title: "{primary}&lKIT ROOM {muted}· {highlight}Admin"
size: 54
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more categories"
    hide_tooltip: false

pagination:
  slots: "0-44"

  item_template:
    material: "%category_material%"
    name: "{highlight}&l%category_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%category_id%"
      - " {muted}❙ {letters}Items: {info}%category_item_count%"
      - ""
      - "{info}» Left-click to edit items"
      - "{warning}» Right-click to change material"
      - "{error}» Shift+click to delete"
    actions:
      - "left: sandbox:open_kitroom_category_editor %category_id%"
      - "right: sandbox:kitroom_set_category_material %category_id%"
      - "shift_left: sandbox:kitroom_delete_category %category_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  create:
    slot: 49
    material: LIME_DYE
    name: "{success}&l+ CREATE CATEGORY"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new category"
      - ""
      - "{success}» Click to create"
    actions:
      - "sandbox:kitroom_create_category"

  reset_defaults:
    slot: 51
    material: COMPARATOR
    name: "{error}&lReset to Defaults"
    lore:
      - ""
      - " {muted}❙ {letters}Deletes all categories and items"
      - " {muted}❙ {error}and restores the default ones"
      - ""
      - "{error}» Click to reset"
    actions:
      - "sandbox:confirm_kitroom_reset_defaults"

  back:
    slot: 47
    material: BARRIER
    name: "{error}&l← BACK"
    actions:
      - "sandbox:open_admin"
