title: "{primary}&lKIT ROOM {muted}· {highlight}Admin"
size: 54
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more categories"
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%category_material%"
    name: "{highlight}&l%category_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {info}%category_id%"
      - " {letters_black}▎ {letters}Items: {info}%category_item_count%"
      - ""
      - "{warning}➥ Left-click to edit items"
      - "{warning}➥ Right-click to change material"
      - "{error}➥ Shift+click to delete"
    actions:
      - "left: sandbox:open_kitroom_category_editor %category_id%"
      - "right: sandbox:kitroom_set_category_material %category_id%"
      - "shift_left: sandbox:kitroom_delete_category %category_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  create:
    slot: 45
    material: LIME_DYE
    name: "{success}&l+ CREATE CATEGORY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create a new category"
      - ""
      - "{success}➥ Click to create"
    actions:
      - "sandbox:kitroom_create_category"

  reset_defaults:
    slot: 53
    material: COMPARATOR
    name: "{error}&lReset to Defaults"
    lore:
      - ""
      - " {letters_black}▎ {letters}Deletes all categories and items"
      - " {letters_black}▎ {error}and restores the default ones"
      - ""
      - "{error}➥ Click to reset"
    actions:
      - "sandbox:confirm_kitroom_reset_defaults"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
