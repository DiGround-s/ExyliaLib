title: "{error}&lVOLCANO SETTINGS"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}The entire floor MUST be"
      - " {letters_black}▎ {highlight}White Concrete"
      - ""
      - " {letters_black}▎ {letters}After grace ends, random"
      - " {letters_black}▎ {letters}blocks heat up in stages:"
      - " {letters_black}▎ {warning}White {muted}> {highlight}Yellow {muted}> {error}Orange {muted}> {error}Red {muted}> Air"
      - ""
      - " {letters_black}▎ {letters}More blocks ignite per second"
      - " {letters_black}▎ {letters}the longer the round goes"

  grace-period:
    slot: 20
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - " {letters_black}▎ {letters}No blocks heat at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  stage-delay:
    slot: 21
    material: ORANGE_CONCRETE
    name: "{warning}&lSTAGE DELAY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%stage_delay% ticks"
      - ""
      - " {letters_black}▎ {letters}Initial ticks per color stage"
      - " {letters_black}▎ {letters}(decreases over time, min 1)"
      - ""
      - " {letters_black}▎ {success}Left-Click +4"
      - " {letters_black}▎ {error}Right-Click -4"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting stage-delay 4"
      - "right: events:adjust_setting stage-delay -4"
      - "shift_left: events:input_setting stage-delay"

  initial-blocks-per-second:
    slot: 22
    material: YELLOW_CONCRETE
    name: "{warning}&lINITIAL BLOCKS/SEC"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%initial_blocks_per_second%"
      - ""
      - " {letters_black}▎ {letters}Blocks that start heating"
      - " {letters_black}▎ {letters}per second at game start"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting initial-blocks-per-second 1"
      - "right: events:adjust_setting initial-blocks-per-second -1"
      - "shift_left: events:input_setting initial-blocks-per-second"

  spawn-growth-interval:
    slot: 23
    material: BLAZE_POWDER
    name: "{warning}&lSPAWN GROWTH INTERVAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%spawn_growth_interval%s"
      - ""
      - " {letters_black}▎ {letters}Seconds between each"
      - " {letters_black}▎ {letters}+1 extra block per second"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting spawn-growth-interval 1"
      - "right: events:adjust_setting spawn-growth-interval -1"
      - "shift_left: events:input_setting spawn-growth-interval"

  burn-footprint:
    slot: 24
    material: "%burn_footprint_material%"
    name: "%burn_footprint_color%&lBURN FOOTPRINT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%burn_footprint%"
      - ""
      - " {letters_black}▎ {letters}Blocks under players heat"
      - " {letters_black}▎ {letters}as they walk (like TNT Run)"
      - ""
      - " {letters_black}▎ {info}Click to toggle"
    actions:
      - "events:toggle_volcano_setting burn-footprint"

  back:
    slot: 31
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
