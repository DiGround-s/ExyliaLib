title: "{primary}&lTP REGIONS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No TP regions configured"
    lore:
      - ""
      - "{muted}Create one with the button below"
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: BEACON
    name: "{highlight}&l%region_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {info}%region_id%"
      - " {letters_black}▎ {letters}World: {info}%region_world%"
      - " {letters_black}▎ {letters}Interval: {info}%region_interval%s"
      - " {letters_black}▎ {letters}Target: {info}%region_target_world%"
      - " {letters_black}▎ {letters}Spread: {info}%region_spread% blocks"
      - ""
      - " {letters_black}▎ {success}Left-click to edit"
      - " {letters_black}▎ {error}Right-click to delete"
    actions:
      - "left: sandbox:open_tp_region_editor %region_id%"
      - "right: sandbox:delete_tp_region %region_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: EMERALD
    name: "{success}&lCREATE TP REGION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create a new TP region"
      - " {letters_black}▎ {letters}Players inside will be"
      - " {letters_black}▎ {letters}periodically teleported"
      - ""
      - "{warning}➥ Click to create"
    actions:
      - "sandbox:create_tp_region"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
