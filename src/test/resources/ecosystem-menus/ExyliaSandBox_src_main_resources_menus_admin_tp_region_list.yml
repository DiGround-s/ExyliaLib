title: "{primary}&lTP REGIONS {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No TP regions configured"
    lore:
      - ""
      - "{muted}Create one with the button below"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: BEACON
    name: "{highlight}&l%region_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%region_id%"
      - " {muted}❙ {letters}World: {info}%region_world%"
      - " {muted}❙ {letters}Interval: {info}%region_interval%s"
      - " {muted}❙ {letters}Target: {info}%region_target_world%"
      - " {muted}❙ {letters}Spread: {info}%region_spread% blocks"
      - ""
      - " {muted}❙ {success}Left-click to edit"
      - " {muted}❙ {error}Right-click to delete"
    actions:
      - "left: sandbox:open_tp_region_editor %region_id%"
      - "right: sandbox:delete_tp_region %region_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE TP REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new TP region"
      - " {muted}❙ {letters}Players inside will be"
      - " {muted}❙ {letters}periodically teleported"
      - ""
      - "{info}» Click to create"
    actions:
      - "sandbox:create_tp_region"

  back:
    slot: 31
    material: ARROW
    name: '{error}&lBack'
    lore:
      - '{muted}Click to return to admin'
    actions:
      - 'sandbox:open_admin'
