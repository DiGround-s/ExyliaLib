title: "{primary}&lSERVER STATISTICS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  overview:
    slot: 37
    material: BOOK
    name: "{warning}&lGLOBAL OVERVIEW"
    lore:
      - ""
      - " {muted}❙ {letters}Total Games: {highlight}%total_games%"
      - " {muted}❙ {letters}Ranked: {highlight}%ranked_games% {muted}({highlight}%ranked_percent%{muted})"
      - " {muted}❙ {letters}Casual: {highlight}%casual_games%"
      - " {muted}❙ {letters}Avg. Duration: {highlight}%avg_duration%"
      - ""
      - " {muted}❙ {letters}Top Kit: {success}%top_kit%"
      - " {muted}❙ {letters}Top Arena: {success}%top_arena%"
      - ""

  kit-stats:
    slot: 38
    material: DIAMOND_SWORD
    name: "{info}&lKIT STATISTICS"
    lore:
      - ""
      - " {muted}❙ {letters}See which kits are"
      - " {muted}❙ {letters}played the most"
      - ""
      - " {muted}❙ {letters}Kits tracked: {highlight}%total_kits_tracked%"
      - ""
      - "{info}» Click to view"
    actions:
      - "practice:open_admin_kit_stats"

  arena-stats:
    slot: 39
    material: COMPASS
    name: "{info}&lARENA STATISTICS"
    lore:
      - ""
      - " {muted}❙ {letters}See which arenas are"
      - " {muted}❙ {letters}used the most"
      - ""
      - " {muted}❙ {letters}Arenas tracked: {highlight}%total_arenas_tracked%"
      - ""
      - "{info}» Click to view"
    actions:
      - "practice:open_admin_arena_stats"

  category-stats:
    slot: 40
    material: BOOKSHELF
    name: "{info}&lCATEGORY STATISTICS"
    lore:
      - ""
      - " {muted}❙ {letters}See which categories"
      - " {muted}❙ {letters}are the most popular"
      - ""
      - " {muted}❙ {letters}Categories tracked: {highlight}%total_categories_tracked%"
      - ""
      - "{info}» Click to view"
    actions:
      - "practice:open_admin_category_stats"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - "{info}» Click to go back"
    actions:
      - "practice:open_admin"
