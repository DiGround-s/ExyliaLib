title: "{error}&lPAYLOAD SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  spawn-location:
    slot: 19
    material: "%spawn_material%"
    name: "%spawn_color%&lSPAWN LOCATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: {highlight}%spawn_status%"
      - " {letters_black}▎ {letters}Initial cart position"
      - ""
      - " {success}➥ Click to set"
    actions:
      - "capture:set_payload_spawn"

  end-location:
    slot: 20
    material: "%end_material%"
    name: "%end_color%&lEND LOCATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: {highlight}%end_status%"
      - " {letters_black}▎ {letters}Delivery destination"
      - ""
      - " {success}➥ Click to set"
    actions:
      - "capture:set_payload_end"

  radius:
    slot: 21
    material: COMPASS
    name: "{info}&lCAPTURE RADIUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%radius% blocks"
      - " {letters_black}▎ {letters}Detection radius around the cart"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.5"
      - " {letters_black}▎ {error}Right-Click -0.5"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_double_setting radius 0.5"
      - "right: capture:adjust_double_setting radius -0.5"
      - "shift_left: capture:input_double_setting radius"

  minecart-type:
    slot: 22
    material: MINECART
    name: "{warning}&lMINECART TYPE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%minecart_type%"
      - " {letters_black}▎ {letters}Entity type spawned as cart"
      - ""
      - " {success}➥ Click to cycle"
    actions:
      - "capture:cycle_minecart_type"

  clan-mode:
    slot: 32
    material: "%clan_mode_material%"
    name: "%clan_mode_color%&lCLAN MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%clan_mode_status%"
      - " {letters_black}▎ {letters}Only clan members can capture"
      - " {letters_black}▎ {letters}Win goes to the delivering clan"
      - ""
      - " {letters_black}▎ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting clan-mode"

  capture-speed:
    slot: 28
    material: LIME_DYE
    name: "{success}&lCAPTURE SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%capture_speed% blocks/s"
      - " {letters_black}▎ {letters}Speed when clan is escorting"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.1"
      - " {letters_black}▎ {error}Right-Click -0.1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_double_setting capture-speed 0.1"
      - "right: capture:adjust_double_setting capture-speed -0.1"
      - "shift_left: capture:input_double_setting capture-speed"

  recapture-speed:
    slot: 29
    material: RED_DYE
    name: "{error}&lRECAPTURE SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%recapture_speed% blocks/s"
      - " {letters_black}▎ {letters}Speed when enemies push cart back"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.1"
      - " {letters_black}▎ {error}Right-Click -0.1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_double_setting recapture-speed 0.1"
      - "right: capture:adjust_double_setting recapture-speed -0.1"
      - "shift_left: capture:input_double_setting recapture-speed"

  return-speed:
    slot: 30
    material: YELLOW_DYE
    name: "{warning}&lRETURN SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%return_speed% blocks/s"
      - " {letters_black}▎ {letters}Speed when cart drifts back (no players)"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.1"
      - " {letters_black}▎ {error}Right-Click -0.1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_double_setting return-speed 0.1"
      - "right: capture:adjust_double_setting return-speed -0.1"
      - "shift_left: capture:input_double_setting return-speed"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
