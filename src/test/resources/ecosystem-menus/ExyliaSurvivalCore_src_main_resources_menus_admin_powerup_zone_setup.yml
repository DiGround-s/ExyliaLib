# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lZONE {muted}— {highlight}%zone_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%zone_name%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "survivalcore:pu_zone_edit_name"

  enabled:
    slot: 5
    material: "%zone_enabled_material%"
    name: "%zone_enabled_color%&lENABLED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %zone_enabled_status%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:pu_zone_toggle_enabled"

  mode-area:
    slot: 20
    material: "%zone_mode_is_area%"
    name: "{highlight}&lMODE: AREA"
    lore:
      - ""
      - " {letters_black}▎ {letters}Spawn randomly in a selected area"
      - ""
      - "{warning}➥ Click to use AREA mode"
    actions:
      - "survivalcore:pu_zone_set_mode_area"

  mode-locations:
    slot: 21
    material: "%zone_mode_is_locations%"
    name: "{highlight}&lMODE: LOCATIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Spawn at predefined locations"
      - ""
      - "{warning}➥ Click to use LOCATIONS mode"
    actions:
      - "survivalcore:pu_zone_set_mode_locations"

  area:
    slot: 22
    material: "%zone_area_material%"
    name: "%zone_area_color%&lAREA REGION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %zone_area_status%"
      - ""
      - " {letters_black}▎ {letters}Two-corner selection for AREA mode"
      - ""
      - "{warning}➥ Click to select with wand"
    actions:
      - "survivalcore:pu_zone_set_area"

  locations:
    slot: 23
    material: PAPER
    name: "{highlight}&lSPAWN LOCATIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Count: {highlight}%zone_locations_count%"
      - ""
      - " {letters_black}▎ {letters}Predefined spawn points for LOCATIONS mode"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "survivalcore:pu_zone_open_locations"

  entries:
    slot: 25
    material: NETHER_STAR
    name: "{highlight}&lPOWERUPS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Count: {highlight}%zone_powerups_count%"
      - ""
      - " {letters_black}▎ {letters}Powerup types that spawn in this zone"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "survivalcore:pu_zone_open_entries"

  interval:
    slot: 29
    material: CLOCK
    name: "{highlight}&lSPAWN INTERVAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%zone_interval%s"
      - ""
      - " {success}● {info}Left-click {muted}+1s"
      - " {error}● {info}Right-click {muted}-1s"
      - " {success}● {info}Shift + Left {muted}+10s"
      - " {error}● {info}Shift + Right {muted}-10s"
    actions:
      - "left: survivalcore:pu_zone_adjust_interval 1"
      - "right: survivalcore:pu_zone_adjust_interval -1"
      - "shift_left: survivalcore:pu_zone_adjust_interval 10"
      - "shift_right: survivalcore:pu_zone_adjust_interval -10"

  max-active:
    slot: 30
    material: REPEATER
    name: "{highlight}&lMAX ACTIVE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%zone_max_active%"
      - ""
      - " {success}● {info}Left-click {muted}+1"
      - " {error}● {info}Right-click {muted}-1"
    actions:
      - "left: survivalcore:pu_zone_adjust_max_active 1"
      - "right: survivalcore:pu_zone_adjust_max_active -1"

  lifetime:
    slot: 31
    material: RECOVERY_COMPASS
    name: "{highlight}&lLIFETIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%zone_lifetime%"
      - ""
      - " {letters_black}▎ {letters}Time before powerup disappears"
      - " {letters_black}▎ {letters}Set to {highlight}-1 {letters}for permanent"
      - ""
      - " {success}● {info}Left-click {muted}+10s"
      - " {error}● {info}Right-click {muted}-10s"
      - " {success}● {info}Shift + Left {muted}+60s"
      - " {error}● {info}Shift + Right {muted}-60s"
    actions:
      - "left: survivalcore:pu_zone_adjust_lifetime 10"
      - "right: survivalcore:pu_zone_adjust_lifetime -10"
      - "shift_left: survivalcore:pu_zone_adjust_lifetime 60"
      - "shift_right: survivalcore:pu_zone_adjust_lifetime -60"

  auto-respawn:
    slot: 32
    material: "%zone_auto_respawn_material%"
    name: "%zone_auto_respawn_color%&lAUTO RESPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %zone_auto_respawn_status%"
      - ""
      - " {letters_black}▎ {letters}Respawn after pickup or expiry"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:pu_zone_toggle_auto_respawn"

  random:
    slot: 33
    material: "%zone_random_material%"
    name: "%zone_random_color%&lSELECTION MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Mode: %zone_random_status%"
      - ""
      - " {letters_black}▎ {letters}Random: equal chance per powerup"
      - " {letters_black}▎ {letters}Weighted: chance by entry weight"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:pu_zone_toggle_random"

  solid-below:
    slot: 40
    material: "%zone_solid_below_material%"
    name: "%zone_solid_below_color%&lREQUIRE SOLID BELOW"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %zone_solid_below_status%"
      - ""
      - " {letters_black}▎ {letters}AREA mode: only spawn on solid ground"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:pu_zone_toggle_solid_below"

  allow-air:
    slot: 41
    material: "%zone_allow_air_material%"
    name: "%zone_allow_air_color%&lALLOW IN AIR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %zone_allow_air_status%"
      - ""
      - " {letters_black}▎ {letters}AREA mode: allow floating spawns"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:pu_zone_toggle_allow_air"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {warning}➥ Return to zone list"
    actions:
      - "survivalcore:pu_zone_open_list"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE ZONE"
    lore:
      - ""
      - " {error}➥ Click to permanently delete"
    actions:
      - "survivalcore:pu_zone_delete %zone_id%"
