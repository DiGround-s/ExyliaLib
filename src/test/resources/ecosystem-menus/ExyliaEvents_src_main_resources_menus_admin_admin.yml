title: "{primary}&lADMIN EVENTS"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  manage-events:
    slot: 13
    material: COMPASS
    name: "{warning}&lMANAGE EVENTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}View and manage active events"
      - " {letters_black}▎ {letters}Stop ongoing events"
      - ""
      - " {letters_black}▎ {letters}Active: {highlight}%active_events%"
      - ""
      - "{warning}➥ Click to open"
    actions:
      - "events:open_event_list"

  events-setup:
    slot: 14
    material: CHISELED_BOOKSHELF
    name: "{info}&lCONFIGURATIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create and configure events"
      - " {letters_black}▎ {letters}Spawns, bounds and parameters"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_events%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "events:open_category_list"

  set-lobby:
    slot: 22
    material: RED_BED
    name: "{secondary}&lSET MAIN LOBBY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Set the main lobby location"
      - " {letters_black}▎ {letters}using the wizard"
      - ""
      - "{warning}➥ Click to set"
    actions:
      - "events:set_lobby"

  reload:
    slot: 27
    material: REDSTONE
    name: "{error}&lRELOAD CONFIGS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Reload all plugin"
      - " {letters_black}▎ {letters}configurations"
      - ""
      - "{warning}➥ Click to reload"
    actions:
      - "events:reload_configs"
