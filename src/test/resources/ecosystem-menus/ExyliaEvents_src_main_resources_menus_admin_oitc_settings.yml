title: "{primary}&lOITC SETTINGS"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  kills-to-win:
    slot: 10
    material: DIAMOND_SWORD
    name: "{info}&lKILLS TO WIN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%kills_to_win%"
      - ""
      - " {muted}❙ {success}Left-Click +5"
      - " {muted}❙ {error}Right-Click -5"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting kills-to-win 5"
      - "right: events:adjust_setting kills-to-win -5"
      - "shift_left: events:input_setting kills-to-win"

  respawn-delay:
    slot: 12
    material: ENDER_PEARL
    name: "{info}&lRESPAWN TIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  arrow-limit:
    slot: 14
    material: ARROW
    name: "{info}&lARROW LIMIT"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%arrow_limit%"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting arrow-limit 1"
      - "right: events:adjust_setting arrow-limit -1"
      - "shift_left: events:input_setting arrow-limit"

  drop-items:
    slot: 16
    material: "%drop_items_material%"
    name: "{info}&lDROP ITEMS ON DEATH"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %drop_items%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_oitc_setting drop-items-on-death"

  reset-kit-on-kill:
    slot: 20
    material: "%reset_kit_material%"
    name: "{info}&lRESET KIT ON KILL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %reset_kit%"
      - " {muted}❙ {letters}Restores full kit"
      - " {muted}❙ {letters}upon getting a kill"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_oitc_setting reset-kit-on-kill"

  golden-apple:
    slot: 22
    material: "%golden_apple_material%"
    name: "{info}&lGOLDEN APPLE ON KILL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %golden_apple_on_kill%"
      - " {muted}❙ {letters}Amount: {highlight}%golden_apple_amount%"
      - ""
      - " {muted}❙ {success}Left-Click to toggle"
      - " {muted}❙ {warning}Right-Click to adjust amount"
    actions:
      - "left: events:toggle_oitc_setting golden-apple-on-kill"
      - "right: events:input_setting golden-apple-amount"

  grace-period:
    slot: 24
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%grace_period%s"
      - " {muted}❙ {letters}No PvP or damage at start"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  team-selector:
    slot: 37
    condition: "%has_teams% == true"
    material: "%team_selector_material%"
    name: "{warning}&lTEAM SELECTOR"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %team_selector%"
      - " {muted}❙ {letters}Allow players to choose"
      - " {muted}❙ {letters}their team in the lobby"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_team_selector_setting team-selector-enabled"

  back:
    slot: 40
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
