# The Connect Four board.
#
# Forty-two squares, seven across and six down, in reading order: the first
# slot is the top-left. The board's shape is in the game's config.yml, and the
# game refuses to load if the number of slots below does not match it.
#
# A click anywhere in a column drops into that column — a player aims at the
# column, not at the one free square in the stack.

title: '%your_name% {muted}vs %opponent_name% {muted}— %match_score%'
size: 54

open_sounds:
  - 'BLOCK_BARREL_OPEN|0.8|1.4'
click_sounds:
  - 'BLOCK_STONE_PLACE|0.8|1.2'

refresh:
  mode: DISABLED

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  status:
    slot: 0
    material: CLOCK
    name: '{primary}&l%match_mode_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Round: {info}%match_round%{muted}/{info}%match_rounds%'
      - ' {muted}❙ {letters}Score: {info}%match_score%'
      - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
      - ''
      - ' {muted}❙ {letters}To move: {highlight}%turn_name%'
      - ' {muted}❙ {letters}Time left: {info}%turn_seconds%s ⏱'

  you:
    slot: 9
    material: 'playerhead-%your_name%'
    name: '{success}&l%your_name%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%your_score%'
      - ' {muted}❙ {letters}Your stake: {highlight}%match_wager%'

  opponent:
    slot: 8
    material: 'playerhead-%opponent_name%'
    name: '{error}&l%opponent_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%opponent_score%'

  spectators:
    slot: 17
    material: ENDER_EYE
    amount: '%spectator_count%'
    name: '{primary}&lWATCHING'
    lore:
      - ''
      - ' {muted}❙ {letters}People watching: {highlight}%spectator_count%'
      - ''
      - '{info}» Click to see who'
    actions:
      - 'left: betcore:open_spectators'

  close:
    slot: 53
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - ''
      - ' {muted}❙ {letters}The match keeps running and'
      - ' {muted}❙ {letters}so does your clock.'
      - ''
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  # Seven across, six down. Change this and connect-four's config.yml together.
  board:
    slots: '1-7,10-16,19-25,28-34,37-43,46-52'
    filler:
      material: AIR
      hide_tooltip: true

    empty_template:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{letters}&lCOLUMN %cell_column%'
      lore:
        - ''
        - ' {muted}❙ {letters}Your piece falls to the bottom.'
        - ''
        - '{success}▶ Click to drop here'
      actions:
        - 'left: betcore:play_cell'

    locked_template:
      material: GRAY_STAINED_GLASS_PANE
      name: '{muted}&lCOLUMN %cell_column%'
      lore:
        - ''
        - ' {muted}❙ {letters}Waiting for {highlight}%turn_name%{letters}.'

    red_template:
      material: RED_TERRACOTTA
      name: '{error}&l●'
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    yellow_template:
      material: YELLOW_TERRACOTTA
      name: '{highlight}&l●'
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    red_last_template:
      material: RED_GLAZED_TERRACOTTA
      name: '{error}&l● {muted}— last move'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    yellow_last_template:
      material: YELLOW_GLAZED_TERRACOTTA
      name: '{highlight}&l● {muted}— last move'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    red_winning_template:
      material: RED_CONCRETE
      name: '{success}&l● {muted}— winning line'
      glow: true

    yellow_winning_template:
      material: YELLOW_CONCRETE
      name: '{success}&l● {muted}— winning line'
      glow: true

  # One slot, two meanings: a player surrenders and a spectator leaves.
  viewer:
    slots: '45'
    filler:
      material: AIR
      hide_tooltip: true

    item_template:
      material: WHITE_BANNER
      name: '{error}&lSURRENDER'
      lore:
        - ''
        - ' {muted}❙ {letters}Gives the match to {highlight}%opponent_name%{letters}.'
        - ' {muted}❙ {letters}Your {info}%match_wager% {letters}goes with it.'
        - ''
        - '{error}▶ Click, then confirm'
      actions:
        - 'left: betcore:surrender'

    watching_template:
      material: WHITE_BANNER
      name: '{warning}&lSTOP WATCHING'
      lore:
        - ''
        - ' {muted}❙ {letters}Leaves the match running.'
        - ''
        - '{warning}▶ Click to leave'
      actions:
        - 'left: betcore:leave_spectate'
