title: "{primary}&lESTADISTICAS"
size: 45
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay eventos disponibles"
    lore:
      - ""
      - "{muted}Vuelve mas tarde"
    hide_tooltip: false

items:
  overall:
    slot: 4
    material: DIAMOND
    name: "{warning}&lESTADISTICAS GENERALES"
    lore:
      - ""
      - " {muted}❙ {letters}Kills: {highlight}%total_kills%"
      - " {muted}❙ {letters}Deaths: {highlight}%total_deaths%"
      - " {muted}❙ {letters}K/D Ratio: {highlight}%kdr%"
      - ""
      - " {muted}❙ {letters}Victorias: {success}%total_wins%"
      - " {muted}❙ {letters}Partidas: {highlight}%games_played%"
      - " {muted}❙ {letters}Win Rate: {success}%win_rate%"

  back:
    slot: 40
    material: ARROW
    name: "{error}&lVolver"
    lore:
      - "{muted}Clic para volver"
    actions:
      - "events:open_main_menu"

pagination:
  slots: '19-25,28-34'
  item_template:
    material: "%config_material%"
    name: "{primary}&l%config_name%"
    lore:
      - " {muted}Tipo: {highlight}%config_type%"
      - ""
      - " {muted}❙ {letters}Kills: {highlight}%kills%"
      - " {muted}❙ {letters}Deaths: {highlight}%deaths%"
      - " {muted}❙ {letters}K/D Ratio: {highlight}%kdr%"
      - ""
      - " {muted}❙ {letters}Victorias: {success}%wins%"
      - " {muted}❙ {letters}Partidas: {highlight}%games%"
      - " {muted}❙ {letters}Win Rate: {success}%winrate%"
  navigation:
    previous:
      slot: 38
      material: ARROW
      name: "{primary}&lAnterior"
      actions:
        - "previous_page"
    next:
      slot: 42
      material: ARROW
      name: "{primary}&lSiguiente"
      actions:
        - "next_page"
