    slot: 19
    material: TNT
    name: "{warning}&lROUND DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%round_duration%s"
      - ""
      - " {letters_black}▎ {letters}Time before exploding"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-duration 5"
      - "right: events:adjust_setting round-duration -5"
      - "shift_left: events:input_setting round-duration"

  tagged-percentage:
