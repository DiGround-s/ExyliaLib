title: "{primary}&lSHOTGUN SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  enabled:
    slot: 10
    material: "%weapon_enabled_material%"
    name: "{info}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %weapon_enabled%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_csgo_weapon_setting weapon-shotgun-enabled"

  damage:
    slot: 11
    material: STONE_HOE
    name: "{info}&lDAMAGE {muted}(per pellet)"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_damage%"
      - ""
      - " {muted}❙ {success}Left-Click +0.5"
      - " {muted}❙ {error}Right-Click -0.5"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_double weapon-shotgun-damage 0.5"
      - "right: events:adjust_csgo_weapon_double weapon-shotgun-damage -0.5"
      - "shift_left: events:input_csgo_weapon_double weapon-shotgun-damage"

  cooldown:
    slot: 12
    material: CLOCK
    name: "{info}&lCOOLDOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_cooldown% ticks"
      - ""
      - " {muted}❙ {success}Left-Click +2"
      - " {muted}❙ {error}Right-Click -2"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_int weapon-shotgun-cooldown 2"
      - "right: events:adjust_csgo_weapon_int weapon-shotgun-cooldown -2"
      - "shift_left: events:input_csgo_weapon_int weapon-shotgun-cooldown"

  range:
    slot: 13
    material: ENDER_EYE
    name: "{info}&lRANGE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_range%"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_double weapon-shotgun-range 1.0"
      - "right: events:adjust_csgo_weapon_double weapon-shotgun-range -1.0"
      - "shift_left: events:input_csgo_weapon_double weapon-shotgun-range"

  oneshot:
    slot: 14
    material: "%weapon_oneshot_material%"
    name: "{info}&lONE SHOT KILL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %weapon_oneshot%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_csgo_weapon_setting weapon-shotgun-oneshot"

  pellets:
    slot: 15
    material: GRAVEL
    name: "{info}&lPELLETS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_pellets%"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_int weapon-shotgun-pellets 1"
      - "right: events:adjust_csgo_weapon_int weapon-shotgun-pellets -1"
      - "shift_left: events:input_csgo_weapon_int weapon-shotgun-pellets"

  spread:
    slot: 16
    material: FEATHER
    name: "{info}&lSPREAD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_spread%"
      - ""
      - " {muted}❙ {success}Left-Click +0.01"
      - " {muted}❙ {error}Right-Click -0.01"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_double weapon-shotgun-spread 0.01"
      - "right: events:adjust_csgo_weapon_double weapon-shotgun-spread -0.01"
      - "shift_left: events:input_csgo_weapon_double weapon-shotgun-spread"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_type_settings"
