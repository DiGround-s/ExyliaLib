title: "{primary}&lJUMPAD LOCATIONS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No locations"
    lore:
      - ""
      - "{muted}Add your first trigger location!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: SLIME_BLOCK
    name: "{warning}&lLOCATION #%loc_index%"
    lore:
      - ""
      - " {muted}❙ {letters}World: {info}%loc_world%"
      - " {muted}❙ {letters}X: {info}%loc_x% {muted}| Y: {info}%loc_y% {muted}| Z: {info}%loc_z%"
      - ""
      - " {muted}❙ {error}Right-Click to remove"
    actions:
      - "right: practice:jumpad_remove_location %loc_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  add:
    slot: 46
    material: EMERALD
    name: "{success}&lADD LOCATION"
    lore:
      - ""
      - " {muted}❙ {letters}Right-click any block to register"
      - " {muted}❙ {letters}it as a jumpad trigger"
      - ""
      - "{info}» Click to add"
    actions:
      - "practice:jumpad_add_location"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to jumpad setup"
    actions:
      - "practice:jumpad_back_to_setup"
