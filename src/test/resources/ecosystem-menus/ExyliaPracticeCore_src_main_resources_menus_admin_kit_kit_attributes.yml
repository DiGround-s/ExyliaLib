      - " {muted}❙ {success}Left-Click {letters}to set value"
      - " {muted}❙ {error}Right-Click {letters}to reset"
    actions:
      - "left: practice:set_kit_attribute movement_speed"
      - "right: practice:reset_kit_attribute movement_speed"

  knockback-resistance:
    slot: 15
    material: "%knockback_resistance_material%"
    name: "{highlight}&lKNOCKBACK RESISTANCE"
    lore:
      - ""
      - " {muted}❙ {letters}Value: {info}%knockback_resistance%"
