title: "{primary}&lATTRIBUTES&r {muted}— %kit_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  max-health:
    slot: 11
    material: "%max_health_material%"
    name: "{highlight}&lMAX HEALTH"
    lore:
      - ""
      - " {muted}❙ {letters}Value: {info}%max_health%"
      - " {muted}❙ {muted}Default = 20.0"
      - ""
      - " {muted}❙ {success}Left-Click {letters}to set value"
      - " {muted}❙ {error}Right-Click {letters}to reset"
    actions:
      - "left: practice:set_kit_attribute max_health"
      - "right: practice:reset_kit_attribute max_health"

  attack-damage:
    slot: 12
    material: "%attack_damage_material%"
    name: "{highlight}&lATTACK DAMAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Value: {info}%attack_damage%"
      - " {muted}❙ {muted}Default = 2.0"
      - ""
      - " {muted}❙ {success}Left-Click {letters}to set value"
      - " {muted}❙ {error}Right-Click {letters}to reset"
    actions:
      - "left: practice:set_kit_attribute attack_damage"
      - "right: practice:reset_kit_attribute attack_damage"

  movement-speed:
