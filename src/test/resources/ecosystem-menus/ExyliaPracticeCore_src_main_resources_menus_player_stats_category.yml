title: "{primary}&lSTATS&r {muted}— Choose Category"
size: 36
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No categories available"
    lore:
      - ""
      - "{muted}No practice categories are enabled."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%category_icon%"
    name: "{primary}&l%category_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Kits: {highlight}%kit_count%"
      - ""
      - "{success}» Click to view kit stats"
    actions:
      - "practice:stats_select_category %category_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  global_stats:
    slot: 31
    material: NETHER_STAR
    name: "{warning}&lGlobal Stats"
    lore:
      - ""
      - " {muted}❙ {letters}Kills: {highlight}%global_kills%"
      - " {muted}❙ {letters}Deaths: {highlight}%global_deaths%"
      - " {muted}❙ {letters}KDR: {highlight}%global_kdr%"
      - " {muted}❙ {letters}Best Streak: {highlight}%global_best_streak%"
      - " {muted}❙ {letters}Damage Dealt: {highlight}%global_damage%"
      - " {muted}❙ {letters}Time Played: {highlight}%global_time_played%"
      - ""
      - "{success}» Click to view global leaderboard"
    actions:
      - "practice:lb_select_kit global"
