title: "{primary}&lQUAKE SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  kills-to-win:
    slot: 10
    material: BLAZE_ROD
    name: "{info}&lFRAGS TO WIN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%kills_to_win%"
      - ""
      - " {muted}❙ {success}Left-Click +5"
      - " {muted}❙ {error}Right-Click -5"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting kills-to-win 5"
      - "right: events:adjust_setting kills-to-win -5"
      - "shift_left: events:input_setting kills-to-win"

  respawn-delay:
    slot: 11
    material: ENDER_PEARL
    name: "{info}&lRESPAWN TIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  grace-period:
    slot: 12
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%grace_period%s"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  weapon-cooldown:
    slot: 14
    material: BLAZE_POWDER
    name: "{info}&lRAILGUN COOLDOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_cooldown% ticks"
      - " {muted}❙ {letters}({highlight}%.2f%weapon_cooldown%{letters}s)"
      - ""
      - " {muted}❙ {success}Left-Click +2 ticks"
      - " {muted}❙ {error}Right-Click -2 ticks"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting weapon-cooldown 2"
      - "right: events:adjust_setting weapon-cooldown -2"
      - "shift_left: events:input_setting weapon-cooldown"

  dash-cooldown:
    slot: 15
    material: FEATHER
    name: "{info}&lDASH COOLDOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%dash_cooldown% ticks"
      - ""
      - " {muted}❙ {success}Left-Click +10 ticks"
      - " {muted}❙ {error}Right-Click -10 ticks"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting dash-cooldown 10"
      - "right: events:adjust_setting dash-cooldown -10"
      - "shift_left: events:input_setting dash-cooldown"

  dash-power:
    slot: 16
    material: WIND_CHARGE
    name: "{info}&lDASH POWER"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%dash_power%"
      - ""
      - " {muted}❙ {success}Left-Click +0.2"
      - " {muted}❙ {error}Right-Click -0.2"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_double_setting dash-power 0.2"
      - "right: events:adjust_double_setting dash-power -0.2"
      - "shift_left: events:input_double_setting dash-power"

  team-selector:
    slot: 46
    condition: "%has_teams% == true"
    material: "%team_selector_material%"
    name: "{warning}&lTEAM SELECTOR"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %team_selector%"
      - " {muted}❙ {letters}Allow players to choose"
      - " {muted}❙ {letters}their team in the lobby"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_team_selector_setting team-selector-enabled"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
