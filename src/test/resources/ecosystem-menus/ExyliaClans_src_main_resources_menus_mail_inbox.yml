title: "{primary}&lCLAN MAIL {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No messages"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%mail_icon%"
    name: "%mail_read_prefix%%mail_title_color%&l%mail_subject%"
    lore:
      - ""
      - " {muted}❙ {letters}From: {highlight}%mail_sender%"
      - " {muted}❙ {letters}Type: %mail_type_label%"
      - " {muted}❙ {letters}Sent: {info}%mail_sent_relative%"
      - " {muted}❙ {letters}Status: %mail_read_status%"
      - "%mail_pinned_line%"
      - ""
      - "{info}» Click to read"
    actions:
      - "exyliaclans:open_mail_view %mail_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - 'next_page'

items:
  compose_member:
    slot: 45
    material: WRITABLE_BOOK
    name: "{success}&lSEND MESSAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Send a private message"
      - " {muted}❙ {letters}to a clan member."
      - ""
      - "{info}» Click to compose"
    actions:
      - "exyliaclans:compose_mail_member_input"

  compose_clan:
    slot: 46
    material: BOOK
    name: "%compose_clan_color%&lMESSAGE CLAN"
    lore:
      - ""
      - " {muted}❙ {letters}Send a message to"
      - " {muted}❙ {letters}every member of the clan."
      - ""
      - "%compose_clan_action_lore%"
    actions:
      - "%compose_clan_action%"

  mark_all_read:
    slot: 47
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTMxMTk2MzRhZjE0NzhjNTk1MzQ1YjA0OTIyM2Q5NTJmMTM1MjhlNTBhOGY0YjE1MzFhZTFhOGE0MzE5In19fQ=='
    name: "{highlight}&lMARK ALL READ"
    lore:
      - ""
      - " {muted}❙ {letters}Unread: {error}%unread_count%"
      - ""
      - "{info}» Click to mark all as read"
    actions:
      - "exyliaclans:mail_mark_all_read"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Click to go back'
    actions:
      - "exyliaclans:open_main_menu"
