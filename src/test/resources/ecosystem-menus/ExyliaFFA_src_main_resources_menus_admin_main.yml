title: "{primary}&lADMIN FFA"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  manage-arenas:
    slot: 11
    material: COMPASS
    name: "{info}&lMANAGE ARENAS"
    lore:
      - ""
      - " {muted}❙ {letters}Create, edit and delete"
      - " {muted}❙ {letters}FFA arenas"
      - ""
      - " {muted}❙ {letters}Total: {highlight}%total_arenas%"
      - " {muted}❙ {letters}Players online: {highlight}%total_players%"
      - ""
      - "{info}» Click to manage"
    actions:
      - "ffa:open_ffa_list"

  info:
    slot: 13
    material: DIAMOND_SWORD
    name: "{warning}&lEXYLIA FFA"
    lore:
      - ""
      - " {muted}❙ {letters}Free For All system"
      - ""
      - " {muted}❙ {letters}Active arenas: {highlight}%total_arenas%"
      - " {muted}❙ {letters}Players fighting: {highlight}%total_players%"

  set-lobby:
    slot: 35
    material: "%lobby_material%"
    name: "{warning}&lLOBBY LOCATION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %lobby_status%"
      - ""
      - "{warning}» Click to set lobby"
    actions:
      - "ffa:set_lobby"

  set-kit-editor:
    slot: 34
    material: "%kit_editor_material%"
    name: "{warning}&lKIT EDITOR LOCATION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %kit_editor_status%"
      - ""
      - "{warning}» Click to set location"
    actions:
      - "ffa:set_kit_editor_location"

  data-management:
    slot: 15
    material: COMPARATOR
    name: "{error}&lDATA MANAGEMENT"
    lore:
      - ""
      - " {muted}❙ {letters}Reset stats & layouts"
      - " {muted}❙ {letters}for players and arenas"
      - ""
      - "{info}» Click to manage"
    actions:
      - "ffa:open_admin_data"

  reload:
    slot: 31
    material: REDSTONE
    name: "{error}&lRELOAD CONFIGS"
    lore:
      - ""
      - " {muted}❙ {letters}Reload all plugin"
      - " {muted}❙ {letters}configurations"
      - ""
      - "{info}» Click to reload"
    actions:
      - "ffa:reload_configs"
