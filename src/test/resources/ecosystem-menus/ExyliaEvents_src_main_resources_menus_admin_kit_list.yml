title: "{primary}&lKITS: %config_name% {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No kits"
    lore:
      - ""
      - "{muted}Create a new kit!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%kit_icon%"
    name: "{warning}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Contents: %kit_has_content%"
      - ""
      - " {muted}❙ {success}Left-Click to save inventory"
      - " {muted}❙ {warning}Shift-Click to edit name"
      - " {muted}❙ {error}Right-Click to delete"
      - " {muted}❙ {success}Shift-Right-Click to receive"
    actions:
      - "left: events:set_kit_contents %kit_id%"
      - "shift_left: events:edit_kit_name %kit_id%"
      - "right: events:confirm_delete_kit %kit_id%"
      - "shift_right: events:give_kit %kit_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE KIT"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new kit"
      - " {muted}❙ {letters}for this event"
      - ""
      - "{info}» Click to create"
    actions:
      - "events:create_kit"

  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
