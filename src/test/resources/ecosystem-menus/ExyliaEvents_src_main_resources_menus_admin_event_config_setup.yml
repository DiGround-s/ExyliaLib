title: "{primary}&lEVENT: %event_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 4
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "events:edit_config_name"

  event-type:
    slot: 19
    material: PAPER
    name: "{highlight}&lEVENT TYPE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Type: {info}%event_type%"
      - ""
      - " {letters_black}▎ {letters}Cannot be changed"

  icon:
    slot: 3
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "events:set_config_icon"

  lobby-spawn:
    slot: 24
    material: "%lobby_material%"
    name: "{warning}&lLOBBY SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}%lobby_status%"
      - " {letters_black}▎ {letters}%lobby_coords%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: events:set_config_lobby"
      - "right: events:teleport_config_lobby"

  spectator-spawn:
    slot: 25
    material: "%spectator_material%"
    name: "{warning}&lSPECTATOR SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}%spectator_status%"
      - " {letters_black}▎ {letters}%spectator_coords%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: events:set_config_spectator"
      - "right: events:teleport_config_spectator"

  spawn-points:
    slot: 28
    material: "%spawns_material%"
    name: "{warning}&lSPAWN POINTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%spawn_count%"
      - ""
      - " {letters_black}▎ {success}Left-Click to add"
      - " {letters_black}▎ {error}Right-Click to clear"
    actions:
      - "left: events:add_config_spawn"
      - "right: events:clear_config_spawns"

  bounds:
    slot: 20
    material: STRUCTURE_BLOCK
    name: "{warning}&lSET BOUNDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Bounds: %bounds_status%"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "events:set_config_bounds"

  copy-bounds:
    slot: 22
    material: FILLED_MAP
    name: "{warning}&lCOPY REGION"
    condition: "%uses_copy_bounds% == true"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %copy_bounds_status%"
      - " {letters_black}▎ {letters}Region cloned for each arena/plot"
      - " {letters_black}▎ {letters}Falls back to Bounds if not set"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "events:set_config_copy_bounds"

  schematic:
    slot: 21
    material: "%schematic_material%"
    name: "{warning}&lSCHEMATIC"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %schematic_status%"
      - ""
      - " {letters_black}▎ {success}Left-Click to save"
      - " {letters_black}▎ {warning}Right-Click to restore"
    actions:
      - "left: events:save_schematic"
      - "right: events:restore_schematic"

  countdown:
    slot: 33
    material: CLOCK
    name: "{info}&lCOUNTDOWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%countdown%s"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting countdown 5"
      - "right: events:adjust_setting countdown -5"
      - "shift_left: events:input_setting countdown"

  duration:
    slot: 34
    material: RECOVERY_COMPASS
    name: "{info}&lDURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%duration%s"
      - ""
      - " {letters_black}▎ {success}Left-Click +30s"
      - " {letters_black}▎ {error}Right-Click -30s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting duration 30"
      - "right: events:adjust_setting duration -30"
      - "shift_left: events:input_setting duration"

  min-players:
    slot: 29
    material: PLAYER_HEAD
    name: "{info}&lMIN PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%min_players%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting min-players 1"
      - "right: events:adjust_setting min-players -1"
      - "shift_left: events:input_setting min-players"

  max-players:
    slot: 30
    material: SKELETON_SKULL
    name: "{info}&lMAX PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%max_players%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting max-players 1"
      - "right: events:adjust_setting max-players -1"
      - "shift_left: events:input_setting max-players"

  kit:
    slot: 31
    material: "%kit_material%"
    name: "{warning}&lMANAGE KITS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Kits: {highlight}%kit_count%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "events:open_kit_list"

  type-settings:
    slot: 38
    material: COMPARATOR
    name: "{secondary}&lTYPE SETTINGS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configure type-specific"
      - " {letters_black}▎ {letters}parameters"
      - ""
      - "{warning}➥ Click to open"
    actions:
      - "events:open_type_settings"

  winner-rewards:
    slot: 41
    material: DIAMOND
    name: "{success}&lWINNER REWARDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%reward_winner_count%"
      - " {letters_black}▎ {muted}Given to the winner(s)"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "events:open_winner_rewards"

  participant-rewards:
    slot: 42
    material: COAL
    name: "{info}&lPARTICIPANT REWARDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%reward_participant_count%"
      - " {letters_black}▎ {muted}Given to all participants"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "events:open_participant_rewards"

  schedules:
    slot: 39
    material: CLOCK
    name: "{warning}&lSCHEDULES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Lines: {highlight}%schedule_count%"
      - " {letters_black}▎ {letters}Next: {info}%schedule_next%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "events:open_schedules"

  toggle:
    slot: 6
    material: "%toggle_material%"
    name: "%toggle_name%"
    lore:
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_config"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Go back to event list"
    actions:
      - "events:open_config_list"
