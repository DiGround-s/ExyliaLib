# How long the series is. Which lengths are offered is series.allowed-rounds
# in config.yml.

title: '{primary}&lROUNDS'
size: 27
type: PAGINATION
animation: 'center_out'

open_sounds:
  - 'ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.5'

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No series lengths are allowed'
    lore:
      - ''
      - '{muted}An admin sets series.allowed-rounds in config.yml.'
    hide_tooltip: false

items:
  back:
    slot: 18
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the bet'
    actions:
      - 'left: betcore:open_create'

  close:
    slot: 26
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - '{muted}Click to close'
    actions:
      - 'close'

pagination:
  slots: '11-15'

  item_template:
    material: PAPER
    amount: '%rounds%'
    name: '{primary}&lBEST OF %rounds%'
    lore:
      - ''
      - ' {muted}❙ {letters}First to {highlight}%rounds_to_win% {letters}takes the pot.'
      - ''
      - '{success}▶ Click to play this'
    actions:
      - 'left: betcore:set_rounds %rounds%'

  selected_template:
    material: MAP
    amount: '%rounds%'
    name: '{primary}&lBEST OF %rounds% {success}✔'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}First to {highlight}%rounds_to_win% {letters}takes the pot.'
      - ''
      - '{success}This is what you are playing.'
