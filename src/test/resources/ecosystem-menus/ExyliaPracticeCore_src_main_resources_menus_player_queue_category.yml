title: "{primary}&lPRACTICE&r&r {muted}— Choose Category"
size: 36
type: PAGINATION
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No categories available"
    lore:
      - ""
      - "{muted}No practice categories are enabled."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%category_icon%"
    name: "{primary}&l%category_name%"
    amount: "%game_count%"
    lore:
      - ""
      - " {muted}❙ {letters}Kits: {highlight}%kit_count%"
      - " {muted}❙ {letters}En cola: {highlight}%queue_count%"
      - " {muted}❙ {letters}Jugando: {highlight}%game_count%"
      - ""
      - "{success}» Click to browse kits"
    actions:
      - "practice:open_queue_kits %category_id%"

  navigation:
    previous:
      slot: 30
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'
