title: "{primary}&lFILTER BY EVENT"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: AIR
    hide_tooltip: true

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%filter_event_material%"
    name: "{primary}&l%filter_event_name%"
    lore:
      - ""
      - "{secondary}Details:"
      - " {letters_black}▎ {letters}Mode {letters_black}» {info}%filter_event_type%"
      - " {letters_black}▎ {letters}Points per win {letters_black}» {highlight}%filter_event_points%"
      - ""
      - "{warning}➥ Click to filter"
      - ""
    actions:
      - "capture:apply_lb_filter %filter_event_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {letters_black}» {info}%current_page%{letters_black}/%total_pages%"
        - ""
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {letters_black}» {info}%current_page%{letters_black}/%total_pages%"
        - ""
      actions:
        - 'next_page'

items:
  global-option:
    slot: 4
    material: NETHER_STAR
    name: "{primary}&lGLOBAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Clears the filter and combines"
      - " {letters_black}▎ {letters}{highlight}every event{letters}."
      - ""
      - "{warning}➥ Click to select"
      - ""
    actions:
      - "capture:apply_lb_filter global"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the ranking"
      - " {letters_black}▎ {letters}without changing the filter."
      - ""
      - "{warning}➥ Click to go back"
    actions:
      - "capture:return_from_lb_filter"
