# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lAFK ZONE: %zone_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  region:
    slot: 2
    material: "%region_material%"
    name: "{highlight}&lZONE REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Area players must stand in to earn rewards"
      - ""
      - "{info}» Click to select"
    actions:
      - "survivalcore:afkzone_set_region"

  name:
    slot: 4
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%zone_name%"
      - ""
      - " {muted}❙ {letters}Shown in title and bossbar"
      - ""
      - "{info}» Click to set"
    actions:
      - "survivalcore:afkzone_edit_name"

  interval:
    slot: 6
    material: CLOCK
    name: "{highlight}&lREWARD INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%interval_value%s"
      - ""
      - " {muted}❙ {letters}Seconds between reward grants"
      - ""
      - "{info}» Click to set"
    actions:
      - "survivalcore:afkzone_set_interval"

  enabled:
    slot: 20
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - ""
      - " {muted}❙ {letters}Toggle zone on or off"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:afkzone_toggle_enabled"

  rewards:
    slot: 24
    material: CHEST
    name: "{highlight}&lREWARDS"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%rewards_count%"
      - ""
      - " {muted}❙ {letters}Commands, items & messages granted"
      - " {muted}❙ {letters}with chance, condition & permission"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:afkzone_open_rewards"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to zone list"
    actions:
      - "survivalcore:afkzone_open_list"

  delete:
    slot: 47
    material: BARRIER
    name: "{error}&lDELETE ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this AFK zone"
      - ""
      - "{error}» Click to delete"
    actions:
      - "survivalcore:afkzone_delete %zone_id%"
