title: "{primary}&lSELECT SPAWN {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No spawns available"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%spawn_icon%"
    name: "{warning}&l%spawn_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Nearby players: {highlight}%spawn_players%"
      - " {muted}❙ {letters}Status: %spawn_locked%"
      - ""
      - "{success}▶ Click to spawn here"
    actions:
      - "ffa:select_spawn %arena_id% %spawn_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'
