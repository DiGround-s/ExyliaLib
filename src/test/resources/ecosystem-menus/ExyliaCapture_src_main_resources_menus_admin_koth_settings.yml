title: "{primary}&lKOTH SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  capture-time:
    slot: 2
    material: CLOCK
    name: "{info}&lCAPTURE TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%capture_time%"
      - " {letters_black}▎ {letters}Time to hold zone to win"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting_millis capture-time 5"
      - "right: capture:adjust_setting_millis capture-time -5"
      - "shift_left: capture:input_setting_millis capture-time"

  infinite:
    slot: 3
    material: "%infinite_material%"
    name: "%infinite_color%&lINFINITE MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%infinite_status%"
      - " {letters_black}▎ {letters}Auto-reset zone after each capture"
      - " {letters_black}▎ {letters}Event ends only by timeout or force-stop"
      - ""
      - " {letters_black}▎ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting infinite"

  glow-enabled:
    slot: 5
    material: "%glow_enabled_material%"
    name: "%glow_enabled_color%&lGLOW EFFECT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%glow_enabled_status%"
      - " {letters_black}▎ {letters}Capturer glows near capture end"
      - ""
      - " {letters_black}▎ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting glow-enabled"

  glow-last-millis:
    slot: 6
    material: GLOWSTONE_DUST
    name: "{info}&lGLOW THRESHOLD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%glow_last_seconds%"
      - " {letters_black}▎ {letters}Time before end to start glow"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting_millis glow-last-millis 1"
      - "right: capture:adjust_setting_millis glow-last-millis -1"
      - "shift_left: capture:input_setting_millis glow-last-millis"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
