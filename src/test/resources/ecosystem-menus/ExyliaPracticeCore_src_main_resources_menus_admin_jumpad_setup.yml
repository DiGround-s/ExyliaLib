# ╔══════════════════════════════════════════════════════════════════╗
# ║  !! WARNING !! - DO NOT EDIT THIS FILE MANUALLY                  ║
# ║  This file is AUTOMATICALLY REGENERATED on every plugin startup. ║
# ║  Any changes made here WILL BE LOST.                             ║
# ╚══════════════════════════════════════════════════════════════════╝

title: "{primary}&lJUMPAD: %jumpad_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:jumpad_edit_name"

  direction:
    slot: 4
    material: COMPASS
    name: "{highlight}&lLAUNCH DIRECTION"
    lore:
      - ""
      - " {muted}❙ {letters}Direction: {highlight}%yaw%"
      - ""
      - " {muted}❙ {letters}Look toward where players should"
      - " {muted}❙ {letters}be launched, then SHIFT+LEFT-CLICK"
      - ""
      - "{info}» Click to set via wizard"
    actions:
      - "practice:jumpad_set_yaw"

  power:
    slot: 21
    material: SLIME_BALL
    name: "{highlight}&lHORIZONTAL POWER"
    lore:
      - ""
      - " {muted}❙ {letters}Power: {highlight}%power%"
      - ""
      - " {muted}❙ {letters}Controls horizontal launch speed"
      - ""
      - " {muted}❙ {success}Left +0.1 {muted}| {error}Right -0.1"
      - " {muted}❙ {success}Shift-Left +0.5 {muted}| {error}Shift-Right -0.5"
    actions:
      - "left: practice:jumpad_adjust_power 0.1"
      - "right: practice:jumpad_adjust_power -0.1"
      - "shift_left: practice:jumpad_adjust_power 0.5"
      - "shift_right: practice:jumpad_adjust_power -0.5"

  vertical-power:
    slot: 22
    material: FEATHER
    name: "{highlight}&lVERTICAL POWER"
    lore:
      - ""
      - " {muted}❙ {letters}Power: {highlight}%vertical_power%"
      - ""
      - " {muted}❙ {letters}Controls vertical launch height"
      - ""
      - " {muted}❙ {success}Left +0.1 {muted}| {error}Right -0.1"
      - " {muted}❙ {success}Shift-Left +0.5 {muted}| {error}Shift-Right -0.5"
    actions:
      - "left: practice:jumpad_adjust_vertical 0.1"
      - "right: practice:jumpad_adjust_vertical -0.1"
      - "shift_left: practice:jumpad_adjust_vertical 0.5"
      - "shift_right: practice:jumpad_adjust_vertical -0.5"

  enabled:
    slot: 6
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - ""
      - " {muted}❙ {letters}Disable to deactivate this jumpad"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:jumpad_toggle_enabled"

  locations:
    slot: 20
    material: LODESTONE
    name: "{highlight}&lTRIGGER LOCATIONS"
    lore:
      - ""
      - " {muted}❙ {letters}Locations: {highlight}%locations_count%"
      - ""
      - " {muted}❙ {letters}Block positions that launch players"
      - " {muted}❙ {letters}when stepped on"
      - ""
      - "{info}» Click to manage"
    actions:
      - "practice:jumpad_open_locations"

  delete:
    slot: 49
    material: BARRIER
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this jumpad"
      - ""
      - "{error}» Click to delete"
    actions:
      - "practice:jumpad_confirm_delete %jumpad_id%"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to jumpad list"
    actions:
      - "practice:jumpad_open_list"
