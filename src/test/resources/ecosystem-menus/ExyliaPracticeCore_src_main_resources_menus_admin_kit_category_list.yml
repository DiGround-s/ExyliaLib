title: "{primary}&lKIT CATEGORIES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No categories"
    lore:
      - ""
      - "{muted}Create your first kit category!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%category_icon%"
    name: "{warning}&l%category_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%category_id%"
      - " {muted}❙ {letters}Enabled: %category_enabled%"
      - " {muted}❙ {letters}Priority: {highlight}%category_priority%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: practice:edit_kit_category %category_id%"
      - "right: practice:confirm_delete_kit_category %category_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE CATEGORY"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new kit category"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:create_kit_category"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to kit hub"
    actions:
      - "practice:open_kit_hub"
