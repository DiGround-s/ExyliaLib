title: "{primary}&lKITS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No kits available"
    lore:
      - ""
      - " {muted}Ask an administrator to create kits."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "%kit_icon%"
    name: "{highlight}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}%kit_description%"
      - ""
      - " {muted}❙ {letters}Cooldown: {highlight}%kit_cooldown%"
      - " {muted}❙ {letters}Uses left: {highlight}%kit_uses%"
      - ""
      - " {success}● {info}Left-click to claim"
      - " {info}● {info}Right-click to preview"
    actions:
      - "left: survivalcore:kit_claim %kit_id%"
      - "right: survivalcore:kit_preview %kit_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
