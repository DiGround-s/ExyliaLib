title: "{warning}&lCHAIRS SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  music-duration-min:
    slot: 19
    material: NOTE_BLOCK
    name: "{info}&lMUSIC MIN DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%music_duration_min%s"
      - ""
      - " {letters_black}▎ {letters}Minimum seconds the music"
      - " {letters_black}▎ {letters}plays before rush starts"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting music-duration-min 1"
      - "right: events:adjust_setting music-duration-min -1"
      - "shift_left: events:input_setting music-duration-min"

  music-duration-max:
    slot: 20
    material: JUKEBOX
    name: "{info}&lMUSIC MAX DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%music_duration_max%s"
      - ""
      - " {letters_black}▎ {letters}Maximum seconds the music"
      - " {letters_black}▎ {letters}can play before rush starts"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting music-duration-max 1"
      - "right: events:adjust_setting music-duration-max -1"
      - "shift_left: events:input_setting music-duration-max"

  rush-duration:
    slot: 21
    material: FIREWORK_ROCKET
    name: "{error}&lRUSH DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%rush_duration%s"
      - ""
      - " {letters_black}▎ {letters}Seconds players have"
      - " {letters_black}▎ {letters}to find a chair"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting rush-duration 1"
      - "right: events:adjust_setting rush-duration -1"
      - "shift_left: events:input_setting rush-duration"

  round-pause:
    slot: 22
    material: CLOCK
    name: "{info}&lROUND PAUSE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%round_pause%s"
      - ""
      - " {letters_black}▎ {letters}Seconds between elimination"
      - " {letters_black}▎ {letters}and the next round"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-pause 1"
      - "right: events:adjust_setting round-pause -1"
      - "shift_left: events:input_setting round-pause"

  chair-percentage:
    slot: 23
    material: GLOWSTONE_DUST
    name: "{warning}&lCHAIR PERCENTAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%chair_percentage%%"
      - ""
      - " {letters_black}▎ {letters}% of players that get"
      - " {letters_black}▎ {letters}a chair each round"
      - ""
      - " {letters_black}▎ {success}Left-Click +5%"
      - " {letters_black}▎ {error}Right-Click -5%"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting chair-percentage 5"
      - "right: events:adjust_setting chair-percentage -5"
      - "shift_left: events:input_setting chair-percentage"

  pvp-round:
    slot: 24
    material: DIAMOND_SWORD
    name: "{error}&lPVP ROUND"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%pvp_round%"
      - ""
      - " {letters_black}▎ {letters}Round at which PVP activates"
      - " {letters_black}▎ {letters}Set to 0 to disable PVP"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting pvp-round 1"
      - "right: events:adjust_setting pvp-round -1"
      - "shift_left: events:input_setting pvp-round"

  chair-color:
    slot: 25
    material: RED_WOOL
    name: "{warning}&lCHAIR COLOR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%chair_color%"
      - ""
      - " {letters_black}▎ {letters}Wool color of the chair sheep"
      - ""
      - "{warning}➥ Click to enter"
    actions:
      - "events:input_setting chair-color"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
