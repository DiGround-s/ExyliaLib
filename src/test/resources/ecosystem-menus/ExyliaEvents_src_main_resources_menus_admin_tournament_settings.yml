title: "{primary}&lTOURNAMENT SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  match-duration:
    slot: 19
    material: CLOCK
    name: "{info}&lMATCH DURATION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%match_duration%s"
      - " {muted}❙ {letters}Max time per match"
      - ""
      - " {muted}❙ {success}Left-Click +15s"
      - " {muted}❙ {error}Right-Click -15s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-duration 15"
      - "right: events:adjust_setting match-duration -15"
      - "shift_left: events:input_setting match-duration"

  match-intro-delay:
    slot: 20
    material: SPYGLASS
    name: "{info}&lMATCH INTRO"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%match_intro_delay%s"
      - " {muted}❙ {letters}Presentation time before fighting"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
