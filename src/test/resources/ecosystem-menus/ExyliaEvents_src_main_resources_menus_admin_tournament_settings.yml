title: "{primary}&lTOURNAMENT SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  match-duration:
    slot: 1
    material: CLOCK
    name: "{info}&lMATCH DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%match_duration%s"
      - " {letters_black}▎ {letters}Max time per match"
      - ""
      - " {letters_black}▎ {success}Left-Click +15s"
      - " {letters_black}▎ {error}Right-Click -15s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-duration 15"
      - "right: events:adjust_setting match-duration -15"
      - "shift_left: events:input_setting match-duration"

  match-intro-delay:
    slot: 2
    material: SPYGLASS
    name: "{info}&lMATCH INTRO"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%match_intro_delay%s"
      - " {letters_black}▎ {letters}Presentation time before fighting"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-intro-delay 1"
      - "right: events:adjust_setting match-intro-delay -1"
      - "shift_left: events:input_setting match-intro-delay"

  match-end-delay:
    slot: 3
    material: ENDER_EYE
    name: "{info}&lPOST-MATCH DELAY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%match_end_delay%s"
      - " {letters_black}▎ {letters}Pause after each match"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-end-delay 1"
      - "right: events:adjust_setting match-end-delay -1"
      - "shift_left: events:input_setting match-end-delay"

  round-delay:
    slot: 4
    material: CLOCK
    name: "{info}&lROUND PAUSE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%round_delay%s"
      - " {letters_black}▎ {letters}Wait between tournament rounds"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-delay 1"
      - "right: events:adjust_setting round-delay -1"
      - "shift_left: events:input_setting round-delay"

  heal-between-matches:
    slot: 5
    material: "%heal_between_matches_material%"
    name: "%heal_between_matches_color%&lHEAL BETWEEN MATCHES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %heal_between_matches%"
      - " {letters_black}▎ {letters}Restore full health between rounds"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_tournament_setting heal-between-matches"

  disable-hit-damage:
    slot: 6
    material: "%disable_hit_damage_material%"
    name: "%disable_hit_damage_color%&lDISABLE HIT DAMAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %disable_hit_damage%"
      - " {letters_black}▎ {letters}Hits deal 0 damage (matches end by time)"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_tournament_setting disable-hit-damage"

  disable-food-drop:
    slot: 7
    material: "%disable_food_drop_material%"
    name: "%disable_food_drop_color%&lDISABLE FOOD DROP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %disable_food_drop%"
      - " {letters_black}▎ {letters}Food level never drops"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_tournament_setting disable-food-drop"

  spectator-mode:
    slot: 12
    material: "%spectator_mode_material%"
    name: "{info}&lSPECTATOR MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%spectator_mode%"
      - " {letters_black}▎ {letters}Mode for alive players awaiting their match"
      - " {letters_black}▎ SPECTATOR {warning}➥ invisible, fly, no interaction"
      - " {letters_black}▎ ADVENTURE {warning}➥ visible, can walk around"
      - ""
      - "{warning}➥ Click to cycle"
    actions:
      - "events:cycle_tournament_spectator_mode"

  freeze-time:
    slot: 13
    material: ICE
    name: "{info}&lFREEZE TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%freeze_time%s"
      - " {letters_black}▎ {letters}Seconds players can't move or act at match start"
      - " {letters_black}▎ {letters}Set to 0 to disable"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting freeze-time 1"
      - "right: events:adjust_setting freeze-time -1"
      - "shift_left: events:input_setting freeze-time"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
