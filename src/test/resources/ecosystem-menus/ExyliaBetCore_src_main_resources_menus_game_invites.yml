# Challenges waiting on you, and the one you sent.

title: '{primary}&lCHALLENGES {muted}%challenge_count% waiting'
size: 45
type: MULTI_PAGINATION
animation: 'center_out'

open_sounds:
  - 'ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.5'

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  header:
    slot: 4
    material: PAPER
    amount: '%challenge_count%'
    glow: '%has_challenges%'
    name: '{primary}&lWAITING ON YOU'
    lore:
      - ''
      - ' {muted}❙ {letters}Offered to you: {highlight}%challenge_count%'
      - ''
      - ' {muted}❙ {letters}A challenge expires on its own.'

  sent:
    slot: 22
    material: FEATHER
    name: '{secondary}&lSENT BY YOU'
    lore:
      - ''
      - ' {muted}❙ {letters}Waiting on them: {info}%outgoing_count%'
      - ''
      - ' {muted}❙ {letters}You can only have one out at a time.'

  back:
    slot: 36
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the game list'
    actions:
      - 'left: betcore:open_main'

  close:
    slot: 44
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  # Bets somebody has offered you by name.
  incoming:
    slots: '10-16'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}Nobody has challenged you'
      lore:
        - ''
        - '{muted}Bets sent to you by name show up here.'
    item_template:
      material: 'playerhead-%player_name%'
      name: '{primary}&l%player_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}Game: {info}%game_name%'
        - ' {muted}❙ {letters}Mode: {info}%mode_name%'
        - ' {muted}❙ {letters}Stake: {highlight}%wager%'
        - ' {muted}❙ {letters}Rounds: {info}Best of %rounds%'
        - ''
        - '{success}▶ Left-click to accept'
        - '{error}▶ Right-click to refuse'
      actions:
        - 'left: betcore:invite_accept'
        - 'right: betcore:invite_decline'
    rematch_template:
      material: 'playerhead-%player_name%'
      name: '{highlight}&l%player_name% {muted}— rematch'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}The same bet as last time.'
        - ' {muted}❙ {letters}Stake: {highlight}%wager%'
        - ''
        - '{success}▶ Left-click to accept'
        - '{error}▶ Right-click to refuse'
      actions:
        - 'left: betcore:invite_accept'
        - 'right: betcore:invite_decline'
    navigation:
      previous:
        slot: 9
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
        lore:
          - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'previous_page incoming'
      next:
        slot: 17
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
        lore:
          - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'next_page incoming'

  # The one you sent.
  outgoing:
    slots: '28-34'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}You have not sent a challenge'
      lore:
        - ''
        - '{muted}Use {highlight}/bet challenge <player>{muted}.'
    item_template:
      material: 'playerhead-%player_name%'
      name: '{muted}&lWAITING ON {letters}&l%player_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}Stake: {highlight}%wager%'
        - ' {muted}❙ {letters}Rounds: {info}Best of %rounds%'
        - ''
        - ' {muted}❙ {letters}It expires on its own.'
    rematch_template:
      material: 'playerhead-%player_name%'
      name: '{muted}&lREMATCH OFFERED TO {letters}&l%player_name%'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Stake: {highlight}%wager%'
