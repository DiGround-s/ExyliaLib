      - "{info}» Click to toggle"
    actions:
      - "events:toggle_tnttag_setting glow-effect"

  normal-speed:
    slot: 23
    material: SUGAR
    name: "{info}&lNORMAL SPEED"
    lore:
      - ""
      - " {muted}❙ {letters}Level: {highlight}%normal_speed%"
      - ""
      - " {muted}❙ {letters}Speed level for"
      - " {muted}❙ {letters}players without TNT"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
    actions:
      - "left: events:adjust_setting normal-player-speed 1"
      - "right: events:adjust_setting normal-player-speed -1"

  tnt-speed:
    slot: 24
    material: BLAZE_POWDER
    name: "{info}&lTNT SPEED"
    lore:
      - ""
      - " {muted}❙ {letters}Level: {highlight}%tnt_speed%"
      - ""
      - " {muted}❙ {letters}Speed level for"
      - " {muted}❙ {letters}players with TNT"
