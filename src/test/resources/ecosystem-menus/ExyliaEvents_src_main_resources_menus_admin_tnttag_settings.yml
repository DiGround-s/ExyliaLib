      - " {muted}❙ {letters}and the next round"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-pause 1"
      - "right: events:adjust_setting round-pause -1"
