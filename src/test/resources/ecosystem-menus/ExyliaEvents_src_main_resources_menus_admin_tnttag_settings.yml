title: "{primary}&lTNT TAG SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  round-duration:
    slot: 19
    material: TNT
    name: "{warning}&lROUND DURATION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%round_duration%s"
      - ""
      - " {muted}❙ {letters}Time before exploding"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-duration 5"
      - "right: events:adjust_setting round-duration -5"
      - "shift_left: events:input_setting round-duration"

  tagged-percentage:
    slot: 20
    material: GLOWSTONE_DUST
    name: "{warning}&lTNT PERCENTAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%tagged_percentage%%"
      - ""
      - " {muted}❙ {letters}% of players with TNT"
      - " {muted}❙ {letters}at the start of each round"
      - ""
      - " {muted}❙ {success}Left-Click +5%"
      - " {muted}❙ {error}Right-Click -5%"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting tagged-percentage 5"
      - "right: events:adjust_setting tagged-percentage -5"
      - "shift_left: events:input_setting tagged-percentage"

  transfer-cooldown:
    slot: 21
    material: HOPPER
    name: "{info}&lTRANSFER COOLDOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%transfer_cooldown%s"
      - ""
      - " {muted}❙ {letters}Cooldown between each"
      - " {muted}❙ {letters}TNT transfer"
      - ""
      - "{info}» Click to enter"
    actions:
      - "events:input_double_setting transfer-cooldown"

  glow-effect:
    slot: 22
    material: "%glow_effect_material%"
    name: "{info}&lGLOW EFFECT"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %glow_effect%"
      - ""
      - " {muted}❙ {letters}TNT players glow"
