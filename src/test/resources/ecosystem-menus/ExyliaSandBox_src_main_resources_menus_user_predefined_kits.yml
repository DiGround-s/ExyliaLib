title: "{primary}&lPREDEFINED KITS {muted}· {highlight}%total_kits%"
size: 54
type: PAGINATION
refresh:
  mode: ON_CLICK
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '9-44'

  item_template:
    material: "%pk_icon%"
    name: "{letters}&l%pk_name%"
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}%pk_description%'
      - ' {muted}❙ {letters}Items: {highlight}%pk_items%'
      - ''
      - '{info}» Click to copy it to a slot'
    actions:
      - "sandbox:predefined_kit_select %pk_id%"

  navigation:
