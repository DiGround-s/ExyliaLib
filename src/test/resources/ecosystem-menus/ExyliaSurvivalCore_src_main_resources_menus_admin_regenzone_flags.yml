# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lFLAGS {muted}— %zone_id% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '0-35'

  item_template:
    material: "%flag_material%"
    name: "{highlight}&l%flag_label%"
    lore:
      - ""
      - " {muted}❙ {letters}%flag_description%"
      - ""
      - " {muted}❙ {letters}State: %flag_state%"
      - ""
      - "{info}» Click to cycle ALLOW / DENY / DEFAULT"
    actions:
      - "survivalcore:regenzone_flag_cycle %flag_key%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - "next_page"

items:
  allowed-blocks:
    slot: 47
    material: WRITABLE_BOOK
    name: "{highlight}&lALLOWED BLOCKS LIST"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%allowed_blocks_count% {letters}material(s)"
      - ""
      - " {muted}❙ {letters}Used by the {highlight}allowed_blocks_only"
      - " {muted}❙ {letters}flag above"
      - ""
      - "{info}» Click to add one block"
      - "{error}» Shift-click to clear all"
    actions:
      - "left: survivalcore:regenzone_set_allowed_blocks"
      - "shift_left: survivalcore:regenzone_clear_allowed_blocks"

  temp-blocks-seconds:
    slot: 51
    material: SAND
    name: "{highlight}&lTEMP BLOCKS SECONDS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%temp_blocks_seconds%s"
      - ""
      - " {muted}❙ {letters}Used by the {highlight}temporary_blocks"
      - " {muted}❙ {letters}flag above"
      - ""
      - "{info}» Click to set"
    actions:
      - "survivalcore:regenzone_set_temp_blocks_seconds"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {info}» Return to zone setup"
    actions:
      - "survivalcore:regenzone_back_to_setup"
