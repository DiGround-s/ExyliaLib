title: "{primary}&lFARMING STATS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 40

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: GRAY_STAINED_GLASS_PANE
    name: "{muted}No farming categories configured"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%cat_icon%"
    name: "%cat_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Type: {highlight}%cat_type%"
      - " {muted}❙ {letters}Farmed: {highlight}%cat_count%"
      - " {muted}❙ {letters}Level: {success}%cat_level% {muted}/ {highlight}%cat_max_level%"
      - ""
      - " {muted}❙ {letters}Next: {highlight}%cat_next_milestone%"
      - " {muted}❙ {letters}Progress: %cat_next_count%"
      - " {muted}  %cat_progress_bar%"
      - ""
      - "%cat_milestone_1%"
      - "%cat_milestone_2%"
      - "%cat_milestone_3%"
      - ""

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  info:
    slot: 4
    material: GOLDEN_HOE
    name: "{highlight}⚒ Your Farming Progress"
    lore:
      - ""
      - " {muted}❙ {letters}Total farmed: {highlight}%total_farmed%"
      - " {muted}❙ {letters}Active categories: {highlight}%total_categories%"
      - ""
      - " {muted}❙ {letters}Break blocks or kill mobs"
      - " {muted}  {letters}to earn rewards and unlock"
      - " {muted}  {letters}milestones!"
      - ""

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    lore:
      - ""
      - "{info}» Click to close"
    actions:
      - "survivalcore:close_menu"
