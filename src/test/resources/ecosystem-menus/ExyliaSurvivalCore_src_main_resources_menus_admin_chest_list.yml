title: "{primary}&lLOOT CHESTS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No chests found"
    lore:
      - ""
      - "{muted}Place chests using the admin wand!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%chest_material%"
    name: "{highlight}&l%chest_template%"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %chest_enabled%"
      - " {muted}❙ {letters}Location: {highlight}%chest_location%"
      - " {muted}❙ {letters}Cooldown: {highlight}%chest_cooldown%"
      - " {muted}❙ {letters}Mode: %chest_dispersed%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {warning}Middle-Click to teleport"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:lc_edit_chest %chest_id%"
      - "middle: survivalcore:lc_teleport_chest %chest_id%"
      - "right: survivalcore:lc_delete_chest %chest_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to template list"
    actions:
      - "survivalcore:lc_open_template_list"
