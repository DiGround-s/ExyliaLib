title: "{primary}&lPLAYERS {muted}· {highlight}%world_display_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No players in this world"
    lore:
      - ""
      - "{muted}The world is empty"
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: PLAYER_HEAD
    name: "{highlight}&l%player_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}Gamemode: {info}%player_gamemode%"
      - " {letters_black}▎ {letters}Health: {info}%player_health%{muted}/{info}%player_max_health%"
      - " {letters_black}▎ {letters}Level: {info}%player_level%"
      - " {letters_black}▎ {letters}Position: {info}%player_x%{muted}, {info}%player_y%{muted}, {info}%player_z%"
      - ""
      - "{warning}➥ Click to teleport"
    actions:
      - "sandbox:admin_tp_to_player %player_name%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  info:
    slot: 45
    material: PLAYER_HEAD
    name: "{highlight}&lWORLD PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}World: {info}%world_display_name%"
      - " {letters_black}▎ {letters}Online: {info}%world_player_count% players"
      - ""
      - "{muted}Click a player to teleport"
    hide_tooltip: false

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to world config"
    actions:
      - "sandbox:open_world_config_from_settings"
