title: "{primary}&lFFA {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay arenas FFA disponibles"
    lore:
      - ""
      - "{muted}Vuelve mas tarde"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%arena_icon%"
    name: "{warning}&l%arena_name%"
    amount: "%arena_total%"
    lore:
      - ""
      - " {muted}❙ {letters}Combatiendo: {highlight}%arena_players%{muted}/{letters}%arena_max%"
      - " {muted}❙ {letters}Jugadores totales: {highlight}%arena_total%"
      - ""
      - "{success}▶ Haz clic para unirte"
    actions:
      - "ffa:join_ffa %arena_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PAGINA ANTERIOR'
      lore:
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lSIGUIENTE PAGINA →'
      lore:
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  kit_editor:
    slot: 35
    material: CHEST
    name: "{primary}&lEDITOR DE KITS"
    lore:
      - ""
      - " {muted}❙ {letters}Personaliza tus kits"
      - ""
      - "{success}▶ Haz clic para abrir"
    actions:
      - "ffa:open_kit_editor"
