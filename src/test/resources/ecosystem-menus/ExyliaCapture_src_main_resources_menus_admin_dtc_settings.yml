title: "{error}&lDTC SETTINGS"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  block-location:
    slot: 11
    material: "%block_material%"
    name: "{info}&lCORE BLOCK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: {highlight}%block_status%"
      - " {letters_black}▎ {letters}The block players must destroy"
      - ""
      - " {success}➥ Click to set"
    actions:
      - "capture:set_dtc_block"

  target-points:
    slot: 14
    material: NETHER_STAR
    name: "{warning}&lTARGET POINTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%target_points% pts"
      - " {letters_black}▎ {letters}Points required to win"
      - ""
      - " {letters_black}▎ {success}Left-Click +5"
      - " {letters_black}▎ {error}Right-Click -5"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting target-points 5"
      - "right: capture:adjust_setting target-points -5"
      - "shift_left: capture:input_setting target-points"

  points-per-break:
    slot: 15
    material: EXPERIENCE_BOTTLE
    name: "{success}&lPOINTS PER BREAK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%points_per_break% pts"
      - " {letters_black}▎ {letters}Points awarded per block break"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting points-per-break 1"
      - "right: capture:adjust_setting points-per-break -1"
      - "shift_left: capture:input_setting points-per-break"

  regen-time:
    slot: 12
    material: CLOCK
    name: "{info}&lREGEN TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%regen_time%"
      - " {letters_black}▎ {letters}Time for core block to regenerate"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting_millis regen-time 1"
      - "right: capture:adjust_setting_millis regen-time -1"
      - "shift_left: capture:input_setting_millis regen-time"

  broadcast-every:
    slot: 22
    material: BELL
    name: "{info}&lBROADCAST EVERY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}every %broadcast_every% breaks"
      - " {letters_black}▎ {letters}Broadcast message every N breaks"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting broadcast-every 1"
      - "right: capture:adjust_setting broadcast-every -1"
      - "shift_left: capture:input_setting broadcast-every"

  clan-mode:
    slot: 23
    material: "%clan_mode_material%"
    name: "%clan_mode_color%&lCLAN MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%clan_mode_status%"
      - " {letters_black}▎ {letters}Points are attributed to clans"
      - ""
      - " {letters_black}▎ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting clan-mode"

  back:
    slot: 31
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
