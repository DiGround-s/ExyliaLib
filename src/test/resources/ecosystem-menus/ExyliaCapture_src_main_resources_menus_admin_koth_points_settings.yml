title: "{primary}&lKOTH POINTS SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  target-points:
    slot: 3
    material: GOLD_INGOT
    name: "{info}&lTARGET POINTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%target_points%"
      - " {letters_black}▎ {letters}Points needed to win"
      - ""
      - " {letters_black}▎ {success}Left-Click +10"
      - " {letters_black}▎ {error}Right-Click -10"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting target-points 10"
      - "right: capture:adjust_setting target-points -10"
      - "shift_left: capture:input_setting target-points"

  points-per-second:
    slot: 4
    material: EXPERIENCE_BOTTLE
    name: "{info}&lPOINTS PER SECOND"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%points_per_second%"
      - " {letters_black}▎ {letters}Points earned each second"
      - " {letters_black}▎ {letters}while holding the zone"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting points-per-second 1"
      - "right: capture:adjust_setting points-per-second -1"
      - "shift_left: capture:input_setting points-per-second"

  clan-mode:
    slot: 6
    material: "%clan_mode_material%"
    name: "%clan_mode_color%&lCLAN MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%clan_mode_status%"
      - " {letters_black}▎ {letters}Points accumulate per clan"
      - " {letters_black}▎ {letters}Leaderboard shows clans"
      - ""
      - " {letters_black}▎ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting clan-mode"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
