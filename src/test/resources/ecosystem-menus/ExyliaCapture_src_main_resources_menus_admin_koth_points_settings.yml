title: "{primary}&lKOTH POINTS SETTINGS"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  target-points:
    slot: 11
    material: GOLD_INGOT
    name: "{info}&lTARGET POINTS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%target_points%"
      - " {muted}❙ {letters}Points needed to win"
      - ""
      - " {muted}❙ {success}Left-Click +10"
      - " {muted}❙ {error}Right-Click -10"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting target-points 10"
      - "right: capture:adjust_setting target-points -10"
      - "shift_left: capture:input_setting target-points"

  points-per-second:
    slot: 13
    material: EXPERIENCE_BOTTLE
    name: "{info}&lPOINTS PER SECOND"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%points_per_second%"
      - " {muted}❙ {letters}Points earned each second"
      - " {muted}❙ {letters}while holding the zone"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting points-per-second 1"
      - "right: capture:adjust_setting points-per-second -1"
      - "shift_left: capture:input_setting points-per-second"

  clan-mode:
    slot: 15
    material: "%clan_mode_material%"
    name: "{warning}&lCLAN MODE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%clan_mode_status%"
      - " {muted}❙ {letters}Points accumulate per clan"
      - " {muted}❙ {letters}Leaderboard shows clans"
      - ""
      - " {muted}❙ {success}Click to toggle"
    actions:
      - "capture:toggle_boolean_setting clan-mode"

  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
