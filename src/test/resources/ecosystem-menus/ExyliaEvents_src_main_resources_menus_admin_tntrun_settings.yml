      - " {letters_black}▎ {letters}Cooldown between double jumps"
      - ""
      - "{warning}➥ Click to enter"
    actions:
      - "events:input_double_setting double-jump-cooldown"

  double-jump-limit:
    slot: 22
    material: RABBIT_FOOT
    name: "{warning}&lDOUBLE JUMP LIMIT"
    lore:
