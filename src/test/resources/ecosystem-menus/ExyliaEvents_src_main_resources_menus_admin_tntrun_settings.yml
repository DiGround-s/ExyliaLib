title: "{primary}&lTNT RUN SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Any block placed directly"
      - " {letters_black}▎ {letters}above a {highlight}TNT block"
      - " {letters_black}▎ {letters}becomes removable floor"
      - ""
      - " {letters_black}▎ {letters}Both the floor block and the"
      - " {letters_black}▎ {letters}TNT below it disappear after"
      - " {letters_black}▎ {letters}being stepped on"
      - ""
      - " {letters_black}▎ {error}Touching water eliminates"
      - " {letters_black}▎ {error}a player instantly"

  block-break-delay:
    slot: 19
    material: TNT
    name: "{warning}&lBLOCK BREAK DELAY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%block_break_delay% ticks"
      - ""
      - " {letters_black}▎ {letters}Delay before the block"
      - " {letters_black}▎ {letters}disappears after being stepped on"
      - ""
      - " {letters_black}▎ {success}Left-Click +2"
      - " {letters_black}▎ {error}Right-Click -2"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting block-break-delay 2"
      - "right: events:adjust_setting block-break-delay -2"
      - "shift_left: events:input_setting block-break-delay"

  grace-period:
    slot: 20
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - " {letters_black}▎ {letters}Blocks don't break at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  double-jump-cooldown:
    slot: 21
    material: FEATHER
    name: "{info}&lDOUBLE JUMP COOLDOWN"
    lore:
