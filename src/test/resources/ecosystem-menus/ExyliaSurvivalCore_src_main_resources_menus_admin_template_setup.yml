# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lTEMPLATE {muted}— {highlight}%template_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%template_name%"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:lc_edit_template_name"

  loot:
    slot: 37
    material: CHEST
    name: "{highlight}&lLOOT TABLE"
    lore:
      - ""
      - " {muted}❙ {letters}Items that can appear in chests"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:lc_open_loot"

  chests:
    slot: 38
    material: ENDER_CHEST
    name: "{highlight}&lPLACED CHESTS"
    lore:
      - ""
      - " {muted}❙ {letters}Chests linked to this template"
      - ""
      - "{info}» Click to view"
    actions:
      - "survivalcore:lc_open_template_chests"

  place:
    slot: 39
    material: BLAZE_ROD
    name: "{warning}&l⚡ PLACE CHEST"
    lore:
      - ""
      - " {muted}❙ {letters}You will be asked to configure:"
      - " {muted}❙ {success}Cooldown {muted}— reset time in seconds"
      - ""
      - " {muted}❙ {letters}The wand remembers the config."
      - " {muted}❙ {letters}Right-click chests to place them."
      - " {muted}❙ {letters}Left-click to delete."
      - ""
      - "{info}» Click to get wand"
    actions:
      - "survivalcore:lc_give_wand"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE TEMPLATE"
    lore:
      - ""
      - " {error}» Deletes template and all its entries"
      - " {error}» Placed chests remain but will be empty"
      - ""
      - " {error}» Click to permanently delete"
    actions:
      - "survivalcore:lc_delete_template %template_id%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {info}» Return to template list"
    actions:
      - "survivalcore:lc_open_template_list"
