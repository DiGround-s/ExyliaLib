title: "{primary}&lPRACTICE ARENAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No arenas"
    lore:
      - ""
      - "{muted}Create your first practice arena!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%arena_icon%"
    name: "{warning}&l%arena_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%arena_id%"
      - " {muted}❙ {letters}Enabled: %arena_enabled%"
      - " {muted}❙ {letters}Instances: {highlight}%arena_instances%"
      - " {muted}❙ {letters}Available: {highlight}%arena_available%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: practice:edit_arena %arena_id%"
      - "right: practice:confirm_delete_arena %arena_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE ARENA"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new practice arena"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:create_arena"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to admin panel"
    actions:
      - "practice:open_admin"
