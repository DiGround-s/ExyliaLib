title: "{primary}&lCLAN BANK {muted}· {highlight}%clan_name%"
size: 27
type: SIMPLE
animation: "center_out"
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  balance:
    slot: 4
    material: GOLD_BLOCK
    name: "{highlight}&lCLAN BANK"
    lore:
      - ""
      - " {muted}❙ {letters}Balance: {success}%balance%"
      - ""

  deposit:
    slot: 11
    material: LIME_WOOL
    name: "{success}&lDEPOSIT"
    lore:
      - ""
      - " {muted}❙ {letters}Transfer your money"
      - " {muted}❙ {letters}into the clan bank."
      - ""
      - "{info}» Click to deposit"
    actions:
      - "exyliaclans:deposit_input"

  withdraw:
    slot: 15
    material: RED_WOOL
    name: "{error}&lWITHDRAW"
    lore:
      - ""
      - " {muted}❙ {letters}Withdraw money from"
      - " {muted}❙ {letters}the clan bank."
      - ""
      - "{info}» Click to withdraw"
    actions:
      - "exyliaclans:withdraw_input"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Click to go back'
    actions:
      - "exyliaclans:open_main_menu"
