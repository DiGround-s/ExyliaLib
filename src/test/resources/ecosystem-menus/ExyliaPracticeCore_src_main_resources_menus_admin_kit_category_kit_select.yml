title: "{primary}&lKITS IN %category_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No kits"
    lore:
      - ""
      - "{muted}Create kits first!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%selected_material%"
    name: "%selected_icon% {warning}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%kit_id%"
      - " {muted}❙ {letters}Icon: {info}%kit_icon%"
      - ""
      - " {muted}❙ %selected_label%"
    actions:
      - "practice:toggle_category_kit %kit_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to category setup"
    actions:
      - "practice:open_kit_category_setup"
