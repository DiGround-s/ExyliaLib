title: "{primary}&l%confirm_title%"
size: 27
type: SIMPLE

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: PAPER
    name: "{warning}&lARE YOU SURE?"
    lore:
      - ""
      - " {muted}❙ {letters}%confirm_line1%"
      - " {muted}❙ {error}%confirm_line2%"

  confirm:
    slot: 11
    material: LIME_WOOL
    name: "{success}&lCONFIRM"
    lore:
      - ""
      - "{info}» Click to confirm"
    actions:
      - "%confirm_action%"

  cancel:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lCANCEL'
    lore:
      - ""
      - "{info}» Click to cancel"
    actions:
      - "%cancel_action%"
