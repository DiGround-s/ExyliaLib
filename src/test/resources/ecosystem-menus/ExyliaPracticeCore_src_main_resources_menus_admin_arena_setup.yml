title: "{primary}&lARENА: %arena_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "practice:edit_arena_name"

  icon:
    slot: 2
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "practice:set_arena_icon"

  enabled:
    slot: 5
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %enabled_status%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "practice:toggle_arena_enabled"

  spawn1:
    slot: 19
    material: "%spawn1_material%"
    name: "%spawn1_color%&lSPAWN 1"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %spawn1_status%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spawn1"
      - "right: practice:tp_spawn spawn1"

  spawn2:
    slot: 20
    material: "%spawn2_material%"
    name: "%spawn2_color%&lSPAWN 2"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %spawn2_status%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spawn2"
      - "right: practice:tp_spawn spawn2"

  spectator-spawn:
    slot: 21
    material: "%spectator_material%"
    name: "%spectator_color%&lSPECTATOR SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %spectator_status%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_spectator_spawn"
      - "right: practice:tp_spawn spectator"

  partyffa-spawn:
    slot: 22
    material: "%partyffa_material%"
    name: "%partyffa_color%&lPARTY FFA SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %partyffa_status%"
      - ""
      - " {letters_black}▎ {success}Left-Click to set"
      - " {letters_black}▎ {info}Right-Click to teleport"
    actions:
      - "left: practice:set_partyffa_spawn"
      - "right: practice:tp_spawn partyffa"

  playable-region:
    slot: 28
    material: "%playable_material%"
    name: "%playable_color%&lPLAYABLE REGION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %playable_status%"
      - ""
      - " {letters_black}▎ {letters}Area where matches happen"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "practice:set_playable_region"

  copy-region:
    slot: 29
    material: "%copy_material%"
    name: "%copy_color%&lCOPY REGION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %copy_status%"
      - ""
      - " {letters_black}▎ {letters}Template area for cloning"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "practice:set_copy_region"

  schematic:
    slot: 31
    material: "%schematic_material%"
    name: "%schematic_color%&lSCHEMATIC"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %schematic_status%"
      - ""
      - " {letters_black}▎ {letters}Save from copy region"
      - " {letters_black}▎ {letters}Used for regen & clones"
      - ""
      - " {letters_black}▎ {success}Left-Click to save"
      - " {letters_black}▎ {warning}Right-Click to restore"
    actions:
      - "left: practice:save_schematic"
      - "right: practice:regen_schematic"

  extra-regions:
    slot: 30
    material: END_PORTAL_FRAME
    name: "{info}&lEXTRA REGIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Count: {highlight}%extra_regions_count%"
      - ""
      - " {letters_black}▎ {letters}Regions used for portal-like triggers"
      - ""
      - " {letters_black}▎ {info}Click to manage"
    actions:
      - "practice:open_extra_regions_list"

  kits:
    slot: 37
    material: BOOK
    name: "{info}&lKITS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Compatible: {highlight}%kit_count% kit(s)"
      - ""
      - " {letters_black}▎ {letters}Select which kits can use this arena"
      - ""
      - " {letters_black}▎ {info}Click to manage"
    actions:
      - "practice:open_arena_kit_select"

  protection-radius:
    slot: 33
    material: SHIELD
    name: "{info}&lSPAWN PROTECTION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Radius: {highlight}%protection_radius% {letters}blocks"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +5"
      - " {letters_black}▎ {error}Shift-Right -5"
    actions:
      - "left: practice:adjust_protection_radius 1"
      - "right: practice:adjust_protection_radius -1"
      - "shift_left: practice:adjust_protection_radius 5"
      - "shift_right: practice:adjust_protection_radius -5"

  extra-region-protection-radius:
    slot: 34
    material: END_PORTAL_FRAME
    name: "{info}&lEXTRA REGION PROTECTION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Radius: {highlight}%extra_region_protection_radius% {letters}blocks"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +5"
      - " {letters_black}▎ {error}Shift-Right -5"
    actions:
      - "left: practice:adjust_extra_region_protection_radius 1"
      - "right: practice:adjust_extra_region_protection_radius -1"
      - "shift_left: practice:adjust_extra_region_protection_radius 5"
      - "shift_right: practice:adjust_extra_region_protection_radius -5"

  priority:
    slot: 38
    material: HOPPER
    name: "{info}&lPRIORITY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%priority%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +10"
      - " {letters_black}▎ {error}Shift-Right -10"
    actions:
      - "left: practice:adjust_priority 1"
      - "right: practice:adjust_priority -1"
      - "shift_left: practice:adjust_priority 10"
      - "shift_right: practice:adjust_priority -10"

  view-clones:
    slot: 40
    material: ENDER_EYE
    name: "{info}&lVIEW CLONES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Active clones: {highlight}%clone_count%"
      - ""
      - "{warning}➥ Click to view"
    actions:
      - "practice:open_clone_list"


  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Go back to arena list"
    actions:
      - "practice:open_arena_list"
