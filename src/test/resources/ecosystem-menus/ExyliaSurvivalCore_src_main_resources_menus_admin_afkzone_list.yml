title: "{primary}&lAFK ZONES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No AFK zones found"
    lore:
      - ""
      - "{muted}Create your first zone!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: BEACON
    name: "{warning}&l%zone_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {highlight}%zone_id%"
      - " {muted}❙ {letters}Region: %zone_region_status%"
      - " {muted}❙ {letters}Status: %zone_enabled%"
      - " {muted}❙ {letters}Interval: {highlight}%zone_interval%s"
      - " {muted}❙ {letters}Rewards: {highlight}%zone_rewards_count%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:afkzone_edit %zone_id%"
      - "right: survivalcore:afkzone_delete %zone_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE AFK ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new AFK reward zone"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:afkzone_create"

  close:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
