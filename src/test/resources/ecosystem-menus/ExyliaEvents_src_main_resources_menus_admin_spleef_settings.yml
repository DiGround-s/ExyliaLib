title: "{primary}&lSPLEEF SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Build the breakable floor"
      - " {letters_black}▎ {letters}out of {highlight}Snow Blocks"
      - ""
      - " {letters_black}▎ {letters}Breaking one gives the player"
      - " {letters_black}▎ {letters}snowballs to dig out others"
      - ""
      - " {letters_black}▎ {letters}Snowballs also destroy any"
      - " {letters_black}▎ {letters}Snow Block they hit directly"
      - ""
      - " {letters_black}▎ {error}Falling through eliminates"
      - " {letters_black}▎ {error}a player"

  grace-period:
    slot: 12
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - " {letters_black}▎ {letters}Blocks don't break at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  snowballs-per-break:
    slot: 13
    material: SNOWBALL
    name: "{info}&lSNOWBALLS PER BLOCK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%snowballs_per_break%"
      - ""
      - " {letters_black}▎ {letters}Snowballs received"
      - " {letters_black}▎ {letters}when breaking a snow block"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting snowballs-per-break 1"
      - "right: events:adjust_setting snowballs-per-break -1"
      - "shift_left: events:input_setting snowballs-per-break"

  snowball-knockback:
    slot: 14
    material: "%snowball_knockback_material%"
    name: "%snowball_knockback_color%&lSNOWBALL KNOCKBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %snowball_knockback%"
      - ""
      - " {letters_black}▎ {letters}Snowballs push players"
      - " {letters_black}▎ {letters}on impact"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_spleef_setting snowball-knockback"

  fall-damage:
    slot: 15
    material: "%fall_damage_material%"
    name: "%fall_damage_color%&lFALL DAMAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %fall_damage%"
      - ""
      - " {letters_black}▎ {letters}If enabled, players"
      - " {letters_black}▎ {letters}take fall damage"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_spleef_setting fall-damage"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
