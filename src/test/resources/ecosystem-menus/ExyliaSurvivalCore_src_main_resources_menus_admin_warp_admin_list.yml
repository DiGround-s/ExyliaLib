title: "{primary}&lWARPS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No warps configured"
    lore:
      - ""
      - " {muted}Click the button above to create one."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "%warp_icon%"
    name: "{warning}&l%warp_name% {muted}— {letters}%warp_id%"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %warp_enabled%"
      - " {muted}❙ {letters}Location: {highlight}%warp_location%"
      - " {muted}❙ {letters}Cost: {highlight}%warp_cost%"
      - " {muted}❙ {letters}Permission: {highlight}%warp_permission%"
      - ""
      - " {success}● {info}Left-click to edit"
      - " {error}● {info}Right-click to delete"
    actions:
      - "left: survivalcore:admin_warp_edit %warp_id%"
      - "right: survivalcore:admin_warp_delete %warp_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE WARP"
    lore:
      - ""
      - " {info}Click to create a new warp."
    actions:
      - "survivalcore:admin_warp_create"

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
