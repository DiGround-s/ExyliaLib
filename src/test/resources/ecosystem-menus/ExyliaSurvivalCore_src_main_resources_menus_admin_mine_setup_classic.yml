title: "{primary}&lCLASSIC MINE: %mine_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 1
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%mine_name%"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:mine_edit_name"

  enabled:
    slot: 3
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_enabled"

  region:
    slot: 5
    material: "%region_material%"
    name: "{highlight}&lMINE REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Full cuboid that gets filled on reset"
      - ""
      - "{info}» Click to select with wand"
    actions:
      - "survivalcore:mine_set_region"

  permission:
    slot: 7
    material: PAPER
    name: "{highlight}&lACCESS PERMISSION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%permission_value%"
      - ""
      - " {muted}❙ {letters}Leave empty to allow everyone"
      - ""
      - "{info}» Click to set"
      - "{error}» Shift-Click to clear"
    actions:
      - "left: survivalcore:mine_set_permission"
      - "shift_left: survivalcore:mine_clear_permission"

  composition:
    slot: 19
    material: CHEST
    name: "{highlight}&lBLOCK COMPOSITION"
    lore:
      - ""
      - " {muted}❙ {letters}Materials: {highlight}%composition_count%"
      - ""
      - " {muted}❙ {letters}Weighted materials used to fill"
      - " {muted}❙ {letters}the mine on every reset"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:mine_open_composition"

  break-effects:
    slot: 28
    material: NOTE_BLOCK
    name: "{highlight}&lBREAK EFFECTS"
    lore:
      - ""
      - " {muted}❙ {letters}Configured: %break_effects_status%"
      - ""
      - " {muted}❙ {letters}Sounds, particles, titles and more"
      - " {muted}❙ {letters}played when any block of this mine"
      - " {muted}❙ {letters}is mined."
      - ""
      - " {muted}❙ {letters}A material with its own effects"
      - " {muted}❙ {warning}overrides {letters}these."
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:mine_open_effects"

  interval:
    slot: 20
    material: CLOCK
    name: "{highlight}&lRESET INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%interval_value%s"
      - ""
      - " {success}● {info}Left-click {muted}+10s"
      - " {error}● {info}Right-click {muted}-10s"
      - " {success}● {info}Shift + Left {muted}+60s"
      - " {error}● {info}Shift + Right {muted}-60s"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:mine_adjust_interval 10"
      - "right: survivalcore:mine_adjust_interval -10"
      - "shift_left: survivalcore:mine_adjust_interval 60"
      - "shift_right: survivalcore:mine_adjust_interval -60"
      - "middle: survivalcore:mine_set_interval"

  warning:
    slot: 21
    material: BELL
    name: "{highlight}&lRESET WARNING"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%warning_value%s"
      - ""
      - " {muted}❙ {letters}Seconds before reset players are warned"
      - ""
      - " {success}● {info}Left-click {muted}+1s"
      - " {error}● {info}Right-click {muted}-1s"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:mine_adjust_warning 1"
      - "right: survivalcore:mine_adjust_warning -1"
      - "middle: survivalcore:mine_set_warning"

  threshold:
    slot: 22
    material: TARGET
    name: "{highlight}&lRESET THRESHOLD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%threshold_value%%"
      - ""
      - " {muted}❙ {letters}Force reset when this % of the"
      - " {muted}❙ {letters}mine has been mined. {highlight}0 {letters}= disabled"
      - ""
      - " {success}● {info}Left-click {muted}+5%"
      - " {error}● {info}Right-click {muted}-5%"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:mine_adjust_threshold 5"
      - "right: survivalcore:mine_adjust_threshold -5"
      - "middle: survivalcore:mine_set_threshold"

  safe-teleport:
    slot: 23
    material: "%safe_teleport_material%"
    name: "{highlight}&lSAFE TELEPORT"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %safe_teleport_status%"
      - ""
      - " {muted}❙ {letters}Players inside are moved here"
      - " {muted}❙ {letters}right before the mine resets"
      - ""
      - "{info}» Click to set"
      - "{error}» Shift-Click to clear"
    actions:
      - "left: survivalcore:mine_set_safe_teleport"
      - "shift_left: survivalcore:mine_clear_safe_teleport"

  entry-teleport:
    slot: 24
    material: "%entry_teleport_material%"
    name: "{highlight}&lENTRY TELEPORT"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %entry_teleport_status%"
      - ""
      - " {muted}❙ {letters}Optional warp point players are"
      - " {muted}❙ {letters}sent to via /mine <id>"
      - ""
      - "{info}» Click to set"
      - "{error}» Shift-Click to clear"
    actions:
      - "left: survivalcore:mine_set_entry_teleport"
      - "shift_left: survivalcore:mine_clear_entry_teleport"

  auto-pickup:
    slot: 25
    material: "%auto_pickup_material%"
    name: "{highlight}&lAUTO-PICKUP"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %auto_pickup_status%"
      - ""
      - " {muted}❙ {letters}Custom loot goes straight into the"
      - " {muted}❙ {letters}player's inventory instead of"
      - " {muted}❙ {letters}dropping on the ground"
      - " {muted}❙ {muted}(overflow still drops normally)"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_auto_pickup"

  restrict-breaking:
    slot: 29
    material: "%restrict_breaking_material%"
    name: "{highlight}&lRESTRICT BREAKING"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %restrict_breaking_status%"
      - ""
      - " {muted}❙ {letters}Blocks breaking any material NOT"
      - " {muted}❙ {letters}listed in the block composition —"
      - " {muted}❙ {letters}useful to protect decoration"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_restrict_breaking"

  force-reset:
    slot: 40
    material: TNT
    name: "{error}&lFORCE RESET NOW"
    lore:
      - ""
      - " {muted}❙ {letters}Immediately fills the mine,"
      - " {muted}❙ {letters}teleporting players to safety"
      - ""
      - "{error}» Click to reset"
    actions:
      - "survivalcore:mine_force_reset"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to mine list"
    actions:
      - "survivalcore:mine_open_list"

  delete:
    slot: 49
    material: BARRIER
    name: "{error}&lDELETE MINE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this mine"
      - ""
      - "{error}» Click to delete"
    actions:
      - "survivalcore:mine_delete %mine_id%"
