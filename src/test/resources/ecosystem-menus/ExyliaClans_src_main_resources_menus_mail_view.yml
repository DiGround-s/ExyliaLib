title: "{primary}&lMESSAGE {muted}· %mail_subject%"
size: 36
type: SIMPLE
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  content:
    slot: 13
    material: "%mail_icon%"
    name: "%mail_title_color%&l%mail_subject%"
    lore:
      - ""
      - " {muted}❙ {letters}From: {highlight}%mail_sender%"
      - " {muted}❙ {letters}Type: %mail_type_label%"
      - " {muted}❙ {letters}Sent: {info}%mail_sent_full%"
      - " {muted}❙ {letters}Expires: {muted}%mail_expires%"
      - ""
      - "%mail_body%"
      - ""

  pin:
    slot: 20
    material: "%mail_pin_mat%"
    name: "%mail_pin_color%&l%mail_pin_label%"
    lore:
      - ""
      - " {muted}❙ {letters}Pinned messages stay"
      - " {muted}❙ {letters}at the top of the mailbox."
      - ""
      - "%mail_pin_action_lore%"
    actions:
      - "%mail_pin_action%"

  delete:
    slot: 24
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE MESSAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently remove this"
      - " {muted}❙ {letters}message from your mailbox."
      - ""
      - "%mail_delete_action_lore%"
    actions:
      - "%mail_delete_action%"

  back:
    slot: 31
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Click to go back to mailbox'
    actions:
      - "exyliaclans:open_mail_inbox"
