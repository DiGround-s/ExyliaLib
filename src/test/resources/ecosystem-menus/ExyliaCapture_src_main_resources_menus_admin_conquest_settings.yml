title: "{warning}&lCONQUEST SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  target-points:
    slot: 3
    material: BEACON
    name: "{info}&lTARGET POINTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%target_points%"
      - " {letters_black}▎ {letters}First clan to reach this wins"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: capture:adjust_setting target-points 1"
      - "right: capture:adjust_setting target-points -1"
      - "shift_left: capture:input_setting target-points"

  manage-zones:
    slot: 4
    material: FILLED_MAP
    name: "{warning}&lMANAGE ZONES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Zones: {highlight}%zones_count%"
      - " {letters_black}▎ {letters}Configure capture zones"
      - " {letters_black}▎ {letters}Each zone has its own capture time"
      - ""
      - "{warning}➥ Click to open"
    actions:
      - "capture:open_conquest_zones"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
