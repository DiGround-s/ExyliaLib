title: "{primary}&lARENA STATISTICS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No arena data available"
    lore:
      - ""
      - "{muted}No games have been played yet."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%arena_icon%"
    name: "{warning}&l#%rank% {letters}%arena_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%arena_id%"
      - ""
      - " {muted}❙ {letters}Total Games: {highlight}%total_games%"
      - " {muted}❙ {letters}Ranked: {highlight}%ranked_games%"
      - " {muted}❙ {letters}Casual: {highlight}%casual_games%"
      - " {muted}❙ {letters}Avg. Duration: {highlight}%avg_duration%"
      - ""

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{secondary}&lBACK"
    lore:
      - ""
      - "{info}» Click to go back"
    actions:
      - "practice:open_admin_stats"
