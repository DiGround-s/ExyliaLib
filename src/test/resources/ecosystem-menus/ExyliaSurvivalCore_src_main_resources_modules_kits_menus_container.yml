# What is inside one of a kit's items.
#
# A shulker box, a bundle, and a box inside a box: the screen is the same one
# every time, and the plugin says which one it is showing. A container in here
# opens the same way, so there is no limit to how deep a kit can nest.
#
# Values: %kit_id% %kit_name% %container_name% %container_items%
#         %path% %parent_path% %depth%
#
# Replaces the older kit_preview_shulker.yml, which is no longer read and may be deleted.

title: "{primary}&lINSIDE {letters_black}» {highlight}%container_name%"
size: 54
type: SIMPLE

open_sounds:
  - "BLOCK_SHULKER_BOX_OPEN|0.7|1.4"
click_sounds:
  - "UI_BUTTON_CLICK|0.6|1.6"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    header:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "1,2,3,5,6,7,46,47,48,50,51,52"

items:
  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Return to what holds this."
      - ""
    actions:
      - "survivalcore:kit_preview %kit_id% %parent_path%"

  info:
    slot: 4
    material: SHULKER_BOX
    name: "{primary}&l%container_name%"
    lore:
      - ""
      - "{secondary}Contents:"
      - " {letters_black}▎ {letters}Holds {highlight}%container_items% {letters}item(s)"
      - " {letters_black}▎ {letters}Part of the {highlight}%kit_name% {letters}kit"
      - ""

  kit:
    slot: 47
    material: CHEST
    name: "{secondary}&lBACK TO THE KIT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Return to the whole kit."
      - ""
    actions:
      - "survivalcore:kit_preview %kit_id%"

sections:
  contents:
    slots: "9-44"

    # Never drawn: a row here always brings the real item. It is declared so
    # that a plain item is the list's default and cannot fall through to the
    # template that opens a container.
    item_template:
      material: PAPER

    container_template:
      material: PAPER
      actions:
        - "survivalcore:kit_preview %kit_id% %path%"

    empty_template:
      material: BLACK_STAINED_GLASS_PANE
      hide_tooltip: true

    navigation:
      previous:
        slot: 48
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
      next:
        slot: 50
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
