title: "{primary}&lCATEGORY: %category_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:edit_category_name"

  icon:
    slot: 4
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{info}» Click to change"
    actions:
      - "practice:set_category_icon"

  enabled:
    slot: 6
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %enabled_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:toggle_category_enabled"

  description:
    slot: 20
    material: PAPER
    name: "{highlight}&lDESCRIPTION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%description%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:edit_category_description"

  manage-kits:
    slot: 22
    material: CHEST
    name: "{info}&lMANAGE KITS"
    lore:
      - ""
      - " {muted}❙ {letters}Select which kits belong"
      - " {muted}❙ {letters}to this category"
      - ""
      - "{info}» Click to manage"
    actions:
      - "practice:open_category_kit_select"

  priority:
    slot: 38
    material: HOPPER
    name: "{info}&lPRIORITY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%priority%"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click +10"
      - " {muted}❙ {error}Shift-Right -10"
    actions:
      - "left: practice:adjust_category_priority 1"
      - "right: practice:adjust_category_priority -1"
      - "shift_left: practice:adjust_category_priority 10"
      - "shift_right: practice:adjust_category_priority -10"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Go back to category list"
    actions:
      - "practice:open_kit_category_list"
