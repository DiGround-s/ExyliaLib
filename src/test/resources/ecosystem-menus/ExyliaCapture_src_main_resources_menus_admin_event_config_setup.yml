title: "{primary}&lCONFIG: %config_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "capture:edit_config_name"

  event-type:
    slot: 4
    material: PAPER
    name: "{highlight}&lEVENT TYPE"
    lore:
      - ""
      - " {muted}❙ {letters}Type: {info}%event_type%"
      - ""
      - " {muted}❙ {letters}Cannot be changed"

  icon:
    slot: 6
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{info}» Click to change"
    actions:
      - "capture:set_config_icon"

  color:
    slot: 29
    material: ORANGE_DYE
    name: "{highlight}&lEVENT COLOR"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%event_color%"
      - " {muted}❙ {letters}Used for waypoints & visuals"
      - ""
      - "{info}» Click to change"
    actions:
      - "capture:input_color"

  zone:
    slot: 19
    material: "%zone_material%"
    name: "{warning}&lCAPTURE ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}%zone_status%"
      - " {muted}❙ {letters}%zone_coords%"
      - ""
      - "{info}» %zone_action_hint%"
    actions:
      - "capture:set_config_zone"

  max-duration:
    slot: 20
    material: CLOCK
    name: "{info}&lMAX DURATION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%max_duration%"
      - " {muted}❙ {letters}Infinite: {highlight}%infinite_duration_status%"
      - ""
      - " {muted}❙ {success}Left-Click +30s"
      - " {muted}❙ {error}Right-Click -30s"
      - " {muted}❙ {warning}Shift-Click to enter"
      - " {muted}❙ {info}Middle-Click to toggle infinite"
    actions:
      - "left: capture:set_max_duration 30"
      - "right: capture:set_max_duration -30"
      - "shift_left: capture:input_max_duration"
      - "middle: capture:toggle_infinite_duration"

  type-settings:
    slot: 22
    material: COMPARATOR
    name: "{secondary}&lTYPE SETTINGS"
    lore:
      - ""
      - " {muted}❙ {letters}Configure type-specific"
      - " {muted}❙ {letters}parameters"
      - ""
      - "{info}» Click to open"
    actions:
      - "capture:open_type_settings"

  commands:
    slot: 24
    material: COMMAND_BLOCK
    name: "{warning}&lCOMMANDS"
    lore:
      - ""
      - " {muted}❙ {letters}Start: {highlight}%start_commands_count% {letters}commands"
      - " {muted}❙ {letters}End: {highlight}%end_commands_count% {letters}commands"
      - " {muted}❙ {letters}Winner: {highlight}%winner_commands_count% {letters}rewards"
      - ""
      - "{info}» Click to manage"
    actions:
      - "capture:open_commands_setup"

  schedules:
    slot: 25
    material: REPEATER
    name: "{info}&lSCHEDULES"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%schedules_count%"
      - " {muted}❙ {letters}Auto-start triggers"
      - ""
      - "{info}» Click to manage"
    actions:
      - "capture:open_schedule_list"

  leaderboard-points:
    slot: 28
    material: GOLD_NUGGET
    name: "{warning}&lLEADERBOARD POINTS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%leaderboard_points% {letters}pts/win"
      - " {muted}❙ {letters}Points earned per win"
      - " {muted}❙ {letters}for the global ranking"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: capture:set_leaderboard_points 1"
      - "right: capture:set_leaderboard_points -1"
      - "shift_left: capture:input_leaderboard_points"

  toggle:
    slot: 31
    material: "%toggle_material%"
    name: "%toggle_name%"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:toggle_config"

  scoreboard-toggle:
    slot: 32
    material: "%scoreboard_material%"
    name: "{highlight}&lSCOREBOARD"
    lore:
      - ""
      - " {muted}❙ {letters}Status: {info}%scoreboard_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:toggle_scoreboard"

  bossbar-toggle:
    slot: 33
    material: "%bossbar_material%"
    name: "{highlight}&lBOSSBAR"
    lore:
      - ""
      - " {muted}❙ {letters}Status: {info}%bossbar_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:toggle_bossbar"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Go back to the list"
    actions:
      - "capture:save_config"

  close:
    slot: 49
    material: ARROW
    name: "{letters}&lCLOSE"
    lore:
      - ""
      - " {muted}❙ {success}All changes are auto-saved"
      - ""
      - "{info}» Click to close"
    actions:
      - "capture:save_config"
