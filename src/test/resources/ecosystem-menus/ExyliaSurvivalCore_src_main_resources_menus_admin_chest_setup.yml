title: "{primary}&lCHEST CONFIG"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  template:
    slot: 4
    material: "%chest_material%"
    name: "{highlight}&lTEMPLATE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%chest_template%"
      - " {muted}❙ {letters}Location: {highlight}%chest_location%"
    hide_tooltip: false

  enabled:
    slot: 11
    material: "%chest_enabled_mat%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %chest_enabled_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:lc_chest_toggle_enabled"

  dispersed:
    slot: 15
    material: "%chest_dispersed_mat%"
    name: "{highlight}&lFILL MODE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %chest_dispersed%"
      - ""
      - " {muted}❙ {letters}Stacked: items grouped at start"
      - " {muted}❙ {letters}Dispersed: items spread randomly"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:lc_chest_toggle_dispersed"

  cooldown-down:
    slot: 20
    material: RED_STAINED_GLASS_PANE
    name: "{error}&l▼ COOLDOWN"
    lore:
      - ""
      - " {success}● {info}Left-click {muted}-10s"
      - " {success}● {info}Shift + Left {muted}-60s"
      - " {error}● {info}Right-click {muted}-300s"
    hide_tooltip: false
    actions:
      - "left: survivalcore:lc_chest_adjust_cooldown -10"
      - "shift_left: survivalcore:lc_chest_adjust_cooldown -60"
      - "right: survivalcore:lc_chest_adjust_cooldown -300"

  cooldown-display:
    slot: 22
    material: CLOCK
    name: "{highlight}&lCOOLDOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%chest_cooldown%"
      - ""
      - " {muted}❙ {letters}Time before chest refills"
    hide_tooltip: false

  cooldown-up:
    slot: 24
    material: LIME_STAINED_GLASS_PANE
    name: "{success}&l▲ COOLDOWN"
    lore:
      - ""
      - " {success}● {info}Left-click {muted}+10s"
      - " {success}● {info}Shift + Left {muted}+60s"
      - " {error}● {info}Right-click {muted}+300s"
    hide_tooltip: false
    actions:
      - "left: survivalcore:lc_chest_adjust_cooldown 10"
      - "shift_left: survivalcore:lc_chest_adjust_cooldown 60"
      - "right: survivalcore:lc_chest_adjust_cooldown 300"

  teleport:
    slot: 31
    material: ENDER_PEARL
    name: "{highlight}&lTELEPORT"
    lore:
      - ""
      - " {muted}❙ {letters}Location: {highlight}%chest_location%"
      - ""
      - "{info}» Click to teleport to chest"
    actions:
      - "survivalcore:lc_teleport_chest %chest_id%"

  delete:
    slot: 53
    material: BARRIER
    name: "{error}&lDELETE CHEST"
    lore:
      - ""
      - " {error}» Click to permanently delete"
    actions:
      - "survivalcore:lc_delete_chest %chest_id%"

  back:
    slot: 45
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to chest list"
    actions:
      - "survivalcore:lc_open_chest_list"
