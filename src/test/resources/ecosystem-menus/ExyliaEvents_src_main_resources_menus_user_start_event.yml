title: "{primary}&lSTART EVENT {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No events available"
    lore:
      - ""
      - "{muted}Come back later!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%event_material%"
    name: "%event_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Type: {info}%event_type%"
      - " {muted}❙ {letters}Players: {highlight}%min_players% - %max_players%"
      - ""
      - "{info}» Click to start"
    actions:
      - "events:start_event %event_id%"

