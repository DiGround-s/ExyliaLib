title: "{primary}&lLOCATIONS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No locations set"
    lore:
      - ""
      - " {muted}Add one with the button below."
    hide_tooltip: false

pagination:
  slots: '0-35'
  item_template:
    material: SLIME_BLOCK
    name: "{warning}&lLOCATION #%loc_index%"
    lore:
      - ""
      - " {muted}❙ {letters}World: {info}%loc_world%"
      - " {muted}❙ {letters}X: {info}%loc_x% {muted}Y: {info}%loc_y% {muted}Z: {info}%loc_z%"
      - ""
      - " {error}● {info}Right-click to remove"
    actions:
      - "right: survivalcore:jumpad_remove_location %loc_index%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
