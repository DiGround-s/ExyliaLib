title: "{primary}&lDATA MANAGEMENT"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  scope-kit:
    slot: 2
    material: PAPER
    name: "{secondary}&lONE KIT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Everything in this column asks"
      - " {letters_black}▎ {letters}which kit first."
    hide_tooltip: false

  scope-all:
    slot: 6
    material: BOOK
    name: "{error}&lEVERY KIT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Everything in this column runs"
      - " {letters_black}▎ {letters}on the whole database at once."
      - ""
      - " {letters_black}▎ {error}None of it can be undone."
    hide_tooltip: false

  new-season:
    slot: 53
    material: END_CRYSTAL
    name: "{error}&lNEW SEASON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Archives ALL stats and match"
      - " {letters_black}▎ {letters}history to the website, then"
      - " {letters_black}▎ {letters}wipes the local database."
      - ""
      - "{secondary}Current season: {highlight}%current_season%"
      - " {letters_black}▎ {letters}Loadouts and kits {highlight}persist{letters}."
      - " {letters_black}▎ {letters}Matchmaking locks during the reset."
      - ""
      - "{warning}➥ Click to start season %next_season%"
    actions:
      - "practice:data_new_season"

  clear-kit-stats:
    slot: 11
    material: ORANGE_DYE
    name: "{warning}&lCLEAR KIT STATS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Deletes all statistics"
      - " {letters_black}▎ {letters}for a specific kit"
      - ""
      - "{warning}➥ Click to select kit"
    actions:
      - "practice:data_clear_kit_stats"

  clear-all-stats:
    slot: 15
    material: TNT
    name: "{error}&lCLEAR ALL STATS"
    lore:
      - ""
      - " {letters_black}▎ {error}Deletes ALL statistics"
      - " {letters_black}▎ {error}for every kit and player"
      - ""
      - "{error}➥ Click to confirm"
    actions:
      - "practice:data_clear_all_stats"

  reset-kit-elo:
    slot: 20
    material: EXPERIENCE_BOTTLE
    name: "{warning}&lRESET KIT ELO"
    lore:
      - ""
      - " {letters_black}▎ {letters}Resets ELO to default"
      - " {letters_black}▎ {letters}for a specific kit"
      - ""
      - "{warning}➥ Click to select kit"
    actions:
      - "practice:data_reset_kit_elo"

  reset-all-elo:
    slot: 24
    material: NETHER_STAR
    name: "{error}&lRESET ALL ELO"
    lore:
      - ""
      - " {letters_black}▎ {error}Resets ELO to default"
      - " {letters_black}▎ {error}for ALL players"
      - ""
      - "{error}➥ Click to confirm"
    actions:
      - "practice:data_reset_all_elo"

  clear-kit-loadouts:
    slot: 29
    material: CRAFTING_TABLE
    name: "{warning}&lCLEAR KIT LOADOUTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Removes all custom loadouts"
      - " {letters_black}▎ {letters}for a specific kit"
      - ""
      - "{warning}➥ Click to select kit"
    actions:
      - "practice:data_clear_kit_customizations"

  clear-all-loadouts:
    slot: 33
    material: FIRE_CHARGE
    name: "{error}&lCLEAR ALL LOADOUTS"
    lore:
      - ""
      - " {letters_black}▎ {error}Removes ALL custom loadouts"
      - " {letters_black}▎ {error}for every player"
      - ""
      - "{error}➥ Click to confirm"
    actions:
      - "practice:data_clear_all_customizations"

  purge-match-history:
    slot: 42
    material: BOOKSHELF
    name: "{error}&lPURGE MATCH HISTORY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Deletes every stored match"
      - " {letters_black}▎ {letters}from the history menus"
      - ""
      - " {letters_black}▎ {success}Stats and ELO are kept"
      - ""
      - "{error}➥ Click to confirm"
    actions:
      - "practice:data_purge_match_history"

  export:
    slot: 45
    material: ENDER_CHEST
    name: "{success}&lEXPORT DATABASE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Exports all database tables"
      - " {letters_black}▎ {letters}to a JSON file in /exports/"
      - ""
      - "{success}➥ Click to export"
    actions:
      - "practice:data_export"

  import:
    slot: 46
    material: BUNDLE
    name: "{warning}&lIMPORT DATABASE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Imports data from a JSON"
      - " {letters_black}▎ {letters}file in the /exports/ folder"
      - ""
      - " {letters_black}▎ {error}WARNING: This will overwrite"
      - " {letters_black}▎ {error}existing data!"
      - ""
      - "{warning}➥ Click to import"
    actions:
      - "practice:data_import"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - "{warning}➥ Click to go back"
    actions:
      - "practice:open_admin"
