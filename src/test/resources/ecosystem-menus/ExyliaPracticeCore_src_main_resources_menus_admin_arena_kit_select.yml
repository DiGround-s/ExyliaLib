title: "{primary}&lSELECT KITS {muted}— {info}%category_filter_name%"
size: 54
type: MULTI_PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to arena setup"
    actions:
      - "practice:open_arena_setup"

  add_all:
    # Not 45: the kit list pages from there.
    slot: 47
    material: NETHER_STAR
    name: "{success}&lAdd All — {warning}%category_filter_name%"
    lore:
      - ""
      - " {letters_black}▎ Adds ALL kits from the selected category"
      - " {letters_black}▎ to this arena at once."
      - ""
      - "{success}➥ Click to add all"
    actions:
      - "practice:arena_kit_add_category %category_filter_id%"

sections:
  categories:
    slots: "1-7"
    filler:
      material: AIR
      hide_tooltip: true
    inactive_template:
      material: "%cat_icon%"
      name: "{warning}&l%cat_name%"
      lore:
        - ""
        - " {letters_black}▎ {letters}ID: {info}%cat_id%"
        - ""
        - "{warning}➥ Click to filter by this category"
    active_template:
      material: "%cat_icon%"
      name: "{success}&l%cat_name%"
      lore:
        - ""
        - " {letters_black}▎ {letters}ID: {info}%cat_id%"
        - ""
        - "{success}✔ Currently filtering"
        - "{warning}➥ Click again to show all kits"
      glowing: true
    navigation:
      previous:
        slot: 0
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
        hide_tooltip: false
      next:
        slot: 8
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
        hide_tooltip: false

  kits:
    slots: "10-16,19-25,28-34"
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "{muted}No kits available"
      lore:
        - ""
        - "{muted}No kits match this filter."
      hide_tooltip: false
    not_in_arena_template:
      material: "%kit_icon%"
      name: "{error}✗ {warning}&l%kit_name%"
      lore:
        - ""
        - " {letters_black}▎ {letters}ID: {info}%kit_id%"
        - ""
        - " {letters_black}▎ {muted}Not in arena — Click to add"
    in_arena_template:
      material: "%kit_icon%"
      name: "{success}✔ {warning}&l%kit_name%"
      lore:
        - ""
        - " {letters_black}▎ {letters}ID: {info}%kit_id%"
        - ""
        - " {letters_black}▎ {success}In arena — Click to remove"
      glowing: true
    navigation:
      previous:
        slot: 45
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
