title: "{primary}&lEVENTOS ACTIVOS {muted}%current_page%/%total_pages%"
size: 27
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay mas eventos activos"
    lore:
      - ""
      - "{muted}Vuelve mas tarde"
    hide_tooltip: false

pagination:
  slots: '10-16'

  item_template:
    material: "%event_material%"
    name: "%event_name%"
    glow: "%event_glow%"
    amount: "%event_players%"
    lore:
      - ""
      - ' {muted}❙ {letters}Tipo: {info}%event_type%'
      - ' {muted}❙ {letters}Estado: {info}%event_state%'
      - ' {muted}❙ {letters}Jugadores: {info}%event_players%/%event_max%'
      - ""
      - "%event_action_text%"
    actions:
      - "%event_action%"

  navigation:
    previous:
      slot: 21
      material: ARROW
      name: '{error}&l← PAGINA ANTERIOR'
      lore:
        - ' {muted}❙ {letters}Clic para ir'
        - ' {muted}❙ {letters}a la pagina anterior.'
        - ''
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 23
      material: ARROW
      name: '{success}&lSIGUIENTE PAGINA →'
      lore:
        - ' {muted}❙ {letters}Clic para ir'
        - ' {muted}❙ {letters}a la siguiente pagina.'
        - ''
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 22
    material: ARROW
    name: '{error}&lVolver'
    lore:
      - '{muted}Clic para volver'
    actions:
      - "events:open_main_menu"
