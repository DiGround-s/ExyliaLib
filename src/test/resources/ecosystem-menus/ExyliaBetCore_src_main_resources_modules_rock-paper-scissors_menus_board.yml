# The Rock Paper Scissors board.
#
# Three squares, in the order the game numbers them: rock, paper, scissors.
# Both players choose at once and neither sees the other's choice until both
# have made one, so most of what is on screen is about the clock.

title: '%your_name% {muted}vs %opponent_name% {muted}— %match_score%'
size: 45

open_sounds:
  - 'BLOCK_BARREL_OPEN|0.8|1.4'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.6'

refresh:
  mode: DISABLED

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  status:
    slot: 4
    material: CLOCK
    name: '{primary}&l%match_mode_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Round: {info}%match_round%{muted}/{info}%match_rounds%'
      - ' {muted}❙ {letters}Score: {info}%match_score%'
      - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
      - ''
      - ' {muted}❙ {letters}Time left: {info}%turn_seconds%s ⏱'
      - ''
      - ' {muted}❙ {letters}You both choose at once. Pick before'
      - ' {muted}❙ {letters}the clock runs out or you lose'
      - ' {muted}❙ {letters}the round.'

  you:
    slot: 10
    material: 'playerhead-%your_name%'
    name: '{success}&l%your_name%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%your_score%'
      - ' {muted}❙ {letters}Your stake: {highlight}%match_wager%'

  opponent:
    slot: 16
    material: 'playerhead-%opponent_name%'
    name: '{error}&l%opponent_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%opponent_score%'

  spectators:
    slot: 38
    material: ENDER_EYE
    amount: '%spectator_count%'
    name: '{primary}&lWATCHING'
    lore:
      - ''
      - ' {muted}❙ {letters}People watching: {highlight}%spectator_count%'
      - ''
      - '{info}» Click to see who'
    actions:
      - 'left: betcore:open_spectators'

  close:
    slot: 44
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - ''
      - ' {muted}❙ {letters}The match keeps running and'
      - ' {muted}❙ {letters}so does the clock.'
      - ''
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  # Rock, paper, scissors, in that order.
  board:
    slots: '21-23'
    filler:
      material: AIR
      hide_tooltip: true

    # Still choosing, and this one is live.
    choice_template:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{letters}&lPICK'
      lore:
        - ''
        - ' {muted}❙ {letters}Rock beats scissors.'
        - ' {muted}❙ {letters}Scissors beats paper.'
        - ' {muted}❙ {letters}Paper beats rock.'
        - ''
        - '{success}▶ Click to choose this'
      actions:
        - 'left: betcore:play_cell'

    # What this viewer locked in.
    chosen_template:
      material: LIME_CONCRETE
      name: '{success}&lYOUR CHOICE'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Locked in. No changing your mind.'

    # What the other one played, once both are on the table.
    opponent_template:
      material: RED_CONCRETE
      name: '{error}&lTHEIRS'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%opponent_name%'

    # Both played the same thing, which is a draw.
    both_template:
      material: YELLOW_CONCRETE
      name: '{warning}&lBOTH'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}You both played this. A draw.'

    locked_template:
      material: GRAY_STAINED_GLASS_PANE
      name: '{muted}&lNOT THIS ONE'
      lore:
        - ''
        - ' {muted}❙ {letters}Waiting for the other player.'

  # One slot, two meanings: a player surrenders and a spectator leaves.
  viewer:
    slots: '40'
    filler:
      material: AIR
      hide_tooltip: true

    item_template:
      material: WHITE_BANNER
      name: '{error}&lSURRENDER'
      lore:
        - ''
        - ' {muted}❙ {letters}Gives the match to {highlight}%opponent_name%{letters}.'
        - ' {muted}❙ {letters}Your {info}%match_wager% {letters}goes with it.'
        - ''
        - '{error}▶ Click, then confirm'
      actions:
        - 'left: betcore:surrender'

    watching_template:
      material: WHITE_BANNER
      name: '{warning}&lSTOP WATCHING'
      lore:
        - ''
        - ' {muted}❙ {letters}Leaves the match running.'
        - ''
        - '{warning}▶ Click to leave'
      actions:
        - 'left: betcore:leave_spectate'
