title: "{primary}&lADMIN CAPTURE"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  configurations:
    slot: 12
    material: CHISELED_BOOKSHELF
    name: "{info}&lCONFIGURATIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create and configure"
      - " {letters_black}▎ {letters}capture zone events"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_configs%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "capture:open_config_list"

  active-events:
    slot: 14
    material: COMPASS
    name: "{warning}&lACTIVE EVENTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Currently running"
      - " {letters_black}▎ {letters}capture events"
      - ""
      - " {letters_black}▎ {letters}Active: {highlight}%active_events%"
      - ""
      - "{warning}➥ Click to view"
    actions:
      - "capture:open_config_list"

  reload:
    slot: 18
    material: REDSTONE
    name: "{error}&lRELOAD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Reload all plugin"
      - " {letters_black}▎ {letters}configurations"
      - ""
      - "{warning}➥ Click to reload"
    actions:
      - "capture:reload_configs"
