title: "{error}&lINFECTION SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  infected-percentage:
    slot: 19
    material: ZOMBIE_HEAD
    name: "{error}&lINFECTED PERCENTAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%infected_percentage%%"
      - ""
      - " {letters_black}▎ {letters}% of infected players"
      - " {letters_black}▎ {letters}at game start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5%"
      - " {letters_black}▎ {error}Right-Click -5%"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting infected-percentage 5"
      - "right: events:adjust_setting infected-percentage -5"
      - "shift_left: events:input_setting infected-percentage"

  infection-cooldown:
    slot: 20
    material: HOPPER
    name: "{info}&lINFECTION COOLDOWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%infection_cooldown%s"
      - ""
      - " {letters_black}▎ {letters}Cooldown between each"
      - " {letters_black}▎ {letters}infection"
      - ""
      - "{warning}➥ Click to enter"
    actions:
      - "events:input_double_setting infection-cooldown"

  glow-effect:
    slot: 21
    material: "%glow_effect_material%"
    name: "%glow_effect_color%&lGLOW EFFECT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %glow_effect%"
      - ""
      - " {letters_black}▎ {letters}Infected players glow"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_infection_setting glow-effect"

  eliminate-on-infect:
    slot: 22
    material: "%eliminate_on_infect_material%"
    name: "%eliminate_on_infect_color%&lELIMINATE ON INFECT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %eliminate_on_infect%"
      - ""
      - " {letters_black}▎ {letters}If enabled, the player"
      - " {letters_black}▎ {letters}is eliminated when infected"
      - " {letters_black}▎ {letters}instead of becoming infected"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_infection_setting eliminate-on-infect"

  infected-speed:
    slot: 23
    material: ROTTEN_FLESH
    name: "{error}&lINFECTED SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Level: {highlight}%infected_speed%"
      - ""
      - " {letters_black}▎ {letters}Speed level for"
      - " {letters_black}▎ {letters}infected players"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
    actions:
      - "left: events:adjust_setting infected-speed 1"
      - "right: events:adjust_setting infected-speed -1"

  survivor-speed:
    slot: 24
    material: SUGAR
    name: "{success}&lSURVIVOR SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Level: {highlight}%survivor_speed%"
      - ""
      - " {letters_black}▎ {letters}Speed level for"
      - " {letters_black}▎ {letters}survivors"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
    actions:
      - "left: events:adjust_setting survivor-speed 1"
      - "right: events:adjust_setting survivor-speed -1"

  grace-period:
    slot: 25
    material: CLOCK
    name: "{warning}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - ""
      - " {letters_black}▎ {letters}Time without infections"
      - " {letters_black}▎ {letters}at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
