title: "{primary}&lRECRUITMENT REQUIREMENTS"
size: 54
type: PAGINATION
animation: "center_out"
refresh:
  mode: ON_CLICK
  click_delay: 4
open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"
filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more requirements"
    hide_tooltip: false
pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "%cat_icon%"
    name: "%cat_display_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %cat_status%"
      - ""
      - " %cat_type_hint%"
      - ""
      - "{info}» Click to change"
    actions:
      - "exyliaclans:lfp_category_click %cat_id%"
  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - 'next_page'
items:
  description:
    slot: 4
    material: OAK_SIGN
    name: "{primary}&lDESCRIPTION"
    lore:
      - ""
      - " {letters}%description%"
      - ""
      - "{info}» Click to write/edit"
    actions:
      - "exyliaclans:lfp_set_description"
  submit:
    slot: 47
    material: LIME_WOOL
    name: "%submit_label%"
    lore:
      - ""
      - " {muted}Publish these requirements so"
      - " {muted}players can apply to your clan."
      - ""
      - "{info}» Click to publish"
    actions:
      - "exyliaclans:lfp_submit"
  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to the listing"
    actions:
      - "exyliaclans:open_lfp_browse"
