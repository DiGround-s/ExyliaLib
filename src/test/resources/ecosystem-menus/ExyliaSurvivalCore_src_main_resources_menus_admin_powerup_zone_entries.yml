title: "{primary}&lZONE POWERUPS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No powerups configured"
    lore:
      - ""
      - "{muted}Add a powerup to this zone!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%pu_icon%"
    name: "{warning}&l%pu_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Weight: {highlight}%pu_weight%"
      - " {muted}❙ {letters}Effects: {highlight}%pu_effects_count%"
      - " {muted}❙ {letters}Rewards: {highlight}%pu_rewards_count%"
      - ""
      - " {success}● {info}Left-click {muted}to edit"
      - " {success}● {info}Right-click {muted}+10 weight"
      - " {error}● {info}Shift+Left {muted}-10 weight"
      - " {error}● {info}Shift+Right {muted}to remove"
    actions:
      - "left: survivalcore:pu_zone_edit_entry %pu_id%"
      - "right: survivalcore:pu_zone_adjust_entry_weight %pu_id% 10"
      - "shift_left: survivalcore:pu_zone_adjust_entry_weight %pu_id% -10"
      - "shift_right: survivalcore:pu_zone_remove_entry %pu_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  add:
    slot: 4
    material: EMERALD
    name: "{success}&lADD POWERUP"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new powerup for this zone"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:pu_zone_add_entry"

  back:
    slot: 49
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to zone setup"
    actions:
      - "survivalcore:pu_zone_back_to_setup"
