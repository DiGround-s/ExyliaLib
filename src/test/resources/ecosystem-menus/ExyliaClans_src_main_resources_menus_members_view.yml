title: "{primary}&lMEMBERS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more members"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "playerhead-%member_name%"
    name: "{primary}&l%member_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Role: {highlight}%member_role%"
      - " {muted}❙ {letters}Status: %member_status%"
      - ""
      - " {muted}❙ {letters}Kills: {success}%member_kills%"
      - " {muted}❙ {letters}Deaths: {error}%member_deaths%"
      - " {muted}❙ {letters}KDR: {highlight}%member_kdr%"
      - " {muted}❙ {letters}Playtime: {info}%member_playtime%"
      - "%member_action_lore%"
    actions:
      - "%member_action%"

  navigation:
    previous:
      slot: 45
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  stats:
    slot: 48
    material: BOOK
    name: "{letters}&lCLAN STATS"
    lore:
      - ""
      - " {muted}❙ {letters}Online: {success}%clan_online%"
      - " {muted}❙ {letters}Kills: {success}%clan_kills%"
      - " {muted}❙ {letters}Deaths: {error}%clan_deaths%"
      - " {muted}❙ {letters}KDR: {highlight}%clan_kdr%"
      - " {muted}❙ {letters}Playtime: {info}%clan_playtime%"
      - ""

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Click to go back'
    actions:
      - "exyliaclans:open_clan_info_by_id %clan_id%"
