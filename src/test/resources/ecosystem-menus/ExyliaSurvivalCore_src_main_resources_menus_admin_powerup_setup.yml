title: "{primary}&lPOWERUP {muted}— {highlight}%pu_name%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 1
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%pu_name%"
      - ""
      - " {muted}❙ {letters}Name shown in holograms"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:pu_edit_name"

  icon:
    slot: 3
    material: "%pu_icon%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%pu_icon%"
      - ""
      - " {muted}❙ {letters}Item shown as ItemDisplay"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:pu_set_icon"

  glow:
    slot: 5
    material: "%pu_glow_material%"
    name: "{highlight}&lGLOW"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %pu_glow_status%"
      - ""
      - " {muted}❙ {letters}Makes the item glow"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:pu_toggle_glow"

  glow-color:
    slot: 7
    material: "%pu_glow_color_material%"
    name: "{highlight}&lGLOW COLOR"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%pu_glow_color%"
      - ""
      - " {muted}❙ {letters}Color of the glow outline"
      - ""
      - "{info}» Click to cycle"
    actions:
      - "survivalcore:pu_cycle_glow_color"

  weight:
    slot: 11
    material: COMPARATOR
    name: "{highlight}&lWEIGHT"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%pu_weight%"
      - ""
      - " {muted}❙ {letters}Relative chance for weighted selection"
      - ""
      - " {success}● {info}Left-click {muted}+10"
      - " {error}● {info}Right-click {muted}-10"
      - " {success}● {info}Shift+Left {muted}+50"
      - " {error}● {info}Shift+Right {muted}-50"
    actions:
      - "left: survivalcore:pu_adjust_weight 10"
      - "right: survivalcore:pu_adjust_weight -10"
      - "shift_left: survivalcore:pu_adjust_weight 50"
      - "shift_right: survivalcore:pu_adjust_weight -50"

  effects:
    slot: 29
    material: SPLASH_POTION
    name: "{highlight}&lPOTION EFFECTS"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%pu_effects_count%"
      - ""
      - " {muted}❙ {letters}Effects applied on pickup"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:pu_open_effects"

  rewards:
    slot: 33
    material: CHEST
    name: "{highlight}&lREWARDS"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%pu_rewards_count%"
      - ""
      - " {muted}❙ {letters}Rewards given on pickup"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:pu_open_rewards"

  back:
    slot: 45
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to zone powerups"
    actions:
      - "survivalcore:pu_zone_open_entries"

  remove:
    slot: 53
    material: BARRIER
    name: "{error}&lREMOVE FROM ZONE"
    lore:
      - ""
      - " {error}» Click to remove this powerup"
    actions:
      - "survivalcore:pu_zone_remove_entry %pu_id%"
