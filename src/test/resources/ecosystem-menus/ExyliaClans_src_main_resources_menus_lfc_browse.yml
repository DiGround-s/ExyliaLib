title: "{primary}&lLOOKING FOR CLAN {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 40

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No active applications"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "playerhead-%profile_name%"
    name: "{primary}&l%profile_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Posted: {highlight}%profile_posted%"
      - " {muted}❙ {letters}Expires: {highlight}%profile_expires%"
      - ""
      - "%profile_summary%"
      - ""
      - "{info}» Click to invite to your clan"
    actions:
      - "exyliaclans:lfc_invite_player %profile_name%"

  navigation:
    previous:
      slot: 45
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS'
      lore:
        - ' {muted}Previous page'
        - ''
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT →'
      lore:
        - ' {muted}Next page'
        - ''
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  post_profile:
    slot: 47
    material: WRITABLE_BOOK
    name: "{success}&lCREATE APPLICATION"
    condition: "%lfc_state% == none"
    lore:
      - ""
      - " {muted}❙ {letters}Create your profile and appear"
      - " {muted}❙ {letters}in this list to be found."
      - ""
      - "{info}» Click to apply"
    actions:
      - "exyliaclans:open_lfc_create"

  my_profile_active:
    slot: 46
    material: WRITABLE_BOOK
    name: "{primary}&lMY APPLICATION"
    condition: "%lfc_state% == active"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %my_profile_status%"
      - " {muted}❙ {letters}Posted: {highlight}%my_profile_posted%"
      - " {muted}❙ {letters}Expires: {highlight}%my_profile_expires%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "exyliaclans:open_lfc_edit"

  my_profile_expired:
    slot: 45
    material: BOOK
    name: "{error}&lEXPIRED APPLICATION"
    condition: "%lfc_state% == expired"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %my_profile_status%"
      - " {muted}❙ {letters}Posted: {highlight}%my_profile_posted%"
      - ""
      - " {muted}Edit and repost to appear"
      - " {muted}in the list again."
      - ""
      - "{info}» Click to edit and renew"
    actions:
      - "exyliaclans:open_lfc_edit"

  renew_profile:
    slot: 47
    material: LIME_WOOL
    name: "{success}&lRENEW WITHOUT CHANGES"
    condition: "%lfc_state% == expired"
    lore:
      - ""
      - " {muted}❙ {letters}Renew your application"
      - " {muted}❙ {letters}without modifying anything."
      - ""
      - "{info}» Click to renew"
    actions:
      - "exyliaclans:lfc_renew_profile"

  cancel_profile:
    slot: 48
    material: RED_WOOL
    name: "{error}&lCANCEL APPLICATION"
    condition: "%lfc_state% != none"
    lore:
      - ""
      - " {muted}❙ {letters}Remove your application"
      - " {muted}❙ {letters}from the list."
      - ""
      - "{error}» Click to cancel"
    actions:
      - "exyliaclans:lfc_cancel_profile"

  close:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{error}&lCLOSE"
    lore:
      - "{muted}Close menu"
    actions:
      - "exyliaclans:close_menu"
