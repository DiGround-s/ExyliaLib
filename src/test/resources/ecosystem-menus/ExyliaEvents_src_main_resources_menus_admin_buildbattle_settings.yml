title: "{primary}&lBUILD BATTLE SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  theme-vote-duration:
    slot: 19
    material: BOOK
    name: "{info}&lTHEME VOTE TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%theme_vote_duration%s"
      - " {letters_black}▎ {letters}Time to vote the building theme"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting theme-vote-duration 5"
      - "right: events:adjust_setting theme-vote-duration -5"
      - "shift_left: events:input_setting theme-vote-duration"

  theme-options:
    slot: 20
    material: WRITABLE_BOOK
    name: "{info}&lTHEMES PER VOTE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%theme_options%"
      - " {letters_black}▎ {letters}Themes offered each round"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting theme-options 1"
      - "right: events:adjust_setting theme-options -1"
      - "shift_left: events:input_setting theme-options"

  build-duration:
    slot: 21
    material: CLOCK
    name: "{info}&lBUILD DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%build_duration%s"
      - " {letters_black}▎ {letters}Time each player has to build"
      - ""
      - " {letters_black}▎ {success}Left-Click +30s"
      - " {letters_black}▎ {error}Right-Click -30s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting build-duration 30"
      - "right: events:adjust_setting build-duration -30"
      - "shift_left: events:input_setting build-duration"

  vote-duration-per-plot:
    slot: 22
    material: PAPER
    name: "{info}&lVOTE TIME PER PLOT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%vote_duration_per_plot%s"
      - " {letters_black}▎ {letters}Time to rate each plot in-world"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting vote-duration-per-plot 5"
      - "right: events:adjust_setting vote-duration-per-plot -5"
      - "shift_left: events:input_setting vote-duration-per-plot"

  results-duration:
    slot: 23
    material: NETHER_STAR
    name: "{info}&lRESULTS DURATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%results_duration%s"
      - " {letters_black}▎ {letters}Time the podium stays visible"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting results-duration 5"
      - "right: events:adjust_setting results-duration -5"
      - "shift_left: events:input_setting results-duration"

  restore-themes:
    slot: 24
    material: ENCHANTED_BOOK
    name: "{warning}&lRESTORE DEFAULT THEMES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Loaded themes {letters_black}» {info}%theme_count%"
      - " {letters_black}▎ {letters}Edit them in {highlight}buildbattle-themes.yml"
      - " {letters_black}▎ {letters}to translate or add your own."
      - ""
      - "{error}⚠ This overwrites the current list"
      - ""
      - "{warning}➥ Click to restore defaults"
      - ""
    actions:
      - "events:restore_buildbattle_themes"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
