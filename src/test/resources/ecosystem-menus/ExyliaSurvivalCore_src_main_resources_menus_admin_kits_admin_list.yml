      - " {letters_black}▎ {letters}Bonuses {letters_black}» {info}%kit_commands%"
      - " {letters_black}▎ {letters}Cooldown {letters_black}» {info}%kit_cooldown%"
      - " {letters_black}▎ {letters}Max uses {letters_black}» {info}%kit_max_uses%"
      - " {letters_black}▎ {letters}Sort order {letters_black}» {info}%kit_sort_order%"
