# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every kit there is. A row is drawn by whether the kit is switched on.

title: "{primary}&lKIT ADMIN {letters_black}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "BLOCK_CHEST_OPEN|0.7|1.4"
click_sounds:
  - "UI_BUTTON_CLICK|0.6|1.6"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "0-8,45-53"

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{letters_black}&lNO KITS YET"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create one with the button above."
      - ""

pagination:
  slots: '0-35'

  enabled_template:
    material: "%kit_icon%"
    name: "{primary}&l%kit_name% {letters_black}%kit_id%"
    lore:
      - ""
      - "{secondary}Setup:"
      - " {letters_black}▎ {letters}Status {letters_black}» {success}Enabled"
      - " {letters_black}▎ {letters}Items {letters_black}» {info}%kit_items%"
      - " {letters_black}▎ {letters}Bonuses {letters_black}» {info}%kit_commands%"
      - " {letters_black}▎ {letters}Cooldown {letters_black}» {info}%kit_cooldown%"
