title: "{primary}&lTP REGION {muted}· {highlight}%region_name%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 4
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%region_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "sandbox:input_tp_region_field name"

  info:
    slot: 5
    material: BEACON
    name: "{highlight}&l%region_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {info}%region_id%"
      - " {letters_black}▎ {letters}World: {info}%region_world%"
      - " {letters_black}▎ {letters}Interval: {info}%region_interval%s"
      - " {letters_black}▎ {letters}Target: {info}%region_target_world%"
      - " {letters_black}▎ {letters}Spread: {info}%region_spread% blocks"
    hide_tooltip: false

  edit-bounds:
    slot: 20
    material: BLAZE_ROD
    name: "{warning}&lEDIT BOUNDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}World: {info}%region_world%"
      - ""
      - "{warning}➥ Click to get wand"
    actions:
      - "sandbox:tp_region_edit_bounds"

  target-world:
    slot: 21
    material: GRASS_BLOCK
    name: "{info}&lTARGET WORLD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%region_target_world%"
      - " {letters_black}▎ {muted}Random = picks any available world"
      - ""
      - "{warning}➥ Click to cycle"
    actions:
      - "sandbox:cycle_tp_region_world"

  interval:
    slot: 23
    material: CLOCK
    name: "{info}&lINTERVAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%region_interval%s"
      - ""
      - " {letters_black}▎ {success}Left-Click +10s"
      - " {letters_black}▎ {error}Right-Click -10s"
      - " {letters_black}▎ {warning}Shift-click to enter"
    actions:
      - "left: sandbox:adjust_tp_region_field interval 10"
      - "right: sandbox:adjust_tp_region_field interval -10"
      - "shift_left: sandbox:input_tp_region_field interval"

  spread:
    slot: 24
    material: FIREWORK_ROCKET
    name: "{info}&lSPREAD RADIUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%region_spread% blocks"
      - " {letters_black}▎ {muted}Distance between players on TP"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
    actions:
      - "left: sandbox:adjust_tp_region_field spread 1"
      - "right: sandbox:adjust_tp_region_field spread -1"

  back:
    slot: 31
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Discard changes"
    actions:
      - "sandbox:open_tp_region_list"

  save:
    slot: 27
    material: EMERALD
    name: "{success}&lSAVE REGION"
    lore:
      - ""
      - "{warning}➥ Click to save"
    actions:
      - "sandbox:save_tp_region"

  delete:
    slot: 35
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "%region_delete_label%"
    lore:
      - ""
      - " {letters_black}▎ {error}Delete this TP region permanently"
      - ""
      - "{error}➥ Click to delete"
    actions:
      - "sandbox:delete_tp_region %region_id%"
