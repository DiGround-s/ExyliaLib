# ╔══════════════════════════════════════════════════════════════════╗
# ║  !! WARNING !! - DO NOT EDIT THIS FILE MANUALLY                  ║
# ║  This file is AUTOMATICALLY REGENERATED on every plugin startup. ║
# ║  Any changes made here WILL BE LOST.                             ║
# ╚══════════════════════════════════════════════════════════════════╝

title: "{primary}&lTP REGION {muted}· {highlight}%region_name%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 2
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%region_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "sandbox:input_tp_region_field name"

  info:
    slot: 4
    material: BEACON
    name: "{highlight}&l%region_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%region_id%"
      - " {muted}❙ {letters}World: {info}%region_world%"
      - " {muted}❙ {letters}Interval: {info}%region_interval%s"
      - " {muted}❙ {letters}Target: {info}%region_target_world%"
      - " {muted}❙ {letters}Spread: {info}%region_spread% blocks"
    hide_tooltip: false

  edit-bounds:
    slot: 6
    material: BLAZE_ROD
    name: "{warning}&lEDIT BOUNDS"
    lore:
      - ""
      - " {muted}❙ {letters}World: {info}%region_world%"
      - ""
      - "{info}» Click to get wand"
    actions:
      - "sandbox:tp_region_edit_bounds"

  target-world:
    slot: 21
    material: GRASS_BLOCK
    name: "{info}&lTARGET WORLD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%region_target_world%"
      - " {muted}❙ {muted}Random = picks any available world"
      - ""
      - "{info}» Click to cycle"
    actions:
      - "sandbox:cycle_tp_region_world"

  interval:
    slot: 22
    material: CLOCK
    name: "{info}&lINTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%region_interval%s"
      - ""
      - " {muted}❙ {success}Left-Click +10s"
      - " {muted}❙ {error}Right-Click -10s"
      - " {muted}❙ {warning}Shift-click to enter"
    actions:
      - "left: sandbox:adjust_tp_region_field interval 10"
      - "right: sandbox:adjust_tp_region_field interval -10"
      - "shift_left: sandbox:input_tp_region_field interval"

  spread:
    slot: 23
    material: FIREWORK_ROCKET
    name: "{info}&lSPREAD RADIUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%region_spread% blocks"
      - " {muted}❙ {muted}Distance between players on TP"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
    actions:
      - "left: sandbox:adjust_tp_region_field spread 1"
      - "right: sandbox:adjust_tp_region_field spread -1"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Discard changes"
    actions:
      - "sandbox:open_tp_region_list"

  save:
    slot: 49
    material: EMERALD
    name: "{success}&lSAVE REGION"
    lore:
      - ""
      - "{info}» Click to save"
    actions:
      - "sandbox:save_tp_region"

  delete:
    slot: 51
    material: "%region_delete_material%"
    name: "%region_delete_label%"
    lore:
      - ""
      - " {muted}❙ {error}Delete this TP region permanently"
      - ""
      - "{error}» Click to delete"
    actions:
      - "sandbox:delete_tp_region %region_id%"
