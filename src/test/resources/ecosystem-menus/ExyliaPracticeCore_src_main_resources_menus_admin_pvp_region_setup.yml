title: "{primary}&lPVP REGION: %pvp_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%display_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "practice:pvp_edit_name"

  kit:
    slot: 37
    material: "%kit_material%"
    name: "{highlight}&lKIT"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %kit_status%"
      - ""
      - " {muted}❙ {letters}Hold the desired items in your inventory"
      - " {muted}❙ {letters}then click to save as the PvP kit"
      - ""
      - " {muted}❙ {success}Left-Click to save current inventory"
      - " {muted}❙ {error}Right-Click to clear kit"
    actions:
      - "left: practice:pvp_set_kit"
      - "right: practice:pvp_clear_kit"

  region:
    slot: 19
    material: "%region_material%"
    name: "{highlight}&lPVP REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Area where PvP is allowed"
      - ""
      - "{info}» Click to select"
    actions:
      - "practice:pvp_set_region"

  enabled:
    slot: 5
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - ""
      - " {muted}❙ {letters}Disable to block entry for maintenance"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_enabled"

  combat-tag:
    slot: 38
    material: CLOCK
    name: "{highlight}&lCOMBAT TAG"
    lore:
      - ""
      - " {muted}❙ {letters}Duration: {highlight}%combat_tag%s"
      - ""
      - " {muted}❙ {letters}Players cannot leave during combat"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click +5"
      - " {muted}❙ {error}Shift-Right -5"
    actions:
      - "left: practice:pvp_adjust_combat_tag 1"
      - "right: practice:pvp_adjust_combat_tag -1"
      - "shift_left: practice:pvp_adjust_combat_tag 5"
      - "shift_right: practice:pvp_adjust_combat_tag -5"

  flag-build:
    slot: 39
    material: "%build_material%"
    name: "{highlight}&lFLAG: BUILD"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %build_status%"
      - ""
      - " {muted}❙ {letters}Allow placing blocks"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_build"

  flag-break:
    slot: 40
    material: "%break_material%"
    name: "{highlight}&lFLAG: BREAK"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %break_status%"
      - ""
      - " {muted}❙ {letters}Allow breaking blocks"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_break"

  flag-drop:
    slot: 41
    material: "%drop_material%"
    name: "{highlight}&lFLAG: DROP ITEMS"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %drop_status%"
      - ""
      - " {muted}❙ {letters}Allow dropping items"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_drop"

  flag-regen:
    slot: 42
    material: "%regen_material%"
    name: "{highlight}&lFLAG: NATURAL REGEN"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %regen_status%"
      - ""
      - " {muted}❙ {letters}Allow natural health regen"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_regen"

  flag-hunger:
    slot: 43
    material: "%hunger_material%"
    name: "{highlight}&lFLAG: HUNGER"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %hunger_status%"
      - ""
      - " {muted}❙ {letters}Allow hunger depletion"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "practice:pvp_toggle_hunger"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this PvP region"
      - ""
      - "{error}» Click to delete"
    actions:
      - "practice:pvp_confirm_delete %pvp_id%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to PvP region list"
    actions:
      - "practice:pvp_open_regions"
