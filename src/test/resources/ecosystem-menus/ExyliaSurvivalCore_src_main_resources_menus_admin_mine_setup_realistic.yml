title: "{primary}&lREALISTIC MINE: %mine_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 1
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%mine_name%"
      - ""
      - "{info}» Click to change"
    actions:
      - "survivalcore:mine_edit_name"

  enabled:
    slot: 3
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %enabled_status%"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_enabled"

  region:
    slot: 5
    material: "%region_material%"
    name: "{highlight}&lMINE AREA"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Select the area where configured"
      - " {muted}❙ {letters}realistic blocks will regenerate"
      - ""
      - "{info}» Click to select with wand"
    actions:
      - "survivalcore:mine_set_region"

  permission:
    slot: 7
    material: PAPER
    name: "{highlight}&lACCESS PERMISSION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%permission_value%"
      - ""
      - " {muted}❙ {letters}Leave empty to allow everyone"
      - ""
      - "{info}» Click to set"
      - "{error}» Shift-Click to clear"
    actions:
      - "left: survivalcore:mine_set_permission"
      - "shift_left: survivalcore:mine_clear_permission"

  levels:
    slot: 20
    material: DIAMOND_PICKAXE
    name: "{highlight}&lREGEN LEVELS"
    lore:
      - ""
      - " {muted}❙ {letters}Configured: {highlight}%levels_count%"
      - ""
      - " {muted}❙ {letters}Add each block material manually."
      - " {muted}❙ {letters}Configure regen, degradation and loot"
      - " {muted}❙ {letters}independently for every level."
      - ""
      - "{info}» Click to manage and add"
    actions:
      - "survivalcore:mine_open_levels"

  break-effects:
    slot: 21
    material: NOTE_BLOCK
    name: "{highlight}&lBREAK EFFECTS"
    lore:
      - ""
      - " {muted}❙ {letters}Configured: %break_effects_status%"
      - ""
      - " {muted}❙ {letters}Sounds, particles, titles and more"
      - " {muted}❙ {letters}played when any block of this mine"
      - " {muted}❙ {letters}is mined."
      - ""
      - " {muted}❙ {letters}A level with its own effects"
      - " {muted}❙ {warning}overrides {letters}these."
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:mine_open_effects"

  auto-pickup:
    slot: 23
    material: "%auto_pickup_material%"
    name: "{highlight}&lAUTO-PICKUP"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %auto_pickup_status%"
      - ""
      - " {muted}❙ {letters}Custom loot goes straight into the"
      - " {muted}❙ {letters}player's inventory instead of"
      - " {muted}❙ {letters}dropping on the ground"
      - " {muted}❙ {muted}(overflow still drops normally)"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_auto_pickup"

  restrict-breaking:
    slot: 24
    material: "%restrict_breaking_material%"
    name: "{highlight}&lRESTRICT BREAKING"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %restrict_breaking_status%"
      - ""
      - " {muted}❙ {letters}Blocks breaking any material NOT"
      - " {muted}❙ {letters}listed in the regen levels —"
      - " {muted}❙ {letters}useful to protect decoration"
      - " {muted}❙ {letters}like fences, lanterns or signs"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:mine_toggle_restrict_breaking"

  back:
    slot: 36
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to mine list"
    actions:
      - "survivalcore:mine_open_list"

  delete:
    slot: 40
    material: BARRIER
    name: "{error}&lDELETE MINE"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this mine"
      - ""
      - "{error}» Click to delete"
    actions:
      - "survivalcore:mine_delete %mine_id%"
