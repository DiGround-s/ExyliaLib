# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lREALISTIC MINE: %mine_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lDISPLAY NAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%mine_name%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "survivalcore:mine_edit_name"

  enabled:
    slot: 5
    material: "%enabled_material%"
    name: "{highlight}&lENABLED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %enabled_status%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:mine_toggle_enabled"

  region:
    slot: 11
    material: "%region_material%"
    name: "%region_color%&lMINE AREA"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %region_status%"
      - ""
      - " {letters_black}▎ {letters}Select the area where configured"
      - " {letters_black}▎ {letters}realistic blocks will regenerate"
      - ""
      - "{warning}➥ Click to select with wand"
    actions:
      - "survivalcore:mine_set_region"

  permission:
    slot: 6
    material: PAPER
    name: "{highlight}&lACCESS PERMISSION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%permission_value%"
      - ""
      - " {letters_black}▎ {letters}Leave empty to allow everyone"
      - ""
      - "{warning}➥ Click to set"
      - "{error}➥ Shift-Click to clear"
    actions:
      - "left: survivalcore:mine_set_permission"
      - "shift_left: survivalcore:mine_clear_permission"

  levels:
    slot: 12
    material: DIAMOND_PICKAXE
    name: "{highlight}&lREGEN LEVELS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configured: {highlight}%levels_count%"
      - ""
      - " {letters_black}▎ {letters}Add each block material manually."
      - " {letters_black}▎ {letters}Configure regen, degradation and loot"
      - " {letters_black}▎ {letters}independently for every level."
      - ""
      - "{warning}➥ Click to manage and add"
    actions:
      - "survivalcore:mine_open_levels"

  break-effects:
    slot: 13
    material: NOTE_BLOCK
    name: "{highlight}&lBREAK EFFECTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configured: %break_effects_status%"
      - ""
      - " {letters_black}▎ {letters}Sounds, particles, titles and more"
      - " {letters_black}▎ {letters}played when any block of this mine"
      - " {letters_black}▎ {letters}is mined."
      - ""
      - " {letters_black}▎ {letters}A level with its own effects"
      - " {letters_black}▎ {warning}overrides {letters}these."
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "survivalcore:mine_open_effects"

  auto-pickup:
    slot: 15
    material: "%auto_pickup_material%"
    name: "%auto_pickup_color%&lAUTO-PICKUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %auto_pickup_status%"
      - ""
      - " {letters_black}▎ {letters}Custom loot goes straight into the"
      - " {letters_black}▎ {letters}player's inventory instead of"
      - " {letters_black}▎ {letters}dropping on the ground"
      - " {letters_black}▎ {muted}(overflow still drops normally)"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:mine_toggle_auto_pickup"

  restrict-breaking:
    slot: 16
    material: "%restrict_breaking_material%"
    name: "%restrict_breaking_color%&lRESTRICT BREAKING"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %restrict_breaking_status%"
      - ""
      - " {letters_black}▎ {letters}Blocks breaking any material NOT"
      - " {letters_black}▎ {letters}listed in the regen levels —"
      - " {letters_black}▎ {letters}useful to protect decoration"
      - " {letters_black}▎ {letters}like fences, lanterns or signs"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "survivalcore:mine_toggle_restrict_breaking"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to mine list"
    actions:
      - "survivalcore:mine_open_list"

  delete:
    slot: 26
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE MINE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Permanently delete this mine"
      - ""
      - "{error}➥ Click to delete"
    actions:
      - "survivalcore:mine_delete %mine_id%"
