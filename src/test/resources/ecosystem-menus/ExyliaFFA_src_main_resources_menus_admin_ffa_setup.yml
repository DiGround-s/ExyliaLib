      - "ffa:input_permission"

  regen-time:
    slot: 40
    material: CLOCK
    name: "{info}&lREGENERATION TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%regen_time%"
      - ""
