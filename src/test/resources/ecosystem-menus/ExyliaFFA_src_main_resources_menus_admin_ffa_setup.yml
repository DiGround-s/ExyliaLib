    actions:
      - "ffa:open_rules_menu"

  protected-shape:
    slot: 24
    material: COMPASS
    name: "{info}&lPROTECTED SHAPE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%protected_shape%"
      - ""
      - " {letters_black}▎ {letters}SPHERE: Spherical distance"
      - " {letters_black}▎ {letters}CUBOID: Box-shaped"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_protected_shape"

  protected-mode:
    slot: 25
    material: SPYGLASS
    name: "{info}&lPROTECTED MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%protected_mode%"
      - ""
      - " {letters_black}▎ {letters}NORMAL: Uses Y axis"
      - " {letters_black}▎ {letters}EXPANDED_VERT: Full height"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_protected_mode"

  toggle-enabled:
    slot: 5
    material: "%enabled_material%"
    name: "%enabled_color%&lTOGGLE ARENA"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %enabled_status%"
      - ""
      - " {letters_black}▎ {letters}Disabled arenas cannot"
      - " {letters_black}▎ {letters}be joined or spectated"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_arena_enabled"

  expel-all:
    slot: 53
    material: BARRIER
    name: "{error}&lEXPEL ALL PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Remove all players"
      - " {letters_black}▎ {letters}from this FFA"
      - ""
      - "{warning}➥ Click to expel all"
    actions:
      - "ffa:confirm_expel_all"

  force-regen:
    slot: 45
    material: ANVIL
    name: "{warning}&lFORCE REGENERATE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Force arena regeneration"
      - " {letters_black}▎ {letters}from saved schematic"
