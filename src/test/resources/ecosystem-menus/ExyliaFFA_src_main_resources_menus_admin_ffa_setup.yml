      - "left: ffa:adjust_regen_time 30"
      - "right: ffa:adjust_regen_time -30"

  priority:
    slot: 33
    material: LADDER
    name: "{info}&lPRIORITY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%arena_priority%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +10"
      - " {letters_black}▎ {error}Shift-Right -10"
    actions:
      - "left: ffa:adjust_arena_priority 1"
      - "right: ffa:adjust_arena_priority -1"
      - "shift_left: ffa:adjust_arena_priority 10"
      - "shift_right: ffa:adjust_arena_priority -10"

  rules:
    slot: 39
    material: COMMAND_BLOCK
    name: "{warning}&lRULES"
    lore:
