title: "{primary}&lFFA: %arena_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "ffa:edit_arena_name"

  icon:
    slot: 2
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "ffa:set_arena_icon"

  max-players:
    slot: 32
    material: PLAYER_HEAD
    name: "{info}&lMAX PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%max_players%"
      - ""
      - " {letters_black}▎ {success}Left-Click +5"
      - " {letters_black}▎ {error}Right-Click -5"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: ffa:adjust_max_players 5"
      - "right: ffa:adjust_max_players -5"
      - "shift_left: ffa:input_max_players"

  kit-mode:
    slot: 31
    material: ENCHANTED_BOOK
    name: "{warning}&lKIT MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%kit_mode%"
      - ""
      - " {letters_black}▎ {letters}SELECTABLE: Player picks kit"
      - " {letters_black}▎ {letters}RANDOM: Random kit assigned"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_kit_mode"

  reset-kit:
    slot: 42
    material: "%reset_kit_material%"
    name: "%reset_kit_color%&lRESET KIT AFTER KILL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%reset_kit%"
      - ""
      - " {letters_black}▎ {letters}If enabled, killer's kit"
      - " {letters_black}▎ {letters}refreshes on each kill"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_reset_kit"

  kits:
    slot: 30
    material: "%kit_material%"
    name: "%kit_color%&lMANAGE KITS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Kits: {highlight}%kit_count%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "ffa:open_kit_list"

  spawns:
    slot: 21
    material: "%spawn_material%"
    name: "%spawn_color%&lMANAGE SPAWNS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Spawns: {highlight}%spawn_count%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "ffa:open_spawn_list"

  bounds:
    slot: 19
    material: "%bounds_material%"
    name: "%bounds_color%&lSET BOUNDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Bounds: %bounds_status%"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "ffa:set_bounds"

  schematic:
    slot: 20
    material: "%schematic_material%"
    name: "%schematic_color%&lSCHEMATIC"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %schematic_exists%"
      - ""
      - " {letters_black}▎ {success}Left-Click to save"
      - " {letters_black}▎ {warning}Right-Click to restore"
    actions:
      - "left: ffa:save_schematic"
      - "right: ffa:restore_schematic"

  protected-radius:
    slot: 23
    material: SHIELD
    name: "{info}&lPROTECTED RADIUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%protected_radius% {letters}blocks"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +5"
      - " {letters_black}▎ {error}Shift-Right -5"
    actions:
      - "left: ffa:adjust_protected_radius 1"
      - "right: ffa:adjust_protected_radius -1"
      - "shift_left: ffa:adjust_protected_radius 5"
      - "shift_right: ffa:adjust_protected_radius -5"

  save-inventory-on-leave:
    slot: 41
    material: "%save_inventory_material%"
    name: "%save_inventory_color%&lSAVE INVENTORY ON LEAVE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%save_inventory_on_leave%"
      - ""
      - " {letters_black}▎ {letters}Saves player inventory"
      - " {letters_black}▎ {letters}on clean leave (no combat)"
      - " {letters_black}▎ {letters}and restores it on rejoin"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "ffa:toggle_save_inventory_on_leave"

  permission:
    slot: 6
    material: TRIPWIRE_HOOK
    name: "{info}&lPERMISSION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%permission%"
      - ""
      - " {letters_black}▎ {letters}Type 'none' to remove"
      - ""
