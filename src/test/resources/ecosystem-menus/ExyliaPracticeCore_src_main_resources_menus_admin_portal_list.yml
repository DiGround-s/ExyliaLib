title: "{primary}&lPORTALS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No portals"
    lore:
      - ""
      - "{muted}Create your first portal!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: ENDER_EYE
    name: "{warning}&l%portal_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%portal_id%"
      - " {muted}❙ {letters}Region: %portal_region_status%"
      - " {muted}❙ {letters}Command: {highlight}%portal_command%"
      - " {muted}❙ {letters}Teleport: %portal_teleport%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: practice:portal_edit %portal_id%"
      - "right: practice:portal_confirm_delete %portal_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE PORTAL"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new portal region"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:portal_create"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to admin panel"
    actions:
      - "practice:open_admin"
