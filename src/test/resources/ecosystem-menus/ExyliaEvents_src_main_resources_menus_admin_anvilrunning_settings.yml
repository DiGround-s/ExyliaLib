title: "{primary}&lANVIL RUNNING SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Anvils rain down from above"
      - " {letters_black}▎ {letters}the arena in waves - no special"
      - " {letters_black}▎ {letters}floor material is required"
      - ""
      - " {letters_black}▎ {error}Touching water eliminates"
      - " {letters_black}▎ {error}a player instantly"
      - ""
      - " {letters_black}▎ {letters}Targeted anvils punish"
      - " {letters_black}▎ {letters}players that stand still"

  grace-period:
    slot: 19
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - " {letters_black}▎ {letters}Period without anvils at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  initial-anvil-rate:
