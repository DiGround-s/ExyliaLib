title: "{primary}&lDATA MANAGEMENT"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  reset-all-stats:
    slot: 12
    material: COMPARATOR
    name: "{error}&lRESET ALL STATS"
    lore:
      - ""
      - " {muted}❙ {letters}Reset stats of ALL players"
      - " {muted}❙ {letters}across ALL arenas"
      - " {muted}❙ {letters}Leaderboards included"
      - ""
      - "{error}» Click to reset"
    actions:
      - "ffa:confirm_reset_all_stats"

  kit-layouts:
    slot: 14
    material: CHEST
    name: "{warning}&lKIT LAYOUTS"
    lore:
      - ""
      - " {muted}❙ {letters}Delete all custom layouts"
      - " {muted}❙ {letters}for a specific kit"
      - ""
      - "{info}» Click to manage"
    actions:
      - "ffa:open_kit_layout_list"

  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to admin panel"
    actions:
      - "ffa:open_admin"
