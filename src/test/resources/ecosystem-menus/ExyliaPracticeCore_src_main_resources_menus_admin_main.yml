title: "{primary}&lPRACTICE ADMIN"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  manage-arenas:
    slot: 20
    material: COMPASS
    name: "{info}&lMANAGE ARENAS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create, edit and delete"
      - " {letters_black}▎ {letters}practice arenas"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_arenas%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:open_arena_list"

  manage-kits:
    slot: 21
    material: DIAMOND_SWORD
    name: "{info}&lMANAGE KITS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create, edit and delete"
      - " {letters_black}▎ {letters}practice kits"
      - ""
      - " {letters_black}▎ {letters}Kits: {highlight}%total_kits%"
      - " {letters_black}▎ {letters}Categories: {highlight}%total_categories%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:open_kit_hub"

  info:
    slot: 4
    material: PAPER
    name: "{warning}&lEXYLIA PRACTICE"
    lore:
      - ""
      - " {letters_black}▎ {letters}1v1 Practice system"
      - ""
      - " {letters_black}▎ {letters}Arenas: {highlight}%total_arenas%"
      - " {letters_black}▎ {letters}Kits: {highlight}%total_kits%"
      - " {letters_black}▎ {letters}Registered Players: {highlight}%registered_players%"
      - " {letters_black}▎ {letters}Active Games: {highlight}%active_games%"
      - " {letters_black}▎ {letters}Queued Players: {highlight}%queued_players%"
      - ""

  manage-pvp-regions:
    slot: 22
    material: IRON_SWORD
    name: "{secondary}&lPVP REGIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create and manage lobby"
      - " {letters_black}▎ {letters}PvP zones with kits"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_pvp_regions%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:pvp_open_regions"

  manage-jumpads:
    slot: 23
    material: SLIME_BLOCK
    name: "{secondary}&lJUMPADS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create and manage lobby"
      - " {letters_black}▎ {letters}launch pads"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_jumpads%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:jumpad_open_list"

  manage-portals:
    slot: 24
    material: ENDER_EYE
    name: "{secondary}&lPORTALS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create and manage portal"
      - " {letters_black}▎ {letters}trigger regions"
      - ""
      - " {letters_black}▎ {letters}Total: {highlight}%total_portals%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:portal_open_list"

  reload:
    slot: 45
    material: REDSTONE
    name: "{error}&lRELOAD"
    lore:
      - ""
      - "{warning}➥ Click to reload plugin"
    actions:
      - "practice:reload"

  manage-data:
    slot: 33
    material: HOPPER
    name: "{secondary}&lDATA MANAGEMENT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Clear stats, reset ELO"
      - " {letters_black}▎ {letters}and manage player data"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:open_data_management"

  server-stats:
    slot: 32
    material: KNOWLEDGE_BOOK
    name: "{info}&lSERVER STATISTICS"
    lore:
      - ""
      - " {letters_black}▎ {letters}View kit, arena and"
      - " {letters_black}▎ {letters}category usage rankings"
      - ""
      - "{warning}➥ Click to view"
    actions:
      - "practice:open_admin_stats"

  set-kit-editor:
    slot: 30
    material: CRAFTING_TABLE
    name: "{secondary}&lSET KIT EDITOR SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %kit_editor_status%"
      - ""
      - "{warning}➥ Click to set"
    actions:
      - "practice:set_kit_editor_spawn"

  set-lobby:
    slot: 29
    material: RED_BED
    name: "{secondary}&lSET LOBBY SPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %lobby_status%"
      - ""
      - "{warning}➥ Click to set"
    actions:
      - "practice:set_lobby"
