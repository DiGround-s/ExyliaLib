title: "{primary}&lSANDBOX WORLDS {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No configured worlds"
    lore:
      - ""
      - "{muted}Create a world with the button below"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%world_material%"
    name: "{highlight}&l%world_name%"
    glow: "%world_glow%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%world_id%"
      - " {muted}❙ {letters}Type: {info}%world_type%"
      - " {muted}❙ {letters}Status: %world_status%"
      - " {muted}❙ {letters}Players: {info}%world_players%"
      - " {muted}❙ {letters}Biome: {info}%world_biome%"
      - " {muted}❙ {letters}Border: {info}%world_border%"
      - " {muted}❙ {letters}Folder: {info}%world_folder%"
      - ""
      - " {muted}❙ {success}Left-click to configure"
      - " {muted}❙ {warning}Right-click to teleport"
    actions:
      - "left: sandbox:open_world_config %world_id%"
      - "right: sandbox:teleport_to_world %world_id%"

  navigation:
    previous:
      slot: 30
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  reset_defaults:
    slot: 2
    material: COMPARATOR
    name: "{error}&lReset to Defaults"
    lore:
      - ""
      - " {muted}❙ {letters}Removes all world configs"
      - " {muted}❙ {error}and restores the default ones"
      - ""
      - "{error}» Click to reset"
    actions:
      - "sandbox:confirm_world_reset_defaults"

  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE WORLD"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new sandbox world"
      - " {muted}❙ {letters}with the creation wizard"
      - ""
      - "{info}» Click to create"
    actions:
      - "sandbox:create_world"

  import:
    slot: 6
    material: NETHER_STAR
    name: "{warning}&lIMPORT WORLD"
    lore:
      - ""
      - " {muted}❙ {letters}Import an existing world folder"
      - " {muted}❙ {letters}already on the server"
      - " {muted}❙ {muted}Generation and seed are yours"
      - " {muted}❙ {muted}No automatic resets"
      - ""
      - "{info}» Click to import"
    actions:
      - "sandbox:import_world"

  back:
    slot: 31
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Click to return to admin'
    actions:
      - 'sandbox:open_admin'
