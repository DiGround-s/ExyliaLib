title: "{primary}&lWORLD CONFIG {muted}· {highlight}%world_display_name%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%world_display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "sandbox:input_world_field name"

  info:
    slot: 4
    material: "%world_icon%"
    name: "{highlight}&l%world_display_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {info}%world_id%"
      - " {letters_black}▎ {letters}Status: %world_status%"
      - " {letters_black}▎ {letters}Players: {info}%world_players%"
    hide_tooltip: false

  icon:
    slot: 2
    material: "%world_icon%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%world_icon%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "sandbox:input_world_field icon"

  biome:
    slot: 19
    material: GRASS_BLOCK
    name: "{info}&lBIOME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%world_biome%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "sandbox:input_world_field biome"

  seed:
    slot: 20
    material: WHEAT_SEEDS
    name: "{info}&lSEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%world_seed%"
      - ""
      - " {letters_black}▎ {success}Left-click to edit"
      - " {letters_black}▎ {warning}Shift-click for random"
    actions:
      - "left: sandbox:input_world_field seed"
      - "shift_left: sandbox:random_world_seed"

  generation-preset:
    slot: 21
    material: BOOKSHELF
    name: "{secondary}&lGENERATION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Preset: {info}%world_gen_preset%"
      - " {letters_black}▎ {letters}Affects the next reset"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "sandbox:cycle_world_preset"

  border:
    slot: 23
    material: GLASS
    name: "{info}&lBORDER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%world_border%"
      - ""
      - " {letters_black}▎ {success}Left-Click +500"
      - " {letters_black}▎ {error}Right-Click -500"
      - " {letters_black}▎ {warning}Shift-click to enter"
    actions:
      - "left: sandbox:adjust_world_field border 500"
      - "right: sandbox:adjust_world_field border -500"
      - "shift_left: sandbox:input_world_field border"

  gamerules:
    slot: 24
    material: COMMAND_BLOCK
    name: "{secondary}&lGAMERULES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Difficulty: {info}%world_difficulty%"
      - " {letters_black}▎ {letters}Configure world rules"
      - ""
      - "{warning}➥ Click to open"
    actions:
      - "sandbox:open_world_settings"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Discard changes"
    actions:
      - "sandbox:open_world_list"

  teleport:
    slot: 28
    material: ENDER_PEARL
    name: "{warning}&lTELEPORT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Teleport to the spawn"
      - " {letters_black}▎ {letters}of this world"
      - ""
      - "{warning}➥ Click to teleport"
    actions:
      - "sandbox:teleport_to_world %world_id%"

  save:
    slot: 45
    material: EMERALD
    name: "{success}&lSAVE WORLD"
    lore:
      - ""
      - "{warning}➥ Click to save"
    actions:
      - "sandbox:save_world"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "%world_delete_name%"
    lore:
      - ""
      - " {letters_black}▎ {error}Delete this world permanently"
      - ""
      - "{error}➥ Click to delete"
    actions:
      - "sandbox:confirm_delete_world %world_id%"

  players:
    slot: 29
    material: PLAYER_HEAD
    name: "{highlight}&lPLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Online: {info}%world_players% players"
      - ""
      - "{warning}➥ Click to view"
    actions:
      - "sandbox:open_world_players %world_id%"
