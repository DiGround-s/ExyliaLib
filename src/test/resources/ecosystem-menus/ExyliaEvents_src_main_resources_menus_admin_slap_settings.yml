title: "{primary}&lSLAP SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Mark capture areas with"
      - " {letters_black}▎ {highlight}Red Concrete"
      - ""
      - " {letters_black}▎ {letters}Standing on it awards 1 point"
      - " {letters_black}▎ {letters}per tick to that player"
