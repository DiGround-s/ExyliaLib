    material: DIAMOND
    name: "{info}&lPOINTS TO WIN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%points_to_win%"
      - ""
      - " {letters_black}▎ {success}Left-Click +10"
      - " {letters_black}▎ {error}Right-Click -10"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting points-to-win 10"
      - "right: events:adjust_setting points-to-win -10"
      - "shift_left: events:input_setting points-to-win"

  respawn-delay:
