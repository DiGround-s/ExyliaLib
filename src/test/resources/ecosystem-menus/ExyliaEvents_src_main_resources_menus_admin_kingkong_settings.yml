title: "{error}&lKING KONG SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}One random player becomes"
      - " {letters_black}▎ {highlight}the Kong"
      - " {letters_black}▎ {letters}Only the Kong can deal damage;"
      - " {letters_black}▎ {letters}runners cannot hurt the Kong"
      - ""
      - " {letters_black}▎ {letters}Place a {highlight}Gold Pressure Plate"
      - " {letters_black}▎ {letters}(Light Weighted) at the top"
      - ""
      - " {letters_black}▎ {letters}Any runner who reaches it"
      - " {letters_black}▎ {success}wins instantly {letters}for everyone"

  runner-respawn:
    slot: 11
    material: "%runner_respawn_material%"
    name: "%runner_respawn_color%&lRUNNER RESPAWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %runner_respawn%"
      - ""
      - " {letters_black}▎ {letters}Whether runners respawn"
      - " {letters_black}▎ {letters}on death or are eliminated"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_kingkong_setting runner-respawn"

  respawn-delay:
    slot: 12
    material: CLOCK
    name: "{warning}&lRESPAWN DELAY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {letters_black}▎ {letters}Time before respawning"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  kong-speed-level:
    slot: 13
    material: SUGAR
    name: "{error}&lKONG SPEED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Level: {highlight}%kong_speed_level%"
      - ""
      - " {letters_black}▎ {letters}Speed level for the Kong"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
    actions:
      - "left: events:adjust_setting kong-speed-level 1"
      - "right: events:adjust_setting kong-speed-level -1"

  kong-glow:
    slot: 14
    material: "%kong_glow_material%"
    name: "%kong_glow_color%&lKONG GLOW EFFECT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %kong_glow%"
      - ""
      - " {letters_black}▎ {letters}The Kong glows to be"
      - " {letters_black}▎ {letters}visible to runners"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_kingkong_setting kong-glow"

  grace-period:
    slot: 15
    material: CLOCK
    name: "{warning}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - ""
      - " {letters_black}▎ {letters}Time without PvP at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
