title: "{error}&lKING KONG SETTINGS"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 0
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {muted}❙ {letters}One random player becomes"
      - " {muted}❙ {highlight}the Kong"
      - " {muted}❙ {letters}Only the Kong can deal damage;"
      - " {muted}❙ {letters}runners cannot hurt the Kong"
      - ""
      - " {muted}❙ {letters}Place a {highlight}Gold Pressure Plate"
      - " {muted}❙ {letters}(Light Weighted) at the top"
      - ""
      - " {muted}❙ {letters}Any runner who reaches it"
      - " {muted}❙ {success}wins instantly {letters}for everyone"

  runner-respawn:
    slot: 10
    material: "%runner_respawn_material%"
    name: "{success}&lRUNNER RESPAWN"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %runner_respawn%"
      - ""
      - " {muted}❙ {letters}Whether runners respawn"
      - " {muted}❙ {letters}on death or are eliminated"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_kingkong_setting runner-respawn"

  respawn-delay:
    slot: 12
    material: CLOCK
    name: "{warning}&lRESPAWN DELAY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {muted}❙ {letters}Time before respawning"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  kong-speed-level:
    slot: 14
    material: SUGAR
    name: "{error}&lKONG SPEED"
    lore:
      - ""
      - " {muted}❙ {letters}Level: {highlight}%kong_speed_level%"
      - ""
      - " {muted}❙ {letters}Speed level for the Kong"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
    actions:
      - "left: events:adjust_setting kong-speed-level 1"
      - "right: events:adjust_setting kong-speed-level -1"

  kong-glow:
    slot: 16
    material: "%kong_glow_material%"
    name: "{info}&lKONG GLOW EFFECT"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %kong_glow%"
      - ""
      - " {muted}❙ {letters}The Kong glows to be"
      - " {muted}❙ {letters}visible to runners"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_kingkong_setting kong-glow"

  grace-period:
    slot: 22
    material: CLOCK
    name: "{warning}&lGRACE PERIOD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%grace_period%s"
      - ""
      - " {muted}❙ {letters}Time without PvP at start"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  back:
    slot: 40
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
