title: "{primary}&lCONTRIBUTIONS {muted}» {letters}%bounty_target%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No contributions"
    lore:
      - ""
      - " {muted}No bounties placed on this player."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "%contrib_material%"
    name: "{highlight}%contrib_placer%"
    lore:
      - ""
      - " {muted}❙ {letters}Amount: {highlight}%contrib_amount%"
      - " {muted}❙ {letters}Placed: {muted}%contrib_date%"
      - ""
      - " {error}● {info}Click to cancel your bounty"
    actions:
      - "left: survivalcore:bounty_cancel %bounty_target_uuid%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  back:
    slot: 48
    material: ARROW
    name: "{letters}&l← BACK"
    actions:
      - "survivalcore:bounty_open_list"
  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
