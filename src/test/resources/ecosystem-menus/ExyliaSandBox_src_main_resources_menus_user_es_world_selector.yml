title: "{primary}&lSANDBOX {muted}%current_page%/%total_pages%"
size: 27
type: PAGINATION
animation: "center_out"
refresh:
  mode: SMART
  interval: 40
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay mas mundos"
    hide_tooltip: false

pagination:
  slots: '10-16'

  item_template:
    material: "%world_material%"
    name: "{highlight}&l%world_name%"
    glow: "%world_glow%"
    amount: "%world_players%"
    lore:
      - ""
      - " {muted}❙ {letters}Estado: %world_status%"
      - " {muted}❙ {letters}Jugadores: {info}%world_players%"
      - ""
      - "{info}» Click para entrar"
    actions:
      - "%world_action%"

  navigation:
    previous:
      slot: 21
      material: ARROW
      name: '{error}&l← ANTERIOR'
      lore:
        - '{info}Pagina: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 23
      material: ARROW
      name: '{success}&lSIGUIENTE →'
      lore:
        - '{info}Pagina: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items: []
