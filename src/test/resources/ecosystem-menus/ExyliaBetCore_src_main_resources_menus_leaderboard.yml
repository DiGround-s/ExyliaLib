# Who is at the top, by whichever stat and whichever game.
#
# A board that has never been read shows as loading rather than as empty: the
# plugin never blocks the server to fill a menu, so the first person to open one
# after a restart sees it arrive a moment later.

title: '{primary}&lLEADERBOARD {muted}— %stat%'
size: 54
type: MULTI_PAGINATION
animation: 'center_out'

open_sounds:
  - 'ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.5'

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  header:
    slot: 4
    material: NETHER_STAR
    name: '{primary}&lLEADERBOARD'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Game: {info}%game_name%'
      - ' {muted}❙ {letters}Sorted by: {highlight}%stat%'

  loading:
    slot: 49
    material: CLOCK
    name: '{warning}&lREADING THE BOARD'
    lore:
      - ''
      - ' {muted}❙ {letters}It will be here in a moment.'
      - ''
      - '{info}» Click to look again'
    condition: '%loading% == true'
    actions:
      - 'refresh'

  back:
    slot: 45
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the game list'
    actions:
      - 'left: betcore:open_main'

  close:
    slot: 53
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  players:
    slots: '10-16,19-25'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}Nobody has played yet'
      lore:
        - ''
        - '{muted}Win a match and take the top spot.'
    item_template:
      material: 'playerhead-%player_name%'
      name: '{muted}#%rank% {primary}&l%player_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}%stat%: {highlight}%value%'
        - ''
        - ' {muted}❙ {letters}Won: {success}%wins%'
        - ' {muted}❙ {letters}Lost: {error}%losses%'
        - ' {muted}❙ {letters}Played: {info}%played%'
        - ''
        - '{info}» Click to see their record'
      actions:
        - 'left: betcore:open_stats %player_name%'
    navigation:
      previous:
        slot: 18
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
        lore:
          - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'previous_page players'
      next:
        slot: 26
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
        lore:
          - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'next_page players'

  # What the board is sorted by.
  stat_types:
    slots: '28-34'
    item_template:
      material: PAPER
      name: '{letters}&l%stat%'
      lore:
        - ''
        - '{info}» Click to sort by this'
      actions:
        - 'left: betcore:set_leaderboard_stat %stat%'
    selected_template:
      material: MAP
      name: '{primary}&l%stat% {success}✔'
      glow: true
      lore:
        - ''
        - '{success}This is what it is sorted by.'

  # Which game the board is for.
  games:
    slots: '38-42'
    item_template:
      material: '%game_icon%'
      name: '%game_name%'
      lore:
        - ''
        - '{info}» Click to see this game'
      actions:
        - 'left: betcore:set_leaderboard_game %game_id%'
    selected_template:
      material: '%game_icon%'
      name: '%game_name% {success}✔'
      glow: true
      lore:
        - ''
        - '{success}This is the board you are on.'
