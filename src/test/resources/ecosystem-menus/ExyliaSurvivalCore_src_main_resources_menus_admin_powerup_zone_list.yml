title: "{primary}&lPOWERUP ZONES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No zones found"
    lore:
      - ""
      - "{muted}Create your first zone!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: BEACON
    name: "{warning}&l%zone_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {highlight}%zone_id%"
      - " {muted}❙ {letters}Mode: {highlight}%zone_mode%"
      - " {muted}❙ {letters}Status: %zone_enabled%"
      - " {muted}❙ {letters}Interval: {highlight}%zone_interval%s"
      - " {muted}❙ {letters}Max Active: {highlight}%zone_max_active%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:pu_zone_edit %zone_id%"
      - "right: survivalcore:pu_zone_delete %zone_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new spawn zone"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:pu_zone_create"

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    lore:
      - ""
      - "{info}» Click to close"
    actions:
      - "survivalcore:close_menu"
