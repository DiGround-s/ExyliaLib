title: "{primary}&lBRACKETS SETTINGS"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  match-duration:
    slot: 10
    material: CLOCK
    name: "{info}&lMATCH DURATION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%match_duration%s"
      - " {muted}❙ {letters}Max time per match"
      - ""
      - " {muted}❙ {success}Left-Click +15s"
      - " {muted}❙ {error}Right-Click -15s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-duration 15"
      - "right: events:adjust_setting match-duration -15"
      - "shift_left: events:input_setting match-duration"

  match-end-delay:
    slot: 12
    material: ENDER_EYE
    name: "{info}&lPOST-MATCH DELAY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%match_end_delay%s"
      - " {muted}❙ {letters}Pause after each match"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting match-end-delay 1"
      - "right: events:adjust_setting match-end-delay -1"
      - "shift_left: events:input_setting match-end-delay"

  round-delay:
    slot: 14
    material: HOPPER
    name: "{info}&lROUND PAUSE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%round_delay%s"
      - " {muted}❙ {letters}Wait between bracket rounds"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-delay 1"
      - "right: events:adjust_setting round-delay -1"
      - "shift_left: events:input_setting round-delay"

  heal-between-rounds:
    slot: 16
    material: "%heal_between_rounds_material%"
    name: "{info}&lHEAL BETWEEN ROUNDS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %heal_between_rounds%"
      - " {muted}❙ {letters}Restore full health between rounds"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_brackets_setting heal-between-rounds"

  disable-hit-damage:
    slot: 20
    material: "%disable_hit_damage_material%"
    name: "{info}&lDISABLE HIT DAMAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %disable_hit_damage%"
      - " {muted}❙ {letters}Hits deal 0 damage (matches end by time)"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_brackets_setting disable-hit-damage"

  disable-food-drop:
    slot: 24
    material: "%disable_food_drop_material%"
    name: "{info}&lDISABLE FOOD DROP"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %disable_food_drop%"
      - " {muted}❙ {letters}Food level never drops"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_brackets_setting disable-food-drop"

  freeze-time:
    slot: 28
    material: ICE
    name: "{info}&lFREEZE TIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%freeze_time%s"
      - " {muted}❙ {letters}Seconds players can't move or act at round start"
      - " {muted}❙ {letters}Set to 0 to disable"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting freeze-time 1"
      - "right: events:adjust_setting freeze-time -1"
      - "shift_left: events:input_setting freeze-time"

  back:
    slot: 40
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
