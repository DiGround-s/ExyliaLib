title: "{primary}&lPARTY&r {muted}— Select Kit"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No kits available"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%kit_icon%"
    name: "{primary}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Category: {highlight}%category_name%"
      - ""
      - "{success}» Click to start"
    actions:
      - "practice:%game_action% %kit_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{muted}&l← Back"
    lore:
      - ""
      - "{muted}Return to category selection"
    actions:
      - "practice:open_party_kit_select %game_type%"
