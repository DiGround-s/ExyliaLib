title: "{primary}&lTHIMBLE SETTINGS"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 0
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {muted}❙ {letters}Build several separate"
      - " {muted}❙ {highlight}Water pools"
      - " {muted}❙ {letters}below jump-off points, at least"
      - " {muted}❙ {letters}3 blocks lower than the ledge"
      - ""
      - " {muted}❙ {letters}Landing in any pool after a"
      - " {muted}❙ {letters}real fall scores a point and"
      - " {muted}❙ {letters}consumes that pool"
      - ""
      - " {muted}❙ {letters}Missing the water counts as a"
      - " {muted}❙ {letters}miss; the round ends once every"
      - " {muted}❙ {letters}pool has been used"

  respawn-delay:
    slot: 13
    material: ENDER_PEARL
    name: "{info}&lRESPAWN TIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%respawn_delay%s"
      - " {muted}❙ {letters}Time before returning to spawn"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  team-selector:
    slot: 37
    condition: "%has_teams% == true"
    material: "%team_selector_material%"
    name: "{warning}&lTEAM SELECTOR"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %team_selector%"
      - " {muted}❙ {letters}Allow players to choose"
      - " {muted}❙ {letters}their team in the lobby"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_team_selector_setting team-selector-enabled"

  back:
    slot: 40
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
