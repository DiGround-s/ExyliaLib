title: "{primary}&lPORTAL: %portal_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "practice:portal_edit_name"

  region:
    slot: 19
    material: "%region_material%"
    name: "%region_color%&lPORTAL REGION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %region_status%"
      - ""
      - " {letters_black}▎ {letters}Area that triggers this portal"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "practice:portal_set_region"

  command:
    slot: 22
    material: PAPER
    name: "{highlight}&lCOMMAND"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%command%"
      - ""
      - " {letters_black}▎ {letters}Command run on entry (without /)"
      - ""
      - "{warning}➥ Click to set"
    actions:
      - "practice:portal_set_command"

  teleport:
    slot: 20
    material: "%teleport_material%"
    name: "%teleport_color%&lTELEPORT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %teleport_status%"
      - ""
      - " {letters_black}▎ {letters}Teleport destination after trigger"
      - ""
      - " {letters_black}▎ {success}Left-Click to set current location"
      - " {letters_black}▎ {error}Right-Click to clear"
    actions:
      - "left: practice:portal_set_teleport"
      - "right: practice:portal_clear_teleport"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Permanently delete this portal"
      - ""
      - "{error}➥ Click to delete"
    actions:
      - "practice:portal_confirm_delete %portal_id%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to portal list"
    actions:
      - "practice:portal_open_list"
