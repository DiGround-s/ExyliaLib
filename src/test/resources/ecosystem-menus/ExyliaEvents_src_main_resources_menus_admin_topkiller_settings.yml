title: "{primary}&lTOP KILLER SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  kills-to-win:
    slot: 10
    material: DIAMOND_SWORD
    name: "{info}&lKILLS TO WIN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%kills_to_win%"
      - ""
      - " {letters_black}▎ {success}Left-Click +5"
      - " {letters_black}▎ {error}Right-Click -5"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting kills-to-win 5"
      - "right: events:adjust_setting kills-to-win -5"
      - "shift_left: events:input_setting kills-to-win"

  respawn-delay:
    slot: 11
    material: ENDER_PEARL
    name: "{info}&lRESPAWN TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  drop-items:
    slot: 12
    material: "%drop_items_material%"
    name: "%drop_items_color%&lDROP ITEMS ON DEATH"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %drop_items%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_topkiller_setting drop-items-on-death"

  reset-kit-on-kill:
    slot: 13
    material: "%reset_kit_material%"
    name: "{info}&lRESET KIT ON KILL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %reset_kit%"
      - " {letters_black}▎ {letters}Restores full kit"
      - " {letters_black}▎ {letters}upon getting a kill"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_topkiller_setting reset-kit-on-kill"

  golden-apple:
    slot: 14
    material: "%golden_apple_material%"
    name: "%golden_apple_color%&lGOLDEN APPLE ON KILL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %golden_apple_on_kill%"
      - " {letters_black}▎ {letters}Amount: {highlight}%golden_apple_amount%"
      - ""
      - " {letters_black}▎ {success}Left-Click to toggle"
      - " {letters_black}▎ {warning}Right-Click to adjust amount"
    actions:
      - "left: events:toggle_topkiller_setting golden-apple-on-kill"
      - "right: events:input_setting golden-apple-amount"

  grace-period:
    slot: 15
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%grace_period%s"
      - " {letters_black}▎ {letters}No PvP or damage at start"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  team-selector:
    slot: 16
    condition: "%has_teams% == true"
    material: "%team_selector_material%"
    name: "%team_selector_color%&lTEAM SELECTOR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %team_selector%"
      - " {letters_black}▎ {letters}Allow players to choose"
      - " {letters_black}▎ {letters}their team in the lobby"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_team_selector_setting team-selector-enabled"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
