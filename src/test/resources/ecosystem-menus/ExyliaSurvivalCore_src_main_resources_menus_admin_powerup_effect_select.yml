title: "{primary}&lSELECT EFFECT {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: POTION
    name: "{warning}&l%effect_display%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {highlight}%effect_type%"
      - ""
      - " {muted}❙ {success}Click to select"
    actions:
      - "survivalcore:pu_select_effect_type %effect_type%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to effects list"
    actions:
      - "survivalcore:pu_open_effects"
