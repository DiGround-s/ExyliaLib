title: "{primary}&lSPECTATOR&r {muted}— %alive_count% alive"
size: 54
type: PAGINATION
refresh:
  mode: FULL
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No players alive"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "playerhead-%player_name%"
    name: "{highlight}%player_name%"
    lore:
      - " {muted}❙ {letters}Health: {error}%player_health% ❤"
      - ""
      - "{success}» Click to teleport"
    actions:
      - "practice:spectator_teleport %player_name%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  toggle_spectators:
    slot: 45
    material: "%toggle_material%"
    name: "%toggle_name%"
    lore:
      - ""
      - "{muted}Click to toggle visibility"
      - "{muted}of other spectators"
    actions:
      - "practice:toggle_spectators"

  leave:
    slot: 49
    material: RED_CONCRETE
    name: "{error}&lLeave Game"
    lore:
      - ""
      - "{muted}Return to lobby"
    actions:
      - "practice:leave_game"
