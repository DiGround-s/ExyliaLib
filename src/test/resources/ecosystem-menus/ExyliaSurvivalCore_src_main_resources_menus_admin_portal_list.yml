    slot: 4
    material: EMERALD
    name: "{success}&lCREATE PORTAL"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new portal region"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:portal_create"

  close:
