title: "{primary}&lCAPTURE CONFIGS {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No configs"
    lore:
      - ""
      - "{muted}Create a new config!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%config_material%"
    name: "%config_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%config_id%"
      - " {muted}❙ {letters}Type: {info}%config_type%"
      - " {muted}❙ {letters}Status: %config_status%"
      - " {muted}❙ {letters}Ready: %config_valid%"
      - " {muted}❙ {letters}Active: %config_active%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: capture:edit_config %config_id%"
      - "right: capture:delete_config %config_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Click to go'
        - ' {muted}❙ {letters}to the previous page.'
        - ''
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Click to go'
        - ' {muted}❙ {letters}to the next page.'
        - ''
        - '{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE CONFIG"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new capture"
      - " {muted}❙ {letters}zone event config"
      - ""
      - "{info}» Click to create"
    actions:
      - "capture:start_config_create"

  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_admin"
