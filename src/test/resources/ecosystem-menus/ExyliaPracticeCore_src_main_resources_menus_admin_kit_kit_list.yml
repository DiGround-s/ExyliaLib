title: "{primary}&lKITS {muted}— {info}%category_filter_name%"
size: 54
type: MULTI_PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  create:
    slot: 40
    material: EMERALD
    name: "{success}&lCREATE KIT"
    lore:
      - ""
      - " {muted}❙ {letters}Category: {info}%category_filter_name%"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:create_kit"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to kit hub"
    actions:
      - "practice:open_kit_hub"

sections:
  categories:
    slots: "1-7"
    filler:
      material: AIR
      hide_tooltip: true
    inactive_template:
      material: "%cat_icon%"
      name: "{warning}&l%cat_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%cat_id%"
        - " {muted}❙ {letters}Kits: {highlight}%cat_kit_count%"
        - ""
        - "{accent}» Click to filter"
    active_template:
      material: "%cat_icon%"
      name: "{success}&l%cat_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%cat_id%"
        - " {muted}❙ {letters}Kits: {highlight}%cat_kit_count%"
        - ""
        - "{success}✔ Currently viewing"
      glowing: true
    navigation:
      previous:
        slot: 0
        material: ARROW
        name: "{letters}&l← Previous"
        hide_tooltip: false
      next:
        slot: 8
        material: ARROW
        name: "{letters}&lNext →"
        hide_tooltip: false

  kits:
    slots: "10-16,19-25,28-34"
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "{muted}No kits"
      lore:
        - ""
        - "{muted}No kits in this category."
        - "{accent}» Click CREATE KIT to add one"
      hide_tooltip: false
    kit_template:
      material: "%kit_icon%"
      name: "{warning}&l%kit_name%"
      lore:
        - ""
        - " {muted}❙ {letters}ID: {info}%kit_id%"
        - " {muted}❙ {letters}Enabled: %kit_enabled%"
        - " {muted}❙ {letters}Priority: {highlight}%kit_priority%"
        - " {muted}❙ {letters}Loadout: %kit_loadout%"
        - ""
        - " {muted}❙ {success}Left-Click to edit"
        - " {muted}❙ {error}Right-Click to delete"
    navigation:
      previous:
        slot: 45
        material: ARROW
        name: "{error}&l← PREVIOUS"
        lore:
          - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: false
      next:
        slot: 53
        material: ARROW
        name: "{success}&lNEXT →"
        lore:
          - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: false
