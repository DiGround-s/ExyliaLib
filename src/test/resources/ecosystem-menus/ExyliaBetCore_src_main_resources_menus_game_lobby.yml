# One game's lobby, shared by all of them: the title and the icon come from
# whichever game opened it, so there is one file to edit rather than three that
# drift apart.
#
# Two lists. 'waiting' is what you can take. 'live' is what you can watch.

title: '%game_name% {muted}— %waiting_count% open'
size: 54
type: MULTI_PAGINATION
animation: 'center_out'

open_sounds:
  - 'ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.5'

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  header:
    slot: 4
    material: '%game_icon%'
    name: '%game_name%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Open bets: {highlight}%waiting_count%'
      - ' {muted}❙ {letters}Being played: {info}%live_count%'
      - ''
      - ' {muted}❙ {letters}Take a bet above, or put'
      - ' {muted}❙ {letters}one up of your own below.'

  back:
    slot: 45
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the game list'
    actions:
      - 'left: betcore:open_main'

  challenges:
    slot: 46
    material: PAPER
    amount: '%challenge_count%'
    glow: '%has_challenges%'
    name: '{primary}&lCHALLENGES'
    lore:
      - ''
      - ' {muted}❙ {letters}Bets offered to you by name.'
      - ''
      - ' {muted}❙ {letters}Waiting on you: {highlight}%challenge_count%'
      - ''
      - '{info}» Click to open'
    actions:
      - 'left: betcore:open_invites'

  create:
    slot: 47
    material: WRITABLE_BOOK
    name: '{primary}&lCREATE A MATCH'
    lore:
      - ''
      - ' {muted}❙ {letters}You pick the mode and the rounds.'
      - ' {muted}❙ {letters}You pick what you bet, and how much.'
      - ' {muted}❙ {letters}You pick who is allowed to take it.'
      - ''
      - ' {muted}❙ {letters}Nothing is charged until'
      - ' {muted}❙ {letters}somebody accepts.'
      - ''
      - '{success}▶ Click to set it up'
    actions:
      - 'left: betcore:open_create'

  queue:
    slot: 48
    material: COMPASS
    name: '{primary}&lQUICK QUEUE'
    lore:
      - ''
      - ' {muted}❙ {letters}Name your stake and wait.'
      - ''
      - ' {muted}❙ {letters}You are paired with the closest bet,'
      - ' {muted}❙ {letters}at the {highlight}lower {letters}of the two figures,'
      - ' {muted}❙ {letters}so you never pay more than you said.'
      - ''
      - '{success}▶ Click to set your terms'
    condition: '%queue_enabled% == true'
    actions:
      - 'left: betcore:open_queue'

  record:
    slot: 50
    material: 'playerhead-%player_name%'
    name: '{primary}&lYOUR RECORD'
    lore:
      - ''
      - ' {muted}❙ {letters}What you have won and lost'
      - ' {muted}❙ {letters}at %game_name%{letters}.'
      - ''
      - '{info}» Click to open'
    actions:
      - 'left: betcore:open_stats %player_name% %game_id%'

  leaderboard:
    slot: 51
    material: NETHER_STAR
    name: '{primary}&lLEADERBOARD'
    lore:
      - ''
      - ' {muted}❙ {letters}Who is winning, and who is'
      - ' {muted}❙ {letters}paying for it.'
      - ''
      - '{info}» Click to open'
    actions:
      - 'left: betcore:open_leaderboard %game_id%'

  close:
    slot: 53
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  # Bets nobody has taken yet. Clicking one puts your stake against the host's.
  waiting:
    slots: '10-16,19-25'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}No open bets'
      lore:
        - ''
        - '{muted}Put one up and be the first.'
    item_template:
      material: 'playerhead-%host_name%'
      name: '{primary}&l%host_name% {muted}— %match_mode_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}Stake: {highlight}%match_wager%'
        - ' {muted}❙ {letters}Pot: {info}%match_pot%'
        - ' {muted}❙ {letters}Rounds: {info}Best of %match_rounds%'
        - ' {muted}❙ {letters}Waiting: {info}%match_age%'
        - ''
        - '{success}▶ Click to take this bet'
      actions:
        - 'left: betcore:join_match'
    own_template:
      material: 'playerhead-%host_name%'
      name: '{warning}&lYOUR BET {muted}— %match_mode_name%'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Stake: {highlight}%match_wager%'
        - ' {muted}❙ {letters}Rounds: {info}Best of %match_rounds%'
        - ' {muted}❙ {letters}Open to: {info}%match_visibility%'
        - ' {muted}❙ {letters}Waiting: {info}%match_age%'
        - ''
        - '{error}▶ Click to cancel and take your stake back'
      actions:
        - 'left: betcore:cancel_match'
    invited_template:
      material: 'playerhead-%host_name%'
      name: '{highlight}&l%host_name% {muted}— for you'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Stake: {highlight}%match_wager%'
        - ' {muted}❙ {letters}Pot: {info}%match_pot%'
        - ' {muted}❙ {letters}Rounds: {info}Best of %match_rounds%'
        - ''
        - ' {muted}❙ {letters}Sent to you and to nobody else.'
        - ''
        - '{success}▶ Click to take this bet'
      actions:
        - 'left: betcore:join_match'
    navigation:
      previous:
        slot: 9
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
        lore:
          - '{info}ℹ Open bets: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'previous_page waiting'
      next:
        slot: 17
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
        lore:
          - '{info}ℹ Open bets: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'next_page waiting'

  # Matches already being played. Clicking one watches it.
  live:
    slots: '28-34,37-43'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}Nothing is being played'
      lore:
        - ''
        - '{muted}Matches in progress show up here.'
    item_template:
      material: 'playerhead-%turn_name%'
      name: '{letters}&l%host_name% {muted}vs {letters}&l%guest_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
        - ' {muted}❙ {letters}Mode: {info}%match_mode_name%'
        - ''
        - ' {muted}❙ {letters}Round: {info}%match_round%{muted}/{info}%match_rounds%'
        - ' {muted}❙ {letters}Score: {info}%match_score%'
        - ' {muted}❙ {letters}To move: {highlight}%turn_name% {muted}(%turn_seconds%s)'
        - ' {muted}❙ {letters}Watching: {info}%spectator_count%'
        - ''
        - '{success}▶ Click to watch'
      actions:
        - 'left: betcore:spectate_match'
    full_template:
      material: BARRIER
      name: '{muted}&l%host_name% vs %guest_name%'
      lore:
        - ''
        - ' {muted}❙ {letters}Pot: {info}%match_pot%'
        - ''
        - '{error}This match has all the watchers it allows.'
    navigation:
      previous:
        slot: 27
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
        name: '{error}&l← PREVIOUS PAGE'
        lore:
          - '{info}ℹ Being played: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'previous_page live'
      next:
        slot: 35
        material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
        name: '{success}&lNEXT PAGE →'
        lore:
          - '{info}ℹ Being played: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'next_page live'

  # The one slot that is different for everybody: the match you are in, the one
  # you are watching, the bet you have up, the queue you are in, or nothing.
  status:
    slots: '49'
    filler:
      material: AIR
      hide_tooltip: true

    item_template:
      material: ENDER_EYE
      name: '{success}&lBACK TO YOUR MATCH'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Against: {highlight}%opponent_name%'
        - ' {muted}❙ {letters}Score: {info}%match_score%'
        - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
        - ''
        - ' {muted}❙ {letters}Your clock {warning}keeps running {letters}while'
        - ' {muted}❙ {letters}the board is closed.'
        - ''
        - '{success}▶ Click to reopen the board'
      actions:
        - 'left: betcore:open_board'

    watching_template:
      material: ENDER_PEARL
      name: '{info}&lBACK TO THE MATCH'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Score: {info}%match_score%'
        - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
        - ''
        - '{info}» Click to go back to it'
      actions:
        - 'left: betcore:open_board'

    waiting_template:
      material: CLOCK
      name: '{warning}&lYOUR BET IS UP'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
        - ''
        - ' {muted}❙ {letters}Nobody has taken it yet.'
        - ''
        - '{error}▶ Click to cancel it and take your stake back'
      actions:
        - 'left: betcore:cancel_match'

    queueing_template:
      material: COMPASS
      name: '{warning}&lYOU ARE IN THE QUEUE'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Looking for somebody betting'
        - ' {muted}❙ {letters}close to your stake.'
        - ''
        - '{error}▶ Click to leave the queue'
      actions:
        - 'left: betcore:queue_leave'
