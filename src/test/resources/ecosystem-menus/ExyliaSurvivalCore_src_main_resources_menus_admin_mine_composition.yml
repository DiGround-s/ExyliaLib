title: "{primary}&lCOMPOSITION {muted}— %mine_id% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No materials configured"
    lore:
      - ""
      - "{muted}Add one with the button below."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%entry_material%"
    name: "{warning}&l%entry_material%"
    lore:
      - ""
      - " {muted}❙ {letters}Weight: {highlight}%entry_percentage%"
      - " {muted}❙ {letters}Chance: {highlight}%entry_chance%%"
      - " {muted}❙ {letters}Custom loot: %entry_loot_status%"
      - " {muted}❙ {letters}Break effects: %entry_effects_status%"
      - ""
      - " {success}● {info}Left-click {muted}+1 weight"
      - " {error}● {info}Right-click {muted}-1 weight"
      - " {muted}❙ {highlight}Middle-click {muted}to edit loot table"
      - " {muted}❙ {highlight}Shift + Left-click {muted}type exact weight"
      - " {muted}❙ {highlight}Drop {muted}to edit break effects"
      - " {muted}❙ {error}Shift + Right-click to remove"
    actions:
      - "left: survivalcore:mine_composition_adjust %entry_index% 1"
      - "right: survivalcore:mine_composition_adjust %entry_index% -1"
      - "middle: survivalcore:mine_composition_open_loot %entry_index%"
      - "shift_left: survivalcore:mine_composition_set_weight %entry_index%"
      - "drop: survivalcore:mine_composition_open_effects %entry_index%"
      - "shift_right: survivalcore:mine_composition_remove %entry_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  add:
    slot: 48
    material: EMERALD
    name: "{success}&lADD BLOCK"
    lore:
      - ""
      - " {info}» Click to select a block with the icon picker"
    actions:
      - "survivalcore:mine_composition_add"

  back:
    slot: 50
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to mine setup"
    actions:
      - "survivalcore:mine_back_to_setup"
