# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lCOMPOSITION {muted}— %mine_id% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No materials configured"
    lore:
      - ""
      - "{muted}Add one with the button below."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%entry_material%"
    name: "{warning}&l%entry_material%"
    lore:
      - ""
      - " {letters_black}▎ {letters}Weight: {highlight}%entry_percentage%"
      - " {letters_black}▎ {letters}Chance: {highlight}%entry_chance%%"
      - " {letters_black}▎ {letters}Custom loot: %entry_loot_status%"
      - " {letters_black}▎ {letters}Break effects: %entry_effects_status%"
      - ""
      - " {success}● {info}Left-click {muted}+1 weight"
      - " {error}● {info}Right-click {muted}-1 weight"
      - " {letters_black}▎ {highlight}Middle-click {muted}to edit loot table"
      - " {letters_black}▎ {highlight}Shift + Left-click {muted}type exact weight"
      - " {letters_black}▎ {highlight}Drop {muted}to edit break effects"
      - " {letters_black}▎ {error}Shift + Right-click to remove"
    actions:
      - "left: survivalcore:mine_composition_adjust %entry_index% 1"
      - "right: survivalcore:mine_composition_adjust %entry_index% -1"
      - "middle: survivalcore:mine_composition_open_loot %entry_index%"
      - "shift_left: survivalcore:mine_composition_set_weight %entry_index%"
      - "drop: survivalcore:mine_composition_open_effects %entry_index%"
      - "shift_right: survivalcore:mine_composition_remove %entry_index%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - "next_page"

items:
  add:
    slot: 45
    material: EMERALD
    name: "{success}&lADD BLOCK"
    lore:
      - ""
      - " {warning}➥ Click to select a block with the icon picker"
    actions:
      - "survivalcore:mine_composition_add"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {warning}➥ Return to mine setup"
    actions:
      - "survivalcore:mine_back_to_setup"
