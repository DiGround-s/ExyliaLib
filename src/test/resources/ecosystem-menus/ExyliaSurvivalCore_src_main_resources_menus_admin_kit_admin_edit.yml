# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One kit. Every field of it, and the two grids that hold its items and its
# bonus commands.

title: "{primary}&lKIT {letters_black}» {highlight}%kit_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "BLOCK_CHEST_OPEN|0.7|1.4"
click_sounds:
  - "UI_BUTTON_CLICK|0.6|1.6"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "0-8,45-53"

items:
  enabled:
    slot: 4
    material: "%enabled_material%"
    name: "{primary}&lSTATUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» %enabled_status%"
      - " {letters_black}▎ {letters_black}A disabled kit is hidden from players."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "survivalcore:kit_admin_toggle_enabled"

  display-name:
    slot: 19
    material: NAME_TAG
    name: "{primary}&lDISPLAY NAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {highlight}%kit_name%"
      - ""
      - "{warning}➥ Click to rename"
      - ""
    actions:
      - "survivalcore:kit_admin_edit_name"

  description:
    slot: 20
    material: BOOK
    name: "{primary}&lDESCRIPTION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {highlight}%kit_description%"
      - " {letters_black}▎ {letters_black}Shown in the kit list and the preview."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "survivalcore:kit_admin_edit_description"

  permission:
    slot: 21
    material: TRIPWIRE_HOOK
    name: "{primary}&lPERMISSION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {highlight}%kit_permission%"
      - " {letters_black}▎ {letters_black}Type clear for no permission at all."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "survivalcore:kit_admin_edit_permission"

  cooldown:
    slot: 22
    material: CLOCK
    name: "{primary}&lCOOLDOWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {info}%kit_cooldown%"
      - " {letters_black}▎ {letters_black}Typed as 1d, 12h30m or 0s for none."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "survivalcore:kit_admin_set_cooldown"

  max-uses:
    slot: 23
    material: PAPER
    name: "{primary}&lMAX USES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {info}%kit_max_uses%"
      - " {letters_black}▎ {letters_black}How often one player may claim it."
      - " {letters_black}▎ {letters_black}Use -1 for unlimited."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "survivalcore:kit_admin_set_max_uses"

  sort-order:
    slot: 24
    material: COMPARATOR
    name: "{primary}&lSORT ORDER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {info}%kit_sort_order%"
      - " {letters_black}▎ {letters_black}Lower is shown first."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "survivalcore:kit_admin_set_sort_order"

  auto-equip:
    slot: 28
    material: "%auto_equip_material%"
    name: "{primary}&lEQUIP ARMOUR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» %auto_equip_status%"
      - " {letters_black}▎ {letters_black}Off puts the armour in the inventory"
      - " {letters_black}▎ {letters_black}instead of onto the player."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "survivalcore:kit_admin_toggle_auto_equip"

  drop-when-full:
    slot: 29
    material: "%drop_full_material%"
    name: "{primary}&lDROP WHEN FULL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» %drop_full_status%"
      - " {letters_black}▎ {letters_black}On drops what does not fit at their feet."
      - " {letters_black}▎ {letters_black}Off refuses the claim until they make room."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "survivalcore:kit_admin_toggle_drop_when_full"

  first-join:
    slot: 30
    material: "%first_join_material%"
    name: "{primary}&lFIRST JOIN KIT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» %first_join_status%"
      - " {letters_black}▎ {letters_black}Handed out once, when a player first joins."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "survivalcore:kit_admin_toggle_first_join"

  icon:
    slot: 31
    material: "%kit_icon%"
    name: "{primary}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current {letters_black}» {highlight}%kit_icon_preview%"
      - ""
      - "{warning}➥ Click to choose one"
      - ""
    actions:
      - "survivalcore:kit_admin_set_icon"

  edit-items:
    slot: 33
    material: CHEST
    name: "{primary}&lITEMS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Holding {letters_black}» {info}%kit_items% {letters}item(s)"
      - " {letters_black}▎ {letters_black}Laid out as the player will receive it."
      - ""
      - "{warning}➥ Click to lay the kit out"
      - ""
    actions:
      - "survivalcore:kit_admin_edit_items"

  edit-commands:
    slot: 34
    material: COMMAND_BLOCK
    name: "{primary}&lBONUSES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Running {letters_black}» {info}%kit_commands% {letters}command(s)"
      - " {letters_black}▎ {letters_black}Named ones are shown in the preview."
      - ""
      - "{warning}➥ Click to manage them"
      - ""
    actions:
      - "survivalcore:kit_admin_open_commands"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Return to the kit list"
      - ""
    actions:
      - "survivalcore:kit_admin_open_list"

  preview:
    slot: 48
    material: ENDER_EYE
    name: "{info}&lPREVIEW"
    lore:
      - ""
      - " {letters_black}▎ {letters}See the kit exactly as a player does."
      - ""
      - "{warning}➥ Click to preview"
      - ""
    actions:
      - "survivalcore:kit_admin_preview"

  clone:
    slot: 50
    material: BOOK
    name: "{success}&lCLONE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Copies everything into a new kit"
      - " {letters_black}▎ {letters}under an id you choose."
      - ""
      - "{warning}➥ Click to clone"
      - ""
    actions:
      - "survivalcore:kit_admin_clone"

  delete:
    slot: 53
    material: BARRIER
    name: "{error}&lDELETE KIT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Removes the kit and everything in it."
      - " {letters_black}▎ {letters_black}You will be asked to confirm."
      - ""
      - "{error}➥ Click to delete"
      - ""
    actions:
      - "survivalcore:kit_admin_delete %kit_id%"
