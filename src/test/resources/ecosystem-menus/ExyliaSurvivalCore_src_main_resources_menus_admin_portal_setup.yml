# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lPORTAL: %portal_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  region:
    slot: 2
    material: "%region_material%"
    name: "{highlight}&lPORTAL REGION"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %region_status%"
      - ""
      - " {muted}❙ {letters}Area that triggers this portal"
      - ""
      - "{info}» Click to select"
    actions:
      - "survivalcore:portal_set_region"

  commands:
    slot: 4
    material: PAPER
    name: "{highlight}&lCOMMANDS"
    lore:
      - ""
      - " {muted}❙ {letters}Configured: {info}%command_count%"
      - ""
      - " {muted}❙ {letters}Executed on player entry"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:portal_open_commands"

  teleport:
    slot: 6
    material: "%teleport_material%"
    name: "{highlight}&lTELEPORT"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %teleport_status%"
      - ""
      - " {muted}❙ {letters}Destination after portal trigger"
      - ""
      - " {muted}❙ {success}Left-Click to set location"
      - " {muted}❙ {error}Right-Click to clear"
    actions:
      - "left: survivalcore:portal_set_teleport"
      - "right: survivalcore:portal_clear_teleport"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Return to portal list"
    actions:
      - "survivalcore:portal_open_list"

  delete:
    slot: 47
    material: BARRIER
    name: "{error}&lDELETE PORTAL"
    lore:
      - ""
      - " {muted}❙ {letters}Permanently delete this portal"
      - ""
      - "{error}» Click to delete"
    actions:
      - "survivalcore:portal_delete %portal_id%"
