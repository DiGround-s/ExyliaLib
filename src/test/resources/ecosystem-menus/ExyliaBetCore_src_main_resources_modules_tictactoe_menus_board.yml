# The Tic Tac Toe board.
#
# The 'board' section's slot list IS the board: the first slot is the top-left
# square and the ninth is the bottom-right. Moving the board is editing that
# one line. The game checks that there are nine of them when it loads, and
# refuses rather than drawing a board with a square missing.
#
# The plugin picks a template per square and the templates below decide what
# that looks like. A template named here that the game never asks for is
# harmless; one the game asks for and this file does not declare falls back to
# the first.
#
# The background stays black rather than the grey the rest of the plugin uses:
# an empty square is a light grey pane and a locked one is a grey pane, and
# both have to read against whatever is behind them.

title: '%your_name% {muted}vs %opponent_name% {muted}— %match_score%'
size: 45

open_sounds:
  - 'BLOCK_BARREL_OPEN|0.8|1.4'
click_sounds:
  - 'BLOCK_NOTE_BLOCK_HAT|1.0|1.4'

# The plugin redraws this once a second while the clock runs, so nothing here
# has to refresh itself.
refresh:
  mode: DISABLED

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  status:
    slot: 4
    material: CLOCK
    name: '{primary}&l%match_mode_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Round: {info}%match_round%{muted}/{info}%match_rounds%'
      - ' {muted}❙ {letters}Score: {info}%match_score%'
      - ' {muted}❙ {letters}Pot: {highlight}%match_pot%'
      - ''
      - ' {muted}❙ {letters}To move: {highlight}%turn_name%'
      - ' {muted}❙ {letters}Time left: {info}%turn_seconds%s ⏱'
      - ''
      - ' {muted}❙ {letters}Closing this does not forfeit — but the'
      - ' {muted}❙ {letters}clock {warning}keeps running{letters}. Reopen it'
      - ' {muted}❙ {letters}with {highlight}/bet board{letters}.'

  you:
    slot: 10
    material: 'playerhead-%your_name%'
    name: '{success}&l%your_name%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%your_score%'
      - ' {muted}❙ {letters}Your stake: {highlight}%match_wager%'

  opponent:
    slot: 16
    material: 'playerhead-%opponent_name%'
    name: '{error}&l%opponent_name%'
    lore:
      - ''
      - ' {muted}❙ {letters}Rounds won: {info}%opponent_score%'

  spectators:
    slot: 38
    material: ENDER_EYE
    name: '{primary}&lWATCHING'
    amount: '%spectator_count%'
    lore:
      - ''
      - ' {muted}❙ {letters}People watching: {highlight}%spectator_count%'
      - ''
      - '{info}» Click to see who'
    actions:
      - 'left: betcore:open_spectators'

  close:
    slot: 44
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - ''
      - ' {muted}❙ {letters}The match keeps running and'
      - ' {muted}❙ {letters}so does your clock.'
      - ''
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  board:
    slots: '12-14,21-23,30-32'
    filler:
      material: AIR
      hide_tooltip: true

    # A free square, yours to take.
    empty_template:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{letters}&lSQUARE %cell_label%'
      lore:
        - ''
        - '{success}▶ Click to play here'
      actions:
        - 'left: betcore:play_cell'

    # A free square that is not yours to take right now.
    locked_template:
      material: GRAY_STAINED_GLASS_PANE
      name: '{muted}&lSQUARE %cell_label%'
      lore:
        - ''
        - ' {muted}❙ {letters}Waiting for {highlight}%turn_name%{letters}.'

    x_template:
      material: RED_TERRACOTTA
      name: '{error}&lX'
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    o_template:
      material: BLUE_TERRACOTTA
      name: '{info}&lO'
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'

    # INFINITE mode only. This is the piece that vanishes when its owner plays
    # their next one — a different block AND a glow, so the cost of a move is
    # visible before the move is made.
    x_marked_template:
      material: RED_GLAZED_TERRACOTTA
      name: '{error}&lX {warning}— about to vanish'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'
        - ''
        - '{warning}➥ Their next piece removes this one'

    o_marked_template:
      material: BLUE_GLAZED_TERRACOTTA
      name: '{info}&lO {warning}— about to vanish'
      glow: true
      lore:
        - ''
        - ' {muted}❙ {letters}Played by {info}%cell_owner%'
        - ''
        - '{warning}➥ Their next piece removes this one'

    x_winning_template:
      material: RED_CONCRETE
      name: '{success}&lX {muted}— winning line'
      glow: true

    o_winning_template:
      material: BLUE_CONCRETE
      name: '{success}&lO {muted}— winning line'
      glow: true

  # One slot, two meanings: a player surrenders and a spectator leaves. A menu
  # holds one item per slot, so this is a list the plugin fills with whichever
  # of the two applies rather than two buttons written on top of each other.
  viewer:
    slots: '40'
    filler:
      material: AIR
      hide_tooltip: true

    item_template:
      material: WHITE_BANNER
      name: '{error}&lSURRENDER'
      lore:
        - ''
        - ' {muted}❙ {letters}Gives the match to {highlight}%opponent_name%{letters}.'
        - ' {muted}❙ {letters}Your {info}%match_wager% {letters}goes with it.'
        - ''
        - '{error}▶ Click, then confirm'
      actions:
        - 'left: betcore:surrender'

    watching_template:
      material: WHITE_BANNER
      name: '{warning}&lSTOP WATCHING'
      lore:
        - ''
        - ' {muted}❙ {letters}Leaves the match running.'
        - ''
        - '{warning}▶ Click to leave'
      actions:
        - 'left: betcore:leave_spectate'
