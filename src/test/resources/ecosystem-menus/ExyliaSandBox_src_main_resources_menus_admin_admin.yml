title: "{primary}&lADMIN SANDBOX"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 1

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  worlds:
    slot: 10
    material: GRASS_BLOCK
    name: "{info}&lMANAGE WORLDS"
    lore:
      - ""
      - " {muted}❙ {letters}View and manage worlds"
      - " {muted}❙ {letters}Reset, teleport, and configure"
      - ""
      - " {muted}❙ {letters}Total: {highlight}%total_worlds%"
      - " {muted}❙ {letters}Players: {highlight}%online_players%"
      - ""
      - "{info}» Click to manage"
    actions:
      - "sandbox:open_world_list"

  kitroom:
    slot: 12
    material: CHEST
    name: "{accent}&lKIT ROOM"
    lore:
      - ""
      - " {muted}❙ {letters}Manage categories"
      - " {muted}❙ {letters}and Kit Room items"
      - ""
      - "{info}» Click to manage"
    actions:
      - "sandbox:open_kitroom_category_list"

  predefined-kits:
    slot: 14
    material: DIAMOND_CHESTPLATE
    name: "{accent}&lPREDEFINED KITS"
    lore:
      - ""
      - " {muted}❙ {letters}Build kits once, players"
      - " {muted}❙ {letters}copy them into their slots"
      - ""
      - "{info}» Click to manage"
    actions:
      - "sandbox:open_predefined_kit_list"

  tp-regions:
    slot: 16
    material: BEACON
    name: "{accent}&lTP REGIONS"
    lore:
      - ""
      - " {muted}❙ {letters}Manage TP regions"
      - " {muted}❙ {letters}Players inside are periodically"
      - " {muted}❙ {letters}teleported to sandbox worlds"
      - ""
      - "{info}» Click to manage"
    actions:
      - "sandbox:open_tp_region_list"

  set-lobby:
    slot: 35
    material: RED_BED
    name: "{secondary}&lSET LOBBY"
    lore:
      - ""
      - " {muted}❙ {letters}Set the main lobby"
      - " {muted}❙ {letters}at your current position"
      - ""
      - "{info}» Click to set"
    actions:
      - "sandbox:set_lobby"

  set-kit-creator-location:
    slot: 34
    material: CRAFTING_TABLE
    name: "{secondary}&lSET KIT CREATOR"
    lore:
      - ""
      - " {muted}❙ {letters}Set the Kit Creator location"
      - " {muted}❙ {letters}at your current position"
      - ""
      - "{info}» Click to set"
    actions:
      - "sandbox:set_kit_creator_location"

  reload:
    slot: 31
    material: REDSTONE
    name: "{error}&lRECARGAR CONFIGS"
    lore:
      - ""
      - " {muted}❙ {letters}Recarga todas las"
      - " {muted}❙ {letters}configuraciones del plugin"
      - ""
      - "{info}» Click para recargar"
    actions:
      - "sandbox:reload_configs"
