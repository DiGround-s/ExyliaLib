title: "{primary}&lJUMPADS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No jumpads configured"
    lore:
      - ""
      - " {muted}Click the button above to create one."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: SLIME_BALL
    name: "{warning}&l%jumpad_id%"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %jumpad_enabled%"
      - " {muted}❙ {letters}Direction: {highlight}%jumpad_yaw%"
      - " {muted}❙ {letters}Power: {highlight}%jumpad_power% {muted}| Vertical: {highlight}%jumpad_vertical%"
      - " {muted}❙ {letters}Glide: %jumpad_glide%"
      - " {muted}❙ {letters}Locations: {highlight}%jumpad_locations%"
      - ""
      - " {success}● {info}Left-click to edit"
      - " {error}● {info}Right-click to delete"
    actions:
      - "left: survivalcore:jumpad_edit %jumpad_id%"
      - "right: survivalcore:jumpad_delete %jumpad_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE JUMPAD"
    lore:
      - ""
      - " {info}Click to create a new jumpad."
    actions:
      - "survivalcore:jumpad_create"

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
