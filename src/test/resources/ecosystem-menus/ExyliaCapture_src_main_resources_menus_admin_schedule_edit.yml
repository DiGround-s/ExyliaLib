title: "{primary}&lEDIT SCHEDULE"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  name:
    slot: 11
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {info}%schedule_name%"
      - ""
      - "{info}» Click to edit"
    actions:
      - "capture:schedule_set_name"

  time:
    slot: 13
    material: CLOCK
    name: "{info}&lTIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%schedule_time%"
      - " {muted}❙ {letters}Format: {info}HH:mm {muted}(24h)"
      - ""
      - "{info}» Click to edit"
    actions:
      - "capture:schedule_set_time"

  min-players:
    slot: 15
    material: PLAYER_HEAD
    name: "{warning}&lMIN PLAYERS"
    lore:
      - ""
      - " {muted}❙ {letters}Minimum online: {highlight}%schedule_min_players%"
      - " {muted}❙ {letters}0 = always fire"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
    actions:
      - "left: capture:schedule_adjust_min_players 1"
      - "right: capture:schedule_adjust_min_players -1"

  mon:
    slot: 28
    material: "%mon_material%"
    name: "{letters}&lMONDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day MONDAY"

  tue:
    slot: 29
    material: "%tue_material%"
    name: "{letters}&lTUESDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day TUESDAY"

  wed:
    slot: 30
    material: "%wed_material%"
    name: "{letters}&lWEDNESDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day WEDNESDAY"

  thu:
    slot: 31
    material: "%thu_material%"
    name: "{letters}&lTHURSDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day THURSDAY"

  fri:
    slot: 32
    material: "%fri_material%"
    name: "{letters}&lFRIDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day FRIDAY"

  sat:
    slot: 33
    material: "%sat_material%"
    name: "{letters}&lSATURDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day SATURDAY"

  sun:
    slot: 34
    material: "%sun_material%"
    name: "{letters}&lSUNDAY"
    lore:
      - ""
      - "{info}» Click to toggle"
    actions:
      - "capture:schedule_toggle_day SUNDAY"

  back:
    slot: 45
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Go back without saving"
    actions:
      - "capture:cancel_schedule_edit"

  save:
    slot: 49
    material: EMERALD
    name: "{success}&lSAVE SCHEDULE"
    lore:
      - ""
      - "{info}» Click to save"
    actions:
      - "capture:save_schedule"
