title: "{primary}&lKIT: %kit_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display-name:
    slot: 3
    material: NAME_TAG
    name: "{highlight}&lNAME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%display_name%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "practice:edit_kit_name"

  icon:
    slot: 2
    material: "%icon_material%"
    name: "{highlight}&lICON"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%icon_material_display%"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "practice:set_kit_icon"

  enabled:
    slot: 5
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %enabled_status%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "practice:toggle_kit_enabled"

  description:
    slot: 4
    material: PAPER
    name: "{highlight}&lDESCRIPTION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {info}%description%"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "practice:edit_kit_description"

  categories:
    slot: 21
    material: "%categories_material%"
    name: "%categories_color%&lCATEGORIES"
    lore:
      - ""
      - " {letters_black}▎ {info}%categories_list%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:open_kit_category_select"

  compatible-arenas:
    slot: 23
    material: COMPASS
    name: "{info}&lCOMPATIBLE ARENAS"
    lore:
      - ""
      - " {letters_black}▎ {info}%arenas_list%"
      - ""
      - "{warning}➥ Click to manage"
    actions:
      - "practice:open_kit_arena_select"

  loadout:
    slot: 30
    material: "%loadout_material%"
    name: "%loadout_color%&lLOADOUT"
    lore:
      - ""
      - " {letters_black}▎ {letters}Status: %loadout_status%"
      - ""
      - " {letters_black}▎ {letters}Arrange your inventory then"
      - " {letters_black}▎ {letters}left-click here to capture it"
      - ""
      - "{warning}➥ Left-click to set loadout"
      - "{warning}➥ Right-click to receive in inventory"
    actions:
      - "left: practice:set_kit_loadout"
      - "right: practice:give_kit_loadout"

  kit-rules:
    slot: 31
    material: WRITTEN_BOOK
    name: "{highlight}&lKIT RULES"
    lore:
      - ""
      - " {letters_black}▎ {letters}Effects, Attributes,"
      - " {letters_black}▎ {letters}Combat, Special Conditions"
      - ""
      - "{warning}➥ Click to configure"
    actions:
      - "practice:open_kit_rules"

  playability:
    slot: 32
    material: COMPASS
    name: "{highlight}&lPLAYABILITY & RANKED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configure where this kit"
      - " {letters_black}▎ {letters}can be played, and ranked status"
      - ""
      - "{warning}➥ Click to configure"
    actions:
      - "practice:open_kit_playability"

  priority:
    slot: 22
    material: LADDER
    name: "{info}&lPRIORITY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%priority%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click +10"
      - " {letters_black}▎ {error}Shift-Right -10"
    actions:
      - "left: practice:adjust_kit_priority 1"
      - "right: practice:adjust_kit_priority -1"
      - "shift_left: practice:adjust_kit_priority 10"
      - "shift_right: practice:adjust_kit_priority -10"

  back:
    slot: 40
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Go back to kit list"
    actions:
      - "practice:open_kit_list"
