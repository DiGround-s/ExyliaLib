title: "{primary}&lPARTY MEMBERS&r {muted}— %party_size%"
size: 54
type: PAGINATION
refresh:
  mode: SMART
  interval: 20

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No members"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "playerhead-%member_name%"
    name: "%member_crown%%member_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Role: {highlight}%member_role%"
      - ""
      - "%member_action_lore%"
    actions:
      - "left: %kick_action%"
      - "right: %transfer_action%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{muted}&l← Back"
    lore:
      - ""
      - "{muted}Return to party hub"
    actions:
      - "practice:open_party_hub"
