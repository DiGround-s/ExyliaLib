title: "{primary}&lSPLEGG SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {muted}❙ {letters}Build the breakable floor"
      - " {muted}❙ {letters}out of the configured block"
      - ""
      - " {muted}❙ {letters}Shoot the projectile to"
      - " {muted}❙ {letters}break blocks under rivals"
      - ""
      - " {muted}❙ {error}Falling through eliminates"
      - " {muted}❙ {error}a player"

  grace-period:
    slot: 19
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%grace_period%s"
      - " {muted}❙ {letters}Blocks don't break at start"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
