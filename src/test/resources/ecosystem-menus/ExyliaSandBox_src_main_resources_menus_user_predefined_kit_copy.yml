title: "{primary}&lCOPY {muted}· {highlight}%pk_name%"
size: 54
type: PAGINATION
refresh:
  mode: ON_CLICK
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '9-44'

  empty_template:
    material: "%slot_icon%"
    name: '{success}&lSLOT %kit_slot%'
    lore:
      - ''
      - ' {muted}❙ {letters}This slot is {success}empty'
      - ''
      - '{info}» Click to copy the kit here'
    actions:
      - "sandbox:predefined_kit_copy %pk_id% %kit_slot%"

  taken_template:
    material: "%slot_icon%"
    name: '{warning}&lSLOT %kit_slot%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}In use by {highlight}%slot_kit_name%'
      - ''
      - '{warning}» Click to overwrite it'
    actions:
      - "sandbox:predefined_kit_copy %pk_id% %kit_slot%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  kit:
    slot: 4
    material: "%pk_icon%"
    name: '{letters}&l%pk_name%'
    glow: true
    hide_tooltip: false
    lore:
      - ''
      - ' {muted}❙ {letters}Pick where it goes'
      - ' {muted}❙ {letters}Slots: {highlight}%max_kits%'

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the predefined kits'
    actions:
      - 'sandbox:open_predefined_kits'
