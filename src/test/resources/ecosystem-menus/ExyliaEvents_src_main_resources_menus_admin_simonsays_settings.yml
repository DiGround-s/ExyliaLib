title: "{warning}&lSIMON SAYS SETTINGS"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  action-time:
    slot: 2
    material: CLOCK
    name: "{warning}&lACTION TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%action_time%s"
      - ""
      - " {letters_black}▎ {letters}Seconds players have to"
      - " {letters_black}▎ {letters}complete each challenge"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting action-time 1"
      - "right: events:adjust_setting action-time -1"
      - "shift_left: events:input_setting action-time"

  time-decrease-interval:
    slot: 3
    material: REPEATER
    name: "{warning}&lTIME DECREASE INTERVAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%time_decrease_interval% rounds"
      - ""
      - " {letters_black}▎ {letters}Every N rounds the action"
      - " {letters_black}▎ {letters}time decreases by 1 second"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting time-decrease-interval 1"
      - "right: events:adjust_setting time-decrease-interval -1"
      - "shift_left: events:input_setting time-decrease-interval"

  min-action-time:
    slot: 4
    material: BARRIER
    name: "{error}&lMIN ACTION TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%min_action_time%s"
      - ""
      - " {letters_black}▎ {letters}Minimum seconds floor"
      - " {letters_black}▎ {letters}for action time"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting min-action-time 1"
      - "right: events:adjust_setting min-action-time -1"
      - "shift_left: events:input_setting min-action-time"

  round-pause:
    slot: 5
    material: CLOCK
    name: "{info}&lROUND PAUSE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%round_pause%s"
      - ""
      - " {letters_black}▎ {letters}Seconds between rounds"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting round-pause 1"
      - "right: events:adjust_setting round-pause -1"
      - "shift_left: events:input_setting round-pause"

  min-players:
    slot: 6
    material: PLAYER_HEAD
    name: "{info}&lMIN PLAYERS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%min_players%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting min-players 1"
      - "right: events:adjust_setting min-players -1"
      - "shift_left: events:input_setting min-players"

  back:
