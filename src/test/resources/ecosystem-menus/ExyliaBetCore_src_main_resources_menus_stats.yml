# One player's record, at one game or across all of them.

title: '{primary}&lRECORD {muted}— %subject%'
size: 54
type: MULTI_PAGINATION
animation: 'center_out'

open_sounds:
  - 'ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2'
click_sounds:
  - 'UI_BUTTON_CLICK|1.0|1.5'

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:

  record:
    slot: 4
    material: 'playerhead-%subject%'
    name: '{primary}&l%subject%'
    glow: true
    lore:
      - ''
      - ' {muted}❙ {letters}Showing: %game_name%'
      - ''
      - ' {muted}❙ {letters}Won: {success}%wins%'
      - ' {muted}❙ {letters}Lost: {error}%losses%'
      - ' {muted}❙ {letters}Drawn: {warning}%draws%'
      - ' {muted}❙ {letters}Played: {info}%played%'
      - ' {muted}❙ {letters}Win rate: {highlight}%win_rate%%'
      - ''
      - ' {muted}❙ {letters}Streak: {highlight}%streak%'
      - ' {muted}❙ {letters}Best ever: {info}%best_streak%'

  leaderboard:
    slot: 48
    material: NETHER_STAR
    name: '{primary}&lLEADERBOARD'
    lore:
      - ''
      - ' {muted}❙ {letters}Who is at the top of this game.'
      - ''
      - '{info}» Click to open'
    actions:
      - 'left: betcore:open_leaderboard'

  history:
    slot: 50
    material: BOOK
    name: '{primary}&lPAST MATCHES'
    lore:
      - ''
      - ' {muted}❙ {letters}The last matches %subject% played.'
      - ''
      - '{info}» Click to open'
    actions:
      - 'left: betcore:open_history %subject%'

  back:
    slot: 45
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - '{muted}Return to the game list'
    actions:
      - 'left: betcore:open_main'

  close:
    slot: 53
    material: BARRIER
    name: '{error}&lCLOSE'
    lore:
      - '{muted}Click to close'
    actions:
      - 'close'

sections:

  # What has been staked and taken, one card per currency.
  money:
    slots: '20-24'
    filler:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{muted}Nothing bet yet'
      lore:
        - ''
        - '{muted}Free matches are not counted here.'
    item_template:
      material: SUNFLOWER
      name: '{primary}&l%currency_id%'
      lore:
        - ''
        - ' {muted}❙ {letters}Put up: {info}%wagered%'
        - ' {muted}❙ {letters}Taken: {success}%won%'
        - ' {muted}❙ {letters}Lost: {error}%lost%'
        - ''
        - ' {muted}❙ {letters}Up or down: {highlight}%net%'
        - ' {muted}❙ {letters}Biggest pot: {highlight}%biggest_pot%'

  # Which game the numbers above are about.
  games:
    slots: '38-42'
    item_template:
      material: '%game_icon%'
      name: '%game_name%'
      lore:
        - ''
        - '{info}» Click to see this game'
      actions:
        - 'left: betcore:set_stats_game %game_id%'
    selected_template:
      material: '%game_icon%'
      name: '%game_name% {success}✔'
      glow: true
      lore:
        - ''
        - '{success}This is what you are looking at.'
