title: "{warning}&lCONQUEST ZONES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No zones configured"
    lore:
      - ""
      - "{muted}Add a new zone!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: LIME_CONCRETE
    name: "{warning}&l%zone_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Color: {info}%zone_color%"
      - " {muted}❙ {letters}Points per capture: {highlight}%zone_pts%"
      - " {muted}❙ {letters}Capture time: {highlight}%zone_capture_time%"
      - " {muted}❙ {letters}World: {info}%zone_world%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: capture:edit_conquest_zone %zone_index%"
      - "right: capture:delete_conquest_zone %zone_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      lore:
        - "{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      lore:
        - "{info}ℹ Current page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  add-zone:
    slot: 4
    material: EMERALD
    name: "{success}&lADD ZONE"
    lore:
      - ""
      - " {muted}❙ {letters}Total zones: {highlight}%zones_count%"
      - " {muted}❙ {letters}Select area then configure"
      - ""
      - "{info}» Click to add"
    actions:
      - "capture:add_conquest_zone"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_type_settings"
