title: "{primary}&lPISTOL SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  enabled:
    slot: 5
    material: "%weapon_enabled_material%"
    name: "{info}&lENABLED"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %weapon_enabled%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_csgo_weapon_setting weapon-pistol-enabled"

  damage:
    slot: 19
    material: WOODEN_HOE
    name: "{info}&lDAMAGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%weapon_damage%"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.5"
      - " {letters_black}▎ {error}Right-Click -0.5"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_double weapon-pistol-damage 0.5"
      - "right: events:adjust_csgo_weapon_double weapon-pistol-damage -0.5"
      - "shift_left: events:input_csgo_weapon_double weapon-pistol-damage"

  cooldown:
    slot: 20
    material: CLOCK
    name: "{info}&lCOOLDOWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%weapon_cooldown% ticks"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_int weapon-pistol-cooldown 1"
      - "right: events:adjust_csgo_weapon_int weapon-pistol-cooldown -1"
      - "shift_left: events:input_csgo_weapon_int weapon-pistol-cooldown"

  range:
    slot: 21
    material: ENDER_EYE
    name: "{info}&lRANGE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%weapon_range%"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_csgo_weapon_double weapon-pistol-range 1.0"
      - "right: events:adjust_csgo_weapon_double weapon-pistol-range -1.0"
      - "shift_left: events:input_csgo_weapon_double weapon-pistol-range"

  oneshot:
    slot: 22
    material: "%weapon_oneshot_material%"
    name: "{info}&lONE SHOT KILL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %weapon_oneshot%"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_csgo_weapon_setting weapon-pistol-oneshot"

  spread:
    slot: 23
    material: FEATHER
    name: "{info}&lSPREAD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%weapon_spread%"
      - ""
      - " {letters_black}▎ {success}Left-Click +0.01"
      - " {letters_black}▎ {error}Right-Click -0.01"
      - " {letters_black}▎ {warning}Shift-Click to enter"
