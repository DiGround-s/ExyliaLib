# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lJUMPAD {muted}— {highlight}%jumpad_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  direction:
    slot: 21
    material: COMPASS
    name: "{highlight}&lLAUNCH DIRECTION"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%yaw%"
      - ""
      - " {warning}➥ Click, then right-click in-world to set"
    actions:
      - "survivalcore:jumpad_set_yaw"

  direction-mode:
    slot: 22
    material: "%direction_mode_material%"
    name: "%direction_mode_color%&lDIRECTION MODE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %direction_mode_status%"
      - " {letters_black}▎ {letters}Player direction launches toward"
      - " {letters_black}▎ {letters}wherever the player is looking."
      - ""
      - " {warning}➥ Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_direction_mode"

  enabled:
    slot: 5
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %enabled_status%"
      - ""
      - " {warning}➥ Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_enabled"

  power:
    slot: 19
    material: SLIME_BALL
    name: "{highlight}&lHORIZONTAL POWER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%power%"
      - ""
      - " {success}● {info}Left-click {muted}+0.1"
      - " {error}● {info}Right-click {muted}-0.1"
      - " {success}● {info}Shift + Left {muted}+0.5"
      - " {error}● {info}Shift + Right {muted}-0.5"
    actions:
      - "left: survivalcore:jumpad_adjust_power 0.1"
      - "right: survivalcore:jumpad_adjust_power -0.1"
      - "shift_left: survivalcore:jumpad_adjust_power 0.5"
      - "shift_right: survivalcore:jumpad_adjust_power -0.5"

  vertical-power:
    slot: 20
    material: FEATHER
    name: "{highlight}&lVERTICAL POWER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%vertical_power%"
      - ""
      - " {success}● {info}Left-click {muted}+0.1"
      - " {error}● {info}Right-click {muted}-0.1"
      - " {success}● {info}Shift + Left {muted}+0.5"
      - " {error}● {info}Shift + Right {muted}-0.5"
    actions:
      - "left: survivalcore:jumpad_adjust_vertical 0.1"
      - "right: survivalcore:jumpad_adjust_vertical -0.1"
      - "shift_left: survivalcore:jumpad_adjust_vertical 0.5"
      - "shift_right: survivalcore:jumpad_adjust_vertical -0.5"

  locations:
    slot: 25
    material: LODESTONE
    name: "{highlight}&lTRIGGER LOCATIONS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configured: {highlight}%locations_count%"
      - ""
      - " {warning}➥ Click to manage"
    actions:
      - "survivalcore:jumpad_open_locations"

  glide:
    slot: 23
    material: "%glide_material%"
    name: "%glide_color%&lGLIDE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %glide_status%"
      - " {letters_black}▎ {letters}Players glide after launch"
      - ""
      - " {warning}➥ Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_glide"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE JUMPAD"
    lore:
      - ""
      - " {error}➥ Click to permanently delete"
    actions:
      - "survivalcore:jumpad_delete %jumpad_id%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {warning}➥ Return to jumpad list"
    actions:
      - "survivalcore:jumpad_open_list"
