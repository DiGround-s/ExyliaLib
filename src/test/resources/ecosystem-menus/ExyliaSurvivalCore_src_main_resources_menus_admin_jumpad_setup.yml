title: "{primary}&lJUMPAD {muted}— {highlight}%jumpad_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  direction:
    slot: 12
    material: COMPASS
    name: "{highlight}&lLAUNCH DIRECTION"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%yaw%"
      - ""
      - " {info}» Click, then right-click in-world to set"
    actions:
      - "survivalcore:jumpad_set_yaw"

  direction-mode:
    slot: 13
    material: "%direction_mode_material%"
    name: "{highlight}&lDIRECTION MODE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %direction_mode_status%"
      - " {muted}❙ {letters}Player direction launches toward"
      - " {muted}❙ {letters}wherever the player is looking."
      - ""
      - " {info}» Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_direction_mode"

  enabled:
    slot: 14
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %enabled_status%"
      - ""
      - " {info}» Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_enabled"

  power:
    slot: 29
    material: SLIME_BALL
    name: "{highlight}&lHORIZONTAL POWER"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%power%"
      - ""
      - " {success}● {info}Left-click {muted}+0.1"
      - " {error}● {info}Right-click {muted}-0.1"
      - " {success}● {info}Shift + Left {muted}+0.5"
      - " {error}● {info}Shift + Right {muted}-0.5"
    actions:
      - "left: survivalcore:jumpad_adjust_power 0.1"
      - "right: survivalcore:jumpad_adjust_power -0.1"
      - "shift_left: survivalcore:jumpad_adjust_power 0.5"
      - "shift_right: survivalcore:jumpad_adjust_power -0.5"

  vertical-power:
    slot: 30
    material: FEATHER
    name: "{highlight}&lVERTICAL POWER"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%vertical_power%"
      - ""
      - " {success}● {info}Left-click {muted}+0.1"
      - " {error}● {info}Right-click {muted}-0.1"
      - " {success}● {info}Shift + Left {muted}+0.5"
      - " {error}● {info}Shift + Right {muted}-0.5"
    actions:
      - "left: survivalcore:jumpad_adjust_vertical 0.1"
      - "right: survivalcore:jumpad_adjust_vertical -0.1"
      - "shift_left: survivalcore:jumpad_adjust_vertical 0.5"
      - "shift_right: survivalcore:jumpad_adjust_vertical -0.5"

  locations:
    slot: 32
    material: LODESTONE
    name: "{highlight}&lTRIGGER LOCATIONS"
    lore:
      - ""
      - " {muted}❙ {letters}Configured: {highlight}%locations_count%"
      - ""
      - " {info}» Click to manage"
    actions:
      - "survivalcore:jumpad_open_locations"

  glide:
    slot: 33
    material: "%glide_material%"
    name: "{highlight}&lGLIDE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %glide_status%"
      - " {muted}❙ {letters}Players glide after launch"
      - ""
      - " {info}» Click to toggle"
    actions:
      - "survivalcore:jumpad_toggle_glide"

  delete:
    slot: 47
    material: BARRIER
    name: "{error}&lDELETE JUMPAD"
    lore:
      - ""
      - " {error}» Click to permanently delete"
    actions:
      - "survivalcore:jumpad_delete %jumpad_id%"

  back:
    slot: 53
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to jumpad list"
    actions:
      - "survivalcore:jumpad_open_list"
