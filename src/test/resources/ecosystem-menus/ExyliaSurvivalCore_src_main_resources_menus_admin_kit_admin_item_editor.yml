# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The grid a kit is laid out in. It is the player's own inventory, in the same
# order it will arrive in:
#
#   0-4    helmet, chestplate, leggings, boots, offhand
#   9-35   the twenty-seven storage slots
#   36-44  the nine hotbar slots
#
# Whatever closes this screen — the save button, the cancel button, or Escape —
# what is left in the grid is read back and saved.

title: "{primary}&lKIT ITEMS {letters_black}» {highlight}%kit_id%"
size: 54
type: ITEM_INPUT

open_sounds:
  - "BLOCK_CHEST_OPEN|0.7|1.4"

editable_slots: "0-4,9-44"

close-actions:
  - "survivalcore:kit_admin_save_items"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  armor-label:
    slot: 5
    material: ARMOR_STAND
    name: "{primary}&l← ARMOUR & OFFHAND"
    lore:
      - ""
      - "{secondary}The five slots to the left:"
      - " {letters_black}▎ {letters}1 {letters_black}» {letters}Helmet"
      - " {letters_black}▎ {letters}2 {letters_black}» {letters}Chestplate"
      - " {letters_black}▎ {letters}3 {letters_black}» {letters}Leggings"
      - " {letters_black}▎ {letters}4 {letters_black}» {letters}Boots"
      - " {letters_black}▎ {letters}5 {letters_black}» {letters}Offhand"
      - ""
      - " {letters_black}▎ {letters_black}The rows below are the inventory,"
      - " {letters_black}▎ {letters_black}the last one being the hotbar."
      - ""

  import:
    slot: 6
    material: HOPPER
    name: "{success}&lIMPORT MY INVENTORY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Lays your own armour, offhand,"
      - " {letters_black}▎ {letters}inventory and hotbar into the grid."
      - " {letters_black}▎ {letters_black}Replaces whatever is there now."
      - ""
      - "{warning}➥ Click to import"
      - ""
    actions:
      - "survivalcore:kit_admin_import_inventory"

  clear:
    slot: 8
    material: TNT
    name: "{error}&lCLEAR THE GRID"
    lore:
      - ""
      - " {letters_black}▎ {letters}Empties every slot."
      - " {letters_black}▎ {letters_black}Nothing is saved until you leave."
      - ""
      - "{error}➥ Click to clear"
      - ""
    actions:
      - "survivalcore:kit_admin_clear_items"

  cancel:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lCANCEL'
    lore:
      - ""
      - " {letters_black}▎ {letters}Leaves the kit exactly as it was."
      - ""
      - "{error}➥ Click to discard"
      - ""
    actions:
      - "survivalcore:kit_admin_cancel_items"

  save:
    slot: 53
    material: EMERALD
    name: "{success}&lSAVE & BACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Saves the layout and returns"
      - " {letters_black}▎ {letters}to the kit."
      - ""
      - "{warning}➥ Click to save"
      - ""
    actions:
      - "close"
