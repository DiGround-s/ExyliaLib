title: "{primary}&lCLONES: %arena_id%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No clones"
    lore:
      - ""
      - "{muted}No instances loaded yet."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%instance_material%"
    name: "%instance_label%"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %instance_status%"
      - " {muted}❙ {letters}Spectator: %instance_spectator%"
      - ""
      - "{info}» Click to teleport"
    actions:
      - "practice:tp_clone %arena_id% %instance_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Go back to arena setup"
    actions:
      - "practice:open_arena_setup"
