title: "{primary}&lSELECT EVENT TYPE {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more"
    lore:
      - ""
      - "{muted}Im working on more event types!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%event_material%"
    name: "%event_display_name%"
    lore:
      - ""
      - " {muted}❙ {letters}%event_desc_1%"
      - " {muted}❙ {letters}%event_desc_2%"
      - " {muted}❙ {letters}%event_desc_3%"
      - ""
      - " {muted}❙ {warning}Category: {highlight}%event_category%"
      - ""
      - "{info}» Click to select"
    actions:
      - "capture:select_event_type %event_type%"

  navigation:
    previous:
      slot: 48
      material: ARROW
      name: "{error}&l← PREVIOUS"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      material: ARROW
      name: "{success}&lNEXT →"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  cancel:
    slot: 49
    material: BARRIER
    name: "{error}&lCANCEL"
    lore:
      - ""
      - " {muted}❙ {letters}Cancel event creation."
      - ""
      - "{info}» Click to cancel"
    actions:
      - "capture:cancel_config_create"
