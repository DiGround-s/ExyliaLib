title: "{success}&lGEM CRAWLER SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 4
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {letters_black}▎ {letters}Place {highlight}Emerald Blocks"
      - " {letters_black}▎ {letters}around the arena as gem"
      - " {letters_black}▎ {letters}spawn markers (kept, not consumed)"
      - ""
      - " {letters_black}▎ {letters}A gem drops above each marker"
      - " {letters_black}▎ {letters}on the interval below"
      - ""
      - " {letters_black}▎ {letters}Killed players drop their gems"
      - ""
      - " {letters_black}▎ {letters}Reach the gem goal and hold"
      - " {letters_black}▎ {letters}the lead to win"

  win-gems:
    slot: 19
    material: EMERALD
    name: "{success}&lGEMS TO WIN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%win_gems% 💎"
      - ""
      - " {letters_black}▎ {letters}Gems required to start"
      - " {letters_black}▎ {letters}the win countdown"
      - ""
      - " {letters_black}▎ {success}Left-Click +1"
      - " {letters_black}▎ {error}Right-Click -1"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting win-gems 1"
      - "right: events:adjust_setting win-gems -1"
      - "shift_left: events:input_setting win-gems"

  win-countdown:
    slot: 20
    material: CLOCK
    name: "{warning}&lWIN COUNTDOWN"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%win_countdown%s"
      - ""
      - " {letters_black}▎ {letters}Seconds the leader must"
      - " {letters_black}▎ {letters}hold the lead to win"
      - ""
      - " {letters_black}▎ {success}Left-Click +5s"
      - " {letters_black}▎ {error}Right-Click -5s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting win-countdown 5"
      - "right: events:adjust_setting win-countdown -5"
      - "shift_left: events:input_setting win-countdown"

  gem-spawn-interval:
    slot: 21
    material: EMERALD_BLOCK
    name: "{info}&lGEM SPAWN INTERVAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%gem_spawn_interval%s"
      - ""
      - " {letters_black}▎ {letters}Seconds between each"
      - " {letters_black}▎ {letters}gem spawn"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting gem-spawn-interval 1"
      - "right: events:adjust_setting gem-spawn-interval -1"
      - "shift_left: events:input_setting gem-spawn-interval"

  respawn-delay:
    slot: 22
    material: ENDER_PEARL
    name: "{info}&lRESPAWN TIME"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: {highlight}%respawn_delay%s"
      - ""
      - " {letters_black}▎ {success}Left-Click +1s"
      - " {letters_black}▎ {error}Right-Click -1s"
      - " {letters_black}▎ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting respawn-delay 1"
      - "right: events:adjust_setting respawn-delay -1"
      - "shift_left: events:input_setting respawn-delay"

  team-selector:
    slot: 23
    condition: "%has_teams% == true"
    material: "%team_selector_material%"
    name: "%team_selector_color%&lTEAM SELECTOR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Current: %team_selector%"
      - " {letters_black}▎ {letters}Allow players to choose"
      - " {letters_black}▎ {letters}their team in the lobby"
      - ""
      - "{warning}➥ Click to toggle"
    actions:
      - "events:toggle_team_selector_setting team-selector-enabled"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
