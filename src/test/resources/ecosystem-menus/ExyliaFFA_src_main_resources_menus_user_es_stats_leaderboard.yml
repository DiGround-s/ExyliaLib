title: "{primary}&lLEADERBOARD {muted}%arena_name%"
size: 54
type: MULTI_PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  back:
    slot: 49
    material: BARRIER
    name: "{warning}&l← VOLVER"
    lore:
      - ""
      - " {muted}❙ {letters}Regresar a la lista de arenas"
      - ""
      - "{warning}» Haz clic para volver"
    actions:
      - "ffa:open_stats"

sections:
  players:
    slots: "10-16,19-25,28-34"
    filler:
      material: BLACK_STAINED_GLASS_PANE
      hide_tooltip: false
    player_template:
      material: "playerhead-%player_name%"
      name: "{highlight}#%player_rank% {letters}%player_name%"
      lore:
        - ""
        - " {muted}❙ {letters}Bajas: {success}%player_kills%"
        - " {muted}❙ {letters}Muertes: {error}%player_deaths%"
        - " {muted}❙ {letters}K/D: {highlight}%player_kdr%"
        - " {muted}❙ {letters}Mejor racha: {info}%player_best_streak%"
        - ""
        - " {muted}❙ {letters}Asistencias: {info}%player_assists%"
        - " {muted}❙ {letters}Dano: {warning}%player_damage%"
        - " {muted}❙ {letters}Bajas/Min: {highlight}%player_kpm%"
        - ""
        - " {muted}❙ {letters}Tiempo jugado: {muted}%player_playtime%"
        - " {muted}❙ {letters}Tiempo vivo: {muted}%player_alivetime%"
        - ""
        - "{accent}» Resumen de combate"
    navigation:
      previous:
        slot: 45
        material: ARROW
        name: "{letters}← Anterior"
        lore:
          - "{info}Pagina: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: true
      next:
        slot: 53
        material: ARROW
        name: "{letters}Siguiente →"
        lore:
          - "{info}Pagina: {success}%current_page%&8/{error}%total_pages%"
        hide_tooltip: true
