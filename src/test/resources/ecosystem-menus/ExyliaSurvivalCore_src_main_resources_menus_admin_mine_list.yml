title: "{primary}&lMINES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No mines found"
    lore:
      - ""
      - "{muted}Create your first mine!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%mine_icon%"
    name: "{warning}&l%mine_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {highlight}%mine_id%"
      - " {muted}❙ {letters}Type: {highlight}%mine_type%"
      - " {muted}❙ {letters}Region: %mine_region_status%"
      - " {muted}❙ {letters}Status: %mine_enabled%"
      - " {muted}❙ {letters}Next reset: {highlight}%mine_next_reset%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:mine_edit %mine_id%"
      - "right: survivalcore:mine_delete %mine_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create-classic:
    slot: 3
    material: EMERALD_BLOCK
    name: "{success}&lCREATE CLASSIC MINE"
    lore:
      - ""
      - " {muted}❙ {letters}Full-cuboid mine, filled by"
      - " {muted}❙ {letters}weighted material composition"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:mine_create CLASSIC"

  create-realistic:
    slot: 5
    material: DIAMOND_ORE
    name: "{success}&lCREATE REALISTIC MINE"
    lore:
      - ""
      - " {muted}❙ {letters}Select an area and manually add"
      - " {muted}❙ {letters}the block materials that regenerate"
      - " {muted}❙ {letters}individually per block"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:mine_create REALISTIC"

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    lore:
      - ""
      - "{info}» Click to close"
    actions:
      - "survivalcore:close_menu"
