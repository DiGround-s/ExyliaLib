# This file is yours to edit.
#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lLEVEL {muted}#%level_position% {highlight}%level_material%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  display:
    slot: 37
    material: "%level_material%"
    name: "{highlight}&l%level_material%"
    lore:
      - ""
      - " {muted}❙ {letters}Position: {highlight}#%level_position% {muted}of %levels_total%"
      - " {muted}❙ {letters}Configured manually as a regeneration level"
      - ""
      - "{muted}This is the material the block heals"
      - "{muted}back to once fully regenerated."

  reorder-up:
    slot: 38
    material: SPECTRAL_ARROW
    name: "{highlight}&l▲ MOVE UP"
    lore:
      - ""
      - " {muted}❙ {letters}Move this level earlier in the list"
      - " {muted}❙ {muted}(display order only, no gameplay effect)"
      - ""
      - "{info}» Click to move up"
    actions:
      - "survivalcore:mine_level_move %level_index% -1"

  reorder-down:
    slot: 39
    material: SPECTRAL_ARROW
    name: "{highlight}&l▼ MOVE DOWN"
    lore:
      - ""
      - " {muted}❙ {letters}Move this level later in the list"
      - " {muted}❙ {muted}(display order only, no gameplay effect)"
      - ""
      - "{info}» Click to move down"
    actions:
      - "survivalcore:mine_level_move %level_index% 1"

  regen:
    slot: 40
    material: CLOCK
    name: "{highlight}&lREGEN TIME"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%level_regen%s {muted}(%level_regen_formatted%)"
      - ""
      - " {muted}❙ {letters}Total seconds after breaking until"
      - " {muted}❙ {letters}the block fully heals back"
      - ""
      - " {success}● {info}Left-click {muted}+10s"
      - " {error}● {info}Right-click {muted}-10s"
      - " {success}● {info}Shift + Left {muted}+60s"
      - " {error}● {info}Shift + Right {muted}-60s"
      - " {highlight}● {info}Middle-click {muted}type exact value"
    actions:
      - "left: survivalcore:mine_level_adjust_regen %level_index% 10"
      - "right: survivalcore:mine_level_adjust_regen %level_index% -10"
      - "shift_left: survivalcore:mine_level_adjust_regen %level_index% 60"
      - "shift_right: survivalcore:mine_level_adjust_regen %level_index% -60"
      - "middle: survivalcore:mine_level_set_regen %level_index%"

  degrade-chain:
    slot: 41
    material: REPEATING_COMMAND_BLOCK
    name: "{highlight}&lDEGRADE CHAIN"
    lore:
      - ""
      - " {muted}❙ {letters}Stages: {highlight}%level_stages%"
      - ""
      - " {muted}❙ {letters}Visual materials shown while the"
      - " {muted}❙ {letters}block regenerates, in order"
      - " {muted}❙ {letters}e.g. STONE @5s {muted}→ {letters}COBBLESTONE @15s"
      - ""
      - "{info}» Click to manage stages"
    actions:
      - "survivalcore:mine_level_open_chain %level_index%"

  loot:
    slot: 42
    material: CHEST
    name: "{highlight}&lCUSTOM LOOT TABLE"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %level_loot_status%"
      - ""
      - " {muted}❙ {letters}When configured, breaking a block"
      - " {muted}❙ {letters}of this level drops this table"
      - " {muted}❙ {letters}instead of the vanilla drop"
      - ""
      - "{info}» Click to edit"
    actions:
      - "survivalcore:mine_level_open_loot %level_index%"

  effects:
    slot: 43
    material: NOTE_BLOCK
    name: "{highlight}&lBREAK EFFECTS"
    lore:
      - ""
      - " {muted}❙ {letters}Status: %level_effects_status%"
      - ""
      - " {muted}❙ {letters}Sounds, particles, titles and more"
      - " {muted}❙ {letters}played when a block of this level"
      - " {muted}❙ {letters}is mined."
      - ""
      - " {muted}❙ {warning}Overrides {letters}the mine's global"
      - " {muted}❙ {letters}effects when configured here."
      - ""
      - "{info}» Click to edit"
    actions:
      - "survivalcore:mine_level_open_effects %level_index%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {info}» Return to level list"
    actions:
      - "survivalcore:mine_open_levels"

  delete:
    slot: 53
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lREMOVE LEVEL"
    lore:
      - ""
      - " {muted}❙ {letters}Removes this level entirely."
      - " {muted}❙ {letters}Blocks of this material will no"
      - " {muted}❙ {letters}longer regenerate when broken."
      - ""
      - "{error}» Click to remove"
    actions:
      - "survivalcore:mine_level_remove %level_index%"
