title: "{primary}&lCOMMANDS {muted}- %config_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  start-commands:
    slot: 3
    material: LIME_DYE
    name: "{success}&lSTART COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when the event starts"
      - " {letters_black}▎ {letters}Count: {highlight}%start_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_start_commands"

  end-commands:
    slot: 4
    material: RED_DYE
    name: "{error}&lEND COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when the event ends"
      - " {letters_black}▎ {letters}Runs regardless of outcome {muted}(win, cancel, timeout)"
      - " {letters_black}▎ {letters}Count: {highlight}%end_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_end_commands"

  top1-reward:
    slot: 12
    material: DIAMOND
    name: "{highlight}&l#1 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%top_1_count%"
      - ""
      - " {letters_black}▎ {info}Reward for the top 1 clan"
      - " {letters_black}▎ {info}Supports chance, condition & permission"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_top_rewards 1"

  top2-reward:
    slot: 13
    material: IRON_INGOT
    name: "{highlight}&l#2 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%top_2_count%"
      - ""
      - " {letters_black}▎ {info}Reward for the top 2 clan"
      - " {letters_black}▎ {info}Supports chance, condition & permission"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_top_rewards 2"

  top3-reward:
    slot: 14
    material: GOLD_NUGGET
    name: "{highlight}&l#3 REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%top_3_count%"
      - ""
      - " {letters_black}▎ {info}Reward for the top 3 clan"
      - " {letters_black}▎ {info}Supports chance, condition & permission"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_top_rewards 3"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
