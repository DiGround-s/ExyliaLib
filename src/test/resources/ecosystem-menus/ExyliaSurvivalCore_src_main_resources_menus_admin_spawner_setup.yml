#
# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lSPAWNER {muted}— {highlight}%spawner_id%"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  enabled:
    slot: 4
    material: "%enabled_material%"
    name: "{highlight}&lSTATUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %enabled_status%"
      - ""
      - " {muted}❙ {letters}Toggle spawner on or off"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "survivalcore:spawner_toggle_enabled"

  locations:
    slot: 6
    material: "%location_material%"
    name: "{highlight}&lSPAWN LOCATIONS"
    lore:
      - ""
      - " {muted}❙ {letters}Count: {highlight}%location_count%"
      - ""
      - " {muted}❙ {letters}Blocks where items will drop"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:spawner_open_locations"

  min-interval:
    slot: 20
    material: CLOCK
    name: "{highlight}&lMIN INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%min_interval%s"
      - ""
      - " {success}● {info}Left-click {muted}+1s"
      - " {error}● {info}Right-click {muted}-1s"
      - " {success}● {info}Shift + Left {muted}+10s"
      - " {error}● {info}Shift + Right {muted}-10s"
    actions:
      - "left: survivalcore:spawner_adjust_min_interval 1"
      - "right: survivalcore:spawner_adjust_min_interval -1"
      - "shift_left: survivalcore:spawner_adjust_min_interval 10"
      - "shift_right: survivalcore:spawner_adjust_min_interval -10"

  max-interval:
    slot: 24
    material: OBSERVER
    name: "{highlight}&lMAX INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%max_interval%s"
      - ""
      - " {success}● {info}Left-click {muted}+1s"
      - " {error}● {info}Right-click {muted}-1s"
      - " {success}● {info}Shift + Left {muted}+10s"
      - " {error}● {info}Shift + Right {muted}-10s"
    actions:
      - "left: survivalcore:spawner_adjust_max_interval 1"
      - "right: survivalcore:spawner_adjust_max_interval -1"
      - "shift_left: survivalcore:spawner_adjust_max_interval 10"
      - "shift_right: survivalcore:spawner_adjust_max_interval -10"

  loot:
    slot: 31
    material: CHEST
    name: "{highlight}&lLOOT TABLE"
    lore:
      - ""
      - " {muted}❙ {letters}Items that can spawn"
      - ""
      - "{info}» Click to manage"
    actions:
      - "survivalcore:spawner_open_loot"

  delete:
    slot: 53
    material: BARRIER
    name: "{error}&lDELETE SPAWNER"
    lore:
      - ""
      - " {error}» Click to permanently delete"
    actions:
      - "survivalcore:spawner_delete %spawner_id%"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {info}» Return to spawner list"
    actions:
      - "survivalcore:spawner_open_list"
