title: "{primary}&lINICIAR EVENTO {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay eventos disponibles"
    lore:
      - ""
      - "{muted}Vuelve mas tarde"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%event_material%"
    name: "%event_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Tipo: {info}%event_type%"
      - " {muted}❙ {letters}Jugadores: {highlight}%min_players% - %max_players%"
      - ""
      - "{info}» Clic para iniciar"
    actions:
      - "events:start_event %event_id%"

  navigation:
    previous:
      slot: 30
      material: ARROW
      name: '{error}&l← PAGINA ANTERIOR'
      lore:
        - ' {muted}❙ {letters}Clic para ir'
        - ' {muted}❙ {letters}a la pagina anterior.'
        - ''
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 32
      material: ARROW
      name: '{success}&lSIGUIENTE PAGINA →'
      lore:
        - ' {muted}❙ {letters}Clic para ir'
        - ' {muted}❙ {letters}a la siguiente pagina.'
        - ''
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 31
    material: ARROW
    name: '{error}&lVolver'
    lore:
      - '{muted}Clic para volver'
    actions:
      - "events:open_main_menu"
