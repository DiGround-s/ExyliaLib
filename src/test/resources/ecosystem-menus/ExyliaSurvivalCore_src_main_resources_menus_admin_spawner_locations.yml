title: "{primary}&lSPAWN LOCATIONS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No locations set"
    lore:
      - ""
      - " {muted}Add one with the button below."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: GRASS_BLOCK
    name: "{warning}&lLOCATION #%loc_index%"
    lore:
      - ""
      - " {muted}❙ {letters}World: {info}%loc_world%"
      - " {muted}❙ {letters}X: {info}%loc_x% {muted}Y: {info}%loc_y% {muted}Z: {info}%loc_z%"
      - ""
      - " {error}● {info}Right-click to remove"
    actions:
      - "right: survivalcore:spawner_remove_location %loc_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  add:
    slot: 48
    material: EMERALD
    name: "{success}&lADD LOCATION"
    lore:
      - ""
      - " {info}» Click, then click a block in-world"
    actions:
      - "survivalcore:spawner_add_location"

  back:
    slot: 50
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to spawner setup"
    actions:
      - "survivalcore:spawner_back_to_setup"
