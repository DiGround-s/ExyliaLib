title: "{primary}&lBOUNTIES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No active bounties"
    lore:
      - ""
      - " {muted}Be the first to place a bounty!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "playerhead:%bounty_target%"
    name: "{error}&l%bounty_target%"
    lore:
      - ""
      - " {muted}❙ {letters}Total Bounty: {highlight}%bounty_total%"
      - " {muted}❙ {letters}Bounties Stacked: {highlight}%bounty_count%"
      - ""
      - " {info}● {letters}Click to view contributions"
    actions:
      - "left: survivalcore:bounty_open_contributions %bounty_target_uuid%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    actions:
      - "survivalcore:close_menu"
