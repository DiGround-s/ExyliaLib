title: "{primary}&lCOMMANDS {muted}- %config_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  start-commands:
    slot: 3
    material: LIME_DYE
    name: "{success}&lSTART COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when the event starts"
      - " {letters_black}▎ {letters}Count: {highlight}%start_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_start_commands"

  end-commands:
    slot: 4
    material: RED_DYE
    name: "{error}&lEND COMMANDS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Executed when the event ends"
      - " {letters_black}▎ {letters}Runs regardless of outcome {muted}(win, cancel, timeout)"
      - " {letters_black}▎ {letters}Count: {highlight}%end_count%"
      - ""
      - " {letters_black}▎ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {letters_black}▎ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_end_commands"

  winner-commands:
    slot: 5
    material: NETHER_STAR
    name: "{warning}&lWINNER REWARD"
    lore:
      - ""
      - " {letters_black}▎ {letters}Rewards: {highlight}%winner_count%"
      - ""
      - " {letters_black}▎ {info}Executed only when there is a winner"
      - " {letters_black}▎ {info}Supports chance, condition & permission"
      - ""
      - " {letters_black}▎ {success}Click to manage"
    actions:
      - "capture:open_winner_rewards"

  back:
    slot: 22
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
