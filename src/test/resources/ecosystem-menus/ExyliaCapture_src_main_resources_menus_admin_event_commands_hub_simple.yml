title: "{primary}&lCOMMANDS {muted}- %config_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  start-commands:
    slot: 10
    material: LIME_DYE
    name: "{success}&lSTART COMMANDS"
    lore:
      - ""
      - " {muted}❙ {letters}Executed when the event starts"
      - " {muted}❙ {letters}Count: {highlight}%start_count%"
      - ""
      - " {muted}❙ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {muted}❙ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {muted}❙ {success}Click to manage"
    actions:
      - "capture:open_start_commands"

  end-commands:
    slot: 13
    material: RED_DYE
    name: "{error}&lEND COMMANDS"
    lore:
      - ""
      - " {muted}❙ {letters}Executed when the event ends"
      - " {muted}❙ {letters}Runs regardless of outcome {muted}(win, cancel, timeout)"
      - " {muted}❙ {letters}Count: {highlight}%end_count%"
      - ""
      - " {muted}❙ {info}Supports: {highlight}console: {info}/ {highlight}player:"
      - " {muted}❙ {info}Placeholder: {highlight}%event_name%"
      - ""
      - " {muted}❙ {success}Click to manage"
    actions:
      - "capture:open_end_commands"

  winner-commands:
    slot: 16
    material: NETHER_STAR
    name: "{warning}&lWINNER REWARD"
    lore:
      - ""
      - " {muted}❙ {letters}Rewards: {highlight}%winner_count%"
      - ""
      - " {muted}❙ {info}Executed only when there is a winner"
      - " {muted}❙ {info}Supports chance, condition & permission"
      - ""
      - " {muted}❙ {success}Click to manage"
    actions:
      - "capture:open_winner_rewards"

  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Click to go back"
    actions:
      - "capture:open_config_setup"
