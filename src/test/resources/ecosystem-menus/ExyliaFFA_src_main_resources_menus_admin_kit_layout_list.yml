title: "{primary}&lKIT LAYOUTS {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No kits"
    lore:
      - ""
      - "{muted}No kits found across arenas"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%kit_icon%"
    name: "{warning}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Arena: {info}%arena_name%"
      - ""
      - " {muted}❙ {letters}Click to delete all custom"
      - " {muted}❙ {letters}layouts for this kit"
      - ""
      - "{error}» Click to reset all layouts"
    actions:
      - "ffa:confirm_reset_kit_layouts %kit_id%"

  navigation:
    previous:
      slot: 28
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 34
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  back:
    slot: 31
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to data management"
    actions:
      - "ffa:open_admin_data"
