title: "{primary}&lJUMPADS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No jumpads"
    lore:
      - ""
      - "{muted}Create your first jumpad!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: SLIME_BALL
    name: "{warning}&l%jumpad_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {info}%jumpad_id%"
      - " {muted}❙ {letters}Status: %jumpad_enabled%"
      - " {muted}❙ {letters}Direction: {highlight}%jumpad_yaw%"
      - " {muted}❙ {letters}Power: {highlight}%jumpad_power% {muted}| Vertical: {highlight}%jumpad_vertical%"
      - " {muted}❙ {letters}Locations: {highlight}%jumpad_locations%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: practice:jumpad_edit %jumpad_id%"
      - "right: practice:jumpad_confirm_delete %jumpad_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE JUMPAD"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new launch pad"
      - ""
      - "{info}» Click to create"
    actions:
      - "practice:jumpad_create"

  back:
    slot: 49
    material: ARROW
    name: "{error}&lBack"
    lore:
      - "{muted}Return to admin panel"
    actions:
      - "practice:open_admin"
