title: "{primary}&lPREVIEW {muted}— {highlight}%kit_name%"
size: 54
type: SIMPLE
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide_tooltip: true

  custom:
    header:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      hide_tooltip: true
      slots: "0-8"

    armor_frame:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      hide_tooltip: true
      slots: "9,14,16-17"

    inventory_frame:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      hide_tooltip: true
      slots: "18,26,27,35"

    hotbar:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: " "
      hide_tooltip: true
      slots: "45-53"

items:
  kit_info:
    slot: 4
    material: "%kit_icon%"
    name: "{highlight}&l%kit_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Kit contents preview"
      - " {muted}❙ {letters}Items: {highlight}%kit_items%"
      - " {muted}❙ {letters}Armor, offhand, inventory & hotbar"

  armor_label:
    slot: 0
    material: DIAMOND_CHESTPLATE
    name: "{info}&lARMOR"
    lore:
      - ""
      - " {muted}❙ {letters}Equipped armor"

  inventory_label:
    slot: 2
    material: CHEST
    name: "{letters}&lINVENTORY"
    lore:
      - ""
      - " {muted}❙ {letters}Stored inventory items"

  hotbar_label:
    slot: 6
    material: IRON_SWORD
    name: "{success}&lHOTBAR"
    lore:
      - ""
      - " {muted}❙ {letters}Items ready to use"

  offhand_label:
    slot: 7
    material: SHIELD
    name: "{highlight}&lOFFHAND"
    lore:
      - ""
      - " {muted}❙ {letters}Held in the offhand"

  close:
    slot: 8
    material: BARRIER
    name: "{error}&lCLOSE"
    lore:
      - ""
      - " {info}» Click to close"
    actions:
      - "survivalcore:close_menu"
