title: "{primary}&lPERSONALIZAR ARMADURA"
size: 27
animation: "rows_alternate"

open_sounds:
  - "ENTITY_ARROW_SHOOT|1.0|2.0"
close_sounds:
  - "BLOCK_CHEST_LOCKED|1.0|2.0"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|2.0"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  helmet:
    slot: 10
    material: DIAMOND_HELMET
    armor_trim:
      pattern: "%helmet_trim_pattern%"
      material: "%helmet_trim_material%"
    name: "{accent}&lCASCO"
    lore:
      - "{muted} ┃ {letters}Pattern: {info}%helmet_pattern%"
      - "{muted} ┃ {letters}Material: {info}%helmet_material%"
      - ""
      - "{accent}⚡ Click para personalizar"
    actions:
      - "armortrim:select_piece helmet"

  chestplate:
    slot: 11
    material: DIAMOND_CHESTPLATE
    armor_trim:
      pattern: "%chestplate_trim_pattern%"
      material: "%chestplate_trim_material%"
    name: "{accent}&lPECHERA"
    lore:
      - "{muted} ┃ {letters}Pattern: {info}%chestplate_pattern%"
      - "{muted} ┃ {letters}Material: {info}%chestplate_material%"
      - ""
      - "{accent}⚡ Click para personalizar"
    actions:
      - "armortrim:select_piece chestplate"

  leggings:
    slot: 12
    material: DIAMOND_LEGGINGS
    armor_trim:
      pattern: "%leggings_trim_pattern%"
      material: "%leggings_trim_material%"
    name: "{accent}&lPANTALONES"
    lore:
      - "{muted} ┃ {letters}Pattern: {info}%leggings_pattern%"
      - "{muted} ┃ {letters}Material: {info}%leggings_material%"
      - ""
      - "{accent}⚡ Click para personalizar"
    actions:
      - "armortrim:select_piece leggings"

  boots:
    slot: 13
    material: DIAMOND_BOOTS
    armor_trim:
      pattern: "%boots_trim_pattern%"
      material: "%boots_trim_material%"
    name: "{accent}&lBOTAS"
    lore:
      - "{muted} ┃ {letters}Pattern: {info}%boots_pattern%"
      - "{muted} ┃ {letters}Material: {info}%boots_material%"
      - ""
      - "{accent}⚡ Click para personalizar"
    actions:
      - "armortrim:select_piece boots"

  reset:
    slot: 16
    material: BARRIER
    name: "{error}&lRESETEAR TODO"
    lore:
      - "{muted} ┃ {letters}Eliminar todas las personalizaciones"
      - ""
      - "{error}⚡ Click para resetear"
    actions:
      - "armortrim:reset"
