title: "{primary}&lKIT {muted}· {highlight}%pk_name%"
size: 27

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  preview:
    slot: 12
    material: "%pk_icon%"
    name: "{letters}&l%pk_name%"
    glow: true
    hide_tooltip: false
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {info}%pk_id%"
      - " {letters_black}▎ {letters}Items: {info}%pk_items%"
      - " {letters_black}▎ {letters}Desc: {info}%pk_description%"

  contents:
    slot: 13
    material: ANVIL
    name: "{success}&lEdit Contents"
    lore:
      - ""
      - " {letters_black}▎ {letters}Opens the Kit Creator with"
      - " {letters_black}▎ {letters}this kit already equipped"
      - ""
      - " {letters_black}▎ {letters}Save it with {highlight}/kitsave"
      - ""
      - "{warning}➥ Click to edit"
    actions:
      - "sandbox:predefined_kit_edit %pk_id%"

  rename:
    slot: 3
    material: NAME_TAG
    name: "{info}&lRename Kit"
    lore:
      - ""
      - " {letters_black}▎ {letters}Change the displayed name"
      - ""
      - "{warning}➥ Click to rename"
    actions:
      - "sandbox:predefined_kit_rename %pk_id%"

  icon:
    slot: 2
    material: ITEM_FRAME
    name: "{highlight}&lChange Icon"
    lore:
      - ""
      - " {letters_black}▎ {letters}Set a custom icon material"
      - ""
      - "{warning}➥ Click to change"
    actions:
      - "sandbox:predefined_kit_set_icon %pk_id%"

  description:
    slot: 4
    material: WRITABLE_BOOK
    name: "{secondary}&lDescription"
    lore:
      - ""
      - " {letters_black}▎ {letters}One line players read"
      - " {letters_black}▎ {letters}before copying the kit"
      - ""
      - "{warning}➥ Click to write"
    actions:
      - "sandbox:predefined_kit_set_description %pk_id%"

  delete:
    slot: 26
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
