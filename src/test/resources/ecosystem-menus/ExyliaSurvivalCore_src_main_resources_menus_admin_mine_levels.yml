# It is written once, when it is missing, and never overwritten: what is on
# disk after that is what you left here. Reload the plugin to apply an edit.

title: "{primary}&lLEVELS {muted}— %mine_id% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No levels configured"
    lore:
      - ""
      - "{muted}Add block materials from the"
      - "{muted}mine setup menu."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%level_material%"
    name: "{warning}&l#%level_position% {highlight}%level_material%"
    lore:
      - ""
      - " {letters_black}▎ {letters}Configured manually"
      - " {letters_black}▎ {letters}Regen time: {highlight}%level_regen%s"
      - " {letters_black}▎ {letters}Degrade stages: {highlight}%level_stages%"
      - " {letters_black}▎ {letters}Custom loot: %level_loot_status%"
      - ""
      - " {success}● {info}Click {muted}to open details"
      - " {letters_black}▎ {error}Shift + Right-click to remove"
    actions:
      - "left: survivalcore:mine_level_open %level_index%"
      - "right: survivalcore:mine_level_open %level_index%"
      - "shift_right: survivalcore:mine_level_remove %level_index%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      actions:
        - "previous_page"
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      actions:
        - "next_page"

items:
  add-level:
    slot: 45
    material: EMERALD
    name: "{success}&lADD MATERIAL"
    lore:
      - ""
      - " {letters_black}▎ {letters}Add a block material as a"
      - " {letters_black}▎ {letters}realistic regeneration level"
      - ""
      - "{warning}➥ Click to select"
    actions:
      - "survivalcore:mine_add_level"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {warning}➥ Return to mine setup"
    actions:
      - "survivalcore:mine_back_to_setup"
