title: "{primary}&lLEVELS {muted}— %mine_id% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No levels configured"
    lore:
      - ""
      - "{muted}Add block materials from the"
      - "{muted}mine setup menu."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%level_material%"
    name: "{warning}&l#%level_position% {highlight}%level_material%"
    lore:
      - ""
      - " {muted}❙ {letters}Configured manually"
      - " {muted}❙ {letters}Regen time: {highlight}%level_regen%s"
      - " {muted}❙ {letters}Degrade stages: {highlight}%level_stages%"
      - " {muted}❙ {letters}Custom loot: %level_loot_status%"
      - ""
      - " {success}● {info}Click {muted}to open details"
      - " {muted}❙ {error}Shift + Right-click to remove"
    actions:
      - "left: survivalcore:mine_level_open %level_index%"
      - "right: survivalcore:mine_level_open %level_index%"
      - "shift_right: survivalcore:mine_level_remove %level_index%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      actions:
        - "next_page"

items:
  add-level:
    slot: 40
    material: EMERALD
    name: "{success}&lADD MATERIAL"
    lore:
      - ""
      - " {muted}❙ {letters}Add a block material as a"
      - " {muted}❙ {letters}realistic regeneration level"
      - ""
      - "{info}» Click to select"
    actions:
      - "survivalcore:mine_add_level"

  back:
    slot: 49
    material: ARROW
    name: "{letters}&lBACK"
    lore:
      - ""
      - " {info}» Return to mine setup"
    actions:
      - "survivalcore:mine_back_to_setup"
