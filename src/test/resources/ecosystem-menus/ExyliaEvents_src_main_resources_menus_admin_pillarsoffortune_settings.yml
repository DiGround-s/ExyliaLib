title: "{primary}&lPILLARS OF FORTUNE SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  item-interval:
    slot: 38
    material: NETHER_STAR
    name: "{primary}&lITEM INTERVAL"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%item_interval%s"
      - ""
      - " {muted}❙ {letters}Seconds between each"
      - " {muted}❙ {letters}random item drop"
      - ""
      - " {muted}❙ {success}Left-Click +1s"
      - " {muted}❙ {error}Right-Click -1s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting item-interval 1"
      - "right: events:adjust_setting item-interval -1"
      - "shift_left: events:input_setting item-interval"

  mode:
    slot: 25
    material: "%pillars_mode_material%"
    name: "{primary}&lITEM MODE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%pillars_mode%"
      - ""
      - " {muted}❙ {letters}DEFAULT {muted}- One random item added"
      - " {muted}❙ {letters}HOTBAR {muted}- All 9 hotbar slots replaced"
      - " {muted}❙ {letters}INVENTORY {muted}- All 36 slots replaced"
      - ""
      - "{info}» Click to cycle"
    actions:
      - "events:cycle_pillars_mode"

  grace-period:
    slot: 37
    material: CLOCK
    name: "{info}&lGRACE PERIOD"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%grace_period%s"
      - ""
      - " {muted}❙ {letters}No PvP or damage at start"
      - ""
      - " {muted}❙ {success}Left-Click +5s"
      - " {muted}❙ {error}Right-Click -5s"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting grace-period 5"
      - "right: events:adjust_setting grace-period -5"
      - "shift_left: events:input_setting grace-period"

  item-given-message:
    slot: 39
    material: "%item_given_message_material%"
    name: "{primary}&lITEM GIVEN MESSAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: %item_given_message%"
      - ""
      - " {muted}❙ {letters}Send a chat message to the"
      - " {muted}❙ {letters}player when they receive an item"
      - ""
      - "{info}» Click to toggle"
    actions:
      - "events:toggle_pillarsoffortune_setting item-given-message"

  back:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - "{muted}Click to go back"
    actions:
      - "events:open_config_setup"
