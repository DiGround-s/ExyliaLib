title: "{primary}&lLOOT CHEST TEMPLATES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No templates found"
    lore:
      - ""
      - "{muted}Create your first template!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: CHEST
    name: "{highlight}&l%template_name%"
    lore:
      - ""
      - " {muted}❙ {letters}ID: {highlight}%template_id%"
      - " {muted}❙ {letters}Entries: {highlight}%template_entries%"
      - " {muted}❙ {letters}Creator: {highlight}%template_creator%"
      - ""
      - " {muted}❙ {success}Left-Click to edit"
      - " {muted}❙ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:lc_edit_template %template_id%"
      - "right: survivalcore:lc_delete_template %template_id%"

  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {muted}❙ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 53
      material: ARROW
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {muted}❙ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 4
    material: EMERALD
    name: "{success}&lCREATE TEMPLATE"
    lore:
      - ""
      - " {muted}❙ {letters}Create a new loot template"
      - ""
      - "{info}» Click to create"
    actions:
      - "survivalcore:lc_create_template"

  chests:
    slot: 6
    material: ENDER_CHEST
    name: "{highlight}&lALL CHESTS"
    lore:
      - ""
      - " {muted}❙ {letters}View all placed loot chests"
      - ""
      - "{info}» Click to open"
    actions:
      - "survivalcore:lc_open_chest_list"

  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCLOSE"
    lore:
      - ""
      - "{info}» Click to close"
    actions:
      - "survivalcore:close_menu"
