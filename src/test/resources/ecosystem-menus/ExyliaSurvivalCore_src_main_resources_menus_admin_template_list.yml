title: "{primary}&lLOOT CHEST TEMPLATES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No templates found"
    lore:
      - ""
      - "{muted}Create your first template!"
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{highlight}&l%template_name%"
    lore:
      - ""
      - " {letters_black}▎ {letters}ID: {highlight}%template_id%"
      - " {letters_black}▎ {letters}Entries: {highlight}%template_entries%"
      - " {letters_black}▎ {letters}Creator: {highlight}%template_creator%"
      - ""
      - " {letters_black}▎ {success}Left-Click to edit"
      - " {letters_black}▎ {error}Right-Click to delete"
    actions:
      - "left: survivalcore:lc_edit_template %template_id%"
      - "right: survivalcore:lc_delete_template %template_id%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ' {letters_black}▎ {letters}Go to the previous page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ' {letters_black}▎ {letters}Go to the next page.'
        - ''
        - '{info}ℹ Page: {success}%current_page%<#475569>/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  create:
    slot: 45
    material: EMERALD
    name: "{success}&lCREATE TEMPLATE"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create a new loot template"
      - ""
      - "{warning}➥ Click to create"
    actions:
      - "survivalcore:lc_create_template"

  chests:
    slot: 46
    material: ENDER_CHEST
    name: "{highlight}&lALL CHESTS"
    lore:
      - ""
      - " {letters_black}▎ {letters}View all placed loot chests"
      - ""
      - "{warning}➥ Click to open"
    actions:
      - "survivalcore:lc_open_chest_list"

  close:
    slot: 49
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lCLOSE'
    lore:
      - ""
      - "{warning}➥ Click to close"
    actions:
      - "survivalcore:close_menu"
