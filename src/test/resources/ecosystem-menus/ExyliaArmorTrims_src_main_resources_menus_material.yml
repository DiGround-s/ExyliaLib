title: "{primary}&lSELECT MATERIAL"
size: 54
type: PAGINATION
animation: "rows_alternate"

open_sounds:
  - "ENTITY_ARROW_SHOOT|1.0|2.0"
close_sounds:
  - "BLOCK_CHEST_LOCKED|1.0|2.0"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|2.0"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: "10-16,19-25,28-34"

  item_template:
    material: "%material_item%"
    hide-attributes: true
    name: "{accent}&l%material_name%"
    lore:
      - "{muted} ┃ {letters}Material: {info}%material_id%"
      - ""
      - "{accent}⚡ Click to select"
    actions:
      - "armortrim:select_material %armor_piece% %selected_pattern_id% %material_id%"

  selected_template:
    material: "%material_item%"
    hide-attributes: true
    name: "{success}&l%material_name%"
    lore:
      - "{muted} ┃ {letters}Material: {info}%material_id%"
      - ""
      - "{success}✔ Currently selected"
    glowing: true

  no_permissions_template:
    material: "%material_item%"
    hide-attributes: true
    name: "{muted}&l%material_name%"
    lore:
      - "{muted} ┃ {letters}Material: {info}%material_id%"
      - ""
      - "{error}🔒 No permission"

