  item_template:
    material: "%world_icon%"
    name: "%world_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Price: {highlight}%world_price%"
      - " {muted}❙ {letters}Cooldown: {highlight}%world_cooldown%"
      - " {muted}❙ {letters}Status: %world_status%"
      - ""
      - " {info}» Click to teleport"
      - ""
    actions:
      - "survivalcore:rtp_world %world_id%"

