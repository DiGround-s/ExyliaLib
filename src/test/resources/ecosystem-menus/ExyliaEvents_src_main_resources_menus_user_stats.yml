    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No events available"
    lore:
      - ""
      - "{muted}Come back later!"
    hide_tooltip: false

items:
  overall:
    slot: 4
    material: DIAMOND
    name: "{warning}&lOVERALL STATISTICS"
    lore:
      - ""
      - " {muted}❙ {letters}Kills: {highlight}%total_kills%"
      - " {muted}❙ {letters}Deaths: {highlight}%total_deaths%"
      - " {muted}❙ {letters}K/D Ratio: {highlight}%kdr%"
      - ""
      - " {muted}❙ {letters}Wins: {success}%total_wins%"
      - " {muted}❙ {letters}Games: {highlight}%games_played%"
      - " {muted}❙ {letters}Win Rate: {success}%win_rate%"

