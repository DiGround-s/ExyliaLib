title: "{info}&lSPLATOON SETTINGS"
size: 54
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  info:
    slot: 0
    material: BOOK
    name: "{info}&lHOW TO SETUP"
    lore:
      - ""
      - " {muted}❙ {letters}Build floors/walls out of any"
      - " {muted}❙ {letters}color of: {highlight}Wool, Concrete,"
      - " {muted}❙ {letters}Terracotta, Glazed Terracotta,"
      - " {muted}❙ {letters}Stained Glass (or Pane), Carpet"
      - " {muted}❙ {letters}or Concrete Powder"
      - ""
      - " {muted}❙ {letters}Any starting color works - it"
      - " {muted}❙ {letters}repaints to the shooter's team"
      - " {muted}❙ {letters}color on hit"
      - ""
      - " {muted}❙ {letters}Score = blocks painted"
      - " {muted}❙ {letters}in your team's color"

  team-count:
    slot: 10
    material: WHITE_BANNER
    name: "{warning}&lTEAMS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%team_count%"
      - ""
      - " {muted}❙ {letters}Number of teams"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting team-count 1"
      - "right: events:adjust_setting team-count -1"
      - "shift_left: events:input_setting team-count"

  weapon-delay:
    slot: 12
    material: WOODEN_HOE
    name: "{info}&lWEAPON DELAY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_delay%s"
      - ""
      - " {muted}❙ {letters}Seconds between shots"
      - ""
      - "{info}» Click to enter"
    actions:
      - "events:input_double_setting weapon-delay"

  weapon-damage:
    slot: 14
    material: IRON_SWORD
    name: "{error}&lWEAPON DAMAGE"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%weapon_damage% ❤"
      - ""
      - " {muted}❙ {letters}Hearts of damage on hit"
      - ""
      - "{info}» Click to enter"
    actions:
      - "events:input_double_setting weapon-damage"

  paint-radius:
    slot: 16
    material: BRUSH
    name: "{success}&lPAINT RADIUS"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%paint_radius% blocks"
      - ""
      - " {muted}❙ {letters}Paint radius on hit"
      - ""
      - " {muted}❙ {success}Left-Click +1"
      - " {muted}❙ {error}Right-Click -1"
      - " {muted}❙ {warning}Shift-Click to enter"
    actions:
      - "left: events:adjust_setting paint-radius 1"
      - "right: events:adjust_setting paint-radius -1"
      - "shift_left: events:input_setting paint-radius"

  respawn-delay:
    slot: 19
    material: RED_BED
    name: "{warning}&lRESPAWN DELAY"
    lore:
      - ""
      - " {muted}❙ {letters}Current: {highlight}%respawn_delay%s"
