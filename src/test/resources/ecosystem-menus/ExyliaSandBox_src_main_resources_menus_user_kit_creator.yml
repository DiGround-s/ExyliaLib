title: "{primary}&lKIT CREATOR {muted}· {highlight}%current_kits%{muted}/{highlight}%max_kits%"
size: 54
type: PAGINATION
refresh:
  mode: ON_CLICK
  click_delay: 2

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

pagination:
  slots: '9-44'

  item_template:
    material: "%kit_icon%"
    name: "{letters}&l%kit_name%"
    glow: true
    lore:
      - ""
      - " {muted}❙ {letters}Click to manage this kit"
      - ""
      - "{info}» Click to open options"
    actions:
      - "sandbox:kit_creator_options %kit_slot%"

  navigation:
    previous:
      slot: 48
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - '{info}Page: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  predefined:
    slot: 47
    material: DIAMOND_CHESTPLATE
    name: '{accent}&lPREDEFINED KITS'
    lore:
      - ''
      - ' {muted}❙ {letters}Copy a ready-made kit'
      - ' {muted}❙ {letters}into one of your slots'
      - ''
      - '{info}» Click to browse'
    actions:
      - 'sandbox:open_predefined_kits'

  create:
    slot: 49
    material: LIME_DYE
    name: '{success}&l+ NEW KIT'
    lore:
      - ''
      - ' {muted}❙ {letters}Kits: {highlight}%current_kits%{muted}/{highlight}%max_kits%'
      - ''
      - '{info}» Click to create'
    actions:
      - 'sandbox:kit_creator_create'
