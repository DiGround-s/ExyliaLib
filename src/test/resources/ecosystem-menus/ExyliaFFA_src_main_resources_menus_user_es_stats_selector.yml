title: "{primary}&lMIS ESTADISTICAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION
animation: "center_out"

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay arenas disponibles"
    lore:
      - ""
      - "{muted}No hay arenas FFA configuradas."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%arena_icon%"
    name: "{warning}&l%arena_name%"
    lore:
      - ""
      - " {muted}❙ {letters}Resumen de combate"
      - ""
      - " {muted}❙ {letters}Bajas: {success}%player_kills%"
      - " {muted}❙ {letters}Muertes: {error}%player_deaths%"
      - " {muted}❙ {letters}K/D: {highlight}%player_kdr%"
      - " {muted}❙ {letters}Mejor racha: {info}%player_best_streak%"
      - ""
      - " {muted}❙ {letters}Asistencias: {info}%player_assists%"
      - " {muted}❙ {letters}Dano hecho: {warning}%player_damage%"
      - " {muted}❙ {letters}Bajas/Min: {highlight}%player_kpm%"
      - ""
      - " {muted}❙ {letters}Tiempo jugado: {muted}%player_playtime%"
      - " {muted}❙ {letters}Tiempo vivo: {muted}%player_alivetime%"
      - ""
      - "{accent}» Haz clic para abrir el reporte completo"
    actions:
      - "ffa:open_leaderboard %arena_id%"

  navigation:
    previous:
      slot: 48
      material: ARROW
      name: '{error}&l← PAGINA ANTERIOR'
      lore:
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'previous_page'
    next:
      slot: 50
      material: ARROW
      name: '{success}&lSIGUIENTE PAGINA →'
      lore:
        - '{info}ℹ Pagina actual: {success}%current_page%&8/{error}%total_pages%'
      actions:
        - 'next_page'

items:
  close:
    slot: 49
    material: BARRIER
    name: "{error}&lCERRAR"
    lore:
      - ""
      - "{error}▶ Haz clic para cerrar"
    actions:
      - "close"
