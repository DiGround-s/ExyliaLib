material: NETHERITE_HOE
name: "<#f59e0b>&lHarvest Hoe <#475569>[<#fbbf24>%status%<#475569>]"
lore:
  - ""
  - " <#475569>❙ <#94a3b8>Tills and replants a <#fbbf24>3x3 <#94a3b8>area around the target block"
  - " <#475569>❙ <#94a3b8>Supports replanting <#fbbf24>nether wart, cactus and sugar cane"
  - " <#475569>❙ <#94a3b8>Uses: <#f8fafc>%uses_remaining%<#475569>/<#f8fafc>%max_uses%"
  - " <#475569>❙ <#94a3b8>Time: <#f8fafc>%time_remaining%"
  - ""
enchantments:
  EFFICIENCY: 5
  UNBREAKING: 3
  FORTUNE: 3
  MENDING: 1
flags:
  - HIDE_ENCHANTS
  - HIDE_ATTRIBUTES
max_stack_size: 1
unbreakable: true
glow: true

behaviors:
  - id: till
    config:
      width: 3
      depth: 3
  - id: area_break
    config:
      width: 3
      height: 1
      depth: 1
      skip-immature-crops: true
  - id: auto_replant
    config:
      crops:
        WHEAT:
          min-age: 7
        CARROTS:
          min-age: 7
        POTATOES:
          min-age: 7
        BEETROOTS:
          min-age: 3
        NETHER_WART:
          min-age: 3
        CACTUS:
          min-age: 0
        SUGAR_CANE:
          min-age: 0

effects:
  on-use:
    sounds:
      - "BLOCK_AMETHYST_CLUSTER_HIT|0.7|1.2"
      - "BLOCK_AMETHYST_BLOCK_CHIME|0.5|1.5"
    particles:
      - "ENCHANT|4|0.2|0.2|0.2"
  on-block-break:
    sounds: []
    particles:
      - "SPELL_WITCH|2|0.2|0.2|0.2"
      - "END_ROD|2|0.15|0.15|0.15"
  on-place:
    sounds: []
    particles:
      - "SPELL_WITCH|2|0.2|0.2|0.2"
      - "END_ROD|2|0.15|0.15|0.15"
