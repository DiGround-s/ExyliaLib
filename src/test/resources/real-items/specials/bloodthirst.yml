# ===== ITEM =====

material: "GHAST_TEAR"
name: '{muted}» &#c2185bBloodthirst {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Activate to enter a'
  - ' {muted}▎ {letters}{highlight}Bloodthirst {letters}for {highlight}8 seconds{letters}: any'
  - ' {muted}▎ {letters}damage you deal, with any weapon,'
  - ' {muted}▎ {letters}heals you for {highlight}50% {letters}of it.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}30s ⌚'
  - ' {muted}▎ {letters}Duration {muted}» {info}8s ⌚'
  - ' {muted}▎ {letters}Lifesteal {muted}» {info}50%'
  - ''
  - '{warning}➥ Click to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#c2185bʙʟᴏᴏᴅᴛʜɪʀꜱᴛ'
cancel-event: true # Cancel the event when the item is used
max_stack_size: 1
max-uses: 8 # Maximum number of uses
cooldown: 30 # seconds

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
trigger-type: IMMEDIATE

action: "lifesteal_window"
action-config:
  duration: 8.0 # seconds the Bloodthirst stays active
  lifesteal-percent: 0.5 # fraction of ALL damage you deal healed back to you
  only-player-targets: false # if true, only damage dealt to other players heals you
  include-projectiles: true # if true, arrows/tridents/etc you shoot also count

  activate-effects:
    particles:
      enabled: true
      particles:
        - "DUST|25|0.4|0.6|0.4|0|180,0,20"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WITCH_DRINK|1.0|0.8"

  heal-effects:
    particles:
      enabled: true
      particles:
        - "HEART|6|0.3|0.3|0.3|0.1"
    sounds:
      enabled: false
      sounds: []

  expire-effects:
    particles:
      enabled: true
      particles:
        - "SMOKE|15|0.3|0.5|0.3|0.05"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WITCH_AMBIENT|0.6|0.6"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: false
    particles: []
  sounds:
    enabled: false
    sounds: []
  fireworks:
    enabled: false
    fireworks: []

