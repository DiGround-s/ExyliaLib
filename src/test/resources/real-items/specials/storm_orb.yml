# ===== ITEM =====

material: "SNOWBALL"
name: '{muted}» &#3f9fbaStorm Orb {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Throw it. On impact it unleashes'
  - ' {muted}▎ {letters}{highlight}chain lightning {letters}that jumps between'
  - ' {muted}▎ {letters}nearby enemies. A ranged version'
  - ' {muted}▎ {letters}of Stormcaller''s melee bolt.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}20s ⌚'
  - ' {muted}▎ {letters}Max Jumps {muted}» {info}3'
  - ''
  - '{warning}➥ Throw at an enemy to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#3f9fbaꜱᴛᴏʀᴍ ᴏʀʙ'
cancel-event: true
max_stack_size: 1
max-uses: 5
cooldown: 20

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
#
# Note: ON_PROJECTILE_HIT only works with EGG, SNOWBALL or ENDER_PEARL as the item material.
trigger-type: ON_PROJECTILE_HIT

# Same chain_lightning action as Stormcaller, but triggered by a thrown snowball instead of a
# melee hit - weaker single-target damage, but lets you open with it from range.
action: "chain_lightning"
action-config:
  damage: 3.0
  damage-falloff: 0.75
  max-jumps: 3
  jump-radius: 5.0
  only-players: true

  chain-particle: "ELECTRIC_SPARK|10|0.1|0.1|0.1|0"
  chain-line-spacing: 0.4

  strike-effects:
    particles:
      enabled: true
      particles:
        - "ELECTRIC_SPARK|20|0.4|0.6|0.4|0.2"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_LIGHTNING_BOLT_IMPACT|0.8|1.6"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "ELECTRIC_SPARK|10|0.3|0.3|0.3|0.05"
  sounds:
    enabled: true
    sounds:
      - "ENTITY_PLAYER_ATTACK_SWEEP|0.6|1.5"
  fireworks:
    enabled: false
    fireworks: []

