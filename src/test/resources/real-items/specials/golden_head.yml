name: '{muted}» &#FFD700Golden Head {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Upon consuming you will get'
  - ' {muted}▎ {highlight}special effects {letters}for a limited time.'
  - ''
  - '{secondary}Effects:'
  - ' {muted}▎ {letters}Speed II {muted}» {info}5s ⌚'
  - ' {muted}▎ {letters}Regeneration II {muted}» {info}10s ⌚'
