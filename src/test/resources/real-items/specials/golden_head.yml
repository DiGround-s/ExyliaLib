glow: true
hide-attributes: true
force-consumable: true
consumable-time: 1.0
consumable-nutrition: 6
consumable-saturation: 14.4
consumable-sound: ITEM_HONEY_BOTTLE_DRINK

# ===== CONFIGURATION ======

display-name: '&#FFD700ɢᴏʟᴅᴇɴ ʜᴇᴀᴅ'
cancel-event: false
max_stack_size: 64
max-uses: 1
cooldown: 8

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Apply action immediately on use
#  - AFTER_CONSUME -> Apply action after the item is fully consumed
trigger-type: AFTER_CONSUME
action: "effect"
action-config:
  effects:
    - "SPEED|2|5"
    - "REGENERATION|2|10"
    - "ABSORPTION|2|30"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "FLAME|20|0.4|0.4|0.4|0.05"
      - "VILLAGER_HAPPY|10|0.5|0.5|0.5|0.1"
  sounds:
    enabled: true
    sounds:
      - "ENTITY_PLAYER_LEVELUP|1.0|1.0"
  fireworks:
    enabled: true
    fireworks:
      - "BALL|255,215,0;255,140,0|255,255,200|true|false|1"

