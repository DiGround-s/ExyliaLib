# ===== ITEM =====

material: "SNOWBALL"
name: '{muted}» &#f5f5a0Flashbang {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Throw it at an enemy to {highlight}blind'
  - ' {muted}▎ {letters}their entire screen {letters}for an instant,'
  - ' {muted}▎ {letters}followed by {highlight}4 seconds {letters}of'
  - ' {muted}▎ {letters}real {highlight}Blindness{letters}.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}25s ⌚'
  - ' {muted}▎ {letters}Blindness {muted}» {info}4s ⌚'
  - ''
  - '{warning}➥ Throw at an enemy'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#f5f5a0ғʟᴀꜱʜʙᴀɴɢ'
cancel-event: true
max_stack_size: 1
max-uses: 3
cooldown: 25

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
#
# Note: ON_PROJECTILE_HIT only works with EGG, SNOWBALL or ENDER_PEARL as the item material.
trigger-type: ON_PROJECTILE_HIT

# Action chain: "flash" (requires PacketEvents) sends a one-time WIN_GAME "ChangeGameState"
# packet - an instant black screen the client can dismiss by pressing Escape or attacking,
# purely visual, no real gamemode/health change happens - followed by a real Blindness
# potion effect via the generic "effect" action (curable with milk/effect_cleaner like any
# other potion effect, unlike the old packet-based fake blindness).
actions:
  - action: "flash"
    action-config:
      flash-reason: "WIN_GAME" # WIN_GAME = full black screen; PLAY_ELDER_GUARDIAN_MOB_APPEARANCE = shorter white flash, less jarring
      flash-effects:
        particles:
          enabled: true
          particles:
            - "FLASH|1|0|0|0|0"
            - "END_ROD|20|0.4|0.4|0.4|0.1"
        sounds:
          enabled: true
          sounds:
            - "ENTITY_GENERIC_EXPLODE|0.5|1.8"
            - "ENTITY_PLAYER_HURT|1.0|2.0"

  - action: "effect"
    action-config:
      effects:
        - "BLINDNESS|1|4" # Blindness I for 4 seconds

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "CRIT|8|0.3|0.3|0.3|0.05"
  sounds:
    enabled: true
    sounds:
      - "ENTITY_ARROW_SHOOT|0.7|1.3"
  fireworks:
    enabled: false
    fireworks: []

