# ===== ITEM =====

material: "TOTEM_OF_UNDYING"
name: '{muted}» &#d4af37Last Stand Totem {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Activate to become {highlight}Unstoppable'
  - ' {muted}▎ {letters}for {highlight}5 seconds{letters}. If a hit would'
  - ' {muted}▎ {letters}kill you in that window, it is'
  - ' {muted}▎ {letters}negated and you heal {highlight}50%{letters}.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}90s ⌚'
  - ' {muted}▎ {letters}Ward Window {muted}» {info}5s ⌚'
  - ' {muted}▎ {letters}Heal On Save {muted}» {info}50%'
  - ''
  - '{warning}➥ Click to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#d4af37ʟᴀꜱᴛ ꜱᴛᴀɴᴅ ᴛᴏᴛᴇᴍ'
cancel-event: true # Cancel the event when the item is used
max_stack_size: 1
max-uses: 3 # Maximum number of uses
cooldown: 90 # seconds

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
trigger-type: IMMEDIATE

action: "unstoppable"
action-config:
  window: 5.0 # seconds the ward stays armed
  heal-percent: 0.5 # fraction of max health restored when the ward saves you

  activate-effects:
    particles:
      enabled: true
      particles:
        - "END_ROD|25|0.4|0.6|0.4|0.1"
    sounds:
      enabled: true
      sounds:
        - "ITEM_TOTEM_USE|0.6|1.4"

  trigger-effects:
    particles:
      enabled: true
      particles:
        - "TOTEM_OF_UNDYING|1|0|0|0|0"
        - "END_ROD|40|0.6|0.8|0.6|0.2"
    sounds:
      enabled: true
      sounds:
        - "ITEM_TOTEM_USE|1.0|1.0"
        - "ENTITY_PLAYER_LEVELUP|1.0|1.5"

  expire-effects:
    particles:
      enabled: true
      particles:
        - "SMOKE_NORMAL|10|0.3|0.3|0.3|0.05"
    sounds:
      enabled: true
      sounds:
        - "BLOCK_BEACON_DEACTIVATE|0.6|1.2"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: false
    particles: []
  sounds:
    enabled: false
    sounds: []
  fireworks:
    enabled: false
    fireworks: []

