# ===== ITEM =====

material: "ENDER_PEARL"
name: '{muted}» &#701f1fHunter''s Mark {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Throw it to finish off a fleeing'
  - ' {muted}▎ {letters}enemy. Deals bonus damage that'
  - ' {muted}▎ {letters}scales with their missing health,'
  - ' {muted}▎ {letters}and heals you for {highlight}40% {letters}of it.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}12s ⌚'
  - ''
  - '{warning}➥ Throw at a wounded enemy'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#701f1fʜᴜɴᴛᴇʀ''ꜱ ᴍᴀʀᴋ'
cancel-event: true
max_stack_size: 1
max-uses: 5
cooldown: 12

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
#
# Note: ON_PROJECTILE_HIT only works with EGG, SNOWBALL or ENDER_PEARL as the item material.
trigger-type: ON_PROJECTILE_HIT

# Same execute_strike action as Reaper's Edge, but ranged and tuned lower - lets you punish an
# enemy trying to run away with low health instead of needing to close the distance.
action: "execute_strike"
action-config:
  base-damage: 1.0
  execute-multiplier: 7.0
  lifesteal-percent: 0.4
  execute-threshold: 0.3

  strike-effects:
    particles:
      enabled: true
      particles:
        - "DUST|10|0.3|0.4|0.3|0|100,0,0"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_ARROW_HIT_PLAYER|0.8|0.8"

  execute-effects:
    particles:
      enabled: true
      particles:
        - "DUST|25|0.5|0.6|0.5|0|180,0,0"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WITHER_HURT|0.8|0.7"

  heal-effects:
    particles:
      enabled: true
      particles:
        - "HEART|5|0.3|0.4|0.3|0.1"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_GENERIC_DRINK|0.8|1.4"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "DUST|6|0.3|0.3|0.3|0|100,0,0"
  sounds:
    enabled: true
    sounds:
      - "ENTITY_ARROW_SHOOT|0.7|1.1"
  fireworks:
    enabled: false
    fireworks: []

