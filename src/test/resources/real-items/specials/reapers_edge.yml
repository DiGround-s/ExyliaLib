# ===== ITEM =====

material: "NETHERITE_HOE"
name: '{muted}» &#701f1fReaper''s Edge {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Deals bonus damage that scales'
  - ' {muted}▎ {letters}with how much health your enemy'
  - ' {muted}▎ {letters}is {highlight}missing{letters}. Heals you for {highlight}50%'
  - ' {muted}▎ {letters}of all damage this deals.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}8s ⌚'
  - ' {muted}▎ {letters}Base Damage {muted}» {info}2 ❤'
  - ' {muted}▎ {letters}Execute Scaling {muted}» {info}up to 8 ❤'
  - ''
  - '{warning}➥ Hit an enemy to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#701f1fʀᴇᴀᴘᴇʀ''ꜱ ᴇᴅɢᴇ'
cancel-event: true # Cancel the event when the item is used
max_stack_size: 1
max-uses: 8 # Maximum number of uses
cooldown: 8 # seconds

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
trigger-type: ON_HIT_PLAYER

# damage = base-damage + (missing-health-percent * execute-multiplier)
# A full-health target only takes the base damage; a nearly-dead target takes a near-lethal finisher.
action: "execute_strike"
action-config:
  base-damage: 2.0
  execute-multiplier: 8.0
  lifesteal-percent: 0.5
  execute-threshold: 0.3 # below this target health% the special "execute-effects" play instead of "strike-effects"

  strike-effects:
    particles:
      enabled: true
      particles:
        - "DUST|10|0.3|0.4|0.3|0|100,0,0"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_PLAYER_ATTACK_SWEEP|0.8|0.9"

  execute-effects:
    particles:
      enabled: true
      particles:
        - "DUST|30|0.5|0.6|0.5|0|180,0,0"
        - "CRIT|15|0.4|0.5|0.4|0.2"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WITHER_HURT|1.0|0.6"
        - "ENTITY_PLAYER_ATTACK_CRIT|1.0|0.8"

  heal-effects:
    particles:
      enabled: true
      particles:
        - "HEART|6|0.3|0.4|0.3|0.1"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_GENERIC_DRINK|1.0|1.4"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: false
    particles: []
  sounds:
    enabled: false
    sounds: []
  fireworks:
    enabled: false
    fireworks: []

