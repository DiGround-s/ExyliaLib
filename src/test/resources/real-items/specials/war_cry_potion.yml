# ===== ITEM =====

material: "POTION"
name: '{muted}» &#ba8f1fWar Cry Potion {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Drink it for an instant burst'
  - ' {muted}▎ {letters}of {highlight}Fury{letters}: Strength IV, Speed III'
  - ' {muted}▎ {letters}and Resistance II for {highlight}8 seconds{letters}.'
  - ' {muted}▎ {letters}No need to build it up by hitting.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}60s ⌚'
  - ''
  - '{warning}➥ Drink to activate'
  - ''

glow: true
hide-attributes: true
consumable-time: 1.0
consumable-sound: ENTITY_GENERIC_DRINK

# ===== CONFIGURATION ======

display-name: '&#ba8f1fᴡᴀʀ ᴄʀʏ ᴘᴏᴛɪᴏɴ'
cancel-event: false
max_stack_size: 1
max-uses: 3
cooldown: 60

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Apply action immediately on use
#  - AFTER_CONSUME -> Apply action after the item is fully consumed
trigger-type: AFTER_CONSUME

# Same ascension action as Warlord's Fury, but with max-stacks: 1 and much higher per-stack
# values - a single drink instantly grants the full burst instead of needing to land several hits.
action: "ascension"
action-config:
  max-stacks: 1
  decay-window: 8.0
  strength-per-stack: 4
  speed-per-stack: 3
  resistance-per-stack: 2

  max-stack-effects:
    particles:
      enabled: true
      particles:
        - "FLAME|30|0.5|0.8|0.5|0.1"
        - "CRIT|20|0.4|0.6|0.4|0.15"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_PLAYER_LEVELUP|1.0|1.8"
        - "ENTITY_RAVAGER_ROAR|0.5|1.4"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "VILLAGER_HAPPY|10|0.4|0.4|0.4|0.1"
  sounds:
    enabled: false
    sounds: []
  fireworks:
    enabled: false
    fireworks: []

