# ===== ITEM =====

material: "SNOWBALL"
name: '{muted}» &#4f2f7dFateweaver {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Throw it to bind souls with'
  - ' {muted}▎ {letters}whoever it hits for {highlight}10 seconds{letters}.'
  - ' {muted}▎ {letters}Half of all damage either of you'
  - ' {muted}▎ {letters}takes is mirrored onto the other -'
  - ' {muted}▎ {letters}easier to land than Blood Pact,'
  - ' {muted}▎ {letters}but the bond is shorter.'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}35s ⌚'
  - ''
  - '{warning}➥ Throw at an enemy to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#4f2f7dғᴀᴛᴇᴡᴇᴀᴠᴇʀ'
cancel-event: true
max_stack_size: 1
max-uses: 3
cooldown: 35

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
#
# Note: ON_PROJECTILE_HIT only works with EGG, SNOWBALL or ENDER_PEARL as the item material.
trigger-type: ON_PROJECTILE_HIT

# Same soul_link action as Blood Pact, but thrown instead of requiring a melee hit - much easier
# to land on a fleeing target, at the cost of a shorter link duration.
action: "soul_link"
action-config:
  duration: 10.0
  damage-share-percent: 0.5
  tick-interval: 2

  tether-particle: "SOUL|3|0|0|0|0"
  tether-spacing: 0.5

  link-effects:
    particles:
      enabled: true
      particles:
        - "SOUL|15|0.4|0.6|0.4|0.05"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WARDEN_HEARTBEAT|0.5|1.6"

  break-effects:
    particles:
      enabled: true
      particles:
        - "SOUL_FIRE_FLAME|12|0.3|0.5|0.3|0.05"
    sounds:
      enabled: true
      sounds:
        - "PARTICLE_SOUL_ESCAPE|0.8|1.1"

  mirror-effects:
    particles:
      enabled: true
      particles:
        - "SOUL|8|0.3|0.4|0.3|0.05"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_PLAYER_HURT|0.7|0.7"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    particles:
      - "SOUL|10|0.3|0.3|0.3|0.05"
  sounds:
    enabled: true
    sounds:
      - "BLOCK_SOUL_SAND_STEP|0.7|0.8"
  fireworks:
    enabled: false
    fireworks: []

