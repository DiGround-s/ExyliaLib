# ===== ITEM =====

material: "IRON_SWORD"
name: '{muted}» &#7cba3fPoison Dagger {muted}[{success}%current_uses%{muted}/{error}%max_uses%{muted}]'
lore:
  - '{secondary}Information:'
  - ' {muted}▎ {letters}Hit {highlight}3 times in a row'
  - ' {muted}▎ {letters}within {highlight}1 second {letters}of each hit'
  - ' {muted}▎ {letters}to poison your target.'
  - ''
  - '{secondary}Effects:'
  - ' {muted}▎ {letters}Poison II {muted}» {info}5s ⌚'
  - ' {muted}▎ {letters}Weakness I {muted}» {info}5s ⌚'
  - ' {muted}▎ {letters}Slowness I {muted}» {info}3s ⌚'
  - ''
  - '{secondary}Stats:'
  - ' {muted}▎ {letters}Cooldown {muted}» {info}20s ⌚'
  - ' {muted}▎ {letters}Combo Window {muted}» {info}1s ⌚'
  - ''
  - '{warning}➥ Hit an enemy to activate'
  - ''

glow: true
hide-attributes: true

# ===== CONFIGURATION ======

display-name: '&#7cba3fᴘᴏɪꜱᴏɴ ᴅᴀɢɢᴇʀ'
cancel-event: true # Cancel the event when the item is used
max_stack_size: 1
max-uses: 5 # Maximum number of uses
cooldown: 20 # seconds

# ===== ACTIONS =====

# Trigger types:
#  - IMMEDIATE -> Only affect the source player -> Apply action immediately
#  - AFTER_CONSUME -> Only affect the source player -> Apply action after the item is consumed (example: food, potions, etc.)
#  - ON_HIT_PLAYER -> Only affect the target player -> Apply action when the target player hit a player
#  - ON_PROJECTILE_HIT -> Only affect the target player -> Apply action when the target player is hit by a projectile
#      (optional) combo: {required-hits: N, window: seconds} -> require N consecutive hits within the window before the action fires
#  - RADIUS -> Only affect players in a radius of the source player -> Apply to all players in a radius of the source player
#  - ON_LAST_ATTACKER -> Only affect the source player -> Apply action targeting the last player who hit the source within "attacker-window" seconds
#  - HOLD -> Only affect the source player -> Apply every "hold-interval" ticks
trigger-type: ON_HIT_PLAYER

# Requires 3 consecutive hits on the same target, no more than 1 second apart, before the effects are applied.
combo:
  required-hits: 3
  window: 1.0

action: "effect"
action-config:
  effects:
    - "POISON|1|5"
    - "WEAKNESS|1|5"
    - "SLOW|1|3"

  # Particles/sounds played on the poisoned target itself when the combo lands
  feedback-effects:
    particles:
      enabled: true
      particles:
        - "WITCH|20|0.4|0.6|0.4|0.1"
    sounds:
      enabled: true
      sounds:
        - "ENTITY_WITCH_DRINK|1.0|0.8"

# ===== VISUALS =====

effects-on-use:
  particles:
    enabled: true
    # Format: PARTICLE_NAME|COUNT|OFFSET_X|OFFSET_Y|OFFSET_Z|EXTRA|DATA
    # PARTICLE_NAME: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Particle.html
    particles:
      - "WITCH|25|0.4|0.6|0.4|0.1"
  sounds:
    enabled: true
    # Format: SOUND_NAME|VOLUME|PITCH
    # SOUND_NAME: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
    sounds:
      - "ENTITY_SPIDER_HURT|1.0|0.7"

