title: "{primary}&lSELECT COLOR {muted}— %picker_mode_name%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No colors available"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: "%color_material%"
    name: "{letters}%color_name%"
    hide_attributes: true
    lore:
      - ""
      - " {muted}❙ %color_lore_action%"
    actions:
      - "shield:pick_color"
  # A colour the player has not unlocked: shown, so they know it exists, but
  # it does nothing when clicked.
  no_permission_template:
    material: "%color_material%"
    name: "{muted}%color_name%"
    hide_attributes: true
    lore:
      - ""
      - " {muted}❙ %color_lore_action%"
  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBACK"
    lore:
      - "{muted}Return to editor"
    actions:
      - "shield:open_editor"
