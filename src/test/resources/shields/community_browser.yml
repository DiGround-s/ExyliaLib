title: "{primary}&lCOMMUNITY DESIGNS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2"
click_sounds:
  - "UI_BUTTON_CLICK|1.0|1.5"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No designs yet"
    lore:
      - ""
      - "{muted}Be the first to create one!"
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'
  item_template:
    material: SHIELD
    banner_design: "%design_banner%"
    name: "{info}Design {highlight}#%design_id%"
    lore:
      - ""
      - " {muted}❙ {letters}By: {info}%design_owner%"
      - " {muted}❙ {letters}Base: {info}%design_base_color%"
      - " {muted}❙ {letters}Layers: {info}%design_layers%"
      - " {muted}❙ {letters}Uses: {info}%design_uses%"
      - ""
      - "{success}» Click to import"
    hide_attributes: true
    actions:
      - "shield:import_design"
  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "{error}&l← PREVIOUS"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 53
      material: ARROW
      name: "{success}&lNEXT →"
      lore:
        - "{info}Page: {success}%current_page%&8/{error}%total_pages%"
      actions:
        - "next_page"

items:
  back:
    slot: 49
    material: ARROW
    name: "{error}&lBACK"
    lore:
      - "{muted}Return to your shields"
    actions:
      - "shield:open_slots"
