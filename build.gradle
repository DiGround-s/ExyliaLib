plugins {
    id 'java-library'
    id 'maven-publish'
    // Bundles scoreboard-library inside the jar and moves it under our own
    // package, so the scoreboard module has exactly one copy on the server and
    // it can never clash with one a plugin still shades during migration.
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'net.exylia'
version = '1.102.0'
description = 'Shared high-performance library for Exylia Minecraft plugins.'

def targetJavaVersion = 21

// The Adventure version paper-api 1.21.4 ships, and therefore the one that runs.
def adventureVersion = '4.20.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'codemc'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'lunarclient'
        url = 'https://repo.lunarclient.dev'
    }
    maven {
        name = 'feather'
        url = 'https://repo.feathermc.net/artifactory/maven-releases'
    }
    // WorldGuard, through a mirror first. EngineHub's own repo answers 503
    // when it is down, and a 5xx aborts resolution instead of falling through
    // to the next repository the way a 404 does — so the build must not meet
    // it before somewhere the artifact already is.
    maven {
        name = 'glaremasters'
        url = 'https://repo.glaremasters.me/repository/public/'
        // Only WorldGuard: this mirror answers 200 with an HTML page for a
        // file it does not have, so anything else asked of it resolves to
        // rubbish rather than moving on to the next repository.
        content { includeGroupByRegex 'com\\.sk89q(\\..*)?' }
        // The POM only. The marker inside it that says "prefer the Gradle
        // module file" points at HTML here, and following it is what fails.
        metadataSources {
            mavenPom()
            ignoreGradleMetadataRedirection()
        }
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
}

/**
 * Adventure must resolve to exactly what the server loads.
 *
 * Both the server's copy and any newer one live in the net.kyori.adventure
 * package, so the server's classes win at runtime no matter what we compile
 * against. Another dependency (PacketEvents) pulls a newer Adventure BOM, and
 * Gradle would silently upgrade us to it. Compiling against API the running
 * server does not have is exactly how a plugin dies with NoSuchMethodError, so
 * the version is pinned instead of merely requested.
 */
configurations {
    // Dependencies that live inside the published jar, relocated under our own
    // package. Declaring them here keeps them on the compile classpath and out
    // of the published POM: consumers must not resolve a relocated copy.
    shade
    compileOnly.extendsFrom(shade)
    testImplementation.extendsFrom(shade)
}

configurations.configureEach {
    resolutionStrategy {
        force "net.kyori:adventure-api:$adventureVersion"
        force "net.kyori:adventure-text-minimessage:$adventureVersion"
        force "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
        force "net.kyori:adventure-key:$adventureVersion"
    }
}

dependencies {
    // Provided by the server at runtime. Never shaded.
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // Provided by the PacketEvents plugin at runtime. Never shaded.
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'

    // Adventure comes from the server, not from us. paper-api 1.21.4 ships
    // 4.20.0 and it wins at runtime whatever we compile against, since both use
    // the net.kyori.adventure package. Compiling against anything newer would
    // build fine and then fail with NoSuchMethodError on a real server.
    compileOnly "net.kyori:adventure-api:$adventureVersion"
    compileOnly "net.kyori:adventure-text-minimessage:$adventureVersion"
    compileOnly "net.kyori:adventure-text-serializer-legacy:$adventureVersion"

    // Installed once on the server, same version across every Exylia plugin.
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Optional at runtime: the placeholder module works without it and only
    // bridges to it when the plugin is present.
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    // Modified-client integrations. Both optional at runtime and confined to one
    // class each, exactly like PacketEvents: a server with neither installed
    // never loads them, and everything the client module offers degrades to
    // doing nothing rather than failing.
    compileOnly 'com.lunarclient:apollo-api:1.2.4'
    compileOnly 'net.digitalingot.feather-server-api:api:0.0.5'

    // Client-mod APIs: bridges load only when the backing plugin (Apollo,
    // FeatherServerAPI) is enabled. Never shaded — the consumer plugin or
    // server must provide them.
    compileOnly 'com.lunarclient:apollo-api:1.2.4'
    // Database. Provided at runtime through plugin.yml libraries, exactly like
    // Lamp and Caffeine: the server's library loader fetches them once and every
    // plugin shares the same copy. Never shaded — two connection pools or two
    // driver copies on one server is precisely what we are avoiding.
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'com.h2database:h2:2.2.224'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    compileOnly 'org.postgresql:postgresql:42.7.4'
    compileOnly 'org.mongodb:mongodb-driver-sync:4.11.1'
    // Redis, on the same terms and the same version ExyliaCommons already
    // installs, so a server migrating plugin by plugin holds one copy rather
    // than two. Optional at runtime: without it the cache reports itself
    // unavailable and every read goes to the database, which is what a server
    // with no Redis configured does anyway.
    compileOnly 'redis.clients:jedis:5.1.0'
    // The database tests run against real engines rather than a mock: H2 in
    // memory covers every dialect path we can exercise without a server, and a
    // wire-format bug is invisible to a mock by construction.
    testImplementation 'com.zaxxer:HikariCP:5.1.0'
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.mongodb:mongodb-driver-sync:4.11.1'
    testImplementation 'redis.clients:jedis:5.1.0'

    // FastAsyncWorldEdit: the only schematic engine. Installed on the server,
    // the same version ExyliaCommons already declares, and confined to one
    // class exactly like PacketEvents: a server without it never loads that
    // class and the schematic module reports itself unsupported. Never shaded —
    // FAWE is a plugin, and a second copy of WorldEdit on one server is a
    // classloading accident waiting to happen.
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.8.4'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.8.4'
    // WorldGuard: optional, guarded behind a plugin check in WorldGuardRegions.
    // WorldEdit is excluded because FAWE above already provides those classes
    // and a second copy on the compile classpath only breeds ambiguity.
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.13') {
        exclude group: 'com.sk89q.worldedit'
    }

    // Lamp: the command framework the whole ecosystem standardises on.
    // compileOnly like everywhere else; the server provides it through the
    // plugin.yml libraries section, exactly as the consumer plugins do.
    compileOnly 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    // scoreboard-library: packet-level sidebars, the same library ExyliaCommons
    // consumes. Shaded and relocated into the jar (see shadowJar below), so it
    // is declared in the shadow configuration: bundled, but kept out of the
    // published POM, because no consumer should resolve a relocated copy.
    // Adventure is provided by the server and excluded to avoid duplicates.
    // The implementation resolves its packet adapters by Class.forName; Shadow
    // rewrites those strings when relocating, so it keeps working.
    shade('net.megavex:scoreboard-library-api:2.8.1') {
        exclude group: 'net.kyori'
    }
    shade('net.megavex:scoreboard-library-implementation:2.8.1') {
        exclude group: 'net.kyori'
    }
    // jfiglet: the ASCII-art plugin name the debug module prints on enable.
    // Same treatment as scoreboard-library: bundled and relocated, absent from
    // the published POM.
    shade 'com.github.lalyos:jfiglet:0.0.9'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Tests drive the schedulers for real, so the server API must be on the test
    // runtime classpath too, not just at compile time.
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    testImplementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    testImplementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
    testImplementation 'me.clip:placeholderapi:2.11.5'
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    // The plain jar is a build intermediate only: the published artifact is the
    // shadow jar, so this one moves aside to keep the two from colliding.
    archiveClassifier = 'thin'
    manifest {
        attributes(
                'Implementation-Title': 'ExyliaLib',
                'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier = ''
    // The shade configuration is not on the runtime classpath, so it has to be
    // bundled explicitly alongside it.
    configurations = [project.configurations.runtimeClasspath, project.configurations.shade]
    // scoreboard-library finds its implementation and packet adapters through
    // Class.forName; Shadow rewrites those strings together with the classes.
    relocate 'net.megavex.scoreboardlibrary', 'net.exylia.lib.internal.scoreboardlibrary'
    relocate 'com.github.lalyos.jfiglet', 'net.exylia.lib.internal.jfiglet'
    manifest {
        attributes(
                'Implementation-Title': 'ExyliaLib',
                'Implementation-Version': project.version
        )
    }
}

// Shadow does not hook itself into the lifecycle, so a plain `gradlew build`
// would produce only the thin jar: a jar that loads until the first scoreboard.
assemble.dependsOn shadowJar

/**
 * Rebuilds lib-manifest.json from the GitHub releases that actually exist.
 *
 * The manifest was maintained by hand, which makes every release depend on
 * remembering a step. Getting it wrong is not cosmetic: two readers consume
 * this file with two different policies — ExyliaLibUpdater takes latest.majorN,
 * while the Lukittu loader's ExyliaLibManifest.findBest walks versions{} — so a
 * release missing from versions{} is a release the loader cannot install, even
 * though the updater would still find the newest one.
 *
 * 1.22.0 through 1.25.0 show the same gap from the other side: they were built
 * and published to Maven, but never cut as GitHub releases, so there is nothing
 * to serve and they are correctly absent here.
 *
 * The releases API is the source of truth because it is the same place the
 * updater downloads from: a release with no asset cannot be served, so it is
 * skipped rather than written as an entry pointing at nothing. The sha256 comes
 * from the asset digest GitHub itself computed over the bytes it will serve.
 */
tasks.register('generateLibManifest') {
    group = 'exylia'
    description = 'Regenerates lib-manifest.json from published GitHub releases.'

    def manifestFile = layout.projectDirectory.file('lib-manifest.json').asFile

    doLast {
        def raw = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'gh', 'api', '--paginate',
                    'repos/DiGround-s/ExyliaLib/releases?per_page=100'
            standardOutput = raw
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException(
                    'Could not list releases. Is the gh CLI installed and authenticated?')
        }

        // --paginate concatenates one JSON array per page.
        def releases = []
        def slurper = new groovy.json.JsonSlurper()
        raw.toString('UTF-8').replace('][', '],[').with { joined ->
            if (joined.startsWith('[') && joined.contains('],[')) {
                slurper.parseText("[${joined}]").each { releases.addAll(it) }
            } else {
                releases.addAll(slurper.parseText(joined))
            }
        }

        def entries = [:]
        def skipped = []

        releases.findAll { !it.draft }.each { release ->
            def v = (release.tag_name ?: '').replaceFirst(/^v/, '')
            if (!(v ==~ /\d+\.\d+\.\d+/)) return

            def asset = release.assets.find { it.name == "ExyliaLib-${v}.jar" }
            if (asset == null) {
                skipped << "${v} (no ExyliaLib-${v}.jar asset)"
                return
            }
            // GitHub reports "sha256:<hex>"; the readers expect bare hex.
            def digest = (asset.digest ?: '').replaceFirst(/^sha256:/, '')
            if (!digest) {
                skipped << "${v} (asset has no sha256 digest)"
                return
            }

            entries[v] = [
                    version        : v,
                    url            : asset.browser_download_url,
                    sha256         : digest,
                    major          : v.substring(0, v.indexOf('.')) as int,
                    requiresRestart: true
            ]
        }

        if (entries.isEmpty()) {
            throw new GradleException('No releases with a usable jar asset were found.')
        }

        def bySemver = { String a, String b ->
            def x = a.tokenize('.')*.toInteger()
            def y = b.tokenize('.')*.toInteger()
            [0, 1, 2].findResult { x[it] <=> y[it] ?: null } ?: 0
        }

        def sortedVersions = entries.keySet().sort(false, bySemver as Comparator)

        def latest = [:]
        sortedVersions.each { v ->
            // Ascending order, so the last write per major is the highest.
            latest["major${entries[v].major}" as String] = v
        }

        def ordered = [versions: [:], latest: latest]
        sortedVersions.each { ordered.versions[it] = entries[it] }

        // prettyPrint indents with four spaces; the file has always used two.
        // Reindenting every line would bury the one entry a release adds under a
        // whole-file diff, so the existing style is kept.
        manifestFile.text = groovy.json.JsonOutput
                .prettyPrint(groovy.json.JsonOutput.toJson(ordered))
                .readLines()
                .collect { line ->
                    def indent = line.length() - line.stripLeading().length()
                    ' ' * (indent / 2 as int) + line.stripLeading()
                }
                .join('\n') + '\n'

        logger.lifecycle("Wrote ${sortedVersions.size()} versions to lib-manifest.json")
        latest.each { major, v -> logger.lifecycle("  latest.${major} = ${v}") }
        skipped.each { logger.warn("  skipped ${it}") }

        if (!entries.containsKey(project.version.toString())) {
            logger.warn("Note: ${project.version} has no GitHub release yet, so it is not listed.")
        }
    }
}

def requireGh = {
    def result = exec {
        commandLine 'gh', 'auth', 'status'
        ignoreExitValue = true
    }
    if (result.exitValue != 0) {
        throw new GradleException('GitHub CLI is required and must be authenticated.')
    }
}

def requireStrictSemver = { String value, String propertyName ->
    if (!(value ==~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/)) {
        throw new GradleException("${propertyName} must be strict X.Y.Z semver: ${value}")
    }
}

tasks.register('publishRelease') {
    group = 'exylia'
    description = 'Dispatches the release workflow on main; the workflow builds, tags vX.Y.Z, publishes the release, and updates the manifest.'

    doLast {
        requireStrictSemver(project.version.toString(), 'project version')
        def dryRun = project.findProperty('dryRun')?.toString()?.toBoolean() ?: false
        def command = ['gh', 'workflow', 'run', 'release.yml', '--ref', 'main']
        if (dryRun) {
            logger.lifecycle("Dry run: ${command.join(' ')}")
        } else {
            requireGh()
            exec { commandLine command }
            logger.lifecycle('Release workflow dispatched for main. It builds and publishes remotely; no local push was performed.')
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'ExyliaLib'
            // The shadow component: publishes the relocated jar as the main
            // artifact and keeps the bundled dependencies out of the POM. It
            // does not carry the java component's secondary artifacts, so the
            // sources and javadoc jars are attached back by hand.
            from components.shadow
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')

            pom {
                name = 'ExyliaLib'
                description = project.description
                url = 'https://github.com/DiGround-s/ExyliaLib'
                licenses {
                    license {
                        name = 'All Rights Reserved'
                        url = 'https://github.com/DiGround-s/ExyliaLib/blob/main/LICENSE'
                    }
                }
            }
        }
    }
}
