plugins {
    id 'java-library'
    id 'maven-publish'
    // Bundles scoreboard-library inside the jar and moves it under our own
    // package, so the scoreboard module has exactly one copy on the server and
    // it can never clash with one a plugin still shades during migration.
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'net.exylia'
version = '1.14.0'
description = 'Shared high-performance library for Exylia Minecraft plugins.'

def targetJavaVersion = 21

// The Adventure version paper-api 1.21.4 ships, and therefore the one that runs.
def adventureVersion = '4.20.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'codemc'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'lunarclient'
        url = 'https://repo.lunarclient.dev'
    }
    maven {
        name = 'feather'
        url = 'https://repo.feathermc.net/artifactory/maven-releases'
    }
}

/**
 * Adventure must resolve to exactly what the server loads.
 *
 * Both the server's copy and any newer one live in the net.kyori.adventure
 * package, so the server's classes win at runtime no matter what we compile
 * against. Another dependency (PacketEvents) pulls a newer Adventure BOM, and
 * Gradle would silently upgrade us to it. Compiling against API the running
 * server does not have is exactly how a plugin dies with NoSuchMethodError, so
 * the version is pinned instead of merely requested.
 */
configurations {
    // Dependencies that live inside the published jar, relocated under our own
    // package. Declaring them here keeps them on the compile classpath and out
    // of the published POM: consumers must not resolve a relocated copy.
    shade
    compileOnly.extendsFrom(shade)
    testImplementation.extendsFrom(shade)
}

configurations.configureEach {
    resolutionStrategy {
        force "net.kyori:adventure-api:$adventureVersion"
        force "net.kyori:adventure-text-minimessage:$adventureVersion"
        force "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
        force "net.kyori:adventure-key:$adventureVersion"
    }
}

dependencies {
    // Provided by the server at runtime. Never shaded.
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // Provided by the PacketEvents plugin at runtime. Never shaded.
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'

    // Adventure comes from the server, not from us. paper-api 1.21.4 ships
    // 4.20.0 and it wins at runtime whatever we compile against, since both use
    // the net.kyori.adventure package. Compiling against anything newer would
    // build fine and then fail with NoSuchMethodError on a real server.
    compileOnly "net.kyori:adventure-api:$adventureVersion"
    compileOnly "net.kyori:adventure-text-minimessage:$adventureVersion"
    compileOnly "net.kyori:adventure-text-serializer-legacy:$adventureVersion"

    // Installed once on the server, same version across every Exylia plugin.
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Optional at runtime: the placeholder module works without it and only
    // bridges to it when the plugin is present.
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    // Modified-client integrations. Both optional at runtime and confined to one
    // class each, exactly like PacketEvents: a server with neither installed
    // never loads them, and everything the client module offers degrades to
    // doing nothing rather than failing.
    compileOnly 'com.lunarclient:apollo-api:1.2.4'
    compileOnly 'net.digitalingot.feather-server-api:api:0.0.5'

    // Client-mod APIs: bridges load only when the backing plugin (Apollo,
    // FeatherServerAPI) is enabled. Never shaded — the consumer plugin or
    // server must provide them.
    compileOnly 'com.lunarclient:apollo-api:1.2.4'
    // Lamp: the command framework the whole ecosystem standardises on.
    // compileOnly like everywhere else; the server provides it through the
    // plugin.yml libraries section, exactly as the consumer plugins do.
    compileOnly 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    // scoreboard-library: packet-level sidebars, the same library ExyliaCommons
    // consumes. Shaded and relocated into the jar (see shadowJar below), so it
    // is declared in the shadow configuration: bundled, but kept out of the
    // published POM, because no consumer should resolve a relocated copy.
    // Adventure is provided by the server and excluded to avoid duplicates.
    // The implementation resolves its packet adapters by Class.forName; Shadow
    // rewrites those strings when relocating, so it keeps working.
    shade('net.megavex:scoreboard-library-api:2.8.1') {
        exclude group: 'net.kyori'
    }
    shade('net.megavex:scoreboard-library-implementation:2.8.1') {
        exclude group: 'net.kyori'
    }
    // jfiglet: the ASCII-art plugin name the debug module prints on enable.
    // Same treatment as scoreboard-library: bundled and relocated, absent from
    // the published POM.
    shade 'com.github.lalyos:jfiglet:0.0.9'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Tests drive the schedulers for real, so the server API must be on the test
    // runtime classpath too, not just at compile time.
    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    testImplementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    testImplementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    // The plain jar is a build intermediate only: the published artifact is the
    // shadow jar, so this one moves aside to keep the two from colliding.
    archiveClassifier = 'thin'
    manifest {
        attributes(
                'Implementation-Title': 'ExyliaLib',
                'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier = ''
    // The shade configuration is not on the runtime classpath, so it has to be
    // bundled explicitly alongside it.
    configurations = [project.configurations.runtimeClasspath, project.configurations.shade]
    // scoreboard-library finds its implementation and packet adapters through
    // Class.forName; Shadow rewrites those strings together with the classes.
    relocate 'net.megavex.scoreboardlibrary', 'net.exylia.lib.internal.scoreboardlibrary'
    relocate 'com.github.lalyos.jfiglet', 'net.exylia.lib.internal.jfiglet'
    manifest {
        attributes(
                'Implementation-Title': 'ExyliaLib',
                'Implementation-Version': project.version
        )
    }
}

// Shadow does not hook itself into the lifecycle, so a plain `gradlew build`
// would produce only the thin jar: a jar that loads until the first scoreboard.
assemble.dependsOn shadowJar

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'ExyliaLib'
            // The shadow component: publishes the relocated jar as the main
            // artifact and keeps the bundled dependencies out of the POM. It
            // does not carry the java component's secondary artifacts, so the
            // sources and javadoc jars are attached back by hand.
            from components.shadow
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')

            pom {
                name = 'ExyliaLib'
                description = project.description
                url = 'https://github.com/DiGround-s/ExyliaLib'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}


